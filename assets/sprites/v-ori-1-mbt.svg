<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- T-62 (T1 oriental). Verde ruso.
     Misma camara y escala que el resto del set (20.9 px/m, ~31 grados).
     Casco 6.63 x 3.30 x 2.40 m: el mas corto del set.
     Identidad: solo 5 ruedas de rodadura grandes y SIN rodillos de retorno (la
     oruga apoya sobre las ruedas), sin faldones, torreta fundida en cupula
     semiesferica, canon U-5TS de 115 mm con el evacuador de humos cerca de la
     boca, tronco de desatasco en la popa y dos bidones de combustible traseros. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0"    stop-color="#9aa878"/>
    <stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/>
    <stop offset="1"    stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0"    stop-color="#6b7a4e"/>
    <stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1"    stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-turret" x1="0.2" y1="0" x2="0.85" y2="1">
    <stop offset="0"    stop-color="#8b9a69"/>
    <stop offset="0.5"  stop-color="#6d7c50"/>
    <stop offset="1"    stop-color="#4e5c38"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0"    stop-color="#485636"/>
    <stop offset="0.6"  stop-color="#374327"/>
    <stop offset="1"    stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0"    stop-color="#a6b28a"/>
    <stop offset="0.5"  stop-color="#717d5a"/>
    <stop offset="1"    stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0"    stop-color="#3a3a30"/>
    <stop offset="0.5"  stop-color="#26261f"/>
    <stop offset="1"    stop-color="#171712"/>
  </linearGradient>
</defs>

<!-- 1. sombra -->
<path d="M30 146 L160 112 L200 143 L64 182 Z" fill="#080a06" opacity="0.30"/>

<!-- 2. popa con bidones de combustible -->
<path d="M33.8 114.6 L66.2 146.3 L66.2 173.3 L33.8 141.6 Z" fill="url(#g-rear)"/>
<g fill="#56653c" stroke="#1f2716" stroke-width="0.9">
  <path d="M37 124 L48 134.8 L48 148 L37 137.2 Z"/>
  <path d="M51 137.5 L62 148.3 L62 161.5 L51 150.7 Z"/>
</g>
<g stroke="#7e8d5e" stroke-opacity="0.6" stroke-width="0.9">
  <path d="M38.5 129 L46.5 136.8"/><path d="M38.5 134 L46.5 141.8"/>
  <path d="M52.5 142.5 L60.5 150.3"/><path d="M52.5 147.5 L60.5 155.3"/>
</g>
<circle cx="36" cy="120" r="2.4" fill="#8f5b30"/>

<!-- 3. cubierta y glacis -->
<path d="M33.8 114.6 L122.1 90.2 L154.5 121.9 L66.2 146.3 Z" fill="url(#g-deck)"/>
<path d="M122.1 90.2 L156.5 90.7 L188.9 122.4 L154.5 121.9 Z" fill="url(#g-deck)"/>
<path d="M122.1 90.2 L154.5 121.9" fill="none" stroke="#3b4728" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M122.1 90.2 L156.5 90.7 L188.9 122.4 L154.5 121.9 Z" fill="#ffffff" fill-opacity="0.07"/>
<ellipse cx="145" cy="104" rx="6.8" ry="4.5" fill="#6d7c50" stroke="#333d22" stroke-width="1"/>
<g fill="#3b4728">
  <path d="M160 92 L166 98 L162.8 99.4 L156.8 93.4 Z"/>
  <path d="M175 106.5 L181 112.5 L177.8 113.9 L171.8 107.9 Z"/>
</g>
<!-- rejillas del motor -->
<path d="M38.4 116.9 L66.6 109.1 L92.8 134.8 L64.6 142.6 Z" fill="#4c5a35"/>
<g stroke="#8b9a69" stroke-opacity="0.7" stroke-width="1.1">
  <path d="M44 115.4 L70.2 141.1"/>
  <path d="M50 113.8 L76.2 139.5"/>
  <path d="M56 112.1 L82.2 137.8"/>
  <path d="M62 110.5 L88.2 136.2"/>
</g>
<!-- tronco de desatasco -->
<path d="M45.6 113.2 L69.0 136.1" fill="none" stroke="#6b5a3c" stroke-width="7" stroke-linecap="round"/>
<path d="M45.6 111.5 L69.0 134.4" fill="none" stroke="#8a7550" stroke-opacity="0.8" stroke-width="2"/>
<!-- deposito externo sobre el guardabarros derecho -->
<path d="M96 140 L120 133.4 L120 126.4 L96 133 Z" fill="#5f6f42" stroke="#333d22" stroke-width="0.9"/>
<path d="M124 132 L148 125.4 L148 118.4 L124 125 Z" fill="#5f6f42" stroke="#333d22" stroke-width="0.9"/>

<!-- 4. flanco -->
<path d="M66.2 146.3 L154.5 121.9 L188.9 122.4 L66.2 156.3 Z" fill="url(#g-flank)"/>
<path d="M66.2 146.3 L154.5 121.9" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>

<!-- 5. tren de rodaje: 5 ruedas grandes, sin rodillos de retorno -->
<path d="M64.1 175.6 L193.9 140.7 L193.9 123.7 L64.1 158.6 Z" fill="url(#g-trk)"/>
<g fill="#3d4433" stroke="#17190f" stroke-width="1.1">
  <ellipse cx="80.8"  cy="162.4" rx="8.2" ry="9.4"/>
  <ellipse cx="105.6" cy="155.6" rx="8.2" ry="9.4"/>
  <ellipse cx="129.4" cy="149.0" rx="8.2" ry="9.4"/>
  <ellipse cx="153.2" cy="142.4" rx="8.2" ry="9.4"/>
  <ellipse cx="177.1" cy="135.9" rx="8.2" ry="9.4"/>
</g>
<g fill="#5a6247">
  <ellipse cx="80.8"  cy="162.4" rx="3" ry="3.6"/>
  <ellipse cx="105.6" cy="155.6" rx="3" ry="3.6"/>
  <ellipse cx="129.4" cy="149.0" rx="3" ry="3.6"/>
  <ellipse cx="153.2" cy="142.4" rx="3" ry="3.6"/>
  <ellipse cx="177.1" cy="135.9" rx="3" ry="3.6"/>
</g>
<ellipse cx="66.7"  cy="162.8" rx="9.2" ry="10.4" fill="#454c39" stroke="#17190f" stroke-width="1.2"/>
<ellipse cx="192.1" cy="128.2" rx="8.2" ry="9.4"  fill="#454c39" stroke="#17190f" stroke-width="1.2"/>
<path d="M65 176 L194.5 141" fill="none" stroke="#080a06" stroke-opacity="0.55" stroke-width="3"/>

<!-- 6. torreta fundida en cupula: base -->
<path d="M123.3 110.2 C130.5 117.3 125.3 126.1 111.7 129.9
         C98.1 133.7 81.1 130.9 73.9 123.8
         C66.7 116.7 71.9 107.9 85.5 104.1
         C99.1 100.3 116.1 103.1 123.3 110.2 Z" fill="url(#g-flank)"/>
<!-- techo -->
<path d="M123.3 87.2 C130.5 94.3 125.3 103.1 111.7 106.9
         C98.1 110.7 81.1 107.9 73.9 100.8
         C66.7 93.7 71.9 84.9 85.5 81.1
         C99.1 77.3 116.1 80.1 123.3 87.2 Z" fill="url(#g-turret)"/>
<path d="M73.9 100.8 C66.7 93.7 71.9 84.9 85.5 81.1 C99.1 77.3 116.1 80.1 123.3 87.2"
      fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.4"/>
<!-- pasamanos de la torreta -->
<g fill="none" stroke="#333d22" stroke-opacity="0.7" stroke-width="1.1">
  <path d="M84 108 C90 113 100 115 108 113"/>
  <path d="M92 89 C98 86 106 86 112 89"/>
</g>

<!-- 7. cupula del comandante, adelantada a la izquierda -->
<path d="M96.7 84.2 L96.7 76.2 A6.5 4.5 0 0 1 109.7 76.2 L109.7 84.2 Z" fill="#5f6f42"/>
<ellipse cx="103.2" cy="76.2" rx="6.5" ry="4.5" fill="#8b9a69" stroke="#333d22" stroke-width="1"/>
<path d="M98.5 74.8 A6.5 4.5 0 0 1 108 74.8" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
<!-- DShK antiaerea -->
<path d="M106 74 L109.5 72.6 L124 67.5 L124.8 69.6 L110.3 74.7 L107 76 Z" fill="url(#g-metal)"/>

<!-- 8. canon U-5TS de 115 mm, evacuador cerca de la boca -->
<path d="M114 101 L122 94 L129.5 98.4 L121.5 105.4 Z" fill="#6d7c50" stroke="#333d22" stroke-width="0.9"/>
<path d="M121.4 93.9 L221.2 66.3 L223.2 73.3 L123.4 100.9 Z" fill="url(#g-metal)"/>
<path d="M185.8 73.9 L199.8 70.0 L202.9 81.2 L188.9 85.1 Z" fill="#95a274" stroke="#3b4728" stroke-width="0.8"/>
<ellipse cx="222.2" cy="69.8" rx="1.4" ry="3.2" fill="#12150e"/>
<path d="M121.4 93.9 L221.2 66.3 L221.6 67.8 L121.8 95.4 Z" fill="#ffffff" fill-opacity="0.32"/>
</svg>
