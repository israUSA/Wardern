<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- M113A3 (T1 occidental, motorizada). Arena. Camara y escala del set (20.9 px/m).
     Casco 4.86 x 2.69 m, 1.85 m a cubierta: cajon de aluminio corto y alto.
     Identidad: 5 ruedas de rodadura sin rodillos de retorno, RUEDA MOTRIZ DELANTERA,
     sin faldones, glacis corto y muy inclinado con la pala rompeolas plegada,
     rampa trasera completa y cupula del jefe con la .50 M2. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#e2d6b2"/><stop offset="0.34" stop-color="#c8b78d"/>
    <stop offset="0.68" stop-color="#ad9c75"/><stop offset="1" stop-color="#91815f"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#aea172"/><stop offset="0.45" stop-color="#978861"/>
    <stop offset="1" stop-color="#78694a"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#6f6247"/><stop offset="0.6" stop-color="#584d38"/>
    <stop offset="1" stop-color="#453c2c"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#d4c9a8"/><stop offset="0.5" stop-color="#9e9376"/>
    <stop offset="1" stop-color="#675e47"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#403d34"/><stop offset="0.5" stop-color="#2c2a22"/>
    <stop offset="1" stop-color="#1b1a15"/>
  </linearGradient>
</defs>
<path d="M50 149 L146 124 L176 148 L78 176 Z" fill="#0d0b06" opacity="0.30"/>

<!-- popa con rampa -->
<path d="M53.3 106.9 L79.6 132.6 L79.6 171.6 L53.3 145.9 Z" fill="url(#g-rear)"/>
<path d="M56.5 116 L76.5 135.5 L76.5 165 L56.5 145.5 Z" fill="#5c5340" stroke="#2f2a1e" stroke-width="1"/>
<ellipse cx="66" cy="140" rx="3.4" ry="2.6" fill="#8d7f5e"/>
<circle cx="55.5" cy="114" r="2.4" fill="#8f5b30"/>
<circle cx="77.5" cy="135" r="2.4" fill="#8f5b30"/>

<!-- cubierta y glacis -->
<path d="M53.3 106.9 L108.0 91.8 L134.3 117.5 L79.6 132.6 Z" fill="url(#g-deck)"/>
<path d="M108.0 91.8 L143.4 102.0 L169.7 127.7 L134.3 117.5 Z" fill="url(#g-deck)"/>
<path d="M108.0 91.8 L134.3 117.5" fill="none" stroke="#6d6046" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M108.0 91.8 L143.4 102.0 L169.7 127.7 L134.3 117.5 Z" fill="#ffffff" fill-opacity="0.07"/>
<!-- pala rompeolas plegada sobre el glacis -->
<path d="M118 100 L142 107 L162 126.5 L138 119.5 Z" fill="#9c8d68" stroke="#5a5039" stroke-width="1"/>
<g fill="#5c5340">
  <path d="M146 104 L151.5 109.4 L148.5 110.7 L143 105.3 Z"/>
  <path d="M159 116.5 L164.5 121.9 L161.5 123.2 L156 117.8 Z"/>
</g>
<!-- escotilla de carga -->
<path d="M85 111 L104 105.5 L112 113.4 L93 118.9 Z" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>

<!-- flanco -->
<path d="M79.6 132.6 L134.3 117.5 L169.7 127.7 L79.6 152.6 Z" fill="url(#g-flank)"/>
<path d="M79.6 132.6 L134.3 117.5" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>

<!-- tren de rodaje: 5 ruedas, motriz delantera, sin rodillos -->
<path d="M78.4 173.7 L173.7 147.4 L173.7 128.4 L78.4 154.7 Z" fill="url(#g-trk)"/>
<g fill="#46423a" stroke="#1b1a15" stroke-width="1.1">
  <ellipse cx="89.8"  cy="162.6" rx="6" ry="7"/>
  <ellipse cx="107.5" cy="157.7" rx="6" ry="7"/>
  <ellipse cx="125.2" cy="152.8" rx="6" ry="7"/>
  <ellipse cx="142.8" cy="147.9" rx="6" ry="7"/>
  <ellipse cx="160.5" cy="143.0" rx="6" ry="7"/>
</g>
<g fill="#6d6455">
  <ellipse cx="89.8"  cy="162.6" rx="2.2" ry="2.6"/>
  <ellipse cx="107.5" cy="157.7" rx="2.2" ry="2.6"/>
  <ellipse cx="125.2" cy="152.8" rx="2.2" ry="2.6"/>
  <ellipse cx="142.8" cy="147.9" rx="2.2" ry="2.6"/>
  <ellipse cx="160.5" cy="143.0" rx="2.2" ry="2.6"/>
</g>
<ellipse cx="169.6" cy="140.6" rx="7.6" ry="8.8" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<ellipse cx="82.8"  cy="159.5" rx="6.8" ry="8"   fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<path d="M79.5 174 L174.5 147.8" fill="none" stroke="#0d0b06" stroke-opacity="0.55" stroke-width="3"/>

<!-- cupula del jefe con la .50 M2 -->
<path d="M82.2 108.8 L82.2 100.5 A7 4.8 0 0 1 96.2 100.5 L96.2 108.8 Z" fill="#8a7c5b"/>
<ellipse cx="89.2" cy="100.5" rx="7" ry="4.8" fill="#b0a179" stroke="#574d38" stroke-width="1"/>
<path d="M84 98.8 A7 4.8 0 0 1 94.4 98.8" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
<path d="M91 96.5 L95 95 L114 88 L115 90.3 L96 97.3 L92.5 98.8 Z" fill="url(#g-metal)"/>
<path d="M91.5 94.5 L99 91.8 L99.8 94 L92.3 96.7 Z" fill="#4a4230"/>
</svg>
