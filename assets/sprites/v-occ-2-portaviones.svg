<!-- USS Nimitz (T2 occidental, portaviones). Gris OTAN. Portaviones nuclear. Identidad frente al Kitty Hawk: isla mas COMPACTA y desplazada a popa, sin chimenea grande, y cuatro ascensores repartidos tres a estribor y uno a babor. Cubierta angulada completa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
