<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- USS Nimitz (CVN-68) — Superportaviones de Propulsión Nuclear (T2 Occidental)
       Diferencias clave frente al Kitty Hawk (CV-63):
       1. Propulsión NUCLEAR: Isla notablemente más COMPACTA, cuadrada y desplazada hacia POPA.
       2. CERO chimeneas o escapes de combustión (alimentado por 2 reactores nucleares A4W).
       3. Mástil integrado y torre de radar independiente de comunicaciones/guerra electrónica.
       4. Numeral "68" estarcido en blanco en la proa.
       5. 4 ascensores de borde clase Nimitz con marcas de seguridad.
       6. Pista angulada completa con 4 cables de apontaje y deflectores JBD.
       7. Diseño limpio, sin figuras flotantes sueltas en el fondo. -->
  <defs>
    <!-- Gradiente de la cubierta de vuelo (Antideslizante naval gris) -->
    <linearGradient id="nm-deck" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#76818b"/>
      <stop offset="40%" stop-color="#8a949e"/>
      <stop offset="100%" stop-color="#adb7c1"/>
    </linearGradient>

    <!-- Gradiente del casco y costados (Haze Gray naval) -->
    <linearGradient id="nm-hull" x1="0" y1="0" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#626b74"/>
      <stop offset="50%" stop-color="#4b535b"/>
      <stop offset="100%" stop-color="#333940"/>
    </linearGradient>

    <!-- Gradiente de sombra del espejo de popa y casco inferior -->
    <linearGradient id="nm-hull-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3036"/>
      <stop offset="100%" stop-color="#1a1d21"/>
    </linearGradient>

    <!-- Gradiente de la superestructura compacta / Isla Nuclear -->
    <linearGradient id="nm-island" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e1e8"/>
      <stop offset="50%" stop-color="#a8b2bd"/>
      <stop offset="100%" stop-color="#727c87"/>
    </linearGradient>

    <!-- Pista de apontaje angulada oscura (goma de frenado de aeronaves) -->
    <linearGradient id="nm-runway" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#424b54"/>
    </linearGradient>

    <!-- Plataformas de los 4 ascensores -->
    <linearGradient id="nm-elevator" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#535b64"/>
      <stop offset="100%" stop-color="#3b424a"/>
    </linearGradient>
  </defs>

  <!-- ==================== CASCO INFERIOR ==================== -->
  <polygon points="44,170 56,186 142,144 142,136 44,164" fill="url(#nm-hull-dark)" stroke="#181c20" stroke-width="0.6"/>
  <polygon points="56,186 226,104 226,94 142,136 142,144" fill="url(#nm-hull)" stroke="#20252a" stroke-width="0.7"/>
  <!-- Línea de flotación -->
  <line x1="57" y1="187" x2="226" y2="105" stroke="#14171a" stroke-width="1.8"/>

  <!-- Proa lanzada bulbosa del casco nuclear -->
  <polygon points="226,94 240,86 242,91 226,104" fill="#565f67" stroke="#20252a" stroke-width="0.6"/>

  <!-- ==================== CUBIERTA DE VUELO CLASE NIMITZ ==================== -->
  <polygon points="
    236,78 244,83 244,85 236,80
    244,85 218,98 218,100 244,85
    218,100 172,122 172,124 218,100
    172,124 140,139 140,141 172,124
    140,141 68,175 68,177 140,141
    68,177 38,162 38,160 68,175
  " fill="#272c32"/>

  <!-- Superficie principal de la cubierta de vuelo -->
  <polygon id="nm-flight-deck" points="
    236,78
    244,83
    218,96
    218,100
    196,110
    196,106
    174,116
    174,121
    144,135
    144,140
    124,149
    124,146
    68,173
    40,159
    34,149
    76,130
    76,125
    94,116
    116,112
    178,92
    222,74
  " fill="url(#nm-deck)" stroke="#181c20" stroke-width="0.8"/>

  <!-- Borde perimetral y resalte de babor -->
  <polyline points="222,74 178,92 116,112 94,116 76,125 76,130 34,149" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ==================== LOS 4 ASCENSORES DE BORDE (NIMITZ CLASS) ==================== -->
  <!-- Elevador 1 (Estribor proa): -->
  <polygon points="218,96 202,104 198,102 214,94" fill="url(#nm-elevator)" stroke="#161a1e" stroke-width="0.6"/>
  <!-- Elevador 2 (Estribor medio): -->
  <polygon points="194,107 178,115 174,113 190,105" fill="url(#nm-elevator)" stroke="#161a1e" stroke-width="0.6"/>
  <!-- Elevador 3 (Estribor popa, detrás de la isla compacta): -->
  <polygon points="144,135 128,143 124,141 140,133" fill="url(#nm-elevator)" stroke="#161a1e" stroke-width="0.6"/>
  <!-- Elevador 4 (Babor popa): -->
  <polygon points="76,125 94,116 96,120 78,129" fill="url(#nm-elevator)" stroke="#161a1e" stroke-width="0.6"/>

  <!-- Franjas de precaución amarillas en los ascensores -->
  <line x1="202" y1="104" x2="218" y2="96" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="178" y1="115" x2="194" y2="107" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="128" y1="143" x2="144" y2="135" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="76" y1="125" x2="94" y2="116" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- ==================== PISTA DE APONTAJE ANGULADA ==================== -->
  <polygon points="40,158 64,170 148,118 126,106" fill="url(#nm-runway)" opacity="0.88"/>

  <!-- Eje central discontinuo blanco -->
  <line x1="46" y1="161" x2="140" y2="112" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.9"/>
  <!-- Tramlines laterales blancas -->
  <line x1="41" y1="157" x2="128" y2="107" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.75"/>
  <line x1="63" y1="169" x2="147" y2="119" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.75"/>

  <!-- 4 Cables de parada de apontaje -->
  <g stroke="#181b1d" stroke-width="0.8" opacity="0.95">
    <line x1="54" y1="154" x2="66" y2="160"/>
    <line x1="60" y1="150" x2="72" y2="156"/>
    <line x1="66" y1="146" x2="78" y2="152"/>
    <line x1="72" y1="142" x2="84" y2="148"/>
  </g>

  <!-- ==================== CATAPULTAS DE VAPOR Y JBD ==================== -->
  <!-- Catapultas de Proa (Cat 1 y 2) -->
  <line x1="202" y1="87" x2="236" y2="80" stroke="#23272d" stroke-width="1.1"/>
  <line x1="192" y1="92" x2="228" y2="84" stroke="#23272d" stroke-width="1.1"/>
  <!-- JBDs de proa -->
  <rect x="195" y="87" width="4" height="2" transform="rotate(-26 195 87)" fill="#414951" stroke="#1b1f23" stroke-width="0.5"/>
  <rect x="185" y="92" width="4" height="2" transform="rotate(-26 185 92)" fill="#414951" stroke="#1b1f23" stroke-width="0.5"/>

  <!-- Catapultas de Cintura (Cat 3 y 4) -->
  <line x1="108" y1="125" x2="134" y2="109" stroke="#23272d" stroke-width="1.1"/>
  <line x1="120" y1="130" x2="144" y2="115" stroke="#23272d" stroke-width="1.1"/>
  <rect x="103" y="127" width="4" height="2" transform="rotate(-32 103 127)" fill="#414951" stroke="#1b1f23" stroke-width="0.5"/>

  <!-- ==================== NUMERAL "68" EN PROA ==================== -->
  <g transform="translate(216, 85) rotate(-26) scale(0.65)" fill="#ffffff" fill-opacity="0.88" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="12">
    <text x="0" y="0">68</text>
  </g>

  <!-- ==================== ISLA NUCLEAR COMPACTA (CVN-68 NIMITZ) ==================== -->
  <!-- Sombra propia de la isla nuclear -->
  <polygon points="144,132 164,121 168,114 154,114 138,124" fill="#12161a" opacity="0.36"/>

  <!-- Bloque inferior de la isla compacta -->
  <polygon points="163,118 165,120 165,108 163,106" fill="#818b95" stroke="#31373e" stroke-width="0.5"/>
  <polygon points="163,118 147,126 147,114 163,106" fill="url(#nm-island)" stroke="#31373e" stroke-width="0.6"/>
  <polygon points="163,106 165,108 149,116 147,114" fill="#c0c9d2" stroke="#31373e" stroke-width="0.5"/>

  <!-- Nivel superior del Puente de Mando y Pri-Fly (sin chimenea detrás) -->
  <polygon points="162,106 150,112 150,103 162,97" fill="#9fa9b3" stroke="#31373e" stroke-width="0.5"/>
  <polygon points="162,97 164,99 152,105 150,103" fill="#d9e0e7" stroke="#31373e" stroke-width="0.5"/>
  <!-- Cristales panorámicos del puente de navegación -->
  <line x1="161" y1="102" x2="154" y2="106" stroke="#141a20" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Cabina Pri-Fly hacia popa -->
  <polygon points="150,107 148,109 148,104 150,103" fill="#182028"/>

  <!-- Domos satelitales sobre el techo plano -->
  <ellipse cx="158" cy="98" rx="1.6" ry="1.1" fill="#ffffff" stroke="#292f35" stroke-width="0.5"/>
  <ellipse cx="153" cy="101" rx="1.3" ry="0.9" fill="#ffffff" stroke="#292f35" stroke-width="0.5"/>

  <!-- MÁSTIL INTEGRADO DE LA ISLA -->
  <line x1="159" y1="97" x2="159" y2="76" stroke="#2b3138" stroke-width="1.2"/>
  <line x1="159" y1="82" x2="155" y2="85" stroke="#2b3138" stroke-width="0.7"/>
  <line x1="159" y1="87" x2="163" y2="90" stroke="#2b3138" stroke-width="0.7"/>
  <!-- Radar 3D AN/SPS-48 -->
  <rect x="156" y="77" width="5" height="4" transform="rotate(-15 156 77)" fill="#dbe3ea" stroke="#262c32" stroke-width="0.6"/>
  <!-- TACAN radome superior -->
  <circle cx="159" cy="75" r="1.3" fill="#ffffff" stroke="#292f35" stroke-width="0.5"/>

  <!-- MÁSTIL RADÁRICO DE POPA EXCLUSIVO DEL NIMITZ (Torre con antena AN/SPS-49) -->
  <line x1="145" y1="116" x2="145" y2="94" stroke="#2e353c" stroke-width="1.1"/>
  <line x1="142" y1="102" x2="148" y2="102" stroke="#2e353c" stroke-width="0.7"/>
  <line x1="143" y1="108" x2="147" y2="108" stroke="#2e353c" stroke-width="0.7"/>
  <path d="M 142 96 Q 145 93 148 96" fill="none" stroke="#dfe6ec" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Sponsons defensivos (RIM-7 Sea Sparrow & Phalanx) -->
  <polygon points="214,100 220,97 220,101 214,104" fill="#565f68" stroke="#202428" stroke-width="0.5"/>
  <circle cx="217" cy="99" r="1.1" fill="#eaf0f6"/>
  <polygon points="34,151 38,153 38,157 34,155" fill="#485057" stroke="#1a1e22" stroke-width="0.5"/>
  <circle cx="36" cy="153" r="1.1" fill="#eaf0f6"/>
</svg>
