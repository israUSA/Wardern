<!-- USS Zumwalt (T3 occidental, destructor). Gris OTAN. Identidad inconfundible: casco de proa INVERTIDA que se afila hacia abajo y una piramide de composite gigantesca que ocupa casi toda la eslora y esconde palos y antenas; las celdas verticales van repartidas por los COSTADOS, no en bloques centrados. Es la silueta mas limpia y compacta del set.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
