<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- USS Zumwalt (DDG-1000) - vista superior, proa al norte. SILUETA STEALTH UNICA:
       casco TUMBLEHOME muy ancho (cubre-maxima en cubierta, inclinado hacia dentro),
       proa wave-piercing puntiaguda, CAJA DE CUBIERTA integrada angular, dos AGS 155mm
       empotrados, helipad amplio a popa. Tinte por pais: .base/.shade/.light/.hi.
       Fijos: .metal/.metalS/.metalL (canones AGS, sensores), .glass, .dark. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="ds3f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="ds3f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="ds3gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ds3g1" gradientUnits="userSpaceOnUse" x1="34" y1="62" x2="94" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".16" stop-color="#fff" stop-opacity=".16"/><stop offset=".42" stop-color="#fff" stop-opacity=".2"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="ds3g2" gradientUnits="userSpaceOnUse" x1="64" y1="14" x2="64" y2="112">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="ds3g3" gradientUnits="userSpaceOnUse" x1="50" y1="52" x2="78" y2="52">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".22" stop-color="#fff" stop-opacity=".18"/><stop offset=".55" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  </defs>

  <ellipse cx="64" cy="62" rx="38" ry="52" fill="url(#ds3gs)"/>

  <!-- ===== casco tumblehome ancho ===== -->
  <path class="shade" d="M64 12 C56 16 47 22.5 40 30 L33.5 42 L28 56 L25.5 72 L26.5 96 L31 106.5 L36 111 L92 111 L97 106.5 L101.5 96 L102.5 72 L100 56 L94.5 42 L88 30 C81 22.5 72 16 64 12 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 12 C56 16 47 22.5 40 30 L33.5 42 L28 56 L25.5 72 L26.5 96 L31 106.5 L36 111 L92 111 L97 106.5 L101.5 96 L102.5 72 L100 56 L94.5 42 L88 30 C81 22.5 72 16 64 12 Z" fill="url(#ds3g1)"/>
  <!-- cubierta -->
  <path class="base" d="M64 15 C57 18.8 48.6 24.8 42.2 31.8 L36.2 43.5 L31.5 57 L29.5 72 L30.5 95 L34.5 104.5 L38.5 108 L89.5 108 L93.5 104.5 L97.5 95 L98.5 72 L96.5 57 L91.8 43.5 L85.8 31.8 C79.4 24.8 71 18.8 64 15 Z"/>
  <path d="M64 15 C57 18.8 48.6 24.8 42.2 31.8 L36.2 43.5 L31.5 57 L29.5 72 L30.5 95 L34.5 104.5 L38.5 108 L89.5 108 L93.5 104.5 L97.5 95 L98.5 72 L96.5 57 L91.8 43.5 L85.8 31.8 C79.4 24.8 71 18.8 64 15 Z" fill="url(#ds3g2)"/>
  <!-- tumblehome: linea de rebalse (cubre-maxima) -->
  <path d="M31.8 56 L29.9 72 L30.9 95 M96.2 56 L98.1 72 L97.1 95" stroke="#fff" stroke-width=".8" opacity=".25" fill="none"/>
  <path d="M33 44 L29.8 57 M95 44 L98.2 57" stroke="#000" stroke-width=".7" opacity=".2" fill="none" filter="url(#ds3f1)"/>
  <!-- rim light babor + sombra estribor -->
  <path d="M32.5 46 L30 64 L31 94" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M95.5 46 L98 64 L97 94" stroke="#000" stroke-width="1.5" opacity=".24" fill="none" filter="url(#ds3f1)"/>
  <path d="M64 16 L64 106.5" stroke="#b8bfa2" stroke-width=".8" opacity=".4" fill="none"/>
  <path class="light" d="M64 15 C57 18.8 48.6 24.8 42.2 31.8 L44.2 33.4 C50.4 26.8 58 21.2 64 17.6 Z" opacity=".7"/>

  <!-- ===== dos AGS 155mm empotrados ===== -->
  <path d="M50.5 31.5 L63.5 31.5 L63 35.5 L51 35.5 Z" fill="#000" opacity=".22" filter="url(#ds3f1)"/>
  <path d="M64.5 31.5 L77.5 31.5 L77 35.5 L65 35.5 Z" fill="#000" opacity=".22" filter="url(#ds3f1)"/>
  <rect class="shade" x="51.6" y="32.4" width="11" height="4.6" rx="1"/>
  <rect class="shade" x="65.4" y="32.4" width="11" height="4.6" rx="1"/>
  <path d="M52 32.8 L62.2 32.8 M65.8 32.8 L76 32.8" stroke="#fff" stroke-width=".5" opacity=".3" fill="none"/>
  <path class="metalL" d="M55 37.4 L59.2 37.4 L59 40.4 L55.2 40.4 Z M68.8 37.4 L73 37.4 L72.8 40.4 L69 40.4 Z" opacity=".9"/>

  <!-- ===== caja de cubierta integrada (deckhouse) ===== -->
  <path class="base" d="M64 40.5 L78.5 47.5 L81 58 L79.5 70.5 L77 78.5 L51 78.5 L48.5 70.5 L47 58 L49.5 47.5 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M64 40.5 L78.5 47.5 L81 58 L79.5 70.5 L77 78.5 L51 78.5 L48.5 70.5 L47 58 L49.5 47.5 Z" fill="url(#ds3g3)"/>
  <path d="M64 41 L77.4 47.6" stroke="#fff" stroke-width="1" opacity=".5" fill="none"/>
  <path d="M48.4 50 L47.6 58 L49 69.6" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <path d="M79.6 50 L80.4 58 L79 69.6" stroke="#000" stroke-width="1.3" opacity=".26" fill="none" filter="url(#ds3f1)"/>
  <path d="M49 78.7 L79 78.7 L78.8 81.7 L49.2 81.7 Z" fill="#000" opacity=".22" filter="url(#ds3f1)"/>
  <!-- franja de ventanas del puente -->
  <path class="glass" d="M57.6 45.8 L70.4 45.8 L69.6 48.4 L58.4 48.4 Z"/>
  <path class="glassL" d="M58.6 46.3 L60.8 46.3 L60.5 47.5 L58.3 47.5 Z" opacity=".8"/>
  <path class="glassL" d="M69.4 46.3 L67.2 46.3 L67.5 47.5 L69.7 47.5 Z" opacity=".8"/>
  <!-- paneles de antenas integrados (bandas) -->
  <rect class="metal" x="49.8" y="52.5" width="2.6" height="17" rx=".6"/>
  <rect class="metal" x="75.6" y="52.5" width="2.6" height="17" rx=".6"/>
  <path d="M50.1 55.5 L52.1 55.5 M50.1 59 L52.1 59 M50.1 62.5 L52.1 62.5 M50.1 66 L52.1 66 M76 55.5 L78 55.5 M76 59 L78 59 M76 62.5 L78 62.5 M76 66 L78 66" stroke="#4a5057" stroke-width=".4" opacity=".8" fill="none"/>
  <!-- sensor integrado en la cresta -->
  <path class="metalL" d="M59.6 52 L68.4 52 L68 54.4 L60 54.4 Z"/>
  <path d="M62 52 L62 54.4 M64 52 L64 54.4 M66 52 L66 54.4" stroke="#4a5057" stroke-width=".4" opacity=".8" fill="none"/>

  <!-- ===== helipad amplio a popa ===== -->
  <path d="M34 84 L94 84 L94 106 L34 106 Z" fill="#000" opacity=".14" filter="url(#ds3f2)"/>
  <path d="M64 82 L64 107" stroke="#b8bfa2" stroke-width=".7" opacity=".45" fill="none"/>
  <ellipse class="dark" cx="64" cy="95" rx="8" ry="8.6"/>
  <ellipse cx="64" cy="95" rx="8" ry="8.6" fill="none" stroke="#b8bfa2" stroke-width=".9" opacity=".85"/>
  <path d="M62.4 95 L65.6 95 M64 92.9 L64 97.1" stroke="#b8bfa2" stroke-width=".8" opacity=".85" fill="none"/>
  <path d="M36 88 L44 88 M84 88 L92 88 M36 102 L44 102 M84 102 L92 102" stroke="#b8bfa2" stroke-width=".6" opacity=".5" fill="none"/>
  <!-- cajas de misiles perimetrales -->
  <g class="dark" opacity=".85">
    <rect x="41.5" y="84.5" width="4.5" height="2.6" rx=".6"/><rect x="82" y="84.5" width="4.5" height="2.6" rx=".6"/>
    <rect x="41.5" y="103" width="4.5" height="2.6" rx=".6"/><rect x="82" y="103" width="4.5" height="2.6" rx=".6"/>
  </g>
  <path d="M42 84.8 L42 86.8 M83.5 84.8 L83.5 86.8" stroke="#8a929b" stroke-width=".4" opacity=".6" fill="none"/>
</svg>
