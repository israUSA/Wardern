  <path class="dark" d="M53 103.5 L57 105 L56.6 106.5 L52.8 105 Z M61.4 105.6 L64 106.4 L64 108 L61.4 107.2 Z M75 103.5 L71 105 L71.4 106.5 L75.2 105 Z M66.6 105.6 L64 106.4 L64 108 L66.6 107.2 Z" opacity=".8"/>
