  <path d="M53 50 L57.4 50 L55.4 80 L50.4 79.6 Z" fill="#000" opacity=".2" filter="url(#f22f2)"/>
  <path d="M75 50 L70.6 50 L72.6 80 L77.6 79.6 Z" fill="#000" opacity=".2" filter="url(#f22f2)"/>
