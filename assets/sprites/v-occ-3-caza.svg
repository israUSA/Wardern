    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".2"/>
  </linearGradient>
  <linearGradient id="f22g6" gradientUnits="userSpaceOnUse" x1="76" y1="70" x2="72" y2="70">
    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".2"/>
  </linearGradient>
