<!-- USS Arleigh Burke (T2 occidental, destructor). Gris OTAN. Identidad: los cuatro paneles planos del radar AEGIS en las caras del macaron, y DOS bancos de celdas verticales Mk41, uno a proa y otro a popa, que es lo que lo separa del Spruance. Dos chimeneas mas discretas y canon de 127 mm en la proa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
