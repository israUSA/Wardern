
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- 9K38 Igla (SA-18 Grouse)
       Orientación: Punta hacia ARRIBA (Norte)
       Características:
       - Aguja aerodinámica frontal ("aerospike") con punta cónica roja/naranja
       - Domo seeker cónico metálico claro
       - Fuselaje muy delgado y uniforme en tono gris plateado / aluminio
       - Collar oscuro y canards plegables delanteros con ranuras longitudinales
       - Sección trasera con 4 aletas curvas/plegables y anillo de tobera con ribete rojo -->
  <defs>
    <!-- Gradiente cilíndrico gris aluminio del cuerpo -->
    <linearGradient id="igla-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#949da2"/>
      <stop offset="28%" stop-color="#e2e8ec"/>
      <stop offset="65%" stop-color="#c1c9ce"/>
      <stop offset="100%" stop-color="#7a8388"/>
    </linearGradient>

    <!-- Resplandor longitudinal para dar volumen al tubo esbelto -->
    <linearGradient id="igla-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Aletas delanteras en sombra/luz -->
    <linearGradient id="igla-canard-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#768085"/>
      <stop offset="100%" stop-color="#555c61"/>
    </linearGradient>
    <linearGradient id="igla-canard-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60676b"/>
      <stop offset="100%" stop-color="#44494c"/>
    </linearGradient>

    <!-- Aletas traseras plegables -->
    <linearGradient id="igla-fin-tail-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#889297"/>
      <stop offset="100%" stop-color="#60686c"/>
    </linearGradient>
    <linearGradient id="igla-fin-tail-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#727b80"/>
      <stop offset="100%" stop-color="#4d5357"/>
    </linearGradient>

    <!-- Punta del dardo aerodinámico (aerospike) -->
    <linearGradient id="igla-spike-tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e2017"/>
      <stop offset="35%" stop-color="#dc4032"/>
      <stop offset="100%" stop-color="#66140e"/>
    </linearGradient>
  </defs>

  <!-- ================= ALETAS TRASERAS PLEGABLES (COLA) ================= -->
  <!-- Aleta trasera izquierda con curvatura de empaque -->
  <polygon points="14.8,55 10.8,55.8 10.8,59.4 14.8,58.6" 
           fill="url(#igla-fin-tail-l)" 
           stroke="#34393c" 
           stroke-width="0.2"/>

  <!-- Aleta trasera derecha -->
  <polygon points="17.2,55 21.2,55.8 21.2,59.4 17.2,58.6" 
           fill="url(#igla-fin-tail-r)" 
           stroke="#2a2e30" 
           stroke-width="0.2"/>

  <!-- ================= CANARDS DELANTEROS DESPLEGABLES ================= -->
  <!-- Aleta canard izquierda en ángulo de flecha -->
  <polygon points="14.8,17.2 10.2,19.2 11.5,23.5 14.8,21" 
           fill="url(#igla-canard-l)" 
           stroke="#34393c" 
           stroke-width="0.2" 
           stroke-linejoin="round"/>

  <!-- Aleta canard derecha -->
  <polygon points="17.2,17.2 21.8,19.2 20.5,23.5 17.2,21" 
           fill="url(#igla-canard-r)" 
           stroke="#2a2e30" 
           stroke-width="0.2" 
           stroke-linejoin="round"/>

  <!-- Canards en perspectiva perpendicular frontal -->
  <polygon points="15.6,16 15.6,13.2 16.4,13.2 16.4,16" fill="#586166" stroke="#2a2e30" stroke-width="0.18"/>

  <!-- ================= CUERPO PRINCIPAL DEL MISIL (EXTRA DELGADO: 2.4 mm) ================= -->
  <!-- Ojiva cónica superior -->
  <path d="M 14.8 11.5 C 14.8 8.8, 15.2 6.5, 16 6.5 C 16.8 6.5, 17.2 8.8, 17.2 11.5 Z" 
        fill="url(#igla-body)"/>

  <!-- Tubo cilíndrico continuo y uniforme -->
  <rect x="14.8" y="11.5" width="2.4" height="45.5" fill="url(#igla-body)"/>

  <!-- Brillo cilíndrico longitudinal -->
  <rect x="14.8" y="6.5" width="2.4" height="50.5" fill="url(#igla-shine)"/>

  <!-- ================= AGUJA AERODINÁMICA FRONTAL (AEROSPIKE DEL IGLA) ================= -->
  <!-- Vástago metálico de la aguja -->
  <line x1="16" y1="6.5" x2="16" y2="2.6" stroke="#c0c9ce" stroke-width="0.32" stroke-linecap="round"/>
  <line x1="16" y1="6.5" x2="16" y2="2.6" stroke="#525b60" stroke-width="0.12"/>

  <!-- Base cónica de anclaje de la aguja en el domo -->
  <polygon points="15.5,6.5 16.5,6.5 16.2,5.2 15.8,5.2" fill="#758086"/>

  <!-- Punta roja aerodinámica -->
  <polygon points="15.5,3.2 16.5,3.2 16,1.8" fill="url(#igla-spike-tip)" stroke="#4d0e09" stroke-width="0.15"/>

  <!-- ================= COLLAR DELANTERO Y DETALLES DEL FUSELAJE ================= -->
  <!-- Anillo oscuro de fijación de los canards -->
  <rect x="14.7" y="17.2" width="2.6" height="1.4" fill="#3c4347" stroke="#1f2325" stroke-width="0.15"/>

  <!-- Ranuras longitudinales de repliegue de aletas -->
  <line x1="15.2" y1="19.5" x2="15.2" y2="22.5" stroke="#3c4347" stroke-width="0.22" stroke-linecap="round"/>
  <line x1="16.8" y1="19.5" x2="16.8" y2="22.5" stroke="#3c4347" stroke-width="0.22" stroke-linecap="round"/>

  <!-- Juntas de ensamble del cuerpo cilíndrico -->
  <line x1="14.8" y1="11.5" x2="17.2" y2="11.5" stroke="#687379" stroke-width="0.2"/>
  <line x1="14.8" y1="14.2" x2="17.2" y2="14.2" stroke="#687379" stroke-width="0.18"/>
  <line x1="14.8" y1="28" x2="17.2" y2="28" stroke="#687379" stroke-width="0.18"/>
  <line x1="14.8" y1="30.5" x2="17.2" y2="30.5" stroke="#687379" stroke-width="0.18"/>

  <!-- Micro-puertos de sensores en el fuselaje -->
  <circle cx="16" cy="24.5" r="0.22" fill="#2d3336"/>

  <!-- ================= SECCIÓN DE COLA Y TOBERA ================= -->
  <!-- Anillo posterior con ribete rojo de advertencia -->
  <rect x="14.8" y="56.2" width="2.4" height="0.6" fill="#c02f23"/>
  <rect x="14.8" y="56.8" width="2.4" height="2" fill="#3b4246"/>

  <!-- Tobera trasera de escape cónica -->
  <path d="M 15 58.8 L 17 58.8 L 16.7 60.5 L 15.3 60.5 Z" fill="#1b1e20" stroke="#0e1011" stroke-width="0.2"/>
</svg>
