<!-- Shtorm, Proyecto 23000E (T3 oriental, portaviones). Gris ruso. Identidad: mantiene la RAMPA DE ESQUI de proa pero anade cubierta angulada completa y DOS islas separadas en el costado de estribor, en vez de una sola. Es el buque mas grande del set.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
