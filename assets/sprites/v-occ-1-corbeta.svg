<!-- USS Cyclone (T1 occidental, corbeta). Gris OTAN. Patrullero costero de 55 m: el buque mas pequeno del set. Identidad: casco corto y bajo, una sola superestructura a media eslora, palo ligero y solo dos montajes de 25 mm, uno a proa y otro a popa. SIN cubierta de vuelo.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
