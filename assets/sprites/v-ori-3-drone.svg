<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Orion (Inokhodets, MALE ruso) - vista superior, morro al norte. GRAN MALE: ala recta
       LARGA, V-tail (doble deriva en V como el MQ-9), helice propulsora trasera, DOS misiles
       bajo CADA ala (4 en total, cuerpo redondeado con ojiva roma), cupula de sensores del
       morro con VENTANAS (dos ranuras de cristal) y buje SATCOM en el lomo dorsal.
       Tinte por pais: sobreescribir .base/.shade/.light/.hi (fuselaje, alas, derivas).
       Fijos: .metal/.metalS/.metalL (misiles, bujes, rieles), .glass (ventanas de la cupula),
       .dark (detalles), .rubber (tomas de aire a banda). -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="od3f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="od3f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="od3gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="od3g1" gradientUnits="userSpaceOnUse" x1="10" y1="59" x2="118" y2="59">
    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".16" stop-color="#000" stop-opacity=".08"/><stop offset=".34" stop-color="#fff" stop-opacity=".16"/><stop offset=".46" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".06"/><stop offset=".82" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".42"/>
  </linearGradient>
  <linearGradient id="od3g2" gradientUnits="userSpaceOnUse" x1="57" y1="60" x2="71" y2="60">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".24" stop-color="#fff" stop-opacity=".2"/><stop offset=".42" stop-color="#fff" stop-opacity=".24"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="od3g3" gradientUnits="userSpaceOnUse" x1="64" y1="18" x2="64" y2="104">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="63" cy="61" rx="55" ry="53" fill="url(#od3gs)"/>

  <!-- ===== ala recta LARGA ===== -->
  <path class="base" d="M62.4 50.8 L15 53.8 Q9.2 55.1 8.7 60.2 Q9.2 65.2 15 66.5 L62.4 65.9 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path class="base" d="M65.6 50.8 L113 53.8 Q118.8 55.1 119.3 60.2 Q118.8 65.2 113 66.5 L65.6 65.9 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M62.4 50.8 L15 53.8 Q9.2 55.1 8.7 60.2 Q9.2 65.2 15 66.5 L62.4 65.9 Z" fill="url(#od3g1)"/>
  <path d="M65.6 50.8 L113 53.8 Q118.8 55.1 119.3 60.2 Q118.8 65.2 113 66.5 L65.6 65.9 Z" fill="url(#od3g1)"/>
  <path d="M62.4 50.8 L15 53.8 Q9.2 55.1 8.7 60.2 Q9.2 65.2 15 66.5 L62.4 65.9 Z" fill="url(#od3g3)"/>
  <path d="M65.6 50.8 L113 53.8 Q118.8 55.1 119.3 60.2 Q118.8 65.2 113 66.5 L65.6 65.9 Z" fill="url(#od3g3)"/>
  <!-- bordes de ataque iluminados + rim light -->
  <path d="M62 51.5 L13.5 54.6 M66 51.5 L114.5 54.6" stroke="#b8bfa2" stroke-width=".9" opacity=".55" fill="none"/>
  <path d="M62.2 51 L12.5 54.2" stroke="#fff" stroke-width=".7" opacity=".45" fill="none"/>
  <path d="M65.8 51 L115.5 54.2" stroke="#fff" stroke-width=".5" opacity=".3" fill="none"/>
  <!-- sombra del fuselaje sobre las alas -->
  <path d="M62.2 50.6 L65.8 50.6 L65.4 66.4 L61.8 66.4 Z" fill="#000" opacity=".2" filter="url(#od3f1)"/>
  <!-- luces de punta de ala -->
  <circle class="dark" cx="10.3" cy="60.2" r="1"/><circle class="dark" cx="117.7" cy="60.2" r="1"/>
  <!-- flaperaones y lineas de panel -->
  <path d="M19 60.2 L59.5 60.5 M68.5 60.5 L109 60.2" stroke="#000" stroke-width=".55" opacity=".24" fill="none"/>
  <path d="M24 55.4 L24 65.2 M104 55.4 L104 65.2 M45 53.7 L45 66.4 M83 53.7 L83 66.4" stroke="#000" stroke-width=".5" opacity=".2" fill="none"/>

  <!-- ===== 4 misiles (2 por ala): cuerpo redondeado sobre riel ===== -->
  <g>
    <path class="metal" d="M31.6 54.6 L33 54.6 L33.3 67 L31.3 67 Z"/>
    <path class="metalS" d="M32.5 53.7 C31.7 54 31.2 54.6 31 55.4 L30.9 65.4 L34.3 65.4 L34.2 55.4 C34 54.6 33.4 54 32.5 53.7 Z"/>
    <circle class="metalL" cx="32.6" cy="54.9" r="1.15"/>
    <circle class="metal" cx="32.6" cy="54.9" r=".45"/>
    <path d="M31.2 62.8 L34 62.8" stroke="#4a5057" stroke-width=".5" fill="none"/>
    <path class="dark" d="M30.9 66.9 L34.4 66.9 L34.2 68.4 L31.1 68.4 Z" opacity=".85"/>
  </g>
  <g>
    <path class="metal" d="M42 54.6 L43.4 54.6 L43.7 67 L41.7 67 Z"/>
    <path class="metalS" d="M42.9 53.7 C42.1 54 41.6 54.6 41.4 55.4 L41.3 65.4 L44.7 65.4 L44.6 55.4 C44.4 54.6 43.8 54 42.9 53.7 Z"/>
    <circle class="metalL" cx="43" cy="54.9" r="1.15"/>
    <circle class="metal" cx="43" cy="54.9" r=".45"/>
    <path d="M41.6 62.8 L44.4 62.8" stroke="#4a5057" stroke-width=".5" fill="none"/>
    <path class="dark" d="M41.3 66.9 L44.8 66.9 L44.6 68.4 L41.5 68.4 Z" opacity=".85"/>
  </g>
  <g>
    <path class="metal" d="M84.6 54.6 L86 54.6 L86.3 67 L84.3 67 Z"/>
    <path class="metalS" d="M85.5 53.7 C84.7 54 84.2 54.6 84 55.4 L83.9 65.4 L87.3 65.4 L87.2 55.4 C87 54.6 86.4 54 85.5 53.7 Z"/>
    <circle class="metalL" cx="85.6" cy="54.9" r="1.15"/>
    <circle class="metal" cx="85.6" cy="54.9" r=".45"/>
    <path d="M84.2 62.8 L87 62.8" stroke="#4a5057" stroke-width=".5" fill="none"/>
    <path class="dark" d="M83.9 66.9 L87.4 66.9 L87.2 68.4 L84.1 68.4 Z" opacity=".85"/>
  </g>
  <g>
    <path class="metal" d="M95 54.6 L96.4 54.6 L96.7 67 L94.7 67 Z"/>
    <path class="metalS" d="M95.9 53.7 C95.1 54 94.6 54.6 94.4 55.4 L94.3 65.4 L97.7 65.4 L97.6 55.4 C97.4 54.6 96.8 54 95.9 53.7 Z"/>
    <circle class="metalL" cx="96" cy="54.9" r="1.15"/>
    <circle class="metal" cx="96" cy="54.9" r=".45"/>
    <path d="M94.6 62.8 L97.4 62.8" stroke="#4a5057" stroke-width=".5" fill="none"/>
    <path class="dark" d="M94.3 66.9 L97.8 66.9 L97.6 68.4 L94.5 68.4 Z" opacity=".85"/>
  </g>
  <!-- sombra de misiles sobre el ala -->
  <path d="M34 56 L36.8 56 L36.8 66.4 L34.4 66.4 Z" fill="#000" opacity=".2" filter="url(#od3f1)"/>
  <path d="M44.4 56 L47.2 56 L47.2 66.4 L44.8 66.4 Z" fill="#000" opacity=".2" filter="url(#od3f1)"/>
  <path d="M87 56 L89.8 56 L89.8 66.4 L87.4 66.4 Z" fill="#000" opacity=".2" filter="url(#od3f1)"/>
  <path d="M97.4 56 L100.2 56 L100.2 66.4 L97.8 66.4 Z" fill="#000" opacity=".2" filter="url(#od3f1)"/>

  <!-- ===== fuselaje esbelto ===== -->
  <path class="base" d="M64 16.4 C61.1 18.2 59.2 21.2 58.3 25.2 L57 31.6 L56.3 41.5 L56.1 52.2 L56.9 63.2 L57.9 74.7 L59.1 86.6 C59.6 92.7 60.3 96.9 61.4 99.9 L64 103.4 L66.6 99.9 C67.7 96.9 68.4 92.7 68.9 86.6 L70.1 74.7 L71.1 63.2 L71.9 52.2 L71.7 41.5 L71 31.6 L69.7 25.2 C68.8 21.2 66.9 18.2 64 16.4 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M64 16.4 C61.1 18.2 59.2 21.2 58.3 25.2 L57 31.6 L56.3 41.5 L56.1 52.2 L56.9 63.2 L57.9 74.7 L59.1 86.6 C59.6 92.7 60.3 96.9 61.4 99.9 L64 103.4 L66.6 99.9 C67.7 96.9 68.4 92.7 68.9 86.6 L70.1 74.7 L71.1 63.2 L71.9 52.2 L71.7 41.5 L71 31.6 L69.7 25.2 C68.8 21.2 66.9 18.2 64 16.4 Z" fill="url(#od3g2)"/>
  <path d="M64 16.4 C61.1 18.2 59.2 21.2 58.3 25.2 L57 31.6 L56.3 41.5 L56.1 52.2 L56.9 63.2 L57.9 74.7 L59.1 86.6 C59.6 92.7 60.3 96.9 61.4 99.9 L64 103.4 L66.6 99.9 C67.7 96.9 68.4 92.7 68.9 86.6 L70.1 74.7 L71.1 63.2 L71.9 52.2 L71.7 41.5 L71 31.6 L69.7 25.2 C68.8 21.2 66.9 18.2 64 16.4 Z" fill="url(#od3g3)"/>
  <!-- rim light en el flanco de babor + sombra profunda a estribor -->
  <path d="M58.5 23.5 C57.2 31.5 56.5 44 56.4 56 C56.3 70 57.5 84 59.1 94" stroke="#fff" stroke-width=".9" opacity=".4" fill="none"/>
  <path d="M69.5 23.5 C70.8 31.5 71.5 44 71.6 56 C71.7 70 70.5 84 68.9 94" stroke="#000" stroke-width="1.4" opacity=".24" fill="none" filter="url(#od3f1)"/>
  <!-- linea de crujia y paneles -->
  <path d="M64 18.5 L64 100" stroke="#b8bfa2" stroke-width=".7" opacity=".35" fill="none"/>
  <path d="M56.8 47 L71.2 47 M57.2 57.5 L70.8 57.5 M57.9 68.5 L70.1 68.5" stroke="#000" stroke-width=".5" opacity=".22" fill="none"/>

  <!-- ===== cupula de sensores del morro con VENTANAS ===== -->
  <path d="M60.2 26 L67.8 26 L67.2 28.8 L60.8 28.8 Z" fill="#000" opacity=".22" filter="url(#od3f1)"/>
  <ellipse class="dark" cx="64" cy="24.4" rx="3.6" ry="3.2"/>
  <ellipse cx="64" cy="24.4" rx="3.6" ry="3.2" fill="none" stroke="#243b4d" stroke-width=".5"/>
  <!-- dos ventanas de cristal (television IR + laser) -->
  <rect class="glass" x="61" y="22.6" width="2.3" height="1.7" rx=".55"/>
  <rect class="glass" x="64.7" y="22.6" width="2.3" height="1.7" rx=".55"/>
  <rect x="61.3" y="22.9" width="1" height=".8" rx=".3" fill="#fff" opacity=".85"/>
  <rect x="65" y="22.9" width="1" height=".8" rx=".3" fill="#fff" opacity=".85"/>
  <rect class="metalS" x="62.6" y="25.2" width="2.8" height="1" rx=".45"/>

  <!-- ===== lomo dorsal: buje SATCOM y toma de aire ===== -->
  <ellipse class="light" cx="64" cy="81.5" rx="3.3" ry="5"/>
  <path d="M61.4 79 C63.1 80.5 64.9 80.5 66.6 79" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>
  <path class="dark" d="M61.9 87.8 L66.1 87.8 L65.7 90.6 L62.3 90.6 Z" opacity=".9"/>
  <!-- tomas de aire a banda -->
  <path class="rubber" d="M57.5 78.4 L59.9 77.8 L60.3 80.6 L57.9 81.2 Z"/>
  <path class="rubber" d="M70.5 78.4 L68.1 77.8 L67.7 80.6 L70.1 81.2 Z"/>

  <!-- ===== V-tail (doble deriva en V) ===== -->
  <path class="shade" d="M61.9 91 L50.2 111.8 L52.7 113.6 L63.9 95.5 Z" stroke="#3d4232" stroke-width="1"/>
  <path class="shade" d="M66.1 91 L77.8 111.8 L75.3 113.6 L64.1 95.5 Z" stroke="#3d4232" stroke-width="1"/>
  <path d="M62 91.5 L50.9 112.1 M66 91.5 L77.1 112.1" stroke="#b8bfa2" stroke-width=".8" opacity=".5" fill="none"/>
  <path d="M58.2 98 L60.2 99 M69.8 98 L67.8 99" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>
  <!-- aleta ventral -->
  <path class="shade" d="M63.1 96.8 L64.9 96.8 L65.5 102.4 L62.5 102.4 Z" opacity=".9"/>
  <path class="light" d="M63.1 96.8 L63.9 96.8 L63.6 102.4 L62.5 102.4 Z" opacity=".6"/>

  <!-- ===== helice propulsora trasera (semitransparente) ===== -->
  <g class="dark" opacity=".42">
    <path d="M62.9 87.6 L65.1 87.6 L65.4 100.4 L62.6 100.4 Z" transform="rotate(40 64 102.4)"/>
    <path d="M62.9 87.6 L65.1 87.6 L65.4 100.4 L62.6 100.4 Z" transform="rotate(130 64 102.4)"/>
    <path d="M62.9 87.6 L65.1 87.6 L65.4 100.4 L62.6 100.4 Z" transform="rotate(220 64 102.4)"/>
    <path d="M62.9 87.6 L65.1 87.6 L65.4 100.4 L62.6 100.4 Z" transform="rotate(310 64 102.4)"/>
  </g>
  <g class="dark" opacity=".8">
    <path d="M62.8 87.8 L65.2 87.8 L65.3 92.6 L62.7 92.6 Z" transform="rotate(40 64 102.4)"/>
    <path d="M62.8 87.8 L65.2 87.8 L65.3 92.6 L62.7 92.6 Z" transform="rotate(130 64 102.4)"/>
    <path d="M62.8 87.8 L65.2 87.8 L65.3 92.6 L62.7 92.6 Z" transform="rotate(220 64 102.4)"/>
    <path d="M62.8 87.8 L65.2 87.8 L65.3 92.6 L62.7 92.6 Z" transform="rotate(310 64 102.4)"/>
  </g>
  <circle class="shade" cx="64" cy="102.4" r="2.6"/>
  <circle class="metal" cx="64" cy="102.4" r="1.5"/>
  <circle class="metalL" cx="64" cy="102.4" r=".6"/>
  <!-- buje del rotor entre derivas -->
  <path d="M62.6 100 L65.4 100" stroke="#4a5057" stroke-width="1.4" fill="none"/>
</svg>
