<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- MIM-104 Patriot (T2 occidental, antiaereo). Arena. Camara y escala del set.
     Estacion de lanzamiento M901 sobre semirremolque M860 en posicion de tiro.
     Identidad: no es un vehiculo de combate sino un REMOLQUE bajo con dos ejes
     traseros y gatos estabilizadores desplegados, con el paquete de CUATRO
     contenedores de misil izado en angulo hacia arriba. La silueta es una rampa
     inclinada sobre un remolque, nada que ver con un blindado. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#e2d6b2"/><stop offset="0.34" stop-color="#c8b78d"/>
    <stop offset="0.68" stop-color="#ad9c75"/><stop offset="1" stop-color="#91815f"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#aea172"/><stop offset="0.45" stop-color="#978861"/>
    <stop offset="1" stop-color="#78694a"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#6f6247"/><stop offset="0.6" stop-color="#584d38"/>
    <stop offset="1" stop-color="#453c2c"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#d4c9a8"/><stop offset="0.5" stop-color="#9e9376"/>
    <stop offset="1" stop-color="#675e47"/>
  </linearGradient>
  <linearGradient id="g-tyre" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#403d34"/><stop offset="0.5" stop-color="#2c2a22"/>
    <stop offset="1" stop-color="#1b1a15"/>
  </linearGradient>
</defs>
<path d="M22 146 L174 105 L200 129 L48 172 Z" fill="#0d0b06" opacity="0.28"/>

<!-- gatos estabilizadores -->
<g stroke="#8d7f5e" stroke-width="5" stroke-linecap="round">
  <path d="M56.5 161.9 L62.1 177.4"/>
  <path d="M186 137 L191.9 141.6"/>
</g>
<g fill="#5c5340">
  <ellipse cx="62.1" cy="178.6" rx="6" ry="3.2"/>
  <ellipse cx="191.9" cy="142.8" rx="6" ry="3.2"/>
</g>

<!-- ruedas -->
<g fill="url(#g-tyre)" stroke="#1b1a15" stroke-width="1.2">
  <ellipse cx="68.5" cy="170.3" rx="7.8" ry="9"/>
  <ellipse cx="93.2" cy="163.5" rx="7.8" ry="9"/>
</g>
<g fill="#6d6455">
  <ellipse cx="68.5" cy="170.3" rx="3.2" ry="4"/>
  <ellipse cx="93.2" cy="163.5" rx="3.2" ry="4"/>
</g>

<!-- chasis del remolque -->
<path d="M25 132 L172.5 91.3 L196.9 115.2 L49.4 155.9 Z" fill="url(#g-deck)"/>
<path d="M49.4 155.9 L196.9 115.2 L196.9 125.2 L49.4 165.9 Z" fill="url(#g-flank)"/>
<path d="M25 132 L49.4 155.9 L49.4 165.9 L25 142 Z" fill="url(#g-rear)"/>
<g stroke="#6d6046" stroke-opacity="0.55" stroke-width="1.1">
  <path d="M70 148.2 L94.4 124.3"/><path d="M110 137.2 L134.4 113.3"/>
  <path d="M150 126.1 L174.4 102.2"/>
</g>
<!-- cuadro electronico en el chasis -->
<path d="M132 130 L160 122.3 L160 111 L132 118.7 Z" fill="#8d7f5e" stroke="#5a5039" stroke-width="0.9"/>

<!-- montante del erector -->
<path d="M95 130 L103 127.8 L109 98 L101 100.2 Z" fill="#7a6d50" stroke="#4a412f" stroke-width="1"/>

<!-- paquete de cuatro contenedores, izado -->
<path d="M59.8 149.5 L130.5 75.0 L130.5 55.0 L59.8 129.5 Z" fill="url(#g-flank)"/>
<path d="M41.0 111.1 L111.7 36.6 L130.5 55.0 L59.8 129.5 Z" fill="url(#g-deck)"/>
<path d="M41.0 131.1 L59.8 149.5 L59.8 129.5 L41.0 111.1 Z" fill="url(#g-rear)"/>
<path d="M41.0 111.1 L111.7 36.6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.6"/>
<!-- culatas de los cuatro contenedores -->
<g fill="#5c5340" stroke="#3a3327" stroke-width="0.9">
  <path d="M42.2 130.1 L49.4 137.2 L49.4 129.4 L42.2 122.3 Z"/>
  <path d="M51.6 139.3 L58.8 146.4 L58.8 138.6 L51.6 131.5 Z"/>
  <path d="M42.2 120.1 L49.4 127.2 L49.4 119.4 L42.2 112.3 Z"/>
  <path d="M51.6 129.3 L58.8 136.4 L58.8 128.6 L51.6 121.5 Z"/>
</g>
<!-- refuerzos longitudinales del paquete -->
<g stroke="#6d6046" stroke-opacity="0.6" stroke-width="1.2">
  <path d="M77.5 131.2 L95.4 112.4"/>
  <path d="M100.5 106.9 L118.4 88.1"/>
</g>
</svg>
