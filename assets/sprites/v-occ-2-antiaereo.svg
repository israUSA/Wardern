<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- MIM-104 Patriot: estacion de lanzamiento M901 remolcada - vista superior, norte.
       Cabina del tractor delante, plataforma con DOS ejes de RUEDAS dobles,
       canister 2x2 con 4 misiles elevado en angulo, riostras hidraulicas.
       Tinte por pais: .base/.shade/.light/.hi. Fijos: .metal/.metalS/.metalL, .dark, .rubber. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="aa2f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="aa2f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="aa2gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".5" stop-color="#000" stop-opacity=".19"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="aa2g1" gradientUnits="userSpaceOnUse" x1="40" y1="64" x2="88" y2="64">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".16" stop-color="#fff" stop-opacity=".18"/><stop offset=".4" stop-color="#fff" stop-opacity=".22"/><stop offset=".64" stop-color="#fff" stop-opacity=".04"/><stop offset=".84" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="aa2g2" gradientUnits="userSpaceOnUse" x1="64" y1="18" x2="64" y2="110">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="aa2g3" gradientUnits="userSpaceOnUse" x1="50" y1="26" x2="78" y2="66">
    <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".35" stop-color="#fff" stop-opacity=".08"/><stop offset=".7" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <radialGradient id="aa2g5" cx=".38" cy=".32" r=".8">
    <stop offset="0" stop-color="#fff" stop-opacity=".36"/><stop offset=".4" stop-color="#fff" stop-opacity=".08"/><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
  </radialGradient>
  </defs>

  <ellipse cx="64" cy="66" rx="44" ry="56" fill="url(#aa2gs)"/>

  <!-- ===== ruedas dobles (dos ejes) ===== -->
  <g>
    <ellipse class="dark" cx="46" cy="84" rx="6.6" ry="7.2" opacity=".3"/><ellipse class="dark" cx="82" cy="84" rx="6.6" ry="7.2" opacity=".3"/>
    <ellipse class="dark" cx="46" cy="96" rx="6.6" ry="7.2" opacity=".3"/><ellipse class="dark" cx="82" cy="96" rx="6.6" ry="7.2" opacity=".3"/>
    <ellipse class="dark" cx="46" cy="110" rx="6.6" ry="7.2" opacity=".3"/><ellipse class="dark" cx="82" cy="110" rx="6.6" ry="7.2" opacity=".3"/>
    <circle class="rubber" cx="46" cy="84" r="5.9"/><circle class="rubber" cx="82" cy="84" r="5.9"/>
    <circle class="rubber" cx="46" cy="96" r="5.9"/><circle class="rubber" cx="82" cy="96" r="5.9"/>
    <circle class="rubber" cx="46" cy="110" r="5.9"/><circle class="rubber" cx="82" cy="110" r="5.9"/>
    <circle cx="46" cy="84" r="5.9" fill="none" stroke="#1c1f1a" stroke-width=".8"/><circle cx="82" cy="84" r="5.9" fill="none" stroke="#1c1f1a" stroke-width=".8"/>
    <circle cx="46" cy="96" r="5.9" fill="none" stroke="#1c1f1a" stroke-width=".8"/><circle cx="82" cy="96" r="5.9" fill="none" stroke="#1c1f1a" stroke-width=".8"/>
    <circle cx="46" cy="110" r="5.9" fill="none" stroke="#1c1f1a" stroke-width=".8"/><circle cx="82" cy="110" r="5.9" fill="none" stroke="#1c1f1a" stroke-width=".8"/>
    <circle class="metal" cx="46" cy="84" r="2.1"/><circle class="metal" cx="82" cy="84" r="2.1"/>
    <circle class="metal" cx="46" cy="96" r="2.1"/><circle class="metal" cx="82" cy="96" r="2.1"/>
    <circle class="metal" cx="46" cy="110" r="2.1"/><circle class="metal" cx="82" cy="110" r="2.1"/>
    <g fill="#fff" opacity=".22">
      <circle cx="44.4" cy="82.2" r="1.7"/><circle cx="80.4" cy="82.2" r="1.4"/>
      <circle cx="44.4" cy="94.2" r="1.7"/><circle cx="80.4" cy="94.2" r="1.4"/>
      <circle cx="44.4" cy="108.2" r="1.7"/><circle cx="80.4" cy="108.2" r="1.4"/>
    </g>
  </g>

  <!-- ===== plataforma del remolque ===== -->
  <path class="base" d="M50 30 L78 30 L80 38 L80 112 L76 116.5 L52 116.5 L48 112 L48 38 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M50 30 L78 30 L80 38 L80 112 L76 116.5 L52 116.5 L48 112 L48 38 Z" fill="url(#aa2g1)"/>
  <path d="M50 30 L78 30 L80 38 L80 112 L76 116.5 L52 116.5 L48 112 L48 38 Z" fill="url(#aa2g2)"/>
  <path d="M49 33 L48.6 111" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M79 33 L79.4 111" stroke="#000" stroke-width="1.4" opacity=".24" fill="none" filter="url(#aa2f1)"/>
  <!-- travesanos de la plataforma -->
  <path d="M49 46 L79 46 M48.6 74 L79.4 74 M48.6 104 L79.4 104" stroke="#000" stroke-width=".6" opacity=".25" fill="none"/>
  <!-- riostras del enganche -->
  <path class="dark" d="M61 25.5 L67 25.5 L67 30 L61 30 Z"/>
  <path d="M62.5 26.3 L62.5 29.2 M65.5 26.3 L65.5 29.2" stroke="#8a929b" stroke-width=".6" opacity=".7" fill="none"/>

  <!-- ===== cabina del tractor ===== -->
  <path class="shade" d="M54 16.5 L74 16.5 L76 21 L76 29.5 L52 29.5 L52 21 Z" stroke="#3d4232" stroke-width="1.1"/>
  <path d="M54.4 17 L73.6 17 L75.2 21.4 L52.8 21.4 Z" fill="#fff" opacity=".16"/>
  <path class="glass" d="M55 21.6 L73 21.6 L74 28 L54 28 Z"/>
  <path d="M55 21.6 L73 21.6 L74 28 L54 28 Z" fill="none" stroke="#243b4d" stroke-width=".6"/>
  <path d="M58.5 22.2 L57.8 27.4 M69.5 22.2 L70.2 27.4" stroke="#243b4d" stroke-width=".5" opacity=".8" fill="none"/>
  <path d="M60 22.6 L59.5 27" stroke="#e8f4fb" stroke-width=".8" opacity=".55" fill="none"/>
  <circle class="hi" cx="54.5" cy="30.2" r="1.2"/><circle class="hi" cx="73.5" cy="30.2" r="1.2"/>

  <!-- sombra del canister sobre la plataforma -->
  <path d="M49.5 34 L78.5 34 L80 62 L48 62 Z" fill="#000" opacity=".26" filter="url(#aa2f2)"/>

  <!-- ===== canister 2x2 elevado ===== -->
  <path class="shade" d="M52 30 L76 30 L79 62 L49 62 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M52 30 L76 30 L79 62 L49 62 Z" fill="url(#aa2g3)"/>
  <path d="M52.6 30.6 L75.4 30.6" stroke="#fff" stroke-width="1" opacity=".55" fill="none"/>
  <path d="M49.6 31.5 L48.4 61" stroke="#fff" stroke-width=".8" opacity=".35" fill="none"/>
  <path d="M78.4 31.5 L78.6 61" stroke="#000" stroke-width="1" opacity=".24" fill="none" filter="url(#aa2f1)"/>
  <path class="light" d="M52 30 L76 30 L75.6 32.4 L52.4 32.4 Z" opacity=".85"/>
  <!-- costuras 2x2 -->
  <path d="M64 33 L64 60.5 M57.2 34 L54.6 60 M70.8 34 L73.4 60" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>
  <path d="M50.5 46 C57 47.4 71 47.4 77.5 46" stroke="#000" stroke-width=".6" opacity=".3" fill="none"/>
  <!-- bocas de los dos tubos delanteros -->
  <circle class="dark" cx="57.8" cy="33.4" r="3.1"/>
  <circle cx="56.9" cy="32.5" r=".9" fill="#fff" opacity=".4"/>
  <circle class="metalL" cx="57.8" cy="33.4" r="1.5"/>
  <circle class="dark" cx="70.2" cy="33.4" r="3.1"/>
  <circle cx="69.3" cy="32.5" r=".9" fill="#fff" opacity=".4"/>
  <circle class="metalL" cx="70.2" cy="33.4" r="1.5"/>
  <!-- bocas de la segunda hilera asomando -->
  <path class="dark" d="M54.4 37.6 A2.9 2.9 0 0 1 60 37.6 Z M68 37.6 A2.9 2.9 0 0 1 73.6 37.6 Z" opacity=".9"/>
  <!-- banda inferior del canister -->
  <path d="M49.6 58.5 C57 60 71 60 78.4 58.5" stroke="#000" stroke-width=".8" opacity=".4" fill="none"/>

  <!-- riostras hidraulicas del canister -->
  <path class="metalS" d="M50.5 63 L46 71" stroke="#8a929b" stroke-width="2.4" fill="none"/>
  <path class="metalS" d="M77.5 63 L82 71" stroke="#8a929b" stroke-width="2.4" fill="none"/>
  <path d="M50.5 63 L46 71 M77.5 63 L82 71" stroke="#4a5057" stroke-width=".6" fill="none"/>
  <!-- caja de electronica en la plataforma -->
  <rect class="dark" x="53" y="100" width="9" height="7" rx=".8"/>
  <path d="M55.5 101 L55.5 106 M58.5 101 L58.5 106" stroke="#9aa378" stroke-width=".55" opacity=".6" fill="none"/>
  <rect class="shade" x="66" y="100.5" width="9" height="6.5" rx=".7"/>
  <path d="M66.3 100.8 L74.7 100.8" stroke="#fff" stroke-width=".5" opacity=".3" fill="none"/>
  <!-- antena -->
  <path d="M49 92 L44.5 100" stroke="#3d4232" stroke-width="1" fill="none" opacity=".85"/>
  <circle class="dark" cx="49" cy="92" r="1"/>
  <!-- luz trasera -->
  <rect class="hi" x="50" y="113.5" width="2.2" height="1.6" rx=".4" opacity=".85"/>
  <rect class="hi" x="75.8" y="113.5" width="2.2" height="1.6" rx=".4" opacity=".85"/>
</svg>
