<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- T-72 (T2 oriental). Verde ruso.
     Misma camara y escala que el resto del set (20.9 px/m, ~31 grados).
     Casco 6.95 x 3.59 x 2.23 m: el mas bajo del set.
     Identidad frente al T-62: 6 ruedas de rodadura y 3 rodillos de retorno,
     faldones de goma abatibles solo sobre el tramo delantero de la oruga, torreta
     fundida achatada mas pequena, canon 2A46 de 125 mm con el evacuador de humos
     a media cana, tubo de esnorquel amarrado en la popa de torreta y bidones
     de combustible en la popa del casco. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0"    stop-color="#9aa878"/>
    <stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/>
    <stop offset="1"    stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0"    stop-color="#6b7a4e"/>
    <stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1"    stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-turret" x1="0.2" y1="0" x2="0.85" y2="1">
    <stop offset="0"    stop-color="#8b9a69"/>
    <stop offset="0.5"  stop-color="#6d7c50"/>
    <stop offset="1"    stop-color="#4e5c38"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0"    stop-color="#485636"/>
    <stop offset="0.6"  stop-color="#374327"/>
    <stop offset="1"    stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0"    stop-color="#a6b28a"/>
    <stop offset="0.5"  stop-color="#717d5a"/>
    <stop offset="1"    stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0"    stop-color="#3a3a30"/>
    <stop offset="0.5"  stop-color="#26261f"/>
    <stop offset="1"    stop-color="#171712"/>
  </linearGradient>
</defs>

<!-- 1. sombra -->
<path d="M26 147 L164 110 L204 145 L62 184 Z" fill="#080a06" opacity="0.30"/>

<!-- 2. popa con bidones de combustible -->
<path d="M29.8 114.9 L65.0 149.3 L65.0 174.3 L29.8 139.9 Z" fill="url(#g-rear)"/>
<g fill="#56653c" stroke="#1f2716" stroke-width="0.9">
  <path d="M33 123 L45 134.7 L45 147 L33 135.3 Z"/>
  <path d="M48 137.6 L60 149.3 L60 161.6 L48 149.9 Z"/>
</g>
<g stroke="#7e8d5e" stroke-opacity="0.6" stroke-width="0.9">
  <path d="M34.5 128 L43.5 136.8"/><path d="M34.5 132.6 L43.5 141.4"/>
  <path d="M49.5 142.6 L58.5 151.4"/><path d="M49.5 147.2 L58.5 156"/>
</g>
<circle cx="32" cy="120" r="2.4" fill="#8f5b30"/>

<!-- 3. cubierta y glacis -->
<path d="M29.8 114.9 L118.1 90.5 L153.3 124.9 L65.0 149.3 Z" fill="url(#g-deck)"/>
<path d="M118.1 90.5 L157.8 92.5 L193.0 126.9 L153.3 124.9 Z" fill="url(#g-deck)"/>
<path d="M118.1 90.5 L153.3 124.9" fill="none" stroke="#3b4728" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M118.1 90.5 L157.8 92.5 L193.0 126.9 L153.3 124.9 Z" fill="#ffffff" fill-opacity="0.07"/>
<!-- escotilla del conductor centrada en el glacis -->
<ellipse cx="141" cy="105.5" rx="6.8" ry="4.5" fill="#6d7c50" stroke="#333d22" stroke-width="1"/>
<g fill="#3b4728">
  <path d="M161 94 L167 100 L163.8 101.4 L157.8 95.4 Z"/>
  <path d="M177 110 L183 116 L179.8 117.4 L173.8 111.4 Z"/>
</g>
<!-- rejillas del motor -->
<path d="M34.4 117.2 L62.6 109.4 L91.7 137.8 L63.5 145.6 Z" fill="#4c5a35"/>
<g stroke="#8b9a69" stroke-opacity="0.7" stroke-width="1.1">
  <path d="M40 115.6 L69.1 144"/>
  <path d="M46 114 L75.1 142.4"/>
  <path d="M52 112.3 L81.1 140.7"/>
  <path d="M58 110.7 L87.1 139.1"/>
</g>
<!-- depositos externos sobre el guardabarros derecho -->
<path d="M96 143 L120 136.4 L120 129.9 L96 136.5 Z" fill="#5f6f42" stroke="#333d22" stroke-width="0.9"/>
<path d="M124 135.3 L146 129.2 L146 122.7 L124 128.8 Z" fill="#5f6f42" stroke="#333d22" stroke-width="0.9"/>

<!-- 4. flanco -->
<path d="M65.0 149.3 L153.3 124.9 L193.0 123.0 L65.0 158.3 Z" fill="url(#g-flank)"/>
<path d="M65.0 149.3 L153.3 124.9" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>

<!-- 5. tren de rodaje: 6 ruedas + 3 rodillos de retorno -->
<path d="M62.9 176.7 L198.0 139.3 L198.0 123.3 L62.9 160.7 Z" fill="url(#g-trk)"/>
<g fill="#3d4433" stroke="#17190f" stroke-width="1.1">
  <ellipse cx="78.8"  cy="164.3" rx="7.5" ry="8.7"/>
  <ellipse cx="100.0" cy="158.4" rx="7.5" ry="8.7"/>
  <ellipse cx="121.1" cy="152.6" rx="7.5" ry="8.7"/>
  <ellipse cx="144.1" cy="146.2" rx="7.5" ry="8.7"/>
  <ellipse cx="165.3" cy="140.4" rx="7.5" ry="8.7"/>
  <ellipse cx="186.5" cy="134.5" rx="7.5" ry="8.7"/>
</g>
<g fill="#5a6247">
  <ellipse cx="78.8"  cy="164.3" rx="2.8" ry="3.3"/>
  <ellipse cx="100.0" cy="158.4" rx="2.8" ry="3.3"/>
  <ellipse cx="121.1" cy="152.6" rx="2.8" ry="3.3"/>
  <ellipse cx="144.1" cy="146.2" rx="2.8" ry="3.3"/>
  <ellipse cx="165.3" cy="140.4" rx="2.8" ry="3.3"/>
  <ellipse cx="186.5" cy="134.5" rx="2.8" ry="3.3"/>
</g>
<ellipse cx="65.5"  cy="165.0" rx="8.8" ry="10"  fill="#454c39" stroke="#17190f" stroke-width="1.2"/>
<ellipse cx="196.2" cy="128.8" rx="8"   ry="9.2" fill="#454c39" stroke="#17190f" stroke-width="1.2"/>
<g fill="#454c39" stroke="#17190f" stroke-width="0.9">
  <ellipse cx="91.1"  cy="151.9" rx="3" ry="3.5"/>
  <ellipse cx="126.4" cy="142.1" rx="3" ry="3.5"/>
  <ellipse cx="161.8" cy="132.3" rx="3" ry="3.5"/>
</g>
<path d="M64 177 L199 139.7" fill="none" stroke="#080a06" stroke-opacity="0.55" stroke-width="3"/>

<!-- 6. faldones de goma abatibles solo en el tramo delantero: marca del T-72 -->
<path d="M140.9 138.5 L193.9 123.8 L193.9 115.8 L140.9 130.5 Z" fill="#5c6a42" stroke="#2b3320" stroke-width="0.9"/>
<g stroke="#2b3320" stroke-opacity="0.75" stroke-width="1">
  <path d="M154.2 126.8 L154.2 134.8"/>
  <path d="M167.4 123.1 L167.4 131.1"/>
  <path d="M180.7 119.5 L180.7 127.5"/>
</g>

<!-- 7. torreta fundida achatada: base -->
<path d="M116.3 113.1 C123.0 119.7 118.2 127.8 105.5 131.3
         C92.8 134.8 77.0 132.3 70.3 125.7
         C63.6 119.1 68.4 111.0 81.1 107.5
         C93.8 104.0 109.6 106.5 116.3 113.1 Z" fill="url(#g-flank)"/>
<!-- techo -->
<path d="M116.3 91.1 C123.0 97.7 118.2 105.8 105.5 109.3
         C92.8 112.8 77.0 110.3 70.3 103.7
         C63.6 97.1 68.4 89.0 81.1 85.5
         C93.8 82.0 109.6 84.5 116.3 91.1 Z" fill="url(#g-turret)"/>
<path d="M70.3 103.7 C63.6 97.1 68.4 89.0 81.1 85.5 C93.8 82.0 109.6 84.5 116.3 91.1"
      fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.4"/>
<!-- esnorquel amarrado en la popa de torreta -->
<path d="M55.1 112.7 L72.9 130.1" fill="none" stroke="#4e5c38" stroke-width="5.5" stroke-linecap="round"/>
<path d="M55.1 111.2 L72.9 128.6" fill="none" stroke="#8b9a69" stroke-opacity="0.7" stroke-width="1.6"/>
<!-- cajas de estiba en el flanco de torreta -->
<path d="M84 118 L104 113 L104 106 L84 111 Z" fill="#5f6f42" stroke="#333d22" stroke-width="0.9"/>

<!-- 8. cupulas: comandante a la derecha, cargador a la izquierda con la NSVT -->
<path d="M91.5 106.9 L91.5 98.9 A7 4.8 0 0 1 105.5 98.9 L105.5 106.9 Z" fill="#5f6f42"/>
<ellipse cx="98.5" cy="98.9" rx="7" ry="4.8" fill="#8b9a69" stroke="#333d22" stroke-width="1"/>
<path d="M93.5 97.4 A7 4.8 0 0 1 103.5 97.4" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
<path d="M75.1 90.4 L75.1 82.4 A6.5 4.5 0 0 1 88.1 82.4 L88.1 90.4 Z" fill="#5f6f42"/>
<ellipse cx="81.6" cy="82.4" rx="6.5" ry="4.5" fill="#8b9a69" stroke="#333d22" stroke-width="1"/>
<path d="M84.5 80.5 L88 79.2 L103 74 L103.8 76.1 L88.8 81.3 L85.5 82.6 Z" fill="url(#g-metal)"/>

<!-- 9. canon 2A46 de 125 mm, evacuador a media cana -->
<path d="M106 104.5 L114.5 97.5 L122 102 L113.5 109 Z" fill="#6d7c50" stroke="#333d22" stroke-width="0.9"/>
<path d="M113.4 96.6 L222.0 66.5 L224.2 74.6 L115.6 104.7 Z" fill="url(#g-metal)"/>
<path d="M154.1 83.0 L170.4 78.4 L173.8 90.8 L157.5 95.4 Z" fill="#95a274" stroke="#3b4728" stroke-width="0.8"/>
<ellipse cx="223.1" cy="70.5" rx="1.6" ry="3.6" fill="#12150e"/>
<path d="M113.4 96.6 L222.0 66.5 L222.4 68.1 L113.8 98.2 Z" fill="#ffffff" fill-opacity="0.32"/>
</svg>
