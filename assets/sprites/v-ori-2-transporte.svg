<!-- Ivan Rogov, Proyecto 1174 (T2 oriental, transporte). Gris ruso. Identidad: superestructura MUY GRANDE a media eslora que parte el buque en dos, con cubierta de vuelo despejada a popa y cubierta de carga con canon a proa. Es el unico transporte del set con la isla en el centro y no en un extremo.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
