<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- F-16C Fighting Falcon - vista superior, morro al norte.
       Tinte por pais: sobreescribir .base/.shade/.light/.hi (fuselaje, alas, estabilizadores).
       Fijos: .metal/.metalS/.metalL (misiles, tobera, pilones), .glass/.glassL (cabina),
       .dark/.rubber (detalles, neumatico). Volumen: overlays g1 (cilindro) y g2 (longitud). -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="56.4" y1="60" x2="71.6" y2="60">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".22" stop-color="#fff" stop-opacity=".2"/><stop offset=".4" stop-color="#fff" stop-opacity=".28"/><stop offset=".62" stop-color="#fff" stop-opacity=".05"/><stop offset=".82" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="64" y1="10" x2="64" y2="116">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="26" y1="50" x2="26" y2="93">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="60" y1="25" x2="60" y2="45">
    <stop offset="0" stop-color="#e8f4fb" stop-opacity=".85"/><stop offset=".35" stop-color="#9cc4dc" stop-opacity=".35"/><stop offset=".75" stop-color="#28495e" stop-opacity=".55"/><stop offset="1" stop-color="#14293a" stop-opacity=".8"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="60" cy="70" rx="50" ry="60" fill="url(#gs)"/>

  <!-- ===== AIM-9 en punta de ala (izq) ===== -->
  <rect class="dark" x="22" y="62" width="2.6" height="25" rx="1"/>
  <path class="metalS" d="M23.3 57.5 L25 61 L25 83.5 L26.6 88 L23.3 86.2 L20 88 L21.6 83.5 L21.6 61 Z"/>
  <path class="dark" d="M21.9 57.9 L24.7 57.9 L25 61 L21.6 61 Z" opacity=".85"/>
  <path d="M21.7 66 L24.9 66 M21.7 80 L24.9 80" stroke="#000" stroke-width=".7" opacity=".35" fill="none"/>
  <path class="metalL" d="M20 87 L21.9 84.6 L21.9 88.6 Z M26.6 87 L24.7 84.6 L24.7 88.6 Z"/>
  <path class="hi" d="M22.3 62 L23 62 L23 83 L22.3 83 Z" opacity=".7"/>
  <!-- ===== AIM-9 (der) ===== -->
  <rect class="dark" x="103.4" y="62" width="2.6" height="25" rx="1"/>
  <path class="metalS" d="M104.7 57.5 L106.4 61 L106.4 83.5 L108 88 L104.7 86.2 L101.4 88 L103 83.5 L103 61 Z"/>
  <path class="dark" d="M103.3 57.9 L106.1 57.9 L106.4 61 L103 61 Z" opacity=".85"/>
  <path d="M103.1 66 L106.3 66 M103.1 80 L106.3 80" stroke="#000" stroke-width=".7" opacity=".35" fill="none"/>
  <path class="metalL" d="M101.4 87 L103.3 84.6 L103.3 88.6 Z M108 87 L106.1 84.6 L106.1 88.6 Z"/>
  <path class="hi" d="M103.7 62 L104.4 62 L104.4 83 L103.7 83 Z" opacity=".7"/>

  <!-- ===== estabilizadores horizontales ===== -->
  <path class="shade" d="M57.6 94 L39.5 104.5 L36 112 L57.2 108.6 Z"/>
  <path class="shade" d="M70.4 94 L88.5 104.5 L92 112 L70.8 108.6 Z"/>
  <path d="M57.6 94 L39.5 104.5 L36 112 L57.2 108.6 Z" fill="url(#g3)"/>
  <path d="M70.4 94 L88.5 104.5 L92 112 L70.8 108.6 Z" fill="url(#g3)"/>
  <path class="light" d="M57.6 94 L39.5 104.5 L38.6 105.9 L58.4 96.2 Z" opacity=".85"/>
  <path class="light" d="M70.4 94 L88.5 104.5 L89.4 105.9 L69.6 96.2 Z" opacity=".85"/>
  <path d="M41 104 L55 101.4 M87 104 L73 101.4" stroke="#000" stroke-width=".6" opacity=".25" fill="none"/>
  <path class="dark" d="M36 112 L39.5 104.5 L41.8 108 L38 112.6 Z" opacity=".8"/>
  <path class="dark" d="M92 112 L88.5 104.5 L86.2 108 L90 112.6 Z" opacity=".8"/>

  <!-- ===== ala delta recortada ===== -->
  <path class="base" d="M55.4 49 C49 58,34 76,26.2 85.6 L25 90.6 L52.4 93.2 L55.6 92.4 Z"/>
  <path class="base" d="M72.6 49 C79 58,94 76,101.8 85.6 L103 90.6 L75.6 93.2 L72.4 92.4 Z"/>
  <path d="M55.4 49 C49 58,34 76,26.2 85.6 L25 90.6 L52.4 93.2 L55.6 92.4 Z" fill="url(#g3)"/>
  <path d="M72.6 49 C79 58,94 76,101.8 85.6 L103 90.6 L75.6 93.2 L72.4 92.4 Z" fill="url(#g3)"/>
  <!-- borde de ataque iluminado + rim light -->
  <path class="light" d="M55.4 49 C49 58,34 76,26.2 85.6 L25.6 88 L53.6 53.4 Z" opacity=".9"/>
  <path class="light" d="M72.6 49 C79 58,94 76,101.8 85.6 L102.4 88 L74.4 53.4 Z" opacity=".9"/>
  <path d="M55.2 49.6 C49 58.4,35 75.6,26.8 85.4" stroke="#fff" stroke-width=".9" opacity=".45" fill="none"/>
  <path d="M72.8 49.6 C79 58.4,93 75.6,101.2 85.4" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <!-- borde de salida en sombra -->
  <path d="M52.6 91.6 L26 89.2" stroke="#000" stroke-width="1.4" opacity=".18" fill="none" filter="url(#f1)"/>
  <path d="M75.4 91.6 L102 89.2" stroke="#000" stroke-width="1.4" opacity=".18" fill="none" filter="url(#f1)"/>
  <!-- flaperones y lineas de panel -->
  <path d="M53.4 55 L30.5 79.5 M52 66 L33.5 85.5 M74.6 55 L97.5 79.5 M76 66 L94.5 85.5" stroke="#000" stroke-width=".7" opacity=".22" fill="none"/>
  <path d="M26.5 89.5 L51.5 92 M101.5 89.5 L76.5 92" stroke="#000" stroke-width=".8" opacity=".3" fill="none"/>
  <path d="M53.4 55 L52.4 91 M74.6 55 L75.6 91" stroke="#000" stroke-width=".6" opacity=".2" fill="none"/>
  <!-- remaches raiz de ala -->
  <path d="M55 52 L55 90 M73 52 L73 90" stroke="#3d4232" stroke-width=".5" stroke-dasharray=".7 1.6" opacity=".5" fill="none"/>

  <!-- ===== AIM-120 bajo ala con pilon ===== -->
  <path class="dark" d="M40.4 76 L43 76 L43 81.5 L40.4 81.5 Z" opacity=".85"/>
  <path class="dark" d="M85 76 L87.6 76 L87.6 81.5 L85 81.5 Z" opacity=".85"/>
  <path class="metalS" d="M41.7 57 L43.4 61 L43.4 82 L45 86.2 L41.7 84.4 L38.4 86.2 L40 82 L40 61 Z"/>
  <path class="dark" d="M40.3 57.4 L43.1 57.4 L43.4 61 L40 61 Z" opacity=".85"/>
  <path class="metalL" d="M38.6 85.4 L40.2 83.2 L40.2 87.4 Z M44.8 85.4 L43.2 83.2 L43.2 87.4 Z"/>
  <path d="M40.1 63 L43.3 63 M40.1 77 L43.3 77" stroke="#000" stroke-width=".6" opacity=".35" fill="none"/>
  <path class="hi" d="M40.7 62 L41.4 62 L41.4 81 L40.7 81 Z" opacity=".65"/>
  <path class="metalS" d="M86.3 57 L88 61 L88 82 L89.6 86.2 L86.3 84.4 L83 86.2 L84.6 82 L84.6 61 Z"/>
  <path class="dark" d="M84.9 57.4 L87.7 57.4 L88 61 L84.6 61 Z" opacity=".85"/>
  <path class="metalL" d="M83.2 85.4 L84.8 83.2 L84.8 87.4 Z M89.4 85.4 L87.8 83.2 L87.8 87.4 Z"/>
  <path d="M84.7 63 L87.9 63 M84.7 77 L87.9 77" stroke="#000" stroke-width=".6" opacity=".35" fill="none"/>
  <path class="hi" d="M85.3 62 L86 62 L86 81 L85.3 81 Z" opacity=".65"/>

  <!-- ===== aletas ventrales ===== -->
  <path class="shade" d="M58.8 100 L53.6 111.5 L59 107.6 Z"/>
  <path class="shade" d="M69.2 100 L74.4 111.5 L69 107.6 Z"/>
  <path class="dark" d="M58.8 100 L53.6 111.5 L57.4 109.4 Z" opacity=".7"/>
  <path class="dark" d="M69.2 100 L74.4 111.5 L70.6 109.4 Z" opacity=".7"/>

  <!-- ===== fuselaje ===== -->
  <path class="base" d="M64 9.5 C61.4 12.6 60 18 59.7 23.5 L59.2 28.5 C57.7 36 57 44 56.6 50 L56.4 56 C56.8 66 57.6 76 58.6 86 L60.2 104 L62.2 112 L64 115.5 L65.8 112 L67.8 104 L69.4 86 C70.4 76 71.2 66 71.6 56 L71.4 50 C71 44 70.3 36 68.8 28.5 L68.3 23.5 C68 18 66.6 12.6 64 9.5 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 9.5 C61.4 12.6 60 18 59.7 23.5 L59.2 28.5 C57.7 36 57 44 56.6 50 L56.4 56 C56.8 66 57.6 76 58.6 86 L60.2 104 L62.2 112 L64 115.5 L65.8 112 L67.8 104 L69.4 86 C70.4 76 71.2 66 71.6 56 L71.4 50 C71 44 70.3 36 68.8 28.5 L68.3 23.5 C68 18 66.6 12.6 64 9.5 Z" fill="url(#g1)"/>
  <path d="M64 9.5 C61.4 12.6 60 18 59.7 23.5 L59.2 28.5 C57.7 36 57 44 56.6 50 L56.4 56 C56.8 66 57.6 76 58.6 86 L60.2 104 L62.2 112 L64 115.5 L65.8 112 L67.8 104 L69.4 86 C70.4 76 71.2 66 71.6 56 L71.4 50 C71 44 70.3 36 68.8 28.5 L68.3 23.5 C68 18 66.6 12.6 64 9.5 Z" fill="url(#g2)"/>
  <!-- rim light en el flanco de babor + sombra profunda a estribor -->
  <path d="M59.9 24 C58 34 57 48 56.8 58 C56.6 70 57.4 82 58.6 92" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M68.1 24 C70 34 71 48 71.2 58 C71.4 70 70.6 82 69.4 92" stroke="#000" stroke-width="1.6" opacity=".24" fill="none" filter="url(#f1)"/>
  <!-- sombra de misiles sobre el ala -->
  <path d="M44.4 60 L47.6 60 L47.6 85 L44.8 85 Z" fill="#000" opacity=".2" filter="url(#f1)"/>
  <path d="M89 60 L92.2 60 L92.2 85 L89.4 85 Z" fill="#000" opacity=".2" filter="url(#f1)"/>
  <!-- sombra de union ala-fuselaje (oclusion suave) -->
  <path d="M56.4 52 C58.2 49.8 60.6 48.8 62 48.6 M71.6 52 C69.8 49.8 67.4 48.8 66 48.6" stroke="#000" stroke-width="2.4" opacity=".3" fill="none" filter="url(#f1)"/>
  <!-- sombra proyectada del fuselaje sobre las alas -->
  <path d="M56.2 50 L59.2 50 L57.4 92.6 L53 92.2 Z" fill="#000" opacity=".2" filter="url(#f2)"/>
  <path d="M71.8 50 L68.8 50 L70.6 92.6 L75 92.2 Z" fill="#000" opacity=".2" filter="url(#f2)"/>
  <!-- sombra del estabilizador sobre el fuselaje -->
  <path d="M57.8 94.4 L70.2 94.4 L69.6 98 L58.4 98 Z" fill="#000" opacity=".24" filter="url(#f1)"/>
  <!-- tomas de aire laterales (rinones) -->
  <path class="dark" d="M56.7 38 C56.3 42.5 56.2 46.5 56.6 50 L59.8 50 C59.2 46 59 42 59.3 38 C58.4 38.4 57.4 38.3 56.7 38 Z" opacity=".55"/>
  <path class="dark" d="M71.3 38 C71.7 42.5 71.8 46.5 71.4 50 L68.2 50 C68.8 46 69 42 68.7 38 C69.6 38.4 70.6 38.3 71.3 38 Z" opacity=".55"/>
  <!-- lineas de panel del fuselaje -->
  <path d="M59.6 23.5 C61.8 25.2 66.2 25.2 68.4 23.5 M57 43 C61.5 44.6 66.5 44.6 71 43 M57.4 60 C61.5 61 66.5 61 70.6 60 M58 78 C61.8 79 66.2 79 70 78" stroke="#000" stroke-width=".6" opacity=".22" fill="none"/>
  <!-- luces de formacion -->
  <path class="hi" d="M58.9 31 L60.3 31 L60.3 34 L58.9 34 Z" opacity=".8"/>
  <path class="hi" d="M67.7 31 L69.1 31 L69.1 34 L67.7 34 Z" opacity=".8"/>
  <!-- puerto del canon sobre LEX izq -->
  <circle class="dark" cx="58.2" cy="34.6" r="1.2"/>
  <circle cx="58.2" cy="34.6" r="1.7" stroke="#000" stroke-width=".5" opacity=".35" fill="none"/>
  <!-- puerto de repostaje -->
  <circle class="metalL" cx="69.3" cy="26.5" r="1.1"/>

  <!-- ===== loma dorsal ===== -->
  <path class="shade" d="M60.3 47 C59.9 57 59.9 67 60.6 79 L67.4 79 C68.1 67 68.1 57 67.7 47 C66 49.2 62 49.2 60.3 47 Z"/>
  <path d="M60.5 53 C61.6 54 66.4 54 67.5 53 M60.5 62 C61.6 63 66.4 63 67.5 62 M60.6 71 C61.7 72 66.3 72 67.4 71" stroke="#000" stroke-width=".6" opacity=".25" fill="none"/>
  <!-- antena dorsal -->
  <path class="dark" d="M60.2 63.5 L61.3 63.5 L61.3 70 L60.2 70 Z" opacity=".9"/>

  <!-- ===== deriva vertical (de canto) ===== -->
  <path class="shade" d="M61.7 74 L66.3 74 L65.5 110 L62.5 110 Z"/>
  <path class="light" d="M61.7 74 L63.4 74 L62.7 110 L62.5 110 Z" opacity=".7"/>
  <path class="dark" d="M65.2 74 L66.3 74 L65.5 110 L64.6 110 Z" opacity=".8"/>
  <path d="M62.2 96 L65.8 96" stroke="#000" stroke-width=".7" opacity=".3" fill="none"/>
  <!-- banda de cola -->
  <path class="dark" d="M61.9 88 L66.1 88 L66 91 L62 91 Z" opacity=".55"/>
  <!-- carenado EC en base de deriva -->
  <path class="shade" d="M59.6 99.5 L68.4 99.5 L68 107 L60 107 Z" opacity=".9"/>
  <path d="M60 101.5 L68 101.5 M60 104.5 L68 104.5" stroke="#000" stroke-width=".5" opacity=".3" fill="none"/>

  <!-- ===== cabina de burbuja ===== -->
  <ellipse cx="64" cy="35" rx="5.4" ry="11.4" class="dark" opacity=".55"/>
  <path class="glass" d="M64 23.8 C61.4 26.3 59.7 30.8 59.7 35.4 C59.7 40.6 61.6 44.2 64 45 C66.4 44.2 68.3 40.6 68.3 35.4 C68.3 30.8 66.6 26.3 64 23.8 Z"/>
  <path d="M64 23.8 C61.4 26.3 59.7 30.8 59.7 35.4 C59.7 40.6 61.6 44.2 64 45 C66.4 44.2 68.3 40.6 68.3 35.4 C68.3 30.8 66.6 26.3 64 23.8 Z" fill="url(#g4)"/>
  <path d="M64 23.8 C61.4 26.3 59.7 30.8 59.7 35.4 C59.7 40.6 61.6 44.2 64 45 C66.4 44.2 68.3 40.6 68.3 35.4 C68.3 30.8 66.6 26.3 64 23.8 Z" fill="none" stroke="#243b4d" stroke-width=".8"/>
  <!-- doble reflejo especular -->
  <ellipse cx="61.8" cy="33.5" rx="1.5" ry="6.4" transform="rotate(-3 61.8 33.5)" fill="#fff" opacity=".85"/>
  <ellipse cx="66.1" cy="29.5" rx=".9" ry="3.4" transform="rotate(5 66.1 29.5)" fill="#fff" opacity=".5"/>
  <ellipse cx="63" cy="42.4" rx="2.2" ry=".9" fill="#fff" opacity=".35"/>
  <!-- marco del parasol -->
  <path d="M60.6 28.6 C62.2 27.4 65.8 27.4 67.4 28.6" stroke="#3d4232" stroke-width=".9" fill="none" opacity=".8"/>

  <!-- ===== tobera ===== -->
  <ellipse class="metal" cx="64" cy="111.5" rx="4.6" ry="5"/>
  <path d="M60.6 109 L67.4 109 M59.8 112 L68.2 112 M60.6 114.4 L67.4 114.4" stroke="#000" stroke-width=".6" opacity=".4" fill="none"/>
  <ellipse class="rubber" cx="64" cy="112.2" rx="2.6" ry="3"/>
  <path class="metalL" d="M64 114.6 L62.6 112.2 L64 110.4 L65.4 112.2 Z" opacity=".9"/>
</svg>
