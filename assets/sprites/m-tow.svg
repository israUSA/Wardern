<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- BGM-71 TOW (Tube-launched, Optically tracked, Wire-guided)
       Orientación: Punta hacia ARRIBA (Norte)
       Características:
       - Ojiva redondeada en tono azul oscuro / azul petróleo (sección inerte/práctica con ranura dorsal)
       - Cuerpo de aluminio anodizado dorado / bronce cálido
       - Sección intermedia en acero pulido con toberas laterales elípticas de eyección
       - 4 alas de sustentación intermedias desplegables en forma de mariposa/corte diagonal
       - Cola con ranuras longitudinales para las 4 aletas traseras rectangulares delgadas
       - Bobina dispensadora del cable de guiado en la popa -->
  <defs>
    <!-- Ojiva redondeada azul petróleo -->
    <linearGradient id="tow-blue-dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#142c3d"/>
      <stop offset="28%" stop-color="#2a5775"/>
      <stop offset="68%" stop-color="#1c3e54"/>
      <stop offset="100%" stop-color="#0c1d29"/>
    </linearGradient>

    <!-- Cuerpo principal en aluminio anodizado bronce / dorado -->
    <linearGradient id="tow-bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c6d3b"/>
      <stop offset="28%" stop-color="#d9b66f"/>
      <stop offset="68%" stop-color="#ab8446"/>
      <stop offset="100%" stop-color="#6e532b"/>
    </linearGradient>

    <!-- Banda oscura / motor de carga hueca -->
    <linearGradient id="tow-dark-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d2c1c"/>
      <stop offset="28%" stop-color="#694e33"/>
      <stop offset="68%" stop-color="#4d3924"/>
      <stop offset="100%" stop-color="#2b1d11"/>
    </linearGradient>

    <!-- Sección intermedia en acero pulido / titanio -->
    <linearGradient id="tow-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ea7ab"/>
      <stop offset="28%" stop-color="#f2f5f7"/>
      <stop offset="68%" stop-color="#c5ced3"/>
      <stop offset="100%" stop-color="#7c8489"/>
    </linearGradient>

    <!-- Resplandor longitudinal para relieve 3D -->
    <linearGradient id="tow-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Alas intermedias en sombra y luz -->
    <linearGradient id="fin-bronze-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dfc07e"/>
      <stop offset="100%" stop-color="#9e7b3f"/>
    </linearGradient>
    <linearGradient id="fin-bronze-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b89758"/>
      <stop offset="100%" stop-color="#7a5e2c"/>
    </linearGradient>

    <!-- Aletas traseras rectangulares delgadas en aluminio claro -->
    <linearGradient id="fin-tail-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4dbe0"/>
      <stop offset="100%" stop-color="#9aabb3"/>
    </linearGradient>
    <linearGradient id="fin-tail-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8b5bd"/>
      <stop offset="100%" stop-color="#73818a"/>
    </linearGradient>
  </defs>

  <!-- ================= ALETAS TRASERAS DE CONTROL (RECTANGULARES DELGADAS) ================= -->
  <!-- Aleta trasera izquierda -->
  <polygon points="13.7,52 6.5,55.5 8,58.8 13.7,55.2" 
           fill="url(#fin-tail-l)" 
           stroke="#4b555c" 
           stroke-width="0.2"/>

  <!-- Aleta trasera derecha -->
  <polygon points="18.3,52 25.5,45 27,47.5 18.3,54.5" 
           fill="url(#fin-tail-r)" 
           stroke="#3d454b" 
           stroke-width="0.2"/>

  <!-- ================= ALAS INTERMEDIAS DESPLEGABLES (RETRÁCTILES TIPO MARIPOSA) ================= -->
  <!-- Ala intermedia izquierda -->
  <polygon points="13.7,24 8,30.5 10.5,33 13.7,29.5" 
           fill="url(#fin-bronze-l)" 
           stroke="#4d3a1f" 
           stroke-width="0.22" 
           stroke-linejoin="round"/>

  <!-- Ala intermedia derecha -->
  <polygon points="18.3,22.5 22.8,17.5 24.5,19.8 18.3,28" 
           fill="url(#fin-bronze-r)" 
           stroke="#3e2e17" 
           stroke-width="0.22" 
           stroke-linejoin="round"/>

  <!-- ================= CUERPO PRINCIPAL DEL MISIL ================= -->
  <!-- 1. Ojiva redondeada frontal azul petróleo -->
  <path d="M 13.7 10 
           C 13.7 5.5, 14.7 3, 16 3 
           C 17.3 3, 18.3 5.5, 18.3 10 
           Z" 
        fill="url(#tow-blue-dome)"/>

  <!-- 2. Sección delantera de bronce/dorado -->
  <rect x="13.7" y="10" width="4.6" height="7.5" fill="url(#tow-bronze)"/>

  <!-- 3. Banda oscura de la ojiva de carga hueca -->
  <rect x="13.7" y="17.5" width="4.6" height="4.5" fill="url(#tow-dark-band)"/>

  <!-- 4. Sección central de motor y toberas en acero pulido -->
  <rect x="13.7" y="22" width="4.6" height="8.5" fill="url(#tow-steel)"/>

  <!-- 5. Cuerpo trasero en bronce/dorado anodizado -->
  <rect x="13.7" y="30.5" width="4.6" height="25" fill="url(#tow-bronze)"/>

  <!-- Brillo longitudinal completo para dar volumen 3D -->
  <rect x="13.7" y="3" width="4.6" height="52.5" fill="url(#tow-shine)"/>

  <!-- ================= DETALLES DE LA OJIVA Y CANALES ================= -->
  <!-- Ranura longitudinal dorsal de la ojiva -->
  <line x1="16" y1="3" x2="16" y2="10" stroke="#0a1217" stroke-width="0.3"/>

  <!-- Junta de unión entre ojiva azul y cuerpo de bronce -->
  <line x1="13.7" y1="10" x2="18.3" y2="10" stroke="#3b4d57" stroke-width="0.25"/>

  <!-- Canales guía longitudinales para el despliegue de las alas -->
  <line x1="14.6" y1="11" x2="14.6" y2="17.2" stroke="#5d4621" stroke-width="0.25"/>
  <line x1="17.4" y1="11" x2="17.4" y2="17.2" stroke="#5d4621" stroke-width="0.25"/>

  <!-- Anillo metálico plateado entre la carga y el motor cohete -->
  <line x1="13.7" y1="17.5" x2="18.3" y2="17.5" stroke="#99835c" stroke-width="0.2"/>
  <line x1="13.7" y1="22" x2="18.3" y2="22" stroke="#d5dee3" stroke-width="0.3"/>

  <!-- ================= TOBERA LATERAL DE COHETE (ESCAPE CENTRAL) ================= -->
  <!-- Tobera elíptica en la sección de acero -->
  <ellipse cx="16" cy="26" rx="1.1" ry="1.9" fill="#54331a" stroke="#2b1a0c" stroke-width="0.22"/>
  <ellipse cx="16" cy="26" rx="0.75" ry="1.4" fill="#2d1c0e"/>

  <!-- ================= RANURAS LONGITUDINALES TRASERAS ================= -->
  <!-- Ranuras profundas donde se repliegan las aletas de cola -->
  <line x1="15.2" y1="39" x2="15.2" y2="51" stroke="#382914" stroke-width="0.32" stroke-linecap="round"/>
  <line x1="16.8" y1="39" x2="16.8" y2="51" stroke="#382914" stroke-width="0.32" stroke-linecap="round"/>

  <!-- Juntas y remaches técnicos traseros -->
  <line x1="13.7" y1="32.5" x2="18.3" y2="32.5" stroke="#664d26" stroke-width="0.2"/>
  <circle cx="16" cy="37" r="0.22" fill="#382914"/>
  <circle cx="16" cy="41" r="0.22" fill="#382914"/>

  <!-- ================= DISPENSADOR DE CABLE TRASERO (WIRE SPOOL) ================= -->
  <path d="M 14.1 55.5 L 17.9 55.5 L 17.5 58 L 14.5 58 Z" fill="#2d2215" stroke="#140f09" stroke-width="0.2"/>
  <!-- Orificio central por donde sale el hilo de control -->
  <ellipse cx="16" cy="58" rx="0.9" ry="0.3" fill="#0f0c08"/>
</svg>

