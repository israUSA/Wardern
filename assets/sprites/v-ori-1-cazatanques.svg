<!-- BRDM-2 con lanzador Konkurs (T1 oriental, cazatanques). Verde ruso.
     Camara y escala del set (20.9 px/m). Casco 5.75 x 2.35 x 2.31 m.
     Identidad: es el UNICO cazatanques oriental de RUEDAS del set - 4 ruedas
     grandes mas las dos parejas de ruedas de vientre retractiles entre ejes,
     casco de lancha con proa apuntada, superestructura estrecha y, en lugar de
     torreta, el bastidor elevable con los tubos del misil Konkurs. -->
