<!-- USS Virginia (T2 occidental, submarino). Casco negro. Identidad frente al Los Angeles: los timones de profundidad ya NO van en la vela sino a PROA, en el casco, y la vela es mas baja y con la base carenada. Casco liso sin resaltes.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
