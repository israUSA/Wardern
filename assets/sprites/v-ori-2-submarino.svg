<!-- Akula, Proyecto 971 (T2 oriental, submarino). Casco negro. Identidad: casco muy voluminoso con doble forro, vela alta con timones de profundidad, y sobre todo la VAINA ALARGADA del sonar remolcado montada encima del timon vertical de popa, un bulto que no lleva ningun submarino occidental del set.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
