<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- R-73 (AA-11 Archer)
       Orientación: Punta hacia ARRIBA (Norte)
       Características de la referencia:
       - Domo seeker esférico de cristal IR oscuro con anillo dorado/latón
       - Sensores ópticos / espoleta de proximidad láser en la ojiva
       - Primer escalón de canards: aletas estabilizadoras fijas rectangulares
       - Segundo escalón de canards: aletas de control triangulares tipo delta
       - Tubo cilíndrico alargado en blanco/gris claro naval
       - Aletas de cola trapezoidales recortadas
       - Alerones de control vectorial / tobera trasera -->
  <defs>
    <!-- Gradiente cilíndrico del cuerpo blanco aerodinámico -->
    <linearGradient id="r73-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b4bcc2"/>
      <stop offset="30%" stop-color="#f2f6f8"/>
      <stop offset="68%" stop-color="#d3dbe0"/>
      <stop offset="100%" stop-color="#98a2a8"/>
    </linearGradient>

    <!-- Resplandor lateral suave para dar volumen al tubo cilíndrico -->
    <linearGradient id="r73-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Domo infrarrojo frontal semiesférico oscuro -->
    <linearGradient id="r73-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5359"/>
      <stop offset="45%" stop-color="#2a3033"/>
      <stop offset="100%" stop-color="#121617"/>
    </linearGradient>

    <!-- Aletas en sombra y luz -->
    <linearGradient id="fin-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cad3d8"/>
      <stop offset="100%" stop-color="#9ea7ad"/>
    </linearGradient>
    <linearGradient id="fin-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a4aeb3"/>
      <stop offset="100%" stop-color="#768085"/>
    </linearGradient>
  </defs>

  <!-- ================= ALETAS DE COLA TRASERAS (TRAPEZOIDALES RECORTADAS) ================= -->
  <!-- Aleta trasera izquierda -->
  <polygon points="13.7,50 6.5,53.2 6.5,58.8 13.7,56.5" 
           fill="url(#fin-left)" 
           stroke="#4b5459" 
           stroke-width="0.25"/>

  <!-- Aleta trasera derecha -->
  <polygon points="18.3,50 25.5,53.2 25.5,58.8 18.3,56.5" 
           fill="url(#fin-right)" 
           stroke="#3d4447" 
           stroke-width="0.25"/>

  <!-- ================= GRUPO 2 DE CANARDS: ALETAS DE CONTROL DELTA ================= -->
  <!-- Aleta de maniobra triangular izquierda -->
  <polygon points="13.7,21.5 7.5,25.5 13.7,27" 
           fill="url(#fin-left)" 
           stroke="#4b5459" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- Aleta de maniobra triangular derecha -->
  <polygon points="18.3,21.5 24.5,25.5 18.3,27" 
           fill="url(#fin-right)" 
           stroke="#3d4447" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- Aleta central visible en perspectiva vertical -->
  <polygon points="15.5,20.8 15.6,17.2 16.4,17.2 16.5,20.8" fill="#cbd4d9" stroke="#4b5459" stroke-width="0.2"/>

  <!-- ================= GRUPO 1 DE CANARDS: GENERADORES DE VÓRTICE FIJOS ================= -->
  <!-- Aletas rectangulares pequeñas en la ojiva delantera -->
  <polygon points="13.7,13.5 11,14.5 11,17.2 13.7,16.5" 
           fill="url(#fin-left)" 
           stroke="#4b5459" 
           stroke-width="0.2"/>

  <polygon points="18.3,13.5 21,14.5 21,17.2 18.3,16.5" 
           fill="url(#fin-right)" 
           stroke="#3d4447" 
           stroke-width="0.2"/>

  <!-- ================= CUERPO PRINCIPAL DEL MISIL ================= -->
  <!-- Ojiva cónica frontal suave -->
  <path d="M 13.7 13 
           C 13.7 8, 14.6 4.8, 16 4.8 
           C 17.4 4.8, 18.3 8, 18.3 13 
           Z" 
        fill="url(#r73-body)"/>

  <!-- Fuselaje cilíndrico alargado -->
  <rect x="13.7" y="13" width="4.6" height="44.5" fill="url(#r73-body)"/>

  <!-- Brillo lateral longitudinal para relieve 3D -->
  <rect x="13.7" y="5.2" width="4.6" height="52.3" fill="url(#r73-shine)"/>

  <!-- ================= DOMO SEEKER ÓPTICO / IR FRONTAL ================= -->
  <!-- Anillo de engaste dorado/latón -->
  <path d="M 14.6 6.2 L 17.4 6.2 L 17.2 5.5 L 14.8 5.5 Z" fill="#bfa15f" stroke="#665329" stroke-width="0.15"/>

  <!-- Lente infrarroja semiesférica oscura -->
  <path d="M 14.8 5.5 
           C 14.8 3.5, 15.3 2.7, 16 2.7 
           C 16.7 2.7, 17.2 3.5, 17.2 5.5 
           Z" 
        fill="url(#r73-lens)" 
        stroke="#1a1e20" 
        stroke-width="0.2"/>

  <!-- Reflejo curvo sobre la lente -->
  <ellipse cx="15.7" cy="3.8" rx="0.35" ry="0.55" fill="#ffffff" opacity="0.45"/>

  <!-- Ventanas del sensor de proximidad activo en la ojiva -->
  <ellipse cx="16" cy="11.2" rx="0.4" ry="0.6" fill="#4d5559"/>
  <ellipse cx="14.3" cy="11.2" rx="0.3" ry="0.5" fill="#4d5559"/>
  <ellipse cx="17.7" cy="11.2" rx="0.3" ry="0.5" fill="#4d5559"/>

  <!-- ================= ZAPATAS DE MONTAJE Y JUNTAS ================= -->
  <!-- Conectores y zapatas para lanzador P-72 / APU-73 -->
  <rect x="15.4" y="27.5" width="1.2" height="2.2" rx="0.2" fill="#586369" stroke="#31373a" stroke-width="0.15"/>
  <rect x="15.4" y="42" width="1.2" height="2.2" rx="0.2" fill="#586369" stroke="#31373a" stroke-width="0.15"/>

  <!-- Líneas de sección del fuselaje -->
  <line x1="13.7" y1="13" x2="18.3" y2="13" stroke="#87939a" stroke-width="0.2"/>
  <line x1="13.7" y1="20" x2="18.3" y2="20" stroke="#87939a" stroke-width="0.2"/>
  <line x1="13.7" y1="36" x2="18.3" y2="36" stroke="#87939a" stroke-width="0.2"/>
  <line x1="13.7" y1="49" x2="18.3" y2="49" stroke="#87939a" stroke-width="0.2"/>

  <!-- Esténcil técnico de fábrica -->
  <line x1="14.4" y1="32" x2="17.6" y2="32" stroke="#5d6970" stroke-width="0.22" opacity="0.7"/>

  <!-- ================= TOBERA Y PALETAS DE EMPUJE VECTORIAL ================= -->
  <path d="M 14.3 57.5 L 17.7 57.5 L 17.3 59.8 L 14.7 59.8 Z" fill="#1b1e20" stroke="#0d0f10" stroke-width="0.25"/>
  <rect x="15.2" y="58" width="1.6" height="1.8" fill="#32383b"/>
</svg>

