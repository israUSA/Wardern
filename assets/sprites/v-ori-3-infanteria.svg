<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Infanteria Ratnik (T3 oriental). Verde ruso. Camara del set.
     Las figuras van a escala aumentada respecto a los vehiculos para que se lean
     en el mapa; su colocacion sobre el suelo si usa la proyeccion del set.
     Identidad T3: equipo Ratnik - casco 6B47 con montura de vision nocturna en
     la frente, chaleco 6B45 modular cargado de bolsillos, y fusil AK-12 de
     polimero negro con riel superior y visor. -->
<defs>
  <linearGradient id="g-uni" x1="0.1" y1="0" x2="0.9" y2="0.35">
    <stop offset="0" stop-color="#8b9a69"/><stop offset="0.5" stop-color="#6d7c50"/>
    <stop offset="1" stop-color="#4a5833"/>
  </linearGradient>
  <linearGradient id="g-leg" x1="0.1" y1="0" x2="0.9" y2="0.35">
    <stop offset="0" stop-color="#77875a"/><stop offset="0.5" stop-color="#5c6b43"/>
    <stop offset="1" stop-color="#3f4c2e"/>
  </linearGradient>
  <linearGradient id="g-vest" x1="0.1" y1="0" x2="0.9" y2="0.35">
    <stop offset="0" stop-color="#56653c"/><stop offset="0.5" stop-color="#43512c"/>
    <stop offset="1" stop-color="#2c3620"/>
  </linearGradient>
  <linearGradient id="g-helm" x1="0.15" y1="0" x2="0.85" y2="0.7">
    <stop offset="0" stop-color="#99a878"/><stop offset="0.45" stop-color="#6d7c50"/>
    <stop offset="1" stop-color="#414e30"/>
  </linearGradient>
  <g id="sol">
    <ellipse cx="1" cy="2" rx="17" ry="5.5" fill="#0d0b06" opacity="0.32"/>
    <g stroke="#2e2a20" stroke-width="1.6" stroke-linejoin="round">
      <!-- mochila, detras del torso -->
      <path d="M-19 -50 L-8 -53 L-8 -76 L-19 -73 Z" fill="#44512f"/>
      <!-- piernas -->
      <path d="M-11 -2 L-3 -2 L-1 -46 L-9 -46 Z" fill="url(#g-leg)"/>
      <path d="M4 -2 L12 -2 L11 -46 L3 -46 Z" fill="url(#g-leg)"/>
      <!-- torso -->
      <path d="M-14 -44 L14 -44 L15 -71 L10 -78 L-10 -78 L-15 -71 Z" fill="url(#g-uni)"/>
      <!-- correaje ALICE -->
      <path d="M-12 -47 L12 -47 L12 -70 L-12 -70 Z" fill="url(#g-vest)"/>
    </g>
    <!-- botas -->
    <path d="M-14 0 L-2 0 L-2 -6 L-12 -6 Z" fill="#25221b" stroke="#15130f" stroke-width="1"/>
    <path d="M2 0 L15 0 L14 -6 L4 -6 Z" fill="#25221b" stroke="#15130f" stroke-width="1"/>
    <!-- cartucheras y correas -->
    <g fill="#3a4728" stroke="#2e2a20" stroke-width="0.9">
      <path d="M-10 -49 L-2 -49 L-2 -58 L-10 -58 Z"/>
      <path d="M1 -49 L9 -49 L9 -58 L1 -58 Z"/>
    </g>
    <path d="M-12 -63 L12 -63" stroke="#2e2a20" stroke-width="1.2" fill="none"/>
    <path d="M-8 -70 L-3 -47" stroke="#3a4728" stroke-width="2" fill="none"/>
    <!-- cuello y cara en sombra -->
    <path d="M-7 -75 L7 -75 L7 -88 L-7 -88 Z" fill="#333d24" stroke="#221e16" stroke-width="1.1"/>
    <path d="M-5.5 -79 L5.5 -79 L5.5 -83.5 L-5.5 -83.5 Z" fill="#4a5730"/>
    <!-- casco PASGT: calota y faldon -->
    <ellipse cx="0" cy="-95" rx="13" ry="10.5" fill="url(#g-helm)" stroke="#2e2a20" stroke-width="1.6"/>
    <path d="M-13 -94.5 A13 10.5 0 0 0 13 -94.5 L11.5 -89 A11.5 6 0 0 1 -11.5 -89 Z"
          fill="#4e5c38" stroke="#2e2a20" stroke-width="1.2"/>
    <path d="M-9 -101 A13 10.5 0 0 1 9 -101" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6"/>
    <path d="M-4 -103 L4 -103 L4 -99 L-4 -99 Z" fill="#2b2720" stroke="#15130f" stroke-width="1"/>
    <path d="M-3 -99 L3 -99 L3 -95 L-3 -95 Z" fill="#454039"/>
    <!-- brazos -->
    <path d="M-15 -69 L-3 -59 L1 -63 L-11 -73 Z" fill="url(#g-uni)" stroke="#2e2a20" stroke-width="1.4"/>
    <path d="M13 -70 L4 -58 L9 -55 L18 -67 Z" fill="url(#g-uni)" stroke="#2e2a20" stroke-width="1.4"/>
    <!-- fusil AK-12: polimero negro, riel superior con visor y perfil recto -->
    <g stroke="#1c1a15" stroke-width="1.2" stroke-linejoin="round">
      <path d="M-17 -52 L19 -70 L20.6 -66.8 L-15.4 -48.8 Z" fill="#2f2c26"/>
      <path d="M-17 -52 L-24 -48.5 L-22.4 -45.3 L-15.4 -48.8 Z" fill="#3a362d"/>
      <path d="M-6 -60 L9 -67.5 L9.8 -71.4 L-5.2 -63.9 Z" fill="#25231e"/>
      <path d="M0 -63.5 L6 -66.5 L6.6 -70.5 L0.6 -67.5 Z" fill="#454039"/>
      <path d="M-3 -56.5 L3 -53.5 L1 -45 L-6 -47.5 Z" fill="#2b2720"/>
      <path d="M18.6 -71.1 L24 -73.8 L25.6 -70.6 L20.2 -67.9 Z" fill="#454039"/>
    </g>
    <ellipse cx="24.6" cy="-71.6" rx="1.3" ry="1.9" fill="#12100c"/>
    <ellipse cx="26.2" cy="-72" rx="1.5" ry="2.2" fill="#12100c"/>
    <ellipse cx="24.4" cy="-70.6" rx="1.4" ry="2" fill="#12100c"/>
    <ellipse cx="22.4" cy="-69.6" rx="1.3" ry="1.9" fill="#12100c"/>
  </g>
</defs>
<use href="#sol" transform="translate(96,164) scale(1.1)"/>
<use href="#sol" transform="translate(154,178) scale(1.1)"/>
<use href="#sol" transform="translate(124,200) scale(1.1)"/>
</svg>
