<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- AIM-92 Stinger (perfil esbelto/delgado, punta al norte) -->
  <defs>
    <!-- Cuerpo verde oliva -->
    <linearGradient id="stinger-olive-slim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a603a"/>
      <stop offset="28%" stop-color="#919760"/>
      <stop offset="68%" stop-color="#73794b"/>
      <stop offset="100%" stop-color="#3e4324"/>
    </linearGradient>

    <!-- Sección de cola en aluminio pulido -->
    <linearGradient id="stinger-steel-slim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#939da3"/>
      <stop offset="28%" stop-color="#f2f5f7"/>
      <stop offset="65%" stop-color="#c5ced3"/>
      <stop offset="100%" stop-color="#6e777d"/>
    </linearGradient>

    <!-- Ojiva metálica delgada -->
    <linearGradient id="stinger-nose-slim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#464d52"/>
      <stop offset="32%" stop-color="#889196"/>
      <stop offset="68%" stop-color="#60686d"/>
      <stop offset="100%" stop-color="#313639"/>
    </linearGradient>

    <!-- Banda de cobre del motor cohete -->
    <linearGradient id="copper-band-slim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a3f1d"/>
      <stop offset="35%" stop-color="#d47942"/>
      <stop offset="70%" stop-color="#a45222"/>
      <stop offset="100%" stop-color="#52260e"/>
    </linearGradient>

    <!-- Reflejo longitudinal esbelto -->
    <linearGradient id="stinger-shine-slim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Aletas traseras metálicas finas -->
    <linearGradient id="fin-steel-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b8bd"/>
      <stop offset="100%" stop-color="#7e878c"/>
    </linearGradient>
    <linearGradient id="fin-steel-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a9399"/>
      <stop offset="100%" stop-color="#5e666b"/>
    </linearGradient>
  </defs>

  <!-- ================= ALETAS TRASERAS DE CONTROL (FINAS) ================= -->
  <!-- Aleta izquierda -->
  <polygon points="14.8,49.5 9.2,49.5 9.2,51.8 14.8,51.8" 
           fill="url(#fin-steel-l)" 
           stroke="#444b50" 
           stroke-width="0.2"/>

  <!-- Aleta derecha -->
  <polygon points="17.2,49.5 22.8,49.5 22.8,51.8 17.2,51.8" 
           fill="url(#fin-steel-r)" 
           stroke="#343a3e" 
           stroke-width="0.2"/>

  <!-- ================= CANARDS DELANTEROS DESPLEGABLES ================= -->
  <!-- Canard izquierdo en el cuello -->
  <polygon points="15.2,8.8 13.6,11.2 14.8,11.2" 
           fill="url(#fin-steel-l)" 
           stroke="#343a3e" 
           stroke-width="0.18"/>

  <!-- Canard derecho en el cuello -->
  <polygon points="16.8,8.8 18.4,11.2 17.2,11.2" 
           fill="url(#fin-steel-r)" 
           stroke="#2a2e32" 
           stroke-width="0.18"/>

  <!-- ================= CUERPO PRINCIPAL ESBELTO (ANCHO 2.4 mm) ================= -->
  <!-- 1. Ojiva y cabeza buscadora estrecha -->
  <rect x="15.2" y="4.5" width="1.6" height="4.5" fill="url(#stinger-nose-slim)"/>
  <polygon points="15.2,9 16.8,9 17.2,11.5 14.8,11.5" fill="url(#stinger-olive-slim)"/>

  <!-- 2. Tubo central extra delgado verde oliva -->
  <rect x="14.8" y="11.5" width="2.4" height="26" fill="url(#stinger-olive-slim)"/>

  <!-- 3. Sección de transición oscura -->
  <rect x="14.8" y="37.5" width="2.4" height="4" fill="#323639"/>

  <!-- 4. Anillo de cobre del motor cohete -->
  <rect x="14.8" y="41.5" width="2.4" height="1.6" fill="url(#copper-band-slim)"/>

  <!-- 5. Sección de popa en acero pulido -->
  <rect x="14.8" y="43.1" width="2.4" height="11.5" fill="url(#stinger-steel-slim)"/>

  <!-- Brillo lateral longitudinal continuo -->
  <rect x="14.8" y="4.5" width="2.4" height="50.1" fill="url(#stinger-shine-slim)"/>

  <!-- ================= DETALLES DE LA CABEZA Y DOMO ================= -->
  <!-- Domo óptico del seeker UV/IR -->
  <path d="M 15.2 4.5 C 15.2 3.2 15.5 2.5 16 2.5 C 16.5 2.5 16.8 3.2 16.8 4.5 Z" 
        fill="#141718" 
        stroke="#0b0d0e" 
        stroke-width="0.18"/>
  <ellipse cx="15.8" cy="3.3" rx="0.2" ry="0.35" fill="#ffffff" opacity="0.45"/>

  <!-- Estrías y anillos del cabezal sensor -->
  <line x1="15.2" y1="5.6" x2="16.8" y2="5.6" stroke="#262a2c" stroke-width="0.2"/>
  <line x1="15.2" y1="7.2" x2="16.8" y2="7.2" stroke="#262a2c" stroke-width="0.2"/>

  <!-- ================= DETALLES Y RANURAS DE LA COLA ================= -->
  <!-- Ranura longitudinal de plegado de aletas -->
  <line x1="16" y1="44.2" x2="16" y2="48" stroke="#25292c" stroke-width="0.28" stroke-linecap="round"/>
  <circle cx="16" cy="44.2" r="0.22" fill="#141618"/>
  <circle cx="16" cy="48" r="0.22" fill="#141618"/>

  <!-- Juntas del fuselaje posterior -->
  <line x1="14.8" y1="43.1" x2="17.2" y2="43.1" stroke="#5d666d" stroke-width="0.18"/>
  <line x1="14.8" y1="53" x2="17.2" y2="53" stroke="#5d666d" stroke-width="0.18"/>

  <!-- Micro-esténciles técnicos -->
  <line x1="16.3" y1="46" x2="17" y2="46" stroke="#485157" stroke-width="0.16" opacity="0.8"/>
  <line x1="16.3" y1="47" x2="17" y2="47" stroke="#485157" stroke-width="0.16" opacity="0.8"/>

  <!-- ================= TOBERA TRASERA ================= -->
  <path d="M 15 54.6 L 17 54.6 L 16.8 56.4 L 15.2 56.4 Z" fill="#2d3235" stroke="#17191b" stroke-width="0.18"/>
  <path d="M 15.3 56.4 C 15.3 57.5 15.6 58.5 16 58.5 C 16.4 58.5 16.7 57.5 16.7 56.4 Z" fill="#0f1112"/>
  <circle cx="16" cy="58" r="0.2" fill="#52585c"/>
</svg>
