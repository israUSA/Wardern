<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Northrop Grumman B-2 Spirit — Stealth Bomber (Versión Final Limpia)
       - Eliminadas las figuras inferiores de los costados de la ventana.
       - Cabina facetada oscura hiper-realista (sin dorado).
       - Dientes de sierra centrales compactos y unidos.
       - Silueta alar limpia y centrada. -->
  <defs>
    <!-- Gradiente RAM Gris Carbón Mate FS 36118 -->
    <linearGradient id="b2-ram-hull" x1="0.1" y1="0" x2="0.9" y2="0.3">
      <stop offset="0%" stop-color="#4a5058"/>
      <stop offset="35%" stop-color="#363c43"/>
      <stop offset="68%" stop-color="#282d33"/>
      <stop offset="100%" stop-color="#1b1f24"/>
    </linearGradient>

    <!-- Gradiente ala izquierda (iluminación suave) -->
    <linearGradient id="b2-wing-l" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#555c65"/>
      <stop offset="50%" stop-color="#3f454d"/>
      <stop offset="100%" stop-color="#2a2f36"/>
    </linearGradient>

    <!-- Gradiente ala derecha (sombra) -->
    <linearGradient id="b2-wing-r" x1="0" y1="0.8" x2="1" y2="0">
      <stop offset="0%" stop-color="#32373e"/>
      <stop offset="50%" stop-color="#22262b"/>
      <stop offset="100%" stop-color="#17191d"/>
    </linearGradient>

    <!-- Espina dorsal central suavemente fundida -->
    <linearGradient id="b2-dorsal-blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cristal de cabina real (Dark Charcoal / Humo polarizado antirreflejo, no dorado) -->
    <linearGradient id="b2-glass" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#38424d"/>
      <stop offset="30%" stop-color="#20262e"/>
      <stop offset="100%" stop-color="#0a0d10"/>
    </linearGradient>

    <!-- Silueta maestra con los 3 dientes centrales unidos y compactos -->
    <path id="b2-airframe" d="
      M 128 48
      L 238 124
      L 238 132
      L 212 118
      L 186 135
      L 164 122
      L 148 138
      L 137 130
      L 128 143
      L 119 130
      L 108 138
      L 92 122
      L 70 135
      L 44 118
      L 18 132
      L 18 124
      Z
    "/>
  </defs>

  <!-- Contenedor centrado verticalmente -->
  <g id="b2-unit" transform="translate(0, 32)">
    <!-- Sombra proyectada -->
    <use href="#b2-airframe" fill="#080a0d" opacity="0.28" transform="translate(6, 9)"/>

    <!-- Planta del ala volante -->
    <use href="#b2-airframe" fill="url(#b2-ram-hull)"/>

    <!-- Tinte alar izquierda / derecha para volumen -->
    <path d="M 128 48 L 128 143 L 119 130 L 108 138 L 92 122 L 70 135 L 44 118 L 18 132 L 18 124 Z" fill="url(#b2-wing-l)" opacity="0.35"/>
    <path d="M 128 48 L 128 143 L 137 130 L 148 138 L 164 122 L 186 135 L 212 118 L 238 132 L 238 124 Z" fill="url(#b2-wing-r)" opacity="0.45"/>

    <!-- Bisel de iluminación del borde de ataque izquierdo -->
    <line x1="128" y1="48" x2="18" y2="124" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="128" y1="48" x2="238" y2="124" stroke="#16181b" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- Elevación central suavemente fundida -->
    <path d="
      M 128 50
      C 134 54, 142 66, 143 82
      C 144 98, 141 116, 137 130
      L 128 141
      L 119 130
      C 115 116, 112 98, 113 82
      C 114 66, 122 54, 128 50 Z
    " fill="url(#b2-dorsal-blend)"/>

    <!-- Escapes de toberas enrasados sobre el ala -->
    <!-- Escape Izquierdo -->
    <polygon points="109,114 122,114 120,123 111,123" fill="#181a1d" stroke="#101214" stroke-width="0.6"/>
    <line x1="113" y1="123" x2="114" y2="116" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="118" y1="123" x2="119" y2="116" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="110" y1="117" x2="121" y2="117" stroke="#383e44" stroke-width="0.5"/>

    <!-- Escape Derecho -->
    <polygon points="134,114 147,114 145,123 136,123" fill="#131416" stroke="#0e0f11" stroke-width="0.6"/>
    <line x1="138" y1="123" x2="137" y2="116" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="143" y1="123" x2="142" y2="116" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="135" y1="117" x2="146" y2="117" stroke="#262a2e" stroke-width="0.5"/>

    <!-- Cabina Real (4 Paneles Facetados de Cristal Oscuro) -->
    <g stroke="#131619" stroke-width="0.8" stroke-linejoin="round">
      <polygon points="128,62 123,67 123.5,74 128,71.5" fill="url(#b2-glass)"/>
      <polygon points="128,62 133,67 132.5,74 128,71.5" fill="url(#b2-glass)"/>
      <polygon points="122.5,67.5 117.5,72 118.5,75.5 123,73.5" fill="url(#b2-glass)"/>
      <polygon points="133.5,67.5 138.5,72 137.5,75.5 133,73.5" fill="url(#b2-glass)"/>
    </g>
    <!-- Reflejos especulares en la cabina -->
    <path d="M 124 68 L 127.5 63.5 L 127.5 70" stroke="#ffffff" stroke-width="0.6" fill="none" stroke-linecap="round" stroke-opacity="0.55"/>
    <line x1="119" y1="72.5" x2="122" y2="69" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.35"/>

    <!-- Líneas de paneles stealth y bisagras de superficies de control -->
    <g fill="none" stroke="#22262b" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <!-- Receptáculo de reabastecimiento en vuelo -->
      <polygon points="128,77 125.5,81 130.5,81" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.45"/>
      <line x1="128" y1="81" x2="128" y2="86" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.45"/>

      <!-- Elevones alares exteriores babor -->
      <line x1="22" y1="122" x2="42" y2="114"/>
      <line x1="48" y1="116" x2="68" y2="128"/>
      <line x1="74" y1="124" x2="90" y2="118"/>

      <!-- Elevones alares exteriores estribor -->
      <line x1="234" y1="122" x2="214" y2="114"/>
      <line x1="208" y1="116" x2="188" y2="128"/>
      <line x1="182" y1="124" x2="166" y2="118"/>

      <!-- Bisagras de los 3 dientes centrales unidos y compactos -->
      <line x1="108" y1="133" x2="119" y2="126"/>
      <line x1="120" y1="127" x2="128" y2="136"/>
      <line x1="128" y1="136" x2="136" y2="127"/>
      <line x1="137" y1="126" x2="148" y2="133"/>
      <line x1="128" y1="136" x2="128" y2="142.5" stroke-width="0.5"/>
    </g>
  </g>
</svg>
