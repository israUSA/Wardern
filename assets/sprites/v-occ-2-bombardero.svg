<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- B-2 Spirit - vista superior, morro al norte. ALA VOLADORA: sin fuselaje ni cola,
       morro puntiagudo central, borde de ataque recto hasta las puntas, borde de salida
       en DOBLE W con sierra, cabina elevada, tomas de motor ocultas, timones partidos.
       Tinte por pais: .base/.shade/.light/.hi. Fijos: .metalS/.metalL, .glass, .dark. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="b2f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="b2f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="b2gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".5" stop-color="#000" stop-opacity=".16"/><stop offset=".8" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="b2g1" gradientUnits="userSpaceOnUse" x1="52" y1="16" x2="76" y2="90">
    <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".06"/><stop offset=".72" stop-color="#000" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="b2g2" gradientUnits="userSpaceOnUse" x1="14" y1="44" x2="14" y2="80">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="b2g4" gradientUnits="userSpaceOnUse" x1="62" y1="16" x2="62" y2="23">
    <stop offset="0" stop-color="#e8f4fb" stop-opacity=".85"/><stop offset=".4" stop-color="#9cc4dc" stop-opacity=".4"/><stop offset="1" stop-color="#28495e" stop-opacity=".6"/>
  </linearGradient>
  </defs>

  <ellipse cx="64" cy="60" rx="58" ry="54" fill="url(#b2gs)"/>

  <!-- ===== ala voladora completa ===== -->
  <path class="base" d="M64 9.5 C56 17 36 32 14 49 L4.5 58 L4 64 L10 72.5 L20.5 71.5 L27 82.5 L40 80.5 L46.5 91 L58 88.5 L60.5 95.5 L64 97 L67.5 95.5 L70 88.5 L81.5 91 L88 80.5 L101 82.5 L107.5 71.5 L118 72.5 L124 64 L123.5 58 L114 49 C92 32 72 17 64 9.5 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M64 9.5 C56 17 36 32 14 49 L4.5 58 L4 64 L10 72.5 L20.5 71.5 L27 82.5 L40 80.5 L46.5 91 L58 88.5 L60.5 95.5 L64 97 L67.5 95.5 L70 88.5 L81.5 91 L88 80.5 L101 82.5 L107.5 71.5 L118 72.5 L124 64 L123.5 58 L114 49 C92 32 72 17 64 9.5 Z" fill="url(#b2g1)"/>
  <path d="M64 9.5 C56 17 36 32 14 49 L4.5 58 L4 64 L10 72.5 L20.5 71.5 L27 82.5 L40 80.5 L46.5 91 L58 88.5 L60.5 95.5 L64 97 L67.5 95.5 L70 88.5 L81.5 91 L88 80.5 L101 82.5 L107.5 71.5 L118 72.5 L124 64 L123.5 58 L114 49 C92 32 72 17 64 9.5 Z" fill="url(#b2g2)" opacity=".5"/>
  <!-- borde de ataque iluminado -->
  <path class="light" d="M64 10 C56.5 17 37 31.8 15 48.6 L4.9 57.8 L4.4 62.4 L15 45 L64 12.4 L113 45 L123.6 62.4 L123.1 57.8 L113 48.6 C91 31.8 71.5 17 64 10 Z" opacity=".9"/>
  <path d="M63.6 11.4 C54 19.4 34 35 12.4 51.4" stroke="#fff" stroke-width=".9" opacity=".45" fill="none"/>
  <path d="M64.4 11.4 C74 19.4 94 35 115.6 51.4" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <!-- borde de salida en sombra + sierra -->
  <path class="dark" d="M10 72.5 L20.5 71.5 L27 82.5 L40 80.5 L46.5 91 L58 88.5 L60.5 95.5 L64 97 L67.5 95.5 L70 88.5 L81.5 91 L88 80.5 L101 82.5 L107.5 71.5 L118 72.5 L124 64 L123.8 66.6 L118.2 74.4 L107.6 73.3 L101.3 84.3 L88.3 82.3 L81.8 93.3 L70.1 90.8 L67.9 97.4 L64 99 L60.1 97.4 L57.9 90.8 L46.2 93.3 L33.7 84.3 L20.7 86.3 L14.4 75.3 L8.8 76.4 Z" opacity=".5"/>
  <!-- timones partidos (drag rudders) -->
  <path class="dark" d="M24.4 70.6 L30.6 69.8 L27.4 80.6 L22.4 74.4 Z M103.6 70.6 L97.4 69.8 L100.6 80.6 L105.6 74.4 Z" opacity=".85"/>
  <path d="M24.4 70.6 L30.6 69.8 M103.6 70.6 L97.4 69.8" stroke="#fff" stroke-width=".4" opacity=".25" fill="none"/>
  <!-- lineas de panel radiales -->
  <path d="M56 26 L26 66 M50 32 L30 72 M72 26 L102 66 M78 32 L98 72 M58 40 L38 80 M70 40 L90 80" stroke="#000" stroke-width=".5" opacity=".16" fill="none"/>

  <!-- ===== centro: cabina elevada ===== -->
  <path class="shade" d="M58.6 16.5 C60 14.8 68 14.8 69.4 16.5 L69.8 22 C66.4 23.8 61.6 23.8 58.2 22 Z"/>
  <path d="M58.9 17 C60.2 15.6 67.8 15.6 69.1 17" stroke="#fff" stroke-width=".6" opacity=".4" fill="none"/>
  <path class="glass" d="M60.4 17.4 L67.6 17.4 L68.2 20.8 C65.6 22 62.4 22 59.8 20.8 Z"/>
  <path d="M60.4 17.4 L67.6 17.4 L68.2 20.8 C65.6 22 62.4 22 59.8 20.8 Z" fill="url(#b2g4)"/>
  <path d="M60.4 17.4 L67.6 17.4 L68.2 20.8 C65.6 22 62.4 22 59.8 20.8 Z" fill="none" stroke="#243b4d" stroke-width=".6"/>
  <path d="M62.9 17.4 L62.7 21 M65.1 17.4 L65.3 21" stroke="#243b4d" stroke-width=".5" opacity=".9" fill="none"/>
  <ellipse cx="61.6" cy="18.8" rx=".7" ry="1.6" transform="rotate(8 61.6 18.8)" fill="#fff" opacity=".85"/>

  <!-- ===== tomas de motor ocultas + escapes ===== -->
  <path class="dark" d="M55.6 34 C55 40 54.8 46 55.2 51.5 L60.2 50.5 C59.6 45 59.5 39.5 60 34.5 C58.4 35 56.8 34.6 55.6 34 Z" opacity=".6"/>
  <path class="dark" d="M72.4 34 C73 40 73.2 46 72.8 51.5 L67.8 50.5 C68.4 45 68.5 39.5 68 34.5 C69.6 35 71.2 34.6 72.4 34 Z" opacity=".6"/>
  <path d="M56.2 36.5 L59.4 36 M68.6 36.5 L71.8 36 M56 41 L59.2 40.6 M68.8 41 L72 40.6" stroke="#000" stroke-width=".4" opacity=".4" fill="none"/>
  <!-- escapes en el borde de salida central -->
  <path class="metalL" d="M60.4 88.5 L62 87.8 L61.6 93 L60.2 93.4 Z M67.6 88.5 L66 87.8 L66.4 93 L67.8 93.4 Z" opacity=".9"/>
  <!-- bahia de armas central -->
  <path d="M60.8 62 C62.8 62.8 65.2 62.8 67.2 62 M60.6 72 C62.8 72.8 65.2 72.8 67.4 72" stroke="#000" stroke-width=".55" opacity=".25" fill="none"/>
  <!-- antena de cuchilla -->
  <path class="dark" d="M60.6 56.5 L61.4 56.5 L61.4 61 L60.6 61 Z" opacity=".85"/>
  <!-- luz de formacion -->
  <path class="hi" d="M12.6 62.6 L13.8 62.6 L13.8 64.6 L12.6 64.6 Z" opacity=".8"/>
  <path class="hi" d="M115.4 62.6 L114.2 62.6 L114.2 64.6 L115.4 64.6 Z" opacity=".8"/>
</svg>
