<!-- USS Spruance (T1 occidental, destructor). Gris OTAN. Identidad: DOS chimeneas grandes muy separadas, una a proa y otra a popa de la superestructura, casco largo y muy despejado, y un canon de 127 mm en cada extremo. Sin celdas verticales a la vista.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
