<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- USS Spruance (DD-963, antisubmarina) - vista superior, proa al norte. Sin SPY ni
       VLS delante: canon 5"/54 a proa, lanzador ASROC Mk112 detras, superestructura
       clasica con DOS chimeneas, hangar grande para 2 SH-3 a popa y canon 5" segundo. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="ds1f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="ds1f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="ds1gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ds1g1" gradientUnits="userSpaceOnUse" x1="42" y1="64" x2="86" y2="64">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".18" stop-color="#fff" stop-opacity=".18"/><stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="ds1g2" gradientUnits="userSpaceOnUse" x1="64" y1="8" x2="64" y2="119">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".24"/>
  </linearGradient>
  <linearGradient id="ds1g3" gradientUnits="userSpaceOnUse" x1="52" y1="70" x2="76" y2="70">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".28" stop-color="#fff" stop-opacity=".14"/><stop offset=".6" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="ds1g4" gradientUnits="userSpaceOnUse" x1="58" y1="88" x2="70" y2="88">
    <stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="ds1g5" gradientUnits="userSpaceOnUse" x1="46" y1="14" x2="84" y2="114">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="63" cy="66" rx="34" ry="63" fill="url(#ds1gs)"/>

  <!-- ===== casco ===== -->
  <path class="shade" d="M64 7 C56.5 11.5 49 20 45.6 32 L43.2 43 L42.6 98 L46.8 111.5 L50.8 118.4 L77.2 118.4 L81.2 111.5 L85.4 98 L84.8 43 L82.4 32 C79 20 71.5 11.5 64 7 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 7 C56.5 11.5 49 20 45.6 32 L43.2 43 L42.6 98 L46.8 111.5 L50.8 118.4 L77.2 118.4 L81.2 111.5 L85.4 98 L84.8 43 L82.4 32 C79 20 71.5 11.5 64 7 Z" fill="url(#ds1g1)"/>
  <!-- cubierta (pista) -->
  <path class="base" d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L46.2 43.2 L45.8 97.4 L49.6 110.2 L53 116 L75 116 L78.4 110.2 L82.2 97.4 L81.8 43.2 L79.6 32.6 C76.8 22 70.2 14 64 9.8 Z"/>
  <path d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L46.2 43.2 L45.8 97.4 L49.6 110.2 L53 116 L75 116 L78.4 110.2 L82.2 97.4 L81.8 43.2 L79.6 32.6 C76.8 22 70.2 14 64 9.8 Z" fill="url(#ds1g2)"/>
  <path d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L46.2 43.2 L45.8 97.4 L49.6 110.2 L53 116 L75 116 L78.4 110.2 L82.2 97.4 L81.8 43.2 L79.6 32.6 C76.8 22 70.2 14 64 9.8 Z" fill="url(#ds1g5)"/>
  <!-- rim light en el costado de babor + sombra profunda a estribor -->
  <path d="M47 42.6 L47.4 96 L51 108.6" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M81 42.6 L80.6 96 L77 108.6" stroke="#000" stroke-width="1.6" opacity=".24" fill="none" filter="url(#ds1f1)"/>
  <!-- linea de crujia -->
  <path d="M64 11 L64 114.5" stroke="#b8bfa2" stroke-width=".8" opacity=".4" fill="none"/>
  <!-- brillete de proa -->
  <path class="light" d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L50.4 33 C53.2 22.8 59.4 15.4 65.4 11.2 Z" opacity=".7"/>
  <!-- anclas y cabrestantes -->
  <circle class="metalL" cx="52.5" cy="18.5" r="1.3"/><circle class="metalL" cx="75.5" cy="18.5" r="1.3"/>
  <path d="M50.8 16 L54 20 M74.6 20 L77.8 16" stroke="#4a5057" stroke-width=".8" fill="none"/>
  <path d="M49 24.5 L52 27.5 M79 24.5 L76 27.5" stroke="#3d4232" stroke-width=".9" opacity=".6" fill="none"/>

  <!-- ===== canon 5"/54 Mk45 de proa ===== -->
  <path class="dark" d="M59.8 33.8 L68.2 33.8 L66.6 39.8 L61.4 39.8 Z" opacity=".85"/>
  <path class="metal" d="M62.9 19.4 L65.1 19.4 L64.9 33.5 L63.1 33.5 Z"/>
  <path class="hi" d="M63.3 20 L63.8 20 L63.7 33 L63.3 33 Z" opacity=".6"/>
  <path class="metalS" d="M62 23.4 L66 23.4 L65.9 28.2 L62.1 28.2 Z"/>
  <path class="metalL" d="M62.7 17.8 L65.3 17.8 L65.1 19.8 L62.9 19.8 Z"/>
  <path class="shade" d="M60 32.6 L68 32.6 L67.5 34.8 L60.5 34.8 Z"/>

  <!-- ===== lanzador ASROC Mk112 (8 celdas) ===== -->
  <rect class="dark" x="56.6" y="42" width="14.8" height="13.6" rx="1"/>
  <g class="metalS">
    <circle cx="59.4" cy="44.4" r="1.2"/><circle cx="64" cy="44.4" r="1.2"/><circle cx="68.6" cy="44.4" r="1.2"/>
    <circle cx="59.4" cy="48" r="1.2"/><circle cx="64" cy="48" r="1.2"/><circle cx="68.6" cy="48" r="1.2"/>
    <circle cx="59.4" cy="51.6" r="1.2"/><circle cx="64" cy="51.6" r="1.2"/><circle cx="68.6" cy="51.6" r="1.2"/>
  </g>
  <g class="dark">
    <circle cx="59.4" cy="44.4" r=".5"/><circle cx="64" cy="44.4" r=".5"/><circle cx="68.6" cy="44.4" r=".5"/>
    <circle cx="59.4" cy="48" r=".5"/><circle cx="64" cy="48" r=".5"/><circle cx="68.6" cy="48" r=".5"/>
    <circle cx="59.4" cy="51.6" r=".5"/><circle cx="64" cy="51.6" r=".5"/><circle cx="68.6" cy="51.6" r=".5"/>
  </g>
  <path d="M56.6 42 L71.4 42 L71.4 55.6 L56.6 55.6 Z" fill="none" stroke="#000" stroke-width=".5" opacity=".3"/>

  <!-- montes de 25mm a banda -->
  <circle class="metal" cx="48.8" cy="52.5" r="1.7"/><path d="M48.8 50.8 L48.8 49" stroke="#2b2e28" stroke-width=".9" fill="none"/>
  <circle class="metal" cx="79.2" cy="52.5" r="1.7"/><path d="M79.2 50.8 L79.2 49" stroke="#2b2e28" stroke-width=".9" fill="none"/>

  <!-- oclusion ambiental: canon y VLS proyectan sobre la cubierta -->
  <path d="M60 34.6 L68 34.6 L67.4 39.8 L60.6 39.8 Z" fill="#000" opacity=".22" filter="url(#ds1f1)"/>
  <path d="M56.2 57.2 L71.8 57.2 L71.4 59.6 L56.6 59.6 Z" fill="#000" opacity=".22" filter="url(#ds1f1)"/>
  <path d="M51.2 62.2 L52.2 62.2 L51.6 79.4 L50.6 79.4 Z" fill="#000" opacity=".2" filter="url(#ds1f1)"/>
  <path d="M76.8 62.2 L75.8 62.2 L76.4 79.4 L77.4 79.4 Z" fill="#000" opacity=".2" filter="url(#ds1f1)"/>

  <!-- ===== superestructura con paneles SPY ===== -->
  <path class="base" d="M52.6 57.6 L75.4 57.6 L77 62.5 L77.6 78 L76 84.6 L52 84.6 L50.4 78 L51 62.5 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M52.6 57.6 L75.4 57.6 L77 62.5 L77.6 78 L76 84.6 L52 84.6 L50.4 78 L51 62.5 Z" fill="url(#ds1g3)"/>
