  <path d="M51.2 58.4 L50.6 77.6 L52 84" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <path d="M77 58.4 L77.4 77.6 L76 84" stroke="#000" stroke-width="1.3" opacity=".26" fill="none" filter="url(#ds1f1)"/>
