
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- RGM-84 / AGM-84 Harpoon con punta roja, booster y rótulo lateral U.S. NAVY -->
  <defs>
    <!-- Gradiente cilíndrico del cuerpo blanco naval -->
    <linearGradient id="harpoon-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b8bc"/>
      <stop offset="25%" stop-color="#e8edf0"/>
      <stop offset="65%" stop-color="#d0d7db"/>
      <stop offset="100%" stop-color="#8e979c"/>
    </linearGradient>

    <!-- Punta roja de prueba / telemetry cone -->
    <linearGradient id="red-nose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e1f19"/>
      <stop offset="30%" stop-color="#e8362c"/>
      <stop offset="70%" stop-color="#cf271d"/>
      <stop offset="100%" stop-color="#6e110c"/>
    </linearGradient>

    <!-- Brillo curvo lateral para dar volumen cilíndrico -->
    <linearGradient id="body-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Aletas metálicas -->
    <linearGradient id="fin-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cad0d4"/>
      <stop offset="100%" stop-color="#9da5a9"/>
    </linearGradient>
    <linearGradient id="fin-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a9296"/>
      <stop offset="100%" stop-color="#646b6f"/>
    </linearGradient>

    <!-- Banda azul del propulsor / booster de aceleración -->
    <linearGradient id="booster-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a5375"/>
      <stop offset="40%" stop-color="#4a7da8"/>
      <stop offset="100%" stop-color="#1d384f"/>
    </linearGradient>
  </defs>

  <!-- ================= ALETAS GRANDES DEL BOOSTER ================= -->
  <polygon points="12.5,50 3.5,53.5 3.5,58.5 12.5,56" fill="url(#fin-left)" stroke="#52585c" stroke-width="0.3"/>
  <polygon points="19.5,50 28.5,53.5 28.5,58.5 19.5,56" fill="url(#fin-right)" stroke="#41474a" stroke-width="0.3"/>

  <!-- ================= ALETAS DE CONTROL DEL MISIL ================= -->
  <polygon points="12.5,41 7.5,42.8 7.5,45.5 12.5,44.5" fill="url(#fin-left)" stroke="#52585c" stroke-width="0.25"/>
  <polygon points="19.5,41 24.5,42.8 24.5,45.5 19.5,44.5" fill="url(#fin-right)" stroke="#41474a" stroke-width="0.25"/>

  <!-- ================= ALETAS ALIENTES MEDIAS (ALAS EN FLECHA) ================= -->
  <polygon points="12.5,23 5,26.5 5,31 12.5,28.5" fill="url(#fin-left)" stroke="#52585c" stroke-width="0.3"/>
  <polygon points="19.5,23 27,26.5 27,31 19.5,28.5" fill="url(#fin-right)" stroke="#41474a" stroke-width="0.3"/>
  <polygon points="15.4,22.5 16.6,22.5 16.3,28.5 15.7,28.5" fill="#f0f4f7" stroke="#686f73" stroke-width="0.2"/>

  <!-- ================= CUERPO PRINCIPAL DEL MISIL ================= -->
  <!-- Punta hemisférica en tono rojito -->
  <path d="M 12.5 8 
           C 12.5 4, 14 2, 16 2 
           C 18 2, 19.5 4, 19.5 8 
           Z" 
        fill="url(#red-nose)"/>

  <!-- Línea divisoria en la base de la cúpula roja -->
  <line x1="12.5" y1="8" x2="19.5" y2="8" stroke="#5a0e0a" stroke-width="0.3"/>

  <!-- Fuselaje cilíndrico principal -->
  <rect x="12.5" y="8" width="7" height="38.5" fill="url(#harpoon-body)"/>

  <!-- Brillo longitudinal en todo el fuselaje -->
  <rect x="12.5" y="2.5" width="7" height="58" fill="url(#body-shine)"/>

  <!-- Líneas de paneles estructurales -->
  <line x1="12.5" y1="12" x2="19.5" y2="12" stroke="#7e878c" stroke-width="0.3"/>
  <line x1="12.5" y1="21.5" x2="19.5" y2="21.5" stroke="#7e878c" stroke-width="0.3"/>
  <line x1="12.5" y1="36" x2="19.5" y2="36" stroke="#7e878c" stroke-width="0.3"/>
  <line x1="12.5" y1="44" x2="19.5" y2="44" stroke="#7e878c" stroke-width="0.35"/>

  <!-- Conducto de cableado dorsal -->
  <rect x="15.6" y="14" width="0.8" height="28" fill="#9da6ab" stroke="#5d6569" stroke-width="0.2"/>

  <!-- Rótulo militar vertical en el lateral: U.S. NAVY -->
  <text x="35" y="-13.6" 
        transform="rotate(90)" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="1.5" 
        font-weight="bold" 
        letter-spacing="0.28" 
        fill="#1a252f" 
        opacity="0.9">U.S. NAVY</text>

  <!-- ================= BOOSTER TRASERO ================= -->
  <!-- Anillo de separación -->
  <rect x="12.3" y="46.5" width="7.4" height="2" fill="#788187" stroke="#4d5357" stroke-width="0.25"/>

  <!-- Cilindro del booster -->
  <rect x="12.5" y="48.5" width="7" height="12.5" fill="url(#harpoon-body)"/>
  <rect x="12.5" y="48.5" width="7" height="12.5" fill="url(#body-shine)"/>

  <!-- Banda azul naval del propulsor -->
  <rect x="12.5" y="55.5" width="7" height="3" fill="url(#booster-blue)"/>
  <line x1="12.5" y1="55.5" x2="19.5" y2="55.5" stroke="#1d384f" stroke-width="0.25"/>
  <line x1="12.5" y1="58.5" x2="19.5" y2="58.5" stroke="#1d384f" stroke-width="0.25"/>

  <!-- Tobera de escape -->
  <path d="M 13.2 61 L 18.8 61 L 18.2 63 L 13.8 63 Z" fill="#2b2d2f" stroke="#161718" stroke-width="0.3"/>
</svg>
