  <path d="M63.4 19 L63.3 21.5 M64.8 19 L64.9 21.5" stroke="#243b4d" stroke-width=".5" opacity=".9" fill="none"/>
  <!-- lineas de panel -->
  <path d="M59.8 28 C62.4 29.2 65.6 29.2 68.2 28 M59.4 44 C62.4 45.2 65.6 45.2 68.6 44 M59.3 62 C62.4 63 65.6 63 68.7 62 M59.5 80 C62.3 81 65.7 81 68.5 80" stroke="#000" stroke-width=".55" opacity=".2" fill="none"/>
