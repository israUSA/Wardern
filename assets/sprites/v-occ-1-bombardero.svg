<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- B-52G Stratofortress - vista superior, morro al norte. FUSELAJE LARGO y ESTRECHO,
       ala en flecha MUY ancha con 4 gondolas POR ALA (8 motores: cada gondola con dos
       tomas gemelas), cola CONVENCIONAL con deriva alta, torreta de cola.
       Tinte por pais: .base/.shade/.light/.hi. Fijos: .metal/.metalS/.metalL, .glass, .dark. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="b52f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="b52f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="b52gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="b52g1" gradientUnits="userSpaceOnUse" x1="57" y1="60" x2="71" y2="60">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".22" stop-color="#fff" stop-opacity=".2"/><stop offset=".4" stop-color="#fff" stop-opacity=".26"/><stop offset=".62" stop-color="#fff" stop-opacity=".05"/><stop offset=".82" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".44"/>
  </linearGradient>
  <linearGradient id="b52g2" gradientUnits="userSpaceOnUse" x1="64" y1="7" x2="64" y2="120">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="b52g3" gradientUnits="userSpaceOnUse" x1="24" y1="58" x2="24" y2="90">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
  </linearGradient>
  <linearGradient id="b52g4" gradientUnits="userSpaceOnUse" x1="62" y1="16" x2="62" y2="22">
