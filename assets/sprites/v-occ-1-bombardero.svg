  <path d="M64 6.5 C62.2 9 61.2 12.5 60.9 16.5 L60.6 21 C59.9 30 59.5 38 59.3 46 L59.2 52 C59.4 64 59.8 76 60.5 88 L61.4 100 L62.6 106.5 L64 111 L65.4 106.5 L66.6 100 L67.5 88 C68.2 76 68.6 64 68.8 52 L68.7 46 C68.5 38 68.1 30 67.4 21 L67.1 16.5 C66.8 12.5 65.8 9 64 6.5 Z" fill="url(#b52g1)"/>
