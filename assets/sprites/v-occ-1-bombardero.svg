  <!-- ===== estabilizadores horizontales (cola convencional) ===== -->
  <path class="shade" d="M62.4 104.4 L48 107.4 L46.6 111 L62.4 114.8 Z"/>
  <path class="shade" d="M65.6 104.4 L80 107.4 L81.4 111 L65.6 114.8 Z"/>
