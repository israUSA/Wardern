<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Ivan Gren, Proyecto 11711 (T3 oriental, transporte). Gris ruso. Identidad: superestructura unica y limpia desplazada hacia proa, sin gruas ni portico, cubierta de vuelo con hangar en la POPA y rampa de proa integrada en el casco. Es el transporte oriental de aspecto mas moderno del set.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
