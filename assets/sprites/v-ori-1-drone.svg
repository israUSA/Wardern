<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Pchela-1T (Tu-243, recon tactico ruso) - vista superior, morro al norte. DRON PEQUENO
       de ala recta en configuracion DOBLE COLA lateral: dos vigas que salen del ala hasta
       un estabilizador trasero con DOS DERIVAS VERTICALES en las puntas. HELICE DELANTERA
       TRACTORA en un morro redondeado con ventana optica. Sin misiles ni tren retraydo
       (lanzamiento desde rail): con antena de radio a popa.
       Tinte por pais: sobreescribir .base/.shade/.light/.hi (fuselaje, alas, vigas, derivas).
       Fijos: .metal/.metalS/.metalL (buje y helice, antenas), .glass (ventana optica), .dark. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="od1f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="od1f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="od1gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="od1g1" gradientUnits="userSpaceOnUse" x1="18" y1="60" x2="110" y2="60">
    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".16" stop-color="#000" stop-opacity=".08"/><stop offset=".34" stop-color="#fff" stop-opacity=".16"/><stop offset=".46" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".06"/><stop offset=".82" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".42"/>
  </linearGradient>
  <linearGradient id="od1g2" gradientUnits="userSpaceOnUse" x1="58" y1="57" x2="70" y2="57">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".24" stop-color="#fff" stop-opacity=".2"/><stop offset=".42" stop-color="#fff" stop-opacity=".24"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="od1g3" gradientUnits="userSpaceOnUse" x1="64" y1="34" x2="64" y2="82">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
  </linearGradient>
  <linearGradient id="od1g4" gradientUnits="userSpaceOnUse" x1="37.5" y1="91.5" x2="90.5" y2="91.5">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".2" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".85" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="64" cy="61" rx="50" ry="49" fill="url(#od1gs)"/>

  <!-- ===== ala recta (montada a media altura, las vigas nacen de ella) ===== -->
  <path class="base" d="M61.4 53 L20 55.6 Q13.5 57 13 61.3 Q13.5 65.6 20 67 L61.4 67.2 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path class="base" d="M66.6 53 L108 55.6 Q114.5 57 115 61.3 Q114.5 65.6 108 67 L66.6 67.2 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M61.4 53 L20 55.6 Q13.5 57 13 61.3 Q13.5 65.6 20 67 L61.4 67.2 Z" fill="url(#od1g1)"/>
  <path d="M66.6 53 L108 55.6 Q114.5 57 115 61.3 Q114.5 65.6 108 67 L66.6 67.2 Z" fill="url(#od1g1)"/>
  <!-- bordes de ataque iluminados + luces de punta -->
  <path d="M61 53.7 L17.5 56.5 M67 53.7 L110.5 56.5" stroke="#b8bfa2" stroke-width=".9" opacity=".55" fill="none"/>
  <path d="M61.2 53.2 L15.5 56" stroke="#fff" stroke-width=".7" opacity=".45" fill="none"/>
  <path d="M66.8 53.2 L112.5 56" stroke="#fff" stroke-width=".5" opacity=".3" fill="none"/>
  <circle class="dark" cx="14.4" cy="61.3" r="1"/><circle class="dark" cx="113.6" cy="61.3" r="1"/>
  <!-- flaperaones y lineas de panel -->
  <path d="M23 61.3 L60 61.6 M68 61.6 L105 61.3" stroke="#000" stroke-width=".55" opacity=".24" fill="none"/>
  <path d="M30 56.8 L30 66.1 M98 56.8 L98 66.1 M48 54.6 L48 66.6 M80 54.6 L80 66.6" stroke="#000" stroke-width=".5" opacity=".2" fill="none"/>

  <!-- ===== doble viga (twin boom) hacia atras ===== -->
  <path class="shade" d="M38.5 58.2 L41.6 58.2 L41.6 90.3 L38.5 90.3 Z"/>
  <path class="shade" d="M86.4 58.2 L89.5 58.2 L89.5 90.3 L86.4 90.3 Z"/>
  <path d="M39 59.4 L39 89.3 M87 59.4 L87 89.3" stroke="#fff" stroke-width=".6" opacity=".3" fill="none"/>
  <path d="M41.1 62 L41.3 88 M86.7 62 L86.5 88" stroke="#000" stroke-width=".7" opacity=".25" fill="none" filter="url(#od1f1)"/>
  <!-- oclusion viga-alas -->
  <path d="M38.2 57.6 L41.9 57.6 L41.9 60.2 L38.2 60.2 Z" fill="#000" opacity=".22" filter="url(#od1f1)"/>
  <path d="M86.1 57.6 L89.8 57.6 L89.8 60.2 L86.1 60.2 Z" fill="#000" opacity=".22" filter="url(#od1f1)"/>

  <!-- ===== estabilizador trasero entre vigas + DOS derivas en las puntas ===== -->
  <path class="shade" d="M37.5 90.3 L90.5 90.3 L89 94.4 L39 94.4 Z" stroke="#3d4232" stroke-width="1"/>
  <path d="M37.5 90.3 L90.5 90.3 L89 94.4 L39 94.4 Z" fill="url(#od1g4)" opacity=".7"/>
  <path d="M38 91 L89.7 91" stroke="#fff" stroke-width=".6" opacity=".35" fill="none"/>
  <path class="dark" d="M39 94.4 L89 94.4 L88.4 96 L39.6 96 Z" opacity=".6"/>
  <!-- derivas verticales (de canto) en los extremos -->
  <path class="shade" d="M38.2 87.6 L41.8 87.6 L41.6 96.6 L38.4 96.6 Z"/>
  <path class="light" d="M38.2 87.6 L39.3 87.6 L39.1 96.6 L38.4 96.6 Z" opacity=".6"/>
  <path class="shade" d="M86.2 87.6 L89.8 87.6 L89.6 96.6 L86.4 96.6 Z"/>
  <path class="light" d="M86.2 87.6 L87.3 87.6 L87.1 96.6 L86.4 96.6 Z" opacity=".6"/>
  <path d="M40 89.5 L40 95.6 M88 89.5 L88 95.6" stroke="#000" stroke-width=".5" opacity=".3" fill="none"/>

  <!-- ===== fuselaje vaina de morro redondeado ===== -->
  <path class="base" d="M64 33.6 C60 34 58 37.1 57.8 41.2 L57.5 49 L57 57 L57.4 64.8 L58.8 72.4 C59.8 76.9 61.3 79.7 63.1 80.9 L64.9 80.9 C66.7 79.7 68.2 76.9 69.2 72.4 L70.6 64.8 L71 57 L70.5 49 L70.2 41.2 C70 37.1 68 34 64 33.6 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M64 33.6 C60 34 58 37.1 57.8 41.2 L57.5 49 L57 57 L57.4 64.8 L58.8 72.4 C59.8 76.9 61.3 79.7 63.1 80.9 L64.9 80.9 C66.7 79.7 68.2 76.9 69.2 72.4 L70.6 64.8 L71 57 L70.5 49 L70.2 41.2 C70 37.1 68 34 64 33.6 Z" fill="url(#od1g2)"/>
  <path d="M64 33.6 C60 34 58 37.1 57.8 41.2 L57.5 49 L57 57 L57.4 64.8 L58.8 72.4 C59.8 76.9 61.3 79.7 63.1 80.9 L64.9 80.9 C66.7 79.7 68.2 76.9 69.2 72.4 L70.6 64.8 L71 57 L70.5 49 L70.2 41.2 C70 37.1 68 34 64 33.6 Z" fill="url(#od1g3)"/>
  <!-- rim light babor + sombra profunda estribor -->
  <path d="M58.9 40 C57.9 47 57.5 56 57.8 65 C58.1 73 59 79 60.3 82" stroke="#fff" stroke-width=".9" opacity=".4" fill="none"/>
  <path d="M69.1 40 C70.1 47 70.5 56 70.2 65 C69.9 73 69 79 67.7 82" stroke="#000" stroke-width="1.3" opacity=".24" fill="none" filter="url(#od1f1)"/>
  <!-- sombra del fuselaje sobre las alas -->
  <path d="M61.6 53.5 L66.4 53.5 L65.8 67.4 L62.2 67.4 Z" fill="#000" opacity=".2" filter="url(#od1f1)"/>
  <!-- linea de crujia y paneles -->
  <path d="M64 36 L64 79" stroke="#b8bfa2" stroke-width=".7" opacity=".35" fill="none"/>
  <path d="M57.9 52 L70.1 52 M58.4 68 L69.6 68" stroke="#000" stroke-width=".5" opacity=".22" fill="none"/>

  <!-- ===== ventana optica bajo el morro redondeado ===== -->
  <path d="M60.6 43.6 L67.4 43.6 L66.8 46.4 L61.2 46.4 Z" fill="#000" opacity=".22" filter="url(#od1f1)"/>
  <ellipse class="dark" cx="64" cy="42.4" rx="3.4" ry="2.9"/>
  <ellipse cx="64" cy="42.4" rx="3.4" ry="2.9" fill="none" stroke="#243b4d" stroke-width=".5"/>
  <circle class="glass" cx="64" cy="42" r="1.9"/>
  <circle cx="63.4" cy="41.4" r=".65" fill="#fff" opacity=".9"/>
  <!-- camera rail lateral (fotogrametria) -->
  <rect class="metalL" x="55.6" y="47.4" width="2.6" height="4.6" rx=".6"/>
  <rect class="metalL" x="69.8" y="47.4" width="2.6" height="4.6" rx=".6"/>

  <!-- ===== antena dorsal y de popa ===== -->
  <path class="dark" d="M64 57.4 L65.4 62.6 L64 66.6 L62.6 62.6 Z" opacity=".9"/>
  <path class="light" d="M64 57.4 L64.7 62.6 L64 66.6 L63.3 62.6 Z" opacity=".55"/>
  <path d="M68.6 71.5 L71.4 76.8" stroke="#3d4232" stroke-width=".9" fill="none"/>

  <!-- ===== helice TRACTORA delantera (disco semitransparente) ===== -->
  <g class="dark" opacity=".4">
    <path d="M62.9 20.6 L65.1 20.6 L65.4 29.4 L62.6 29.4 Z" transform="rotate(40 64 31.2)"/>
    <path d="M62.9 20.6 L65.1 20.6 L65.4 29.4 L62.6 29.4 Z" transform="rotate(130 64 31.2)"/>
    <path d="M62.9 20.6 L65.1 20.6 L65.4 29.4 L62.6 29.4 Z" transform="rotate(220 64 31.2)"/>
    <path d="M62.9 20.6 L65.1 20.6 L65.4 29.4 L62.6 29.4 Z" transform="rotate(310 64 31.2)"/>
  </g>
  <g class="dark" opacity=".78">
    <path d="M62.8 21.4 L65.2 21.4 L65.3 27.6 L62.7 27.6 Z" transform="rotate(40 64 31.2)"/>
    <path d="M62.8 21.4 L65.2 21.4 L65.3 27.6 L62.7 27.6 Z" transform="rotate(130 64 31.2)"/>
    <path d="M62.8 21.4 L65.2 21.4 L65.3 27.6 L62.7 27.6 Z" transform="rotate(220 64 31.2)"/>
    <path d="M62.8 21.4 L65.2 21.4 L65.3 27.6 L62.7 27.6 Z" transform="rotate(310 64 31.2)"/>
  </g>
  <!-- morro redondeado con buje y cono de helice -->
  <circle class="shade" cx="64" cy="32.4" r="2.9"/>
  <circle class="metal" cx="64" cy="31.2" r="1.7"/>
  <circle class="metalS" cx="64" cy="30.4" r=".8"/>
  <circle class="metalL" cx="64" cy="30.4" r=".3"/>
  <!-- oclusion de la helice sobre el morro -->
  <path d="M61.6 35.4 L66.4 35.4 L66 37.4 L62 37.4 Z" fill="#000" opacity=".2" filter="url(#od1f1)"/>
</svg>
