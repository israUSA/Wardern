<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- T-90M Proryv (T3 oriental). Verde ruso.
     Misma camara y escala que el resto del set (20.9 px/m, ~31 grados).
     Casco 6.86 x 3.78 x 2.23 m.
     Identidad frente al T-72: torreta SOLDADA angular (no fundida en cupula),
     bloques de blindaje reactivo Relikt en las mejillas y en los faldones,
     gran cesta de estiba enrejada en la popa de torreta y estacion de armas
     teledirigida en el techo. Canon 2A46M-5 de 125 mm. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0"    stop-color="#9aa878"/>
    <stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/>
    <stop offset="1"    stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0"    stop-color="#6b7a4e"/>
    <stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1"    stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0"    stop-color="#485636"/>
    <stop offset="0.6"  stop-color="#374327"/>
    <stop offset="1"    stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0"    stop-color="#a6b28a"/>
    <stop offset="0.5"  stop-color="#717d5a"/>
    <stop offset="1"    stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0"    stop-color="#3a3a30"/>
    <stop offset="0.5"  stop-color="#26261f"/>
    <stop offset="1"    stop-color="#171712"/>
  </linearGradient>
</defs>

<!-- 1. sombra -->
<path d="M26 145 L162 109 L204 146 L64 185 Z" fill="#080a06" opacity="0.30"/>

<!-- 2. popa -->
<path d="M29.8 113.7 L66.9 150.0 L66.9 175.0 L29.8 138.7 Z" fill="url(#g-rear)"/>
<g fill="#56653c" stroke="#1f2716" stroke-width="0.9">
  <path d="M33 122 L45 133.7 L45 146 L33 134.3 Z"/>
  <path d="M49 137.6 L61 149.3 L61 161.6 L49 149.9 Z"/>
</g>
<g stroke="#7e8d5e" stroke-opacity="0.6" stroke-width="0.9">
  <path d="M34.5 127 L43.5 135.8"/><path d="M34.5 131.6 L43.5 140.4"/>
  <path d="M50.5 142.6 L59.5 151.4"/><path d="M50.5 147.2 L59.5 156"/>
</g>
<circle cx="32" cy="119" r="2.4" fill="#8f5b30"/>

<!-- 3. cubierta y glacis -->
<path d="M29.8 113.7 L116.3 89.8 L153.4 126.1 L66.9 150.0 Z" fill="url(#g-deck)"/>
<path d="M116.3 89.8 L156.1 90.8 L193.2 127.1 L153.4 126.1 Z" fill="url(#g-deck)"/>
<path d="M116.3 89.8 L153.4 126.1" fill="none" stroke="#3b4728" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M116.3 89.8 L156.1 90.8 L193.2 127.1 L153.4 126.1 Z" fill="#ffffff" fill-opacity="0.07"/>
<!-- bloques Relikt en el glacis -->
<g fill="#657547" stroke="#2b3320" stroke-width="0.8">
  <path d="M124 96 L140 96.4 L146 102 L130 101.6 Z"/>
  <path d="M133 104.6 L149 105 L155 110.6 L139 110.2 Z"/>
  <path d="M142 113.2 L158 113.6 L164 119.2 L148 118.8 Z"/>
</g>
<ellipse cx="170" cy="112" rx="6.5" ry="4.3" fill="#6d7c50" stroke="#333d22" stroke-width="1"/>
<g fill="#3b4728">
  <path d="M159 93 L165 99 L161.8 100.4 L155.8 94.4 Z"/>
  <path d="M176 110 L182 116 L178.8 117.4 L172.8 111.4 Z"/>
</g>
<!-- rejillas del motor -->
<path d="M34.4 116.0 L62.6 108.2 L93.4 138.5 L65.2 146.3 Z" fill="#4c5a35"/>
<g stroke="#8b9a69" stroke-opacity="0.7" stroke-width="1.1">
  <path d="M40 114.4 L70.8 144.7"/>
  <path d="M46 112.8 L76.8 143.1"/>
  <path d="M52 111.1 L82.8 141.4"/>
  <path d="M58 109.5 L88.8 139.8"/>
</g>

<!-- 4. flanco -->
<path d="M66.9 150.0 L153.4 126.1 L193.2 127.1 L66.9 159.0 Z" fill="url(#g-flank)"/>

<!-- 5. tren de rodaje: 6 ruedas + 3 rodillos de retorno -->
<path d="M64.8 177.3 L198.1 140.4 L198.1 124.4 L64.8 161.3 Z" fill="url(#g-trk)"/>
<g fill="#3d4433" stroke="#17190f" stroke-width="1.1">
  <ellipse cx="80.7"  cy="164.9" rx="7.5" ry="8.7"/>
  <ellipse cx="101.9" cy="159.0" rx="7.5" ry="8.7"/>
  <ellipse cx="123.0" cy="153.2" rx="7.5" ry="8.7"/>
  <ellipse cx="146.0" cy="146.8" rx="7.5" ry="8.7"/>
  <ellipse cx="167.2" cy="141.0" rx="7.5" ry="8.7"/>
  <ellipse cx="186.6" cy="135.6" rx="7.5" ry="8.7"/>
</g>
<g fill="#5a6247">
  <ellipse cx="80.7"  cy="164.9" rx="2.8" ry="3.3"/>
  <ellipse cx="101.9" cy="159.0" rx="2.8" ry="3.3"/>
  <ellipse cx="123.0" cy="153.2" rx="2.8" ry="3.3"/>
  <ellipse cx="146.0" cy="146.8" rx="2.8" ry="3.3"/>
  <ellipse cx="167.2" cy="141.0" rx="2.8" ry="3.3"/>
  <ellipse cx="186.6" cy="135.6" rx="2.8" ry="3.3"/>
</g>
<ellipse cx="67.4"  cy="165.6" rx="8.8" ry="10"  fill="#454c39" stroke="#17190f" stroke-width="1.2"/>
<ellipse cx="196.3" cy="129.9" rx="8"   ry="9.2" fill="#454c39" stroke="#17190f" stroke-width="1.2"/>
<g fill="#454c39" stroke="#17190f" stroke-width="0.9">
  <ellipse cx="93.0"  cy="152.5" rx="3" ry="3.5"/>
  <ellipse cx="128.3" cy="142.7" rx="3" ry="3.5"/>
  <ellipse cx="163.7" cy="132.9" rx="3" ry="3.5"/>
</g>
<path d="M66 177.6 L199 140.8" fill="none" stroke="#080a06" stroke-opacity="0.55" stroke-width="3"/>

<!-- 6. faldon con bloques Relikt a lo largo de todo el flanco -->
<path d="M66.0 162.4 L193.2 127.2 L193.2 116.2 L66.0 151.4 Z" fill="url(#g-flank)"/>
<g fill="#657547" stroke="#2b3320" stroke-width="0.9">
  <path d="M69.6 152.4 L89.0 147.0 L89.0 154.0 L69.6 159.4 Z"/>
  <path d="M91.6 146.3 L111.1 140.9 L111.1 147.9 L91.6 153.3 Z"/>
  <path d="M113.7 140.2 L133.1 134.8 L133.1 141.8 L113.7 147.2 Z"/>
  <path d="M135.8 134.1 L155.2 128.7 L155.2 135.7 L135.8 141.1 Z"/>
  <path d="M157.9 128.0 L177.3 122.6 L177.3 129.6 L157.9 135.0 Z"/>
  <path d="M179.9 121.9 L193.2 118.2 L193.2 125.2 L179.9 128.9 Z"/>
</g>
<path d="M66.0 151.4 L193.2 116.2" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="2"/>

<!-- 7. cesta de estiba enrejada en la popa de torreta: marca del T-90M -->
<path d="M38.2 114.6 L62.6 138.5 L62.6 122.5 L38.2 98.6 Z" fill="#3f4c2e"/>
<path d="M62.6 138.5 L82.0 133.1 L82.0 117.1 L62.6 122.5 Z" fill="#4c5a35"/>
<path d="M38.2 98.6 L57.6 93.2 L82.0 117.1 L62.6 122.5 Z" fill="#44512f"/>
<g stroke="#222a17" stroke-opacity="0.75" stroke-width="0.8">
  <path d="M46 106.2 L70.4 130.1"/>
  <path d="M54 101.8 L78.4 125.7"/>
  <path d="M69 136 L69 120"/>
  <path d="M76 134 L76 118"/>
</g>

<!-- 8. torreta soldada angular -->
<path d="M58.5 115.1 L81.0 137.2 L81.0 115.2 L58.5 93.1 Z" fill="url(#g-rear)"/>
<path d="M81.0 137.2 L130.6 125.9 L146.9 113.1 L146.9 91.1 L130.6 103.9 L81.0 115.2 Z" fill="url(#g-flank)"/>
<path d="M58.5 93.1 L104.3 78.2 L133.8 78.2 L146.9 91.1 L130.6 103.9 L81.0 115.2 Z" fill="url(#g-deck)"/>
<path d="M104.3 78.2 L130.6 103.9" fill="none" stroke="#3b4728" stroke-opacity="0.5" stroke-width="1.1"/>
<path d="M58.5 93.1 L104.3 78.2 L133.8 78.2" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.4"/>
<!-- bloques Relikt en la mejilla derecha -->
<g fill="#657547" stroke="#2b3320" stroke-width="0.9">
  <path d="M132.5 102.5 L145.3 92.4 L145.3 99.4 L132.5 109.5 Z"/>
  <path d="M113 111 L129 107.4 L129 114.4 L113 118 Z"/>
</g>
<!-- lanzagranadas fumigenas -->
<path d="M137 105 L146 102.5 L146 96.8 L137 99.3 Z" fill="#3f4c2e" stroke="#1f2716" stroke-width="0.7"/>
<g fill="#1a2012">
  <ellipse cx="146.3" cy="98.4" rx="1.5" ry="1.9"/>
  <ellipse cx="146.3" cy="101.8" rx="1.5" ry="1.9"/>
</g>

<!-- 9. escotilla del comandante y estacion de armas teledirigida -->
<ellipse cx="84.4" cy="91.9" rx="6.5" ry="4.5" fill="#6d7c50" stroke="#333d22" stroke-width="1"/>
<path d="M85.1 104.9 L93.1 102.5 L101.1 104.9 L101.1 95.6 L93.1 93.2 L85.1 95.6 Z"
      fill="#4e5c38" stroke="#222a17" stroke-width="1"/>
<path d="M85.1 95.6 L93.1 93.2 L101.1 95.6 L93.1 98 Z" fill="#7c8b5d"/>
<path d="M97 100 L104 98 L104 93.6 L97 95.6 Z" fill="#2b3320"/>
<ellipse cx="104" cy="96" rx="1.6" ry="2.6" fill="#8fb4c4"/>
<path d="M95 95 L99 93.6 L117 87.2 L118 89.4 L100 95.8 L96.5 97.2 Z" fill="url(#g-metal)"/>

<!-- 10. canon 2A46M-5 de 125 mm -->
<path d="M133 97.5 L141 90.5 L149 95 L141 102 Z" fill="#6d7c50" stroke="#333d22" stroke-width="0.9"/>
<path d="M139.3 89.7 L225.0 66.1 L227.2 74.2 L141.5 97.8 Z" fill="url(#g-metal)"/>
<path d="M171.3 78.5 L184.1 75.0 L187.5 87.4 L174.7 90.9 Z" fill="#95a274" stroke="#3b4728" stroke-width="0.8"/>
<ellipse cx="226.1" cy="70.1" rx="1.6" ry="3.6" fill="#12150e"/>
<path d="M139.3 89.7 L225.0 66.1 L225.4 67.7 L139.7 91.3 Z" fill="#ffffff" fill-opacity="0.32"/>
</svg>
