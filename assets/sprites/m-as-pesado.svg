<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64">
  <!-- FAMILIA: aire-suelo PESADO de morro sensor (AGM-65 Maverick / Kh-25ML).
       Rasgo propio: cuerpo GORDO y corto, alas en cruz grandes bien atrás y
       ventana plana cuadrada del buscador en el morro (electroóptico o láser).
       Morro hacia ARRIBA (norte). Dibujo base: mejóralo encima. -->
  <defs>
    <linearGradient id="ap-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe3e7"/>
      <stop offset="0.45" stop-color="#9fa8b0"/>
      <stop offset="1" stop-color="#5a636b"/>
    </linearGradient>
    <linearGradient id="ap-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c9"/>
      <stop offset="0.5" stop-color="#ffa040"/>
      <stop offset="1" stop-color="#d94a1c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M12.6 48 L19.4 48 C20.5 53 18.4 58 16 61 C13.6 58 11.5 53 12.6 48 Z" fill="url(#ap-flame)"/>

  <!-- alas en cruz grandes y traseras -->
  <path d="M12.6 30 L2.5 40 L2.5 46 L12.6 42 Z" fill="#59626a"/>
  <path d="M19.4 30 L29.5 40 L29.5 46 L19.4 42 Z" fill="#59626a"/>
  <!-- aletillas de guiado delanteras -->
  <path d="M12.6 20 L9 22 L9 25.5 L12.6 24 Z" fill="#7b848c"/>
  <path d="M19.4 20 L23 22 L23 25.5 L19.4 24 Z" fill="#7b848c"/>

  <!-- fuselaje ancho -->
  <rect x="12.5" y="11" width="7" height="37" rx="1.4" fill="url(#ap-body)"/>
  <rect x="12.5" y="27" width="7" height="2.4" fill="#c9432f"/>
  <!-- morro ROMO con ventana plana del buscador: no es ojiva puntiaguda -->
  <path d="M12.5 11 L12.9 5.5 L19.1 5.5 L19.5 11 Z" fill="#3a424a"/>
  <rect x="13.4" y="6" width="5.2" height="4" rx="0.6" fill="#2a3038"/>
  <rect x="14" y="6.6" width="4" height="2.8" rx="0.4" fill="#8fd0e8" opacity="0.8"/>
</svg>
