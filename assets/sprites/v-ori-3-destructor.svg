<!-- Lider, Proyecto 23560 (T3 oriental, destructor). Gris ruso. Identidad: casco muy grande con superestructura furtiva integrada de una pieza, palo cerrado, y DOS bancos enormes de celdas verticales (proa y popa) con mas celdas que ningun otro buque de superficie del set. Aspecto liso, sin chimeneas ni celosias.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
