<path d="M145 102.5 A7.5 5 0 0 1 159 102.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1"/>
<g fill="#5c5340">
  <path d="M167 92.5 L173.5 98.9 L170 100.4 L163.6 94 Z"/>
  <path d="M186 105 L192.5 111.4 L189 112.9 L182.6 106.5 Z"/>
</g>

<!-- 7. cubierta de motor -->
<path d="M26.4 114.8 L56.4 106.5 L89.2 135.9 L59.2 144.2 Z" fill="#6e6247"/>
<g stroke="#a99a74" stroke-opacity="0.75" stroke-width="1.2">
  <path d="M32.6 114.3 L60.7 141.8"/>
  <path d="M38.8 112.6 L66.9 140.1"/>
  <path d="M45.0 110.9 L73.1 138.4"/>
  <path d="M51.2 109.2 L79.3 136.7"/>
</g>

<!-- 8. cesta de estiba alta con modulo APU -->
<path d="M45.2 108.4 L67.7 130.5 L67.7 114.5 L45.2 92.4 Z" fill="#564c37"/>
<path d="M67.7 130.5 L87.1 125.2 L87.1 109.2 L67.7 114.5 Z" fill="#6a5e45"/>
<path d="M45.2 92.4 L64.6 87.1 L87.1 109.2 L67.7 114.5 Z" fill="#5f553e"/>
<!-- modulo APU: bloque solido en el lado izquierdo -->
<path d="M45.2 92.4 L58.0 88.9 L58.0 100.9 L45.2 104.4 Z" fill="#7a6d50" stroke="#2f2a1e" stroke-width="0.9"/>
<g stroke="#2f2a1e" stroke-opacity="0.7" stroke-width="0.8">
  <path d="M62 100 L84.5 122.1"/>
  <path d="M69 96.8 L91.5 118.9"/>
  <path d="M74 118 L76 109.8"/>
  <path d="M81 115.7 L83 107.5"/>
</g>

<!-- 9. torreta con blindaje aplicado en el flanco -->
<path d="M63.7 109.2 L87.6 132.6 L87.6 112.6 L63.7 89.2 Z" fill="url(#g-rear)"/>
<path d="M87.6 132.6 L136.7 120.8 L152.1 107.1 L152.1 87.1 L136.7 100.8 L87.6 112.6 Z" fill="url(#g-flank)"/>
<path d="M112.2 126.7 L136.7 120.8 L152.1 107.1 L152.1 89.1 L136.7 102.8 L112.2 108.7 Z"
      fill="#a1936a" stroke="#5a5039" stroke-width="1"/>
<path d="M63.7 89.2 L110.0 74.6 L140.4 75.6 L152.1 87.1 L136.7 100.8 L87.6 112.6 Z" fill="url(#g-deck)"/>
<path d="M110.0 74.6 L136.7 100.8" fill="none" stroke="#6d6046" stroke-opacity="0.5" stroke-width="1.1"/>
<path d="M63.7 89.2 L110.0 74.6 L140.4 75.6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4"/>

<!-- 10. lanzagranadas fumigenas -->
<path d="M143.5 105.5 L152.5 103.2 L152.5 97.6 L143.5 99.9 Z" fill="#5c5340" stroke="#2f2a1e" stroke-width="0.7"/>
<g fill="#2b271c">
