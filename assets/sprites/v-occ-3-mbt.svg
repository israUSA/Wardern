<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- M1A2 SEPv3 Abrams (T3 occidental). Pintura arena CARC.
     Mismo casco que el M1 (7.93 m, 7 ruedas) y misma camara del set.
     Identidad frente al M1 base: estacion de armas teledirigida CROWS II en el
     techo en vez de la cupula abierta con la .50, torreta sin escotilla saliente,
     blindaje aplicado en el flanco de torreta, tejas de blindaje reactivo ARAT en
     los faldones, cesta de estiba mas alta con el modulo APU en la popa. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0"    stop-color="#e2d6b2"/>
    <stop offset="0.34" stop-color="#c8b78d"/>
    <stop offset="0.68" stop-color="#ad9c75"/>
    <stop offset="1"    stop-color="#91815f"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0"    stop-color="#aea172"/>
    <stop offset="0.45" stop-color="#978861"/>
    <stop offset="1"    stop-color="#78694a"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0"    stop-color="#6f6247"/>
    <stop offset="0.6"  stop-color="#584d38"/>
    <stop offset="1"    stop-color="#453c2c"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0"    stop-color="#d4c9a8"/>
    <stop offset="0.5"  stop-color="#9e9376"/>
    <stop offset="1"    stop-color="#675e47"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0"    stop-color="#403d34"/>
    <stop offset="0.5"  stop-color="#2c2a22"/>
    <stop offset="1"    stop-color="#1b1a15"/>
  </linearGradient>
</defs>

<!-- 1. sombra -->
<path d="M16 150 L170 108 L212 147 L54 190 Z" fill="#0d0b06" opacity="0.30"/>

<!-- 2. tren de rodaje: 7 ruedas -->
<path d="M54 183.7 L207.6 141.2 L207.6 125.2 L54 167.7 Z" fill="url(#g-trk)"/>
<g fill="#46423a" stroke="#1b1a15" stroke-width="1.1">
  <ellipse cx="68.1"  cy="171.8" rx="6.5" ry="7.6"/>
  <ellipse cx="89.3"  cy="165.9" rx="6.5" ry="7.6"/>
  <ellipse cx="110.5" cy="160.1" rx="6.5" ry="7.6"/>
  <ellipse cx="131.7" cy="154.2" rx="6.5" ry="7.6"/>
  <ellipse cx="152.9" cy="148.3" rx="6.5" ry="7.6"/>
  <ellipse cx="174.1" cy="142.5" rx="6.5" ry="7.6"/>
  <ellipse cx="195.3" cy="136.6" rx="6.5" ry="7.6"/>
</g>
<g fill="#6d6455">
  <ellipse cx="68.1"  cy="171.8" rx="2.4" ry="2.9"/>
  <ellipse cx="89.3"  cy="165.9" rx="2.4" ry="2.9"/>
  <ellipse cx="110.5" cy="160.1" rx="2.4" ry="2.9"/>
  <ellipse cx="131.7" cy="154.2" rx="2.4" ry="2.9"/>
  <ellipse cx="152.9" cy="148.3" rx="2.4" ry="2.9"/>
  <ellipse cx="174.1" cy="142.5" rx="2.4" ry="2.9"/>
  <ellipse cx="195.3" cy="136.6" rx="2.4" ry="2.9"/>
</g>
<ellipse cx="57.5"  cy="169.7" rx="8.4" ry="9.6" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<ellipse cx="204.1" cy="129.2" rx="7.6" ry="8.8" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<path d="M55 184 L208 141.5" fill="none" stroke="#0d0b06" stroke-opacity="0.55" stroke-width="3"/>

<!-- 3. faldon con tejas de blindaje reactivo ARAT -->
<path d="M55.3 167.8 L189.6 130.7 L189.6 112.7 L55.3 149.8 Z" fill="url(#g-flank)"/>
<g fill="#8d7f5e" stroke="#5a5039" stroke-width="0.9">
  <path d="M59.7 134.6 L77.4 129.7 L77.4 137.7 L59.7 142.6 Z"/>
  <path d="M81.8 128.5 L99.5 123.6 L99.5 131.6 L81.8 136.5 Z"/>
  <path d="M103.9 122.4 L121.5 117.5 L121.5 125.5 L103.9 130.4 Z"/>
  <path d="M125.9 116.3 L143.6 111.4 L143.6 119.4 L125.9 124.3 Z"/>
  <path d="M148.0 110.2 L165.7 105.3 L165.7 113.3 L148.0 118.2 Z"/>
  <path d="M170.1 104.1 L187.8 99.2 L187.8 107.2 L170.1 112.1 Z"/>
</g>
<g stroke="#6d6046" stroke-opacity="0.7" stroke-width="1.2">
  <path d="M76.5 143.9 L76.5 161.9"/>
  <path d="M97.7 138.1 L97.7 156.1"/>
  <path d="M118.9 132.2 L118.9 150.2"/>
  <path d="M140.1 126.4 L140.1 144.4"/>
  <path d="M161.3 120.5 L161.3 138.5"/>
  <path d="M182.5 114.7 L182.5 132.7"/>
</g>
<path d="M55.3 149.8 L189.6 112.7" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="2"/>

<!-- 4. flanco del casco -->
<path d="M56.1 148.3 L162.1 119.0 L202.7 126.8 L202.7 133.5 L56.1 155 Z" fill="url(#g-flank)"/>

<!-- 5. popa con rejilla de escape de la turbina -->
<path d="M20 146 L56.1 181.3 L56.1 148.3 L20 113 Z" fill="url(#g-rear)"/>
<path d="M25.6 145.5 L51.0 170.3 L51.0 148.3 L25.6 123.5 Z" fill="#241f16"/>
<g stroke="#8a7c5b" stroke-opacity="0.75" stroke-width="1.3">
  <path d="M26.6 142.4 L50.0 165.4"/>
  <path d="M26.6 137.4 L50.0 160.4"/>
  <path d="M26.6 132.4 L50.0 155.4"/>
  <path d="M26.6 127.4 L50.0 150.4"/>
</g>
<circle cx="23.5" cy="122.5" r="2.6" fill="#8f5b30"/>
<circle cx="53.5" cy="175.5" r="2.6" fill="#8f5b30"/>

<!-- 6. cubierta y glacis -->
<path d="M20 113 L126.0 83.7 L162.1 119.0 L56.1 148.3 Z" fill="url(#g-deck)"/>
<path d="M126.0 83.7 L166.6 91.5 L202.7 126.8 L162.1 119.0 Z" fill="url(#g-deck)"/>
<path d="M126.0 83.7 L162.1 119.0" fill="none" stroke="#6d6046" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M126.0 83.7 L166.6 91.5 L202.7 126.8 L162.1 119.0 Z" fill="#ffffff" fill-opacity="0.06"/>
