  <ellipse cx="152.8" cy="102.6" rx="1.5" ry="1.9"/>
</g>

<!-- 11. escotillas enrasadas -->
<ellipse cx="99" cy="86.5" rx="6.5" ry="4.4" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>
<ellipse cx="113.3" cy="97.9" rx="6.5" ry="4.4" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>

<!-- 12. estacion de armas CROWS II: marca del SEPv3 -->
<path d="M107.2 80.8 L115.2 78.4 L123.2 80.8 L123.2 71.5 L115.2 69.1 L107.2 71.5 Z"
