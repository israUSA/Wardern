  <path d="M64 29.2 C61.9 29.8 61.2 31.4 61 33.2 L61.2 36.6 L66.8 36.6 L67 33.2 C66.8 31.4 66.1 29.8 64 29.2 Z" fill="url(#d3g4)"/>
  <path d="M64 29.2 C61.9 29.8 61.2 31.4 61 33.2 L61.2 36.6 L66.8 36.6 L67 33.2 C66.8 31.4 66.1 29.8 64 29.2 Z" fill="none" stroke="#243b4d" stroke-width=".6"/>
  <ellipse cx="62.6" cy="31.6" rx=".8" ry="1.6" transform="rotate(12 62.6 31.6)" fill="#fff" opacity=".7"/>

  <!-- ===== lomo dorsal: bulge SATCOM y toma de aire ===== -->
  <ellipse class="light" cx="64" cy="83.5" rx="3.1" ry="4.6"/>
  <path d="M61.6 81 C63.2 82.4 64.8 82.4 66.4 81" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>
