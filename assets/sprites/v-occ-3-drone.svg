  <path d="M64 17.2 C61.3 18.9 59.4 21.7 58.5 25.4 L57.2 31.4 L56.4 41 L56.1 52 L56.8 63 L57.8 74.5 L59 86.5 C59.5 92.5 60.2 96.8 61.3 99.8 L64 103.2 L66.7 99.8 C67.8 96.8 68.5 92.5 69 86.5 L70.2 74.5 L71.2 63 L71.9 52 L71.6 41 L70.8 31.4 L69.5 25.4 C68.6 21.7 66.7 18.9 64 17.2 Z" fill="url(#d3g3)"/>
