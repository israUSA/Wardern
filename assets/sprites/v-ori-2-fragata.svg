<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Almirante Gorshkov, Proyecto 22350 (T2 oriental, fragata). Gris ruso. Identidad: superestructura furtiva con el palo cerrado en forma de piramide truncada que aloja el radar, celdas verticales delante del puente y canon de 130 mm en la proa. Mucho mas limpia que el Krivak: ya no hay contenedores ni celosias a la vista.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
