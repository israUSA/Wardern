<!-- USS Columbia (T3 occidental, submarino). Casco negro. Submarino lanzamisiles balisticos: es el mas largo y grueso del set. Identidad: la JOROBA del compartimento de tubos de misil, un lomo elevado que recorre toda la seccion central del casco detras de una vela baja y ancha. Timones de profundidad a proa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
