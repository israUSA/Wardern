<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- USS Los Angeles (T1 occidental, submarino). Casco negro. Identidad: vela alta y estrecha adelantada con los TIMONES DE PROFUNDIDAD MONTADOS EN LA VELA, que es lo que lo separa de los submarinos posteriores; casco cilindrico liso y aleta vertical de popa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#79828a"/><stop offset="0.45" stop-color="#5c656d"/>
    <stop offset="1" stop-color="#454d54"/>
  </linearGradient>
  <linearGradient id="g-side" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#454d54"/><stop offset="0.5" stop-color="#353c42"/>
    <stop offset="1" stop-color="#262b30"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#dfe5ea"/><stop offset="0.5" stop-color="#9aa4ad"/>
    <stop offset="1" stop-color="#5d666e"/>
  </linearGradient>
</defs>
