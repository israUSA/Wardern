<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- USS Los Angeles (SSN-688, anos 80) - vista superior, proa al norte. Difiere del
       Virginia: caps VLS de Tomahawk en DOS FILAS DE 6 DELANTE de la vela (no detras),
       planes de inmersion en la TORRE (stubs a los lados de la vela), 4 tubos de torpedos
       de proa y helice de 7 palas (no pump-jet). -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="sb1f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="sb1f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="sb1gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sb1g1" gradientUnits="userSpaceOnUse" x1="50" y1="62" x2="78" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".2" stop-color="#fff" stop-opacity=".18"/><stop offset=".4" stop-color="#fff" stop-opacity=".24"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset=".8" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".44"/>
  </linearGradient>
  <linearGradient id="sb1g2" gradientUnits="userSpaceOnUse" x1="64" y1="10" x2="64" y2="114">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
  </linearGradient>
  <linearGradient id="sb1g3" gradientUnits="userSpaceOnUse" x1="58" y1="49" x2="70" y2="49">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".24" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".85" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".36"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="63" cy="62" rx="20" ry="57" fill="url(#sb1gs)"/>

  <!-- ===== casco presion eliptico ===== -->
  <path class="metal" d="M64 10.5 C57.8 14.6 52.8 21 50.2 29.6 L48.6 41 L48.8 84 L50.8 94.5 L55.2 104 L60 110 L64 112.4 L68 110 L72.8 104 L77.2 94.5 L79.2 84 L79.4 41 L77.8 29.6 C75.2 21 70.2 14.6 64 10.5 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 10.5 C57.8 14.6 52.8 21 50.2 29.6 L48.6 41 L48.8 84 L50.8 94.5 L55.2 104 L60 110 L64 112.4 L68 110 L72.8 104 L77.2 94.5 L79.2 84 L79.4 41 L77.8 29.6 C75.2 21 70.2 14.6 64 10.5 Z" fill="url(#sb1g1)"/>
  <path d="M64 10.5 C57.8 14.6 52.8 21 50.2 29.6 L48.6 41 L48.8 84 L50.8 94.5 L55.2 104 L60 110 L64 112.4 L68 110 L72.8 104 L77.2 94.5 L79.2 84 L79.4 41 L77.8 29.6 C75.2 21 70.2 14.6 64 10.5 Z" fill="url(#sb1g2)"/>
  <!-- rim light en el flanco de babor + sombra profunda a estribor -->
  <path d="M50.4 30 L48.9 41 L49 84 L51 94 L55.4 103.6" stroke="#fff" stroke-width="1.1" opacity=".4" fill="none"/>
  <path d="M77.6 30 L79.1 41 L79 84 L77 94 L72.6 103.6" stroke="#000" stroke-width="1.6" opacity=".26" fill="none" filter="url(#sb1f1)"/>
  <!-- domo de sonar de proa -->
  <ellipse class="metalL" cx="64" cy="20.5" rx="5.2" ry="7" opacity=".55"/>
  <path d="M59.6 17.5 C61.5 19.8 66.5 19.8 68.4 17.5 M58.9 21.5 C61.4 23.6 66.6 23.6 69.1 21.5" stroke="#4a5057" stroke-width=".5" opacity=".7" fill="none"/>
  <!-- tuneles de empuje transversal -->
  <path class="dark" d="M55.2 25.9 L56.9 26.7 M55.2 28.3 L56.9 27.5 M72.8 25.9 L71.1 26.7 M72.8 28.3 L71.1 27.5" stroke-width="1" fill="none"/>
  <!-- 4 bocas de tubos torpederos de proa -->
  <circle class="dark" cx="59.2" cy="17.2" r="1.5"/><circle class="dark" cx="68.8" cy="17.2" r="1.5"/>
  <circle class="dark" cx="61.8" cy="14.4" r="1.5"/><circle class="dark" cx="66.2" cy="14.4" r="1.5"/>
  <circle class="metalL" cx="59.2" cy="17.2" r=".55"/><circle class="metalL" cx="68.8" cy="17.2" r=".55"/>
  <circle class="metalL" cx="61.8" cy="14.4" r=".55"/><circle class="metalL" cx="66.2" cy="14.4" r=".55"/>
  <!-- muettes de amarre -->
  <path d="M52.4 35.6 L53.8 34.9 M52.4 36.2 L53.8 36.9 M53 34.9 L53 36.9 M75.6 35.6 L74.2 34.9 M75.6 36.2 L74.2 36.9 M75 34.9 L75 36.9" stroke="#4a5057" stroke-width=".6" fill="none"/>
  <!-- anillos estructurales del casco -->
  <path d="M50.3 31.5 C56.5 33.2 71.5 33.2 77.7 31.5 M49.2 44 C56.6 45.6 71.4 45.6 78.8 44 M48.9 66 C56.6 67.6 71.4 67.6 79.1 66 M49.6 90 C56.5 91.6 71.5 91.6 78.4 90" stroke="#000" stroke-width=".55" opacity=".18" fill="none"/>
  <path d="M49.5 77.5 C56.6 79 71.4 79 78.5 77.5" stroke="#000" stroke-width=".55" opacity=".15" fill="none"/>
  <!-- bulge del sonar remolcado a popa -->
  <path class="metalL" d="M63.2 104.2 L64.8 104.2 L65.6 111 L62.4 111 Z" opacity=".7"/>
  <!-- linea de cubierta central -->
  <path d="M64 12.5 L64 38 M64 64 L64 106" stroke="#b8bfa2" stroke-width=".7" opacity=".28" fill="none"/>
  <!-- imbornales de drenaje -->
  <circle class="dark" cx="53.8" cy="52" r=".55"/><circle class="dark" cx="52.9" cy="60" r=".55"/><circle class="dark" cx="52.9" cy="72" r=".55"/><circle class="dark" cx="53.8" cy="80" r=".55"/>
  <circle class="dark" cx="74.2" cy="52" r=".55"/><circle class="dark" cx="75.1" cy="60" r=".55"/><circle class="dark" cx="75.1" cy="72" r=".55"/><circle class="dark" cx="74.2" cy="80" r=".55"/>

  <!-- ===== planes de profundidad de proa ===== -->
  <path class="metalS" d="M50.6 31.2 L42.8 33.4 L42.4 36.2 L50.3 37.2 Z" stroke="#3d4232" stroke-width=".8"/>
  <path class="metalS" d="M77.4 31.2 L85.2 33.4 L85.6 36.2 L77.7 37.2 Z" stroke="#3d4232" stroke-width=".8"/>
  <path d="M44.4 34.2 L49.6 34.6 M83.6 34.2 L78.4 34.6" stroke="#b8bfa2" stroke-width=".6" opacity=".5" fill="none"/>

  <!-- ===== vela (sail) con periscopios ===== -->
  <path d="M57.8 38.4 L70.2 38.4 L69.8 63 L58.2 63 Z" fill="#000" opacity=".24" filter="url(#sb1f1)"/>
  <path class="metalS" d="M64 37.2 C60.6 38.3 59 40.4 58.6 43.2 L58.2 55.2 C58.6 58.9 60.3 61.1 64 61.9 C67.7 61.1 69.4 58.9 69.8 55.2 L69.4 43.2 C69 40.4 67.4 38.3 64 37.2 Z" stroke="#3d4232" stroke-width="1.1"/>
  <path d="M64 37.2 C60.6 38.3 59 40.4 58.6 43.2 L58.2 55.2 C58.6 58.9 60.3 61.1 64 61.9 C67.7 61.1 69.4 58.9 69.8 55.2 L69.4 43.2 C69 40.4 67.4 38.3 64 37.2 Z" fill="url(#sb1g3)"/>
  <path d="M59.4 40.6 C60 38.8 61.6 37.8 63.8 37.5" stroke="#fff" stroke-width=".9" opacity=".5" fill="none"/>
  <path d="M68.8 42 L69 55 C68.8 57.6 67.4 59.8 65.4 60.8" stroke="#000" stroke-width="1" opacity=".26" fill="none" filter="url(#sb1f1)"/>
  <!-- radomo delantero de la vela -->
  <ellipse class="metalL" cx="64" cy="41.6" rx="2.6" ry="2" opacity=".7"/>
  <!-- puente abierto -->
  <ellipse class="dark" cx="64" cy="46.6" rx="2.7" ry="3.4"/>
  <ellipse cx="64" cy="45.6" rx="1.7" ry="2.1" fill="#0d1116" opacity=".6"/>
  <!-- periscopios y mastros -->
  <circle class="metalL" cx="61.6" cy="40.4" r=".95"/><circle cx="61.6" cy="40.4" r=".4" fill="#2b2e28"/>
  <circle class="metal" cx="66.4" cy="40.4" r=".95"/><circle cx="66.4" cy="40.4" r=".4" fill="#2b2e28"/>
  <circle class="dark" cx="60.2" cy="42.8" r=".6"/><circle class="dark" cx="67.8" cy="42.8" r=".6"/>
  <!-- revestimiento de goma (anechoico) en flancos de vela -->
  <path class="rubber" d="M59 47.4 L59.3 55 C59.6 57.7 60.8 59.6 62.6 60.6 L62.8 59 C61.4 58.1 60.5 56.4 60.2 54.2 L60 47.4 Z" opacity=".55"/>
  <path class="rubber" d="M69 47.4 L68.7 55 C68.4 57.7 67.2 59.6 65.4 60.6 L65.2 59 C66.6 58.1 67.5 56.4 67.8 54.2 L68 47.4 Z" opacity=".55"/>

  <!-- ===== 12 caps VLS de Tomahawk delante de la vela (2 filas de 6) ===== -->
  <g class="dark">
    <circle cx="56.6" cy="27.2" r="1.35"/><circle cx="60.3" cy="27.9" r="1.35"/><circle cx="64" cy="28.2" r="1.35"/><circle cx="67.7" cy="27.9" r="1.35"/><circle cx="71.4" cy="27.2" r="1.35"/>
    <circle cx="56.6" cy="31.6" r="1.35"/><circle cx="60.3" cy="32.3" r="1.35"/><circle cx="64" cy="32.6" r="1.35"/><circle cx="67.7" cy="32.3" r="1.35"/><circle cx="71.4" cy="31.6" r="1.35"/>
    <circle cx="60.3" cy="24.4" r="1.35"/><circle cx="67.7" cy="24.4" r="1.35"/>
  </g>
  <g class="metalS">
    <circle cx="56.2" cy="26.8" r=".45"/><circle cx="63.6" cy="27.8" r=".45"/><circle cx="71" cy="26.8" r=".45"/>
    <circle cx="56.2" cy="31.2" r=".45"/><circle cx="63.6" cy="32.2" r=".45"/><circle cx="71" cy="31.2" r=".45"/>
  </g>
  <!-- cubierta trasera lisa con tronco de escape -->
  <circle class="metalS" cx="64" cy="72" r="1.1"/>
  <circle class="dark" cx="64" cy="72" r=".5"/>
  <path d="M53 62 C55 62.6 73 62.6 75 62" stroke="#000" stroke-width=".4" opacity=".2" fill="none"/>

  <!-- planes de inmersion en la torre -->
  <path class="metalS" d="M57.6 46.5 L52.2 47.5 L52 49.6 L57.4 49.3 Z" stroke="#3d4232" stroke-width=".7"/>
  <path class="metalS" d="M70.4 46.5 L75.8 47.5 L76 49.6 L70.6 49.3 Z" stroke="#3d4232" stroke-width=".7"/>

  <!-- ===== planes y timon de popa ===== -->
  <path class="metalS" d="M52 95 L43.6 97.2 L43.2 100.2 L51.6 101.4 Z" stroke="#3d4232" stroke-width=".8"/>
  <path class="metalS" d="M76 95 L84.4 97.2 L84.8 100.2 L76.4 101.4 Z" stroke="#3d4232" stroke-width=".8"/>
  <path d="M45 98.2 L50.8 98.6 M83 98.2 L77.2 98.6" stroke="#b8bfa2" stroke-width=".6" opacity=".5" fill="none"/>
  <!-- timon vertical (cuchilla a proa de la helice) -->
  <path class="dark" d="M63.1 98.5 L64.9 98.5 L65.2 107.5 L62.8 107.5 Z"/>

  <!-- helice de 7 palas (vista desde arriba) -->
  <circle class="dark" cx="64" cy="108" r="4.6"/>
  <circle cx="64" cy="108" r="4.6" fill="none" stroke="#3d4232" stroke-width=".7"/>
  <g class="metalS" opacity=".9">
    <path d="M64 108 L66.8 104.4 L67.4 105.2 Z"/><path d="M64 108 L69 107 L68.8 108 Z"/>
    <path d="M64 108 L66.8 111.6 L66.2 112.4 Z"/><path d="M64 108 L61.2 111.6 L60.6 110.8 Z"/>
    <path d="M64 108 L59 107 L59.2 109 Z"/><path d="M64 108 L61.2 104.4 L61.8 103.6 Z"/>
  </g>
  <circle class="metalL" cx="64" cy="108" r="1.2"/>
</svg>
