<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64">
  <!-- AIM-7M Sparrow (id del arma: aim7)
       aire-aire SARH · 45 km
       Silueta heredada de la familia "radar semiactivo": todavia NO es su arte propio.
       Sustituyelo cuando quieras: el motor solo exige que el archivo
       exista con este nombre, no depende de ninguna forma concreta.
       CONVENCION: morro hacia ARRIBA (norte); el render lo gira al rumbo. -->
  <!-- FAMILIA: aire-aire de RADAR SEMIACTIVO (AIM-7 Sparrow / R-23 Apex /
       R-27 Alamo). El rasgo que los identifica a simple vista son las ALAS
       DELTA GRANDES a media panza; son misiles largos y pesados.
       Morro hacia ARRIBA (norte). Dibujo base: mejóralo encima. -->
  <defs>
    <linearGradient id="sa-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="0.45" stop-color="#b8c2cc"/>
      <stop offset="1" stop-color="#6b7681"/>
    </linearGradient>
    <linearGradient id="sa-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ecff"/>
      <stop offset="0.5" stop-color="#7fbaff"/>
      <stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M13.5 50 L18.5 50 C19.6 56 18 60 16 63 C14 60 12.4 56 13.5 50 Z" fill="url(#sa-flame)"/>

  <!-- aletas de control traseras, pequeñas -->
  <path d="M13.6 43 L9.5 45.5 L9.5 49 L13.6 47.5 Z" fill="#5d6772"/>
  <path d="M18.4 43 L22.5 45.5 L22.5 49 L18.4 47.5 Z" fill="#5d6772"/>
  <!-- ALAS DELTA GRANDES a media panza: la seña de identidad -->
  <path d="M13.6 20 L3 33 L3 38 L13.6 34 Z" fill="#7d8894"/>
  <path d="M18.4 20 L29 33 L29 38 L18.4 34 Z" fill="#7d8894"/>

  <rect x="13.5" y="10" width="5" height="40" rx="1.1" fill="url(#sa-body)"/>
  <rect x="13.5" y="16" width="5" height="2.2" fill="#2f6fd0"/>
  <!-- radomo de radar: ojiva larga y opaca, sin cristal -->
  <path d="M13.5 10 C14.2 4.5 15 1.5 16 0 C17 1.5 17.8 4.5 18.5 10 Z" fill="#404a55"/>
</svg>
