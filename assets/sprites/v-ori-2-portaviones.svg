<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Almirante Kuznetsov (T2 oriental, portaviones). Gris ruso. Identidad: no tiene catapultas, sino una RAMPA DE ESQUI en la proa que levanta el ultimo tramo de la cubierta de vuelo; es el rasgo que lo separa de cualquier portaviones occidental del set. Isla alta con celosias y dos ascensores a estribor.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
