<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Mi-28N Night Hunter - vista superior, morro al norte. Cazador robusto y compacto
       con RADAR DE MASTIL N025 (domo sobre el cubo), rotor de 4 palas, canon bajo el
