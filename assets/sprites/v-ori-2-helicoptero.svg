  <path d="M64 32.6 C60.4 34.2 58.5 37 58.1 40.6 L57.5 45 L57.1 52 C57.3 57 57.9 61 58.7 64.6 L59.3 68 L59.9 74 C60.3 79 60.9 83 61.9 86.6 L62.5 92 L64 94.6 L65.5 92 L66.1 86.6 C67.1 83 67.7 79 68.1 74 L68.7 68 L69.3 64.6 C70.1 61 70.7 57 70.9 52 L70.5 45 L69.9 40.6 C69.5 37 67.6 34.2 64 32.6 Z" fill="url(#h28g1)"/>
