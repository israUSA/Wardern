<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- D-30 (T1 oriental, artilleria). Verde ruso. Camara y escala del set (20.9 px/m).
     Obus REMOLCADO de 122 mm, no autopropulsado: es la unica pieza del set sin
     casco. Identidad: las TRES colas abiertas en tripode a 120 grados con sus
     rejas de anclaje, el pivote central que le da giro de 360 grados, las ruedas
     levantadas del suelo y plegadas junto al tubo, el escudo bajo y el freno de
     boca multideflector. -->
<defs>
  <linearGradient id="g-part" x1="0.15" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#8b9a69"/><stop offset="0.5" stop-color="#6d7c50"/>
    <stop offset="1" stop-color="#4a5833"/>
  </linearGradient>
  <linearGradient id="g-shield" x1="0" y1="0" x2="0.9" y2="0.3">
    <stop offset="0" stop-color="#7c8b5d"/><stop offset="0.5" stop-color="#66744c"/>
    <stop offset="1" stop-color="#4a5833"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#a6b28a"/><stop offset="0.5" stop-color="#717d5a"/>
    <stop offset="1" stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-tyre" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#26261f"/>
    <stop offset="1" stop-color="#171712"/>
  </linearGradient>
</defs>
<!-- sombra bajo el tripode -->
<path d="M52 164 L110 116 L164 166 L118 176 Z" fill="#080a06" opacity="0.26"/>

<!-- tres colas en tripode -->
<g stroke="#54633c" stroke-width="6" stroke-linecap="round" fill="none">
  <path d="M109 140 L53.4 163.4"/>
  <path d="M109 140 L162.4 165.4"/>
  <path d="M109 140 L111.2 115.2"/>
</g>
<g stroke="#8b9a69" stroke-opacity="0.55" stroke-width="1.8" fill="none">
  <path d="M108 137.5 L53.4 160.6"/>
  <path d="M110 137.5 L162.4 162.6"/>
</g>
<!-- rejas de anclaje en las puntas -->
<g fill="#3f4c2e" stroke="#1f2716" stroke-width="0.9">
  <path d="M47 160 L59 165.5 L57 170 L45 164.5 Z"/>
  <path d="M157 162 L169 167.5 L167 172 L155 166.5 Z"/>
  <path d="M106 112 L118 112 L118 117 L106 117 Z"/>
</g>

<!-- pivote y plato de asiento -->
<ellipse cx="109" cy="148" rx="12" ry="6.6" fill="#3f4c2e"/>
<ellipse cx="109" cy="146" rx="12" ry="6.6" fill="#5f6f42" stroke="#222a17" stroke-width="1"/>

<!-- rueda lejana (izquierda), plegada junto al tubo -->
<ellipse cx="115.4" cy="112.1" rx="8" ry="9.5" fill="url(#g-tyre)" stroke="#141710" stroke-width="1.1"/>
<ellipse cx="115.4" cy="112.1" rx="3.4" ry="4.2" fill="#5a6247"/>

<!-- escudo bajo -->
<path d="M105.8 121.9 L126.4 142.1 L126.4 118.1 L105.8 97.9 Z" fill="url(#g-shield)" stroke="#333d22" stroke-width="1"/>
<path d="M105.8 97.9 L126.4 118.1" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.4"/>

<!-- cuna y cilindros de retroceso -->
<path d="M99.9 137.8 L107.5 145.2 L107.5 127.2 L99.9 119.8 Z" fill="#4a5833"/>
<path d="M107.5 145.2 L125.2 140.3 L125.2 122.3 L107.5 127.2 Z" fill="url(#g-part)"/>
<path d="M99.9 119.8 L117.6 114.9 L125.2 122.3 L107.5 127.2 Z" fill="#8b9a69"/>

<!-- tubo de 122 mm -->
<path d="M113.6 120.0 L194.0 97.8 L195.4 102.8 L115.0 125.0 Z" fill="url(#g-metal)"/>
<!-- freno de boca multideflector -->
<path d="M185.4 97.7 L193.4 95.5 L196.0 107.3 L188.0 109.5 Z" fill="#95a274" stroke="#3b4728" stroke-width="0.9"/>
<g stroke="#243019" stroke-width="1.3">
  <path d="M187.6 97.1 L190.2 108.9"/>
  <path d="M190.2 96.4 L192.8 108.2"/>
</g>
<ellipse cx="194.7" cy="100.3" rx="1.2" ry="2.7" fill="#12150e"/>
<path d="M113.6 120.0 L194.0 97.8 L194.3 99 L113.9 121.2 Z" fill="#ffffff" fill-opacity="0.35"/>

<!-- rueda cercana (derecha) -->
<ellipse cx="138.0" cy="134.1" rx="8" ry="9.5" fill="url(#g-tyre)" stroke="#141710" stroke-width="1.1"/>
<ellipse cx="138.0" cy="134.1" rx="3.4" ry="4.2" fill="#5a6247"/>
<ellipse cx="138.0" cy="134.1" rx="5.8" ry="7" fill="none" stroke="#4a5040" stroke-opacity="0.8" stroke-width="1"/>
</svg>
