<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- D-30 122mm remolcada - vista superior, canon hacia el norte. SIN chasis propio:
       PLATAFORMA CIRCULAR de tiro en el centro, TRES TIROLES (uno bajo el canon hacia
       el norte, dos a banda en V hacia el sur), escudo con dos hojas, canon con
       eyector y escudo protector de escotilla. Tinte por pais: .base/.shade/.light/.hi
       (escudo, tirantes). Fijos: .metal/.metalS/.metalL (canon), .dark (detalles). -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="d30f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="d30f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="d30gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="d30g1" gradientUnits="userSpaceOnUse" x1="44" y1="70" x2="84" y2="70">
    <stop offset="0" stop-color="#000" stop-opacity=".24"/><stop offset=".2" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity=".18"/><stop offset=".65" stop-color="#fff" stop-opacity=".03"/><stop offset=".85" stop-color="#000" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <linearGradient id="d30g2" gradientUnits="userSpaceOnUse" x1="60" y1="12" x2="68" y2="66">
    <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".36"/>
  </linearGradient>
  <radialGradient id="d30g3" cx=".4" cy=".34" r=".85">
    <stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </radialGradient>
  </defs>

  <ellipse cx="64" cy="66" rx="40" ry="52" fill="url(#d30gs)"/>

  <!-- ===== plataforma circular de tiro ===== -->
  <circle class="shade" cx="64" cy="70" r="21"/>
  <circle cx="64" cy="70" r="21" fill="url(#d30g1)" opacity=".7"/>
  <circle cx="64" cy="70" r="21" fill="none" stroke="#3d4232" stroke-width="1"/>
  <circle cx="64" cy="70" r="16.5" fill="none" stroke="#000" stroke-width=".5" opacity=".22"/>
  <circle cx="64" cy="70" r="12" fill="none" stroke="#000" stroke-width=".4" opacity=".18"/>
  <!-- eje central -->
  <circle class="metal" cx="64" cy="70" r="4.2"/>
  <circle cx="64" cy="70" r="4.2" fill="url(#d30g3)"/>
  <circle cx="64" cy="70" r="4.2" fill="none" stroke="#3d4232" stroke-width=".8"/>
  <circle class="metalL" cx="64" cy="70" r="1.6"/>
  <circle cx="62.8" cy="68.8" r=".9" fill="#fff" opacity=".35"/>

  <!-- ===== tirantes (trails) ===== -->
  <!-- tirante norte (bajo el canon) -->
  <path class="base" d="M61.6 52.5 L66.4 52.5 L65.6 49.5 L64 20 L62.4 49.5 Z" opacity="0"/>
  <path class="shade" d="M60.8 60 L64 56.5 L67.2 60 L66.4 92 L61.6 92 Z"/>
  <path d="M61.4 61.5 L61 90.5 M66.6 61.5 L67 90.5" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>
  <path d="M62.2 60.6 L62.2 90.6" stroke="#fff" stroke-width=".6" opacity=".3" fill="none"/>
  <!-- rueda del tirante norte -->
  <circle class="rubber" cx="64" cy="94" r="3.4"/>
  <circle class="metal" cx="64" cy="94" r="1.5"/>
  <!-- tirantes laterales en V -->
  <path class="base" d="M60 63 L46 74 L47.5 77 L61.5 68.5 Z"/>
  <path d="M60.5 63.6 L47 74.2" stroke="#fff" stroke-width=".7" opacity=".35" fill="none"/>
  <path d="M61 68 L48.5 76.4" stroke="#000" stroke-width=".6" opacity=".25" fill="none"/>
  <path class="base" d="M68 63 L82 74 L80.5 77 L66.5 68.5 Z"/>
  <path d="M67.5 63.6 L81 74.2" stroke="#fff" stroke-width=".5" opacity=".25" fill="none"/>
  <path d="M67 68 L79.5 76.4" stroke="#000" stroke-width=".6" opacity=".25" fill="none"/>
  <!-- ruedas de los tirantes laterales -->
  <circle class="rubber" cx="45.2" cy="76.4" r="3.4"/>
  <circle class="metal" cx="45.2" cy="76.4" r="1.5"/>
  <circle class="rubber" cx="82.8" cy="76.4" r="3.4"/>
  <circle class="metal" cx="82.8" cy="76.4" r="1.5"/>
  <!-- ganchos de remolque -->
  <circle class="metalL" cx="64" cy="95.5" r="1.2"/>

  <!-- ===== canon 122mm con eyector ===== -->
  <!-- sombra del canon sobre el escudo -->
  <path d="M58.5 46.5 L69.5 46.5 L68.5 51.5 L59.5 51.5 Z" fill="#000" opacity=".2" filter="url(#d30f1)"/>
  <!-- berceau -->
  <path class="shade" d="M59.6 44 L68.4 44 L67.6 49 L60.4 49 Z"/>
  <path d="M60 45 L67.8 45" stroke="#fff" stroke-width=".5" opacity=".3" fill="none"/>
  <!-- tubo -->
  <path class="metal" d="M62 8 L66 8 L65.8 30 L65.6 45 L62.4 45 L62.2 30 Z"/>
  <path d="M62 8 L66 8 L65.8 30 L65.6 45 L62.4 45 L62.2 30 Z" fill="url(#d30g2)"/>
  <path d="M62.5 9 L62.4 44" stroke="#fff" stroke-width=".6" opacity=".5" fill="none"/>
  <path d="M65.5 9 L65.6 44" stroke="#000" stroke-width=".55" opacity=".35" fill="none"/>
  <path class="hi" d="M62.6 9 L63.1 9 L63 44 L62.6 44 Z" opacity=".5"/>
  <!-- eyector de vaina a media ala -->
  <path class="metalS" d="M61.4 19 L66.6 19 L66.5 24.6 L61.5 24.6 Z"/>
  <path d="M61.8 20.4 L66.2 20.4 M61.8 23.2 L66.2 23.2" stroke="#000" stroke-width=".45" opacity=".4" fill="none"/>
  <!-- boca con punta -->
  <path class="metalL" d="M61.9 4.6 L66.1 4.6 L66 8.2 L62 8.2 Z"/>

  <!-- ===== escudo con dos hojas ===== -->
  <path class="base" d="M64 42.5 L72.5 45 L75.5 52 L73.5 62 L64 66.5 L54.5 62 L52.5 52 L55.5 45 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M64 42.5 L72.5 45 L75.5 52 L73.5 62 L64 66.5 L54.5 62 L52.5 52 L55.5 45 Z" fill="url(#d30g1)" opacity=".85"/>
  <path d="M64 43.2 L71.6 45.5" stroke="#fff" stroke-width=".9" opacity=".5" fill="none"/>
  <path d="M54 49 L53 54" stroke="#fff" stroke-width=".7" opacity=".35" fill="none"/>
  <path d="M74 49 L75 54" stroke="#000" stroke-width=".9" opacity=".25" fill="none" filter="url(#d30f1)"/>
  <!-- costura central del escudo -->
  <path d="M64 43 L64 66" stroke="#000" stroke-width=".7" opacity=".28" fill="none"/>
  <!-- ventanilla del escudo -->
  <rect class="dark" x="60.6" y="49.5" width="3" height="2" rx=".5" opacity=".85"/>
  <rect class="glass" x="60.9" y="49.8" width="2.4" height="1.4" rx=".4" opacity=".85"/>
</svg>
