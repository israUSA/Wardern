<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- BMP-3 (T3 oriental, motorizada). Verde ruso. Camara y escala del set.
     Casco 7.14 x 3.20 x 2.40 m.
     Identidad: DOS canones en el mismo mantelete, el 2A70 de 100 mm (tubo corto y
     grueso) y el 2A72 de 30 mm a su derecha (fino y mas largo); 6 ruedas pequenas
     y muy juntas con motriz delantera; motor en la POPA, por eso las rejillas
     estan atras y la tropa sale por encima. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#9aa878"/><stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/><stop offset="1" stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#6b7a4e"/><stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1" stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-turret" x1="0.2" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#8b9a69"/><stop offset="0.5" stop-color="#6d7c50"/>
    <stop offset="1" stop-color="#4e5c38"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#485636"/><stop offset="0.6" stop-color="#374327"/>
    <stop offset="1" stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#a6b28a"/><stop offset="0.5" stop-color="#717d5a"/>
    <stop offset="1" stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#26261f"/>
    <stop offset="1" stop-color="#171712"/>
  </linearGradient>
</defs>
<path d="M27 150 L166 111 L200 140 L59 180 Z" fill="#080a06" opacity="0.30"/>

<!-- popa: el motor va detras, rejillas en la popa -->
<path d="M29.9 116.2 L61.3 147.0 L61.3 174.0 L29.9 143.2 Z" fill="url(#g-rear)"/>
<path d="M33 124 L52 142.6 L52 162 L33 143.4 Z" fill="#2a331e"/>
<g stroke="#7e8d5e" stroke-opacity="0.7" stroke-width="1.1">
  <path d="M34 129 L51 145.6"/><path d="M34 134 L51 150.6"/><path d="M34 139 L51 155.6"/>
</g>
<circle cx="32" cy="120" r="2.2" fill="#8f5b30"/>

<path d="M29.9 116.2 L113.8 93.0 L145.2 123.8 L61.3 147.0 Z" fill="url(#g-deck)"/>
<path d="M113.8 93.0 L161.5 91.8 L192.9 122.6 L145.2 123.8 Z" fill="url(#g-deck)"/>
<path d="M113.8 93.0 L145.2 123.8" fill="none" stroke="#3b4728" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M113.8 93.0 L161.5 91.8 L192.9 122.6 L145.2 123.8 Z" fill="#ffffff" fill-opacity="0.08"/>
<ellipse cx="152" cy="105" rx="6" ry="4" fill="#6d7c50" stroke="#333d22" stroke-width="1"/>
<g fill="#3b4728">
  <path d="M165 96 L170 101 L167.4 102.2 L162.4 97.2 Z"/>
  <path d="M177 108 L182 113 L179.4 114.2 L174.4 109.2 Z"/>
</g>
<!-- escotillas de tropa sobre el techo -->
<g fill="#6d7c50" stroke="#333d22" stroke-width="0.9">
  <path d="M48 118 L64 113.6 L71.5 121 L55.5 125.4 Z"/>
  <path d="M58 128 L74 123.6 L81.5 131 L65.5 135.4 Z"/>
</g>

<path d="M61.3 147.0 L145.2 123.8 L192.9 122.6 L61.3 159.0 Z" fill="url(#g-flank)"/>
<path d="M61.3 147.0 L145.2 123.8" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>

<!-- tren de rodaje: ruedas pequenas y muy juntas -->
<path d="M60.1 176.0 L196.9 138.2 L196.9 123.2 L60.1 161.0 Z" fill="url(#g-trk)"/>
<g fill="#3d4433" stroke="#17190f" stroke-width="1">
  <ellipse cx="75.1"  cy="164.9" rx="4.8" ry="5.8"/>
  <ellipse cx="94.5"  cy="159.5" rx="4.8" ry="5.8"/>
  <ellipse cx="113.9" cy="154.2" rx="4.8" ry="5.8"/>
  <ellipse cx="133.3" cy="148.8" rx="4.8" ry="5.8"/>
  <ellipse cx="152.7" cy="143.4" rx="4.8" ry="5.8"/>
  <ellipse cx="172.2" cy="138.0" rx="4.8" ry="5.8"/>
</g>
<g fill="#5a6247">
  <ellipse cx="75.1"  cy="164.9" rx="1.8" ry="2.2"/>
  <ellipse cx="94.5"  cy="159.5" rx="1.8" ry="2.2"/>
  <ellipse cx="113.9" cy="154.2" rx="1.8" ry="2.2"/>
  <ellipse cx="133.3" cy="148.8" rx="1.8" ry="2.2"/>
  <ellipse cx="152.7" cy="143.4" rx="1.8" ry="2.2"/>
  <ellipse cx="172.2" cy="138.0" rx="1.8" ry="2.2"/>
</g>
<ellipse cx="191.6" cy="132.1" rx="6.4" ry="7.6" fill="#454c39" stroke="#17190f" stroke-width="1.1"/>
<ellipse cx="64.5"  cy="164.8" rx="6"   ry="7.2" fill="#454c39" stroke="#17190f" stroke-width="1.1"/>
<g fill="#454c39" stroke="#17190f" stroke-width="0.8">
  <ellipse cx="87.4"  cy="152.5" rx="2.3" ry="2.7"/>
  <ellipse cx="119.2" cy="143.7" rx="2.3" ry="2.7"/>
  <ellipse cx="151.0" cy="134.9" rx="2.3" ry="2.7"/>
</g>
<path d="M61 176.3 L197.5 138.6" fill="none" stroke="#080a06" stroke-opacity="0.55" stroke-width="3"/>

<!-- torreta baja y ancha -->
<path d="M125.1 109.6 C131.3 115.7 126.9 123.2 115.2 126.5
         C103.5 129.8 88.9 127.5 82.7 121.4
         C76.5 115.3 80.9 107.8 92.6 104.5
         C104.3 101.2 118.9 103.5 125.1 109.6 Z" fill="url(#g-flank)"/>
