<ellipse cx="109" cy="94" rx="5" ry="3.4" fill="#5f6f42" stroke="#333d22" stroke-width="0.9"/>
<!-- lanzagranadas fumigenas -->
<path d="M100 103 L112 99.5 L112 95.5 L100 99 Z" fill="#3f4c2e" stroke="#1f2716" stroke-width="0.7"/>

<!-- mantelete con los DOS canones -->
<path d="M115 101 L124 92.5 L133 97.5 L124 106 Z" fill="#6d7c50" stroke="#333d22" stroke-width="1"/>
<!-- 2A72 de 30 mm, a la derecha, fino y mas largo -->
<path d="M125.0 100.8 L184.5 84.3 L185.5 87.7 L126.0 104.2 Z" fill="url(#g-metal)"/>
<ellipse cx="185" cy="86" rx="0.9" ry="1.7" fill="#12150e"/>
<!-- 2A70 de 100 mm, corto y grueso -->
<path d="M122.2 91.2 L178.7 75.6 L180.9 83.4 L124.4 99.0 Z" fill="url(#g-metal)"/>
<path d="M148 84.1 L166 79.1 L167.6 84.9 L149.6 89.9 Z" fill="#95a274" stroke="#3b4728" stroke-width="0.8"/>
<ellipse cx="179.8" cy="79.5" rx="1.8" ry="3.9" fill="#12150e"/>
<path d="M122.2 91.2 L178.7 75.6 L179 76.9 L122.5 92.5 Z" fill="#ffffff" fill-opacity="0.32"/>
</svg>
