  </linearGradient>
  <linearGradient id="h1g2" gradientUnits="userSpaceOnUse" x1="64" y1="34" x2="64" y2="102">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".32" stop-color="#fff" stop-opacity=".05"/><stop offset=".58" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="h1g4" gradientUnits="userSpaceOnUse" x1="61" y1="40" x2="61" y2="54">
    <stop offset="0" stop-color="#e8f4fb" stop-opacity=".85"/><stop offset=".35" stop-color="#9cc4dc" stop-opacity=".4"/><stop offset=".75" stop-color="#28495e" stop-opacity=".6"/><stop offset="1" stop-color="#14293a" stop-opacity=".8"/>
