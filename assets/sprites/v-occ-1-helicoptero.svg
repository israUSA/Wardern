<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- AH-1F Cobra - vista superior, morro al norte. FUSELAJE ESTRECHO y redondeado,
       cabina tandem alargada con marco curvo, torreta de morro con minigun, alas cortas
       con pila de TOW y vaina de cohetes, UNA tobera a estribor, ROTOR DE 2 PALAS,
       pala de cola a estribor. Tinte por pais: .base/.shade/.light/.hi.
       Fijos: .metal/.metalS/.metalL (armas, bujes), .glass, .dark, .rubber. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="h1f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="h1f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="h1gs" cx=".5" cy=".5" r=".5">
