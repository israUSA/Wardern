<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- USS Oliver Hazard Perry (FFG-7) - vista superior, proa al norte. DISPOSICION UNICA:
       lanzador Mk13 de un brazo a proa, superestructura con mack (mastil-chimenea),
       hangar GRANDE a popa con el canon 76mm Mk75 ENCIMA del hangar, helipad a la
       mais popa. Tinte por pais: .base/.shade/.light/.hi.
       Fijos: .metal/.metalS/.metalL (canon, lanzador, radares), .glass, .dark, .rubber. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="fr2f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="fr2f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="fr2gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fr2g1" gradientUnits="userSpaceOnUse" x1="46" y1="62" x2="82" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".18" stop-color="#fff" stop-opacity=".18"/><stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="fr2g2" gradientUnits="userSpaceOnUse" x1="64" y1="13" x2="64" y2="110">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".35" stop-color="#fff" stop-opacity=".05"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="fr2g3" gradientUnits="userSpaceOnUse" x1="53" y1="62" x2="75" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".2" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".85" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <linearGradient id="fr2g4" gradientUnits="userSpaceOnUse" x1="58" y1="82" x2="70" y2="82">
    <stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  </defs>

  <ellipse cx="63" cy="61" rx="27" ry="55" fill="url(#fr2gs)"/>

  <!-- ===== casco ===== -->
  <path class="shade" d="M64 12.5 C58.2 16.3 52.8 23 50.2 32 L48.4 41 L47.8 95 L51 104 L55 108.8 L73 108.8 L77 104 L80.2 95 L79.6 41 L77.8 32 C75.2 23 69.8 16.3 64 12.5 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 12.5 C58.2 16.3 52.8 23 50.2 32 L48.4 41 L47.8 95 L51 104 L55 108.8 L73 108.8 L77 104 L80.2 95 L79.6 41 L77.8 32 C75.2 23 69.8 16.3 64 12.5 Z" fill="url(#fr2g1)"/>
  <!-- cubierta -->
  <path class="base" d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z"/>
  <path d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z" fill="url(#fr2g2)"/>
  <!-- rim light babor + sombra estribor -->
  <path d="M51.8 41 L51.4 94 L54.4 102.6" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M76.2 41 L76.6 94 L73.6 102.6" stroke="#000" stroke-width="1.5" opacity=".24" fill="none" filter="url(#fr2f1)"/>
  <path d="M64 16.5 L64 104" stroke="#b8bfa2" stroke-width=".8" opacity=".4" fill="none"/>
  <path class="light" d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L54.8 33.2 C57 25.4 60.8 19.8 65.4 16.5 Z" opacity=".7"/>
  <circle class="metalL" cx="55.6" cy="23" r="1.2"/><circle class="metalL" cx="72.4" cy="23" r="1.2"/>
  <path d="M54.2 20.8 L56.9 24.4 M71.6 24.4 L74.3 20.8" stroke="#4a5057" stroke-width=".8" fill="none"/>

  <!-- ===== lanzador Mk13 de un brazo a proa ===== -->
  <path d="M59.4 33.6 L68.6 33.6 L67.9 36.6 L60.1 36.6 Z" fill="#000" opacity=".22" filter="url(#fr2f1)"/>
  <circle class="metal" cx="64" cy="39" r="4.4"/>
  <circle cx="64" cy="39" r="4.4" fill="none" stroke="#3d4232" stroke-width=".7"/>
  <circle class="metalS" cx="64" cy="39" r="2.6"/>
  <path class="hi" d="M61.8 37.4 L66.2 37.4" stroke="#b8bfa2" stroke-width=".7" opacity=".7" fill="none"/>
  <!-- brazo con misil Standard apuntando a babor -->
  <path class="metalL" d="M60.2 38.6 L53.2 40.2 L53 41.8 L60 40.6 Z"/>
  <path class="dark" d="M53.6 39.2 L50 39.8 L50.2 42.4 L53.4 42 Z"/>
  <path d="M64 34.4 L64 43.8" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>
  <!-- cubierta de proa despejada (sin VLS) -->
  <path d="M56 45.5 L72 45.5" stroke="#000" stroke-width=".4" opacity=".18" fill="none"/>
  <circle class="metalS" cx="57.5" cy="48.5" r=".8"/><circle class="metalS" cx="70.5" cy="48.5" r=".8"/>

  <!-- ===== superestructura con mack ===== -->
  <path class="base" d="M55.6 52 L72.4 52 L74 56.6 L74.4 66 L72.8 70.6 L55.2 70.6 L53.6 66 L54 56.6 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M55.6 52 L72.4 52 L74 56.6 L74.4 66 L72.8 70.6 L55.2 70.6 L53.6 66 L54 56.6 Z" fill="url(#fr2g3)"/>
  <path d="M56 52.3 L72 52.3" stroke="#fff" stroke-width="1" opacity=".45" fill="none"/>
  <path d="M54.4 54.4 L54.2 65.4 L55.4 70.2" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <path d="M73.6 54.4 L73.8 65.4 L72.6 70.2" stroke="#000" stroke-width="1.3" opacity=".26" fill="none" filter="url(#fr2f1)"/>
  <path d="M53.4 70.4 L74.6 70.4 L74.4 73.6 L53.6 73.6 Z" fill="#000" opacity=".22" filter="url(#fr2f1)"/>
  <!-- ventanas del puente -->
  <path class="glass" d="M58.6 53 L62.8 53 L62.2 55.6 L58 55.6 Z M69.4 53 L65.2 53 L65.8 55.6 L70 55.6 Z"/>
  <path class="glassL" d="M59.4 53.5 L61 53.5 L60.6 54.7 L59.1 54.7 Z" opacity=".8"/>
  <!-- mack: mastil-chimenea unico -->
  <path class="shade" d="M61.2 57 L66.8 57 L68 73.5 L60 73.5 Z"/>
  <path class="light" d="M61.2 57 L62.6 57 L61.7 73.5 L60 73.5 Z" opacity=".6"/>
  <path class="dark" d="M66.8 57 L65.9 57 L66.9 73.5 L68 73.5 Z" opacity=".55"/>
  <path class="dark" d="M62.2 58.6 L65.8 58.6 L66 64 L62 64 Z" opacity=".92"/>
  <path d="M62.4 59.2 L65.6 59.2 M62.3 61.4 L65.7 61.4 M62.3 63 L65.7 63" stroke="#9aa378" stroke-width=".5" opacity=".5" fill="none"/>
  <!-- radar de busqueda giratorio arriba del mack -->
  <circle class="metalS" cx="64" cy="66.8" r="2.3"/>
  <path d="M64 66.8 L66.8 65.2 M64 66.8 L63 69.4" stroke="#3d4232" stroke-width=".7" fill="none"/>
  <path d="M64 66.8 L66 68.9" stroke="#b8bfa2" stroke-width=".8" fill="none"/>
  <!-- antenas de verga -->
  <path d="M56.6 60.6 L58 60.6 M71.4 60.6 L70 60.6" stroke="#3d4232" stroke-width="1" fill="none"/>
  <path d="M56.3 58 L56.3 63.2 M71.7 58 L71.7 63.2" stroke="#3d4232" stroke-width=".7" fill="none"/>
  <!-- botes a banda -->
  <rect class="light" x="51.9" y="74.5" width="2.1" height="4" rx=".8"/>
  <rect class="light" x="74" y="74.5" width="2.1" height="4" rx=".8"/>

  <!-- ===== hangar grande a popa ===== -->
  <path d="M55.5 77.5 L72.5 77.5 L72.5 92 L55.5 92 Z" fill="#000" opacity=".2" filter="url(#fr2f2)"/>
  <path class="base" d="M56 78 L72 78 L72 91.5 L56 91.5 Z" stroke="#3d4232" stroke-width="1.1"/>
  <path d="M56 78 L72 78 L72 91.5 L56 91.5 Z" fill="url(#fr2g3)" opacity=".55"/>
  <path d="M56.2 78.3 L71.8 78.3" stroke="#fff" stroke-width=".8" opacity=".4" fill="none"/>
  <path d="M71.8 78.6 L71.8 91.2" stroke="#000" stroke-width="1.1" opacity=".24" fill="none" filter="url(#fr2f1)"/>
  <path d="M58.5 78.6 L58.5 91 M69.5 78.6 L69.5 91" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>

  <!-- ===== canon 76mm Mk75 ENCIMA del hangar ===== -->
  <path d="M59.6 82.2 L68.4 82.2 L67.8 84.8 L60.2 84.8 Z" fill="#000" opacity=".22" filter="url(#fr2f1)"/>
  <circle class="metal" cx="64" cy="87" r="3.9"/>
  <circle cx="64" cy="87" r="3.9" fill="none" stroke="#3d4232" stroke-width=".7"/>
  <circle class="metalS" cx="64" cy="87" r="2.2"/>
  <path class="hi" d="M62.2 85.7 L65.8 85.7" stroke="#b8bfa2" stroke-width=".7" opacity=".7" fill="none"/>
  <path class="metal" d="M63.2 78.9 L64.8 78.9 L64.7 83.4 L63.3 83.4 Z"/>
  <path class="hi" d="M63.5 79.3 L63.9 79.3 L63.8 83 L63.5 83 Z" opacity=".6"/>
  <path class="metalL" d="M62.9 77.7 L65.1 77.7 L65 79.1 L63 79.1 Z"/>

  <!-- ===== helipad a mas popa ===== -->
  <path d="M56.2 91.5 L71.8 91.5 L71.6 93.5 L56.4 93.5 Z" fill="#000" opacity=".2" filter="url(#fr2f1)"/>
  <path d="M64 93.6 L64 105" stroke="#b8bfa2" stroke-width=".7" opacity=".45" fill="none"/>
  <ellipse class="dark" cx="64" cy="100.8" rx="6.4" ry="4.4"/>
  <ellipse cx="64" cy="100.8" rx="6.4" ry="4.4" fill="none" stroke="#b8bfa2" stroke-width=".9" opacity=".85"/>
  <path d="M62.8 100.8 L65.2 100.8 M64 99.4 L64 102.2" stroke="#b8bfa2" stroke-width=".8" opacity=".85" fill="none"/>
  <path d="M56.6 98.6 L60.4 98.6 M67.6 98.6 L71.4 98.6 M56.6 103 L60.4 103 M67.6 103 L71.4 103" stroke="#b8bfa2" stroke-width=".6" opacity=".5" fill="none"/>
  <circle class="metalL" cx="53.6" cy="104.6" r=".7"/><circle class="metalL" cx="74.4" cy="104.6" r=".7"/>
  <!-- bote de maniobras a estribor -->
  <path class="light" d="M78.6 58 C80.4 59.3 80.4 62.2 78.6 63.5 C77.9 62.2 77.9 59.3 78.6 58 Z"/>
</svg>
