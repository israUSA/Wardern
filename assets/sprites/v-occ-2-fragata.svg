<!-- USS Oliver Hazard Perry (T2 occidental, fragata). Gris OTAN. Identidad: el lanzador MONOBRAZO Mk13 solo en el extremo de proa, muy adelantado y por delante de todo lo demas, con el canon de 76 mm retrasado encima del macaron en vez de en la proa; CIWS Phalanx sobre el hangar y doble plataforma de helicoptero a popa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
