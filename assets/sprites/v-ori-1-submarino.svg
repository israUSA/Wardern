<!-- Kilo, Proyecto 877 (T1 oriental, submarino). Casco negro. Submarino diesel-electrico costero: el mas CORTO y rechoncho del set, con la relacion eslora-manga mas baja. Identidad: vela ancha con los timones de profundidad montados en ella y casco en forma de gota muy marcada.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
