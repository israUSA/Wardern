<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64">
  <!-- KAB-500S (id del arma: kab)
       bomba GPS · 20 km
       Silueta heredada de la familia "bomba guiada": todavia NO es su arte propio.
       Sustituyelo cuando quieras: el motor solo exige que el archivo
       exista con este nombre, no depende de ninguna forma concreta.
       CONVENCION: morro hacia ARRIBA (norte); el render lo gira al rumbo. -->
  <!-- FAMILIA: BOMBA GUIADA (GBU-31 JDAM / KAB-500S). La silueta más distinta
       de todas: NO tiene motor (sin llama), cuerpo de bomba en gota, cola con
       kit de guiado cuadrado y estabilizadores laterales largos. Cae, no vuela.
       Morro hacia ARRIBA (norte). Dibujo base: mejóralo encima. -->
  <defs>
    <linearGradient id="bg-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6db"/>
      <stop offset="0.45" stop-color="#8b949c"/>
      <stop offset="1" stop-color="#4a5257"/>
    </linearGradient>
  </defs>

  <!-- estabilizadores laterales largos (las "strakes" del kit JDAM) -->
  <rect x="10.8" y="20" width="1.8" height="24" rx="0.7" fill="#6c757c"/>
  <rect x="19.4" y="20" width="1.8" height="24" rx="0.7" fill="#6c757c"/>

  <!-- cola: caja de guiado con aletas rectas, no en punta -->
  <path d="M11.5 44 L20.5 44 L20.5 56 L11.5 56 Z" fill="#4a5257"/>
  <path d="M11.5 46 L5.5 50 L5.5 55 L11.5 53 Z" fill="#5b646b"/>
  <path d="M20.5 46 L26.5 50 L26.5 55 L20.5 53 Z" fill="#5b646b"/>
  <rect x="12.6" y="46.5" width="6.8" height="7" rx="0.8" fill="#39424a"/>
  <circle cx="16" cy="50" r="1.4" fill="#7fd08a" opacity="0.8"/>

  <!-- cuerpo de bomba en gota: ancho arriba, se estrecha hacia la cola -->
  <path d="M16 2 C19.2 6 21 12 21 20 L21 44 L11 44 L11 20 C11 12 12.8 6 16 2 Z" fill="url(#bg-body)"/>
  <rect x="11" y="24" width="10" height="2.6" fill="#c9a22f"/>
  <rect x="11" y="29" width="10" height="1.4" fill="#c9432f"/>
  <path d="M12.6 8 C13.6 6 14.8 4.2 16 3 L16 20 L12.6 20 Z" fill="#ffffff" opacity="0.28"/>
</svg>
