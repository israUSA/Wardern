<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64">
  <!-- Cohete de artillería (salva MLRS: HIMARS occidental / Smerch oriental).
       Más flaco que un misil de crucero y con muchísima más llama: es un cohete
       no guiado disparado en salva. Morro hacia ARRIBA (norte). -->
  <defs>
    <linearGradient id="mc-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9a76"/>
      <stop offset="0.45" stop-color="#6b7457"/>
      <stop offset="1" stop-color="#414936"/>
    </linearGradient>
    <linearGradient id="mc-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffd166"/>
      <stop offset="0.75" stop-color="#f2682a"/>
      <stop offset="1" stop-color="#a8280d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- llama larga de propulsante sólido -->
  <path d="M13.6 44 L18.4 44 C20 52 18.4 59 16 64 C13.6 59 12 52 13.6 44 Z" fill="url(#mc-flame)"/>

  <!-- aletas estabilizadoras -->
  <path d="M13.4 38 L7 42 L7 46 L13.4 43 Z" fill="#333a29"/>
  <path d="M18.6 38 L25 42 L25 46 L18.6 43 Z" fill="#333a29"/>

  <!-- tubo -->
  <rect x="13.3" y="10" width="5.4" height="34" rx="0.8" fill="url(#mc-body)"/>
  <!-- ojiva -->
  <path d="M13.3 10 C14.2 4.5 15 1.5 16 0 C17 1.5 17.8 4.5 18.7 10 Z" fill="#2f3527"/>
  <rect x="14.1" y="11" width="1" height="32" rx="0.5" fill="#ffffff" opacity="0.28"/>
</svg>
