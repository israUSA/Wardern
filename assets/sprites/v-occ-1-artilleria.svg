  <path class="shade" d="M59.4 40.4 L68.6 40.4 L67.6 45.4 L60.4 45.4 Z"/>
  <path d="M59.9 41.4 L68.1 41.4 M59.7 43.4 L68.3 43.4" stroke="#000" stroke-width=".5" opacity=".4" fill="none"/>
