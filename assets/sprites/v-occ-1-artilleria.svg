  <path d="M62 14.4 L66 14.4 M62 17.6 L66 17.6" stroke="#000" stroke-width=".45" opacity=".4" fill="none"/>
  <path d="M63 10 L63 12.4 M65 10 L65 12.4 M63 19.6 L63 30.9 M65 19.6 L65 30.9 M63 38 L63 43 L65 43 L65 38" stroke="#000" stroke-width=".55" opacity=".45" fill="none"/>

