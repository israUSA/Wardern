  <path d="M60.8 6 L67.2 6 M60.8 8.8 L67.2 8.8" stroke="#000" stroke-width=".5" opacity=".5" fill="none"/>
  <!-- tubo corto L/39 -->
  <path class="metal" d="M62.7 9.4 L65.3 9.4 L65.1 32 L64.9 44 L63.1 44 L62.9 32 Z"/>
  <path d="M62.7 9.4 L65.3 9.4 L65.1 32 L64.9 44 L63.1 44 L62.9 32 Z" fill="url(#a1g4)"/>
  <path d="M63.2 10 L63.1 42" stroke="#fff" stroke-width=".6" opacity=".5" fill="none"/>
  <path d="M64.9 10 L65 42" stroke="#000" stroke-width=".6" opacity=".35" fill="none"/>
  <path class="hi" d="M63.2 10 L63.8 10 L63.7 42 L63.2 42 Z" opacity=".55"/>
