  <path class="rubber" d="M31.5 24 C31.5 18.5 35 16 39 16 C43 16 46.5 18.5 46.5 24 L46.5 104 C46.5 109.5 43 112 39 112 C35 112 31.5 109.5 31.5 104 Z"/>
  <path class="rubber" d="M81.5 24 C81.5 18.5 85 16 89 16 C93 16 96.5 18.5 96.5 24 L96.5 104 C96.5 109.5 93 112 89 112 C85 112 81.5 109.5 81.5 104 Z"/>
  <path d="M33 18 L33 110 M37.4 16.4 L37.4 111.6 M40.6 16.4 L40.6 111.6 M45 18 L45 110" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".9" fill="none"/>
  <path d="M83 18 L83 110 M87.4 16.4 L87.4 111.6 M90.6 16.4 L90.6 111.6 M95 18 L95 110" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".9" fill="none"/>
  <path d="M39 17.5 L39 112.5" stroke="#000" stroke-width="1.4" stroke-dasharray="2.6 1.8" opacity=".55" fill="none"/>
  <path d="M89 17.5 L89 112.5" stroke="#000" stroke-width="1.4" stroke-dasharray="2.6 1.8" opacity=".55" fill="none"/>
  <path d="M37 20 L37 108 M91 20 L91 108" stroke="#8a929b" stroke-width=".7" stroke-dasharray="1.6 3.4" opacity=".7" fill="none"/>
  <circle class="metalL" cx="39" cy="21" r="5.4"/><circle class="metal" cx="39" cy="21" r="3"/>
  <circle class="metalL" cx="89" cy="21" r="5.4"/><circle class="metal" cx="89" cy="21" r="3"/>
  <circle class="metalL" cx="39" cy="107" r="5.4"/><circle class="metal" cx="39" cy="107" r="3"/>
  <circle class="metalL" cx="89" cy="107" r="5.4"/><circle class="metal" cx="89" cy="107" r="3"/>

