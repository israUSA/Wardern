  <path d="M64 25 L83.4 33 L44.6 33 Z" fill="#fff" opacity=".12"/>
  <path d="M64 25 L44.6 33" stroke="#fff" stroke-width="1.1" opacity=".5" fill="none"/>
  <path d="M43.4 44 L43 97 L48 108.6" stroke="#fff" stroke-width="1" opacity=".35" fill="none"/>
  <path d="M84.6 33.4 L86 45 L86 97 L80.6 108.6" stroke="#000" stroke-width="2" opacity=".28" fill="none" filter="url(#a1f1)"/>
  <path d="M64 25 L83.4 32.6" stroke="#000" stroke-width="1.2" opacity=".18" fill="none" filter="url(#a1f1)"/>
  <path class="light" d="M64 24 L84.5 33 L83.6 34.6 L64 26.6 L44.4 34.6 L43.5 33 Z" opacity=".85"/>
