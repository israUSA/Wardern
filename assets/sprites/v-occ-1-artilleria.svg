  <path class="shade" d="M28 22 L33 20 L33 110 L28 106 Z"/>
  <path class="shade" d="M100 22 L95 20 L95 110 L100 106 Z"/>
  <path d="M30.5 23 L32 22 M30.5 33 L32 33 M30.5 43 L32 43 M30.5 53 L32 53 M30.5 63 L32 63 M30.5 73 L32 73 M30.5 83 L32 83 M30.5 93 L32 93 M30.5 102 L32 103" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>
  <path d="M97.5 23 L96 22 M97.5 33 L96 33 M97.5 43 L96 43 M97.5 53 L96 53 M97.5 63 L96 63 M97.5 73 L96 73 M97.5 83 L96 83 M97.5 93 L96 93 M97.5 102 L96 103" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>
