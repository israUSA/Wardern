  <path d="M73.6 48.6 L73.6 46" stroke="#2b2e28" stroke-width="1.1" fill="none"/>
  <circle class="glass" cx="70.8" cy="49.8" r=".8"/>
  <!-- lanzagranadas de humo -->
  <g class="dark">
    <circle cx="50.2" cy="48.4" r=".9"/><circle cx="52.4" cy="47" r=".9"/><circle cx="50.4" cy="50.8" r=".9"/><circle cx="52.6" cy="49.4" r=".9"/>
    <circle cx="77.8" cy="48.4" r=".9"/><circle cx="75.6" cy="47" r=".9"/><circle cx="77.6" cy="50.8" r=".9"/><circle cx="75.4" cy="49.4" r=".9"/>
  </g>
  <!-- panza de recarga trasera con estanteria -->
  <path class="shade" d="M54 84.5 C53.5 87 54.5 88.5 56.5 89 C57.5 91 59.5 91.6 61.5 91 C63.5 92.2 66.5 92.2 68.5 91 C70.5 91.6 72.5 91 73.5 89 C75.5 88.5 76.5 87 76 84.5 Z"/>
  <path d="M57 85 C56.7 86.5 57.1 87.9 58.1 88.7 M62.5 85.5 C62.3 87.5 62.7 89.3 63.5 90.5 M68.5 85.5 C68.7 87.5 68.3 89.3 67.5 90.5" stroke="#000" stroke-width=".6" opacity=".3" fill="none"/>
  <path class="dark" d="M59 87 C60.1 85.9 61.9 86.1 62.5 87.3 C63.1 88.5 61.7 89.7 60.3 89.3 C58.9 88.9 58.4 87.9 59 87 Z" opacity=".8"/>
  <path class="dark" d="M67 87.5 C68.1 86.5 69.9 86.9 70.3 88.1 C70.7 89.3 69.1 90.1 67.9 89.5 C66.7 88.9 66.4 88.1 67 87.5 Z" opacity=".8"/>
  <!-- riel de proyectiles abierto a babor -->
  <rect class="metalS" x="49.4" y="59" width="3" height="11" rx=".6"/>
  <path d="M49.9 61 L52 61 M49.9 64 L52 64 M49.9 67 L52 67" stroke="#4a5057" stroke-width=".5" opacity=".8" fill="none"/>
