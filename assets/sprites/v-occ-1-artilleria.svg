<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- M109A2 (T1 occidental, artilleria). Arena. Camara y escala del set (20.9 px/m).
     Casco 6.19 x 3.15 m, 3.28 m al techo de torreta; 9.10 m con el obus al frente.
     Identidad: 7 ruedas de rodadura SIN rodillos de retorno y motriz delantera,
     torreta cajon ENORME que ocupa casi todo el casco, obus M185 de 155 mm con
     extractor de humos y FRENO DE BOCA de doble deflector (la marca que lo separa
     de un carro), y la reja-pala de anclaje en la popa del casco. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#e2d6b2"/><stop offset="0.34" stop-color="#c8b78d"/>
    <stop offset="0.68" stop-color="#ad9c75"/><stop offset="1" stop-color="#91815f"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#aea172"/><stop offset="0.45" stop-color="#978861"/>
    <stop offset="1" stop-color="#78694a"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#6f6247"/><stop offset="0.6" stop-color="#584d38"/>
    <stop offset="1" stop-color="#453c2c"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#d4c9a8"/><stop offset="0.5" stop-color="#9e9376"/>
    <stop offset="1" stop-color="#675e47"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#403d34"/><stop offset="0.5" stop-color="#2c2a22"/>
    <stop offset="1" stop-color="#1b1a15"/>
  </linearGradient>
</defs>
<path d="M35 145 L158 112 L190 145 L66 180 Z" fill="#0d0b06" opacity="0.30"/>

<!-- popa con la pala de anclaje -->
<path d="M38.9 111.0 L69.9 141.3 L69.9 157.3 L38.9 127.0 Z" fill="url(#g-rear)"/>
<path d="M42 122 L66 145.4 L66 155 L42 131.6 Z" fill="#5c5340" stroke="#2f2a1e" stroke-width="1"/>
<g stroke="#8d7f5e" stroke-opacity="0.7" stroke-width="1.1">
  <path d="M46 124.5 L64 142"/><path d="M44 129 L62 146.5"/>
</g>
<circle cx="41" cy="115" r="2.4" fill="#8f5b30"/>

<!-- cubierta y glacis -->
<path d="M38.9 111.0 L122.8 87.8 L153.8 118.1 L69.9 141.3 Z" fill="url(#g-deck)"/>
<path d="M122.8 87.8 L152.8 95.5 L183.8 125.8 L153.8 118.1 Z" fill="url(#g-deck)"/>
<path d="M122.8 87.8 L153.8 118.1" fill="none" stroke="#6d6046" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M122.8 87.8 L152.8 95.5 L183.8 125.8 L153.8 118.1 Z" fill="#ffffff" fill-opacity="0.07"/>
<ellipse cx="147" cy="104" rx="6.5" ry="4.3" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>
<g fill="#5c5340">
  <path d="M158 99 L163.5 104.4 L160.5 105.7 L155 100.3 Z"/>
  <path d="M170 111 L175.5 116.4 L172.5 117.7 L167 112.3 Z"/>
</g>

<!-- flanco -->
<path d="M69.9 141.3 L153.8 118.1 L183.8 125.8 L69.9 157.3 Z" fill="url(#g-flank)"/>
<path d="M69.9 141.3 L153.8 118.1" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>

<!-- tren de rodaje: 7 ruedas, sin rodillos, motriz delantera -->
<path d="M68.6 176.4 L187.9 143.5 L187.9 126.5 L68.6 159.4 Z" fill="url(#g-trk)"/>
<g fill="#46423a" stroke="#1b1a15" stroke-width="1.1">
  <ellipse cx="80.1"  cy="165.3" rx="5.6" ry="6.6"/>
  <ellipse cx="97.8"  cy="160.4" rx="5.6" ry="6.6"/>
  <ellipse cx="115.5" cy="155.5" rx="5.6" ry="6.6"/>
  <ellipse cx="133.1" cy="150.6" rx="5.6" ry="6.6"/>
  <ellipse cx="150.8" cy="145.7" rx="5.6" ry="6.6"/>
  <ellipse cx="166.7" cy="141.3" rx="5.6" ry="6.6"/>
  <ellipse cx="180.8" cy="137.5" rx="5.6" ry="6.6"/>
</g>
<g fill="#6d6455">
  <ellipse cx="80.1"  cy="165.3" rx="2" ry="2.4"/>
  <ellipse cx="97.8"  cy="160.4" rx="2" ry="2.4"/>
  <ellipse cx="115.5" cy="155.5" rx="2" ry="2.4"/>
  <ellipse cx="133.1" cy="150.6" rx="2" ry="2.4"/>
  <ellipse cx="150.8" cy="145.7" rx="2" ry="2.4"/>
  <ellipse cx="166.7" cy="141.3" rx="2" ry="2.4"/>
  <ellipse cx="180.8" cy="137.5" rx="2" ry="2.4"/>
</g>
<ellipse cx="184.3" cy="132.5" rx="7.2" ry="8.4" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<ellipse cx="73.1"  cy="163.2" rx="6.6" ry="7.8" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<path d="M69.5 176.7 L188.5 143.9" fill="none" stroke="#0d0b06" stroke-opacity="0.55" stroke-width="3"/>

<!-- torreta cajon enorme -->
<path d="M47.9 110.8 L76.0 138.4 L76.0 102.4 L47.9 74.8 Z" fill="url(#g-rear)"/>
<path d="M76.0 138.4 L146.6 118.9 L146.6 82.9 L76.0 102.4 Z" fill="url(#g-flank)"/>
<path d="M47.9 74.8 L118.5 55.3 L146.6 82.9 L76.0 102.4 Z" fill="url(#g-deck)"/>
<path d="M47.9 74.8 L118.5 55.3" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4"/>
<!-- puerta y cajones de estiba del flanco -->
<g stroke="#6d6046" stroke-opacity="0.6" stroke-width="1.2">
  <path d="M99 131.9 L99 95.9"/><path d="M123 125.3 L123 89.3"/>
</g>
<path d="M84 128 L96 124.7 L96 110.7 L84 114 Z" fill="#8d7f5e" stroke="#5a5039" stroke-width="0.9"/>
<!-- cupula del jefe con la .50 -->
<path d="M84 96 L84 88 A8 5.4 0 0 1 100 88 L100 96 Z" fill="#8a7c5b"/>
<ellipse cx="92" cy="88" rx="8" ry="5.4" fill="#b0a179" stroke="#574d38" stroke-width="1"/>
<path d="M86 86 L98 86" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
<path d="M94 85 L98 83.5 L116 77 L117 79.3 L99 85.8 L95.5 87.3 Z" fill="url(#g-metal)"/>
<!-- escotilla del cargador -->
<ellipse cx="108" cy="74" rx="7" ry="4.6" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>

<!-- obus M185 de 155 mm -->
<path d="M126 90 L136 82 L145 88 L135 96 Z" fill="#9c8d68" stroke="#5a5039" stroke-width="1"/>
<path d="M131.5 82.6 L221.6 57.7 L223.6 64.7 L133.5 89.6 Z" fill="url(#g-metal)"/>
<!-- extractor de humos -->
<path d="M174.3 68.6 L186.9 65.1 L190.0 76.3 L177.4 79.8 Z" fill="#bcac82" stroke="#6d6046" stroke-width="0.8"/>
<!-- freno de boca de doble deflector -->
<path d="M213.3 56.9 L221.8 54.6 L225.2 67.2 L216.7 69.5 Z" fill="#b0a179" stroke="#5a5039" stroke-width="0.9"/>
<g stroke="#4a412f" stroke-width="1.4">
  <path d="M216.2 56.2 L219.2 67.4"/><path d="M219.8 55.2 L222.8 66.4"/>
</g>
<ellipse cx="222.6" cy="61.2" rx="1.4" ry="3.4" fill="#181510"/>
<path d="M131.5 82.6 L221.6 57.7 L221.9 59 L131.8 83.9 Z" fill="#ffffff" fill-opacity="0.35"/>
</svg>
