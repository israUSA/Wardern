  <rect class="shade" x="45.5" y="40" width="6" height="5" rx="1"/>
  <rect class="shade" x="76.5" y="40" width="6" height="5" rx="1"/>
  <rect class="hi" x="46.4" y="41.1" width="2.4" height="2.8" rx=".6"/>
  <rect class="hi" x="77.4" y="41.1" width="2.4" height="2.8" rx=".6"/>
