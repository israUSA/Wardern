  <circle class="dark" cx="49.5" cy="81" r="1"/><circle class="dark" cx="78.5" cy="81" r="1"/>
  <!-- eslabones de repuesto en el glacis -->
  <path class="shade" d="M45 33.5 L48.5 32.5 L49 36.5 L45.5 37.5 Z" opacity=".9"/>
  <path class="shade" d="M83 33.5 L79.5 32.5 L79 36.5 L82.5 37.5 Z" opacity=".9"/>
