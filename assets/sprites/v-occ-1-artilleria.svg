  <circle class="metal" cx="55" cy="55" r="4.4"/>
  <circle cx="55" cy="55" r="4.4" fill="url(#a1g5)"/>
  <circle cx="55" cy="55" r="4.4" fill="none" stroke="#3d4232" stroke-width="1"/>
  <circle class="shade" cx="55" cy="55" r="1.8"/>
  <circle cx="53.9" cy="53.9" r=".7" fill="#fff" opacity=".5"/>
  <path d="M51.2 51.7 L52.9 50.1 M58.8 51.7 L57.1 50.1" stroke="#8a929b" stroke-width="1.1" fill="none"/>
  <circle class="metal" cx="73" cy="55" r="4.4"/>
  <circle cx="73" cy="55" r="4.4" fill="url(#a1g5)"/>
  <circle cx="73" cy="55" r="4.4" fill="none" stroke="#3d4232" stroke-width="1"/>
  <circle class="shade" cx="73" cy="55" r="1.8"/>
  <circle cx="71.9" cy="53.9" r=".7" fill="#fff" opacity=".5"/>
  <path d="M69.2 51.7 L70.9 50.1 M76.8 51.7 L75.1 50.1" stroke="#8a929b" stroke-width="1.1" fill="none"/>
