  <path d="M57.6 39.6 L70.4 39.6 L70 43 L58 43 Z" fill="#000" opacity=".22" filter="url(#a1f1)"/>
  <!-- oclusion del collar sobre la torreta -->
  <path d="M60.6 45.2 L67.4 45.2 L67 48 L61 48 Z" fill="#000" opacity=".2" filter="url(#a1f1)"/>
  <!-- M2 en la cupola del jefe -->
