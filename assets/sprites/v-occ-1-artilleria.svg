  <path d="M64 38 L73.5 43.5 L78.5 54 L79.5 70 L74 84.5 L54 84.5 L48.5 70 L49.5 54 L54.5 43.5 Z" fill="url(#a1g3)"/>
  <path d="M64 38 L73.5 43.5 L78.5 54 L79.5 70 L74 84.5 L54 84.5 L48.5 70 L49.5 54 L54.5 43.5 Z" fill="#fff" opacity=".07"/>
  <path d="M64 38.6 L55 44.6" stroke="#fff" stroke-width="1.1" opacity=".55" fill="none"/>
  <path d="M50 55.6 L49.6 69.4" stroke="#fff" stroke-width=".9" opacity=".4" fill="none"/>
  <path d="M73.5 43.5 L78.5 54 L79.5 70 L74 84.5" stroke="#000" stroke-width="2" opacity=".3" fill="none" filter="url(#a1f1)"/>
  <path class="light" d="M64 38 L73.5 43.5 L72 45 L64 40.6 L56 45 L54.5 43.5 Z" opacity=".8"/>
  <path d="M73.5 43.5 L78.5 54 L79.5 70 L74 84.5" stroke="#000" stroke-width="1" opacity=".22" fill="none"/>
  <path class="dark" d="M74 84.5 L79.5 70 L78.5 54 L75.3 55.8 L76.1 69 L72.4 81 Z" opacity=".35"/>
