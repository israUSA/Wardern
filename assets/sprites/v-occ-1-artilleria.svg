  <path d="M64 24 L84.5 33 L86 45 L86.5 98 L80 110 L48 110 L41.5 98 L42 45 L43.5 33 Z" fill="url(#a1g2)"/>
  <path d="M64 24 L84.5 33 L86 45 L86.5 98 L80 110 L48 110 L41.5 98 L42 45 L43.5 33 Z" fill="url(#a1g1)"/>
