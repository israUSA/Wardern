<!-- USS Gerald R. Ford (T3 occidental, portaviones). Gris OTAN. Identidad frente al Nimitz: la isla es mas PEQUENA y esta claramente mas retrasada hacia popa, sin celosias ni antenas colgando porque los radares van embebidos en sus caras planas; solo tres ascensores. Catapultas electromagneticas, sin el vapor de las de vapor.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
