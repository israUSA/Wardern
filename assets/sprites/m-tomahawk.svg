<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32">
  <!-- Misil de crucero tipo Tomahawk en vuelo, vista lateral, avanza hacia la derecha,
       llama del acelerador detras. El motor puede rotarlo segun el rumbo.
       Colores fijos (proyectil neutro); llama en tonos exhusto. -->
  <defs><style>
    .metal{fill:#6f767c}.metalS{fill:#54595e}.metalL{fill:#939aa0}
    .dark{fill:#3d4232}.rubber{fill:#2b2e28}
  </style></defs>

  <!-- llama del acelerador -->
  <path d="M0 16.5 C3 12.8 7 13.4 9.5 14.7 L9.5 18.3 C7 19.6 3 20.2 0 16.5 Z" fill="#e8a33d" opacity=".9"/>
  <path d="M0 16.5 C2.5 14.4 5 14.7 7 15.4 L7 17.6 C5 18.3 2.5 18.6 0 16.5 Z" fill="#f6d47c"/>

  <!-- tobera del acelerador -->
  <path class="rubber" d="M7 14.2 L4.6 13 L4.6 20 L7 18.8 Z"/>
  <path class="metalS" d="M7 13.8 L13 13.8 L13 19.2 L7 19.2 Z"/>

  <!-- aletas de cola (cruciformes) -->
  <path class="metal" d="M12 13.6 L15 8.4 L19 8.4 L17.5 13.6 Z"/>
  <path d="M12 13.6 L15 8.4 L19 8.4 L17.5 13.6 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".7"/>
  <path class="metalS" d="M12 19.4 L15 24.6 L19 24.6 L17.5 19.4 Z"/>
  <path d="M12 19.4 L15 24.6 L19 24.6 L17.5 19.4 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".7"/>

  <!-- ala desplegada -->
  <path class="metalL" d="M26 13.6 L28.5 10.2 L42.5 10.2 L40 13.6 Z"/>
  <path d="M26 13.6 L28.5 10.2 L42.5 10.2 L40 13.6 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".7"/>

  <!-- toma de aire ventral -->
  <path class="metalS" d="M24 19.4 L24 21.2 C24 22.2 25 22.8 26.5 22.8 L31 22.8 C32.3 22.8 33 22.2 33 21.2 L33 19.4 Z"/>
  <path d="M24 19.4 L24 21.2 C24 22.2 25 22.8 26.5 22.8 L31 22.8 C32.3 22.8 33 22.2 33 21.2 L33 19.4 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".7"/>
  <ellipse class="rubber" cx="32.2" cy="21" rx="1.4" ry="1.4"/>

  <!-- fuselaje con morro redondeado -->
  <path class="metalL" d="M12 13.6 C10 13.6 8.6 14.8 8.6 16.5 C8.6 18.2 10 19.4 12 19.4 L48 19.4 C51.5 19.4 55 18.2 57 16.5 C55 14.8 51.5 13.6 48 13.6 Z"/>
  <path d="M12 13.6 C10 13.6 8.6 14.8 8.6 16.5 C8.6 18.2 10 19.4 12 19.4 L48 19.4 C51.5 19.4 55 18.2 57 16.5 C55 14.8 51.5 13.6 48 13.6 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".8"/>
  <path class="metalS" d="M13 18 L49 18 C51.5 18 53.5 17.7 55 17.3 L55 18.2 C53 18.7 50.5 19 48 19 L13 19 Z" opacity=".85"/>
  <path d="M14 14.3 C24 13.9 40 13.9 47 14.3" stroke="#b8bfa2" stroke-width=".7" fill="none" opacity=".6"/>
  <!-- lineas de panel -->
  <path d="M21 13.8 L21 19.2 M36 13.8 L36 19.2 M45 13.8 L45 19.2" stroke="#3d4232" stroke-width=".5" opacity=".45"/>
</svg>
