<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64">
  <!-- AIM-120C AMRAAM (id del arma: aim120)
       aire-aire activo · 105 km
       Arte propio, ya diferenciado.
       Sustituyelo cuando quieras: el motor solo exige que el archivo
       exista con este nombre, no depende de ninguna forma concreta.
       CONVENCION: morro hacia ARRIBA (norte); el render lo gira al rumbo. -->
  <!-- AIM-120 AMRAAM (arte propio). Radar ACTIVO: se distingue del Sparrow en
       que NO lleva alas grandes — cuerpo largo, delgado y limpio, con cuatro
       aletas recortadas pequeñas atrás. Es el misil largo moderno.
       Morro hacia ARRIBA (norte). Dibujo base: mejóralo encima. -->
  <defs>
    <linearGradient id="am-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.45" stop-color="#cad2da"/>
      <stop offset="1" stop-color="#7c8690"/>
    </linearGradient>
    <linearGradient id="am-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f1ff"/>
      <stop offset="0.5" stop-color="#8cc2ff"/>
      <stop offset="1" stop-color="#2f6fd0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M13.9 52 L18.1 52 C19.1 57 17.7 61 16 64 C14.3 61 12.9 57 13.9 52 Z" fill="url(#am-flame)"/>

  <!-- aletas traseras recortadas (borde exterior recto, no en punta) -->
  <path d="M13.9 42 L9.8 45 L9.8 50 L13.9 48.5 Z" fill="#69737e"/>
  <path d="M18.1 42 L22.2 45 L22.2 50 L18.1 48.5 Z" fill="#69737e"/>
  <!-- alitas medias muy cortas: apenas sobresalen -->
  <path d="M13.9 26 L11.4 27.5 L11.4 33 L13.9 32 Z" fill="#8e98a2"/>
  <path d="M18.1 26 L20.6 27.5 L20.6 33 L18.1 32 Z" fill="#8e98a2"/>

  <rect x="13.85" y="7" width="4.3" height="45" rx="1" fill="url(#am-body)"/>
  <rect x="13.85" y="14" width="4.3" height="2.2" fill="#2f6fd0"/>
  <rect x="13.85" y="18" width="4.3" height="1.2" fill="#c9432f"/>
  <!-- radomo activo: ojiva fina y muy larga -->
  <path d="M13.85 7 C14.5 3 15.2 1.2 16 0 C16.8 1.2 17.5 3 18.15 7 Z" fill="#3a4450"/>
  <rect x="14.6" y="9" width="1" height="42" rx="0.5" fill="#ffffff" opacity="0.35"/>
</svg>
