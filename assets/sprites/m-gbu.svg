<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- JDAM-ER (Alas hacia atrás con un 25% más de grosor en las palas)
       Orientación: Punta hacia ARRIBA (Norte) -->
  <defs>
    <!-- Cuerpo bomba en verde oliva mate -->
    <linearGradient id="jdam-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b4733"/>
      <stop offset="28%" stop-color="#677a56"/>
      <stop offset="68%" stop-color="#4d5c41"/>
      <stop offset="100%" stop-color="#2a3324"/>
    </linearGradient>

    <!-- Resplandor cilíndrico suave para volumen 3D -->
    <linearGradient id="jdam-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Sección de cola cónica JDAM en gris naval claro -->
    <linearGradient id="jdam-tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9da5ab"/>
      <stop offset="30%" stop-color="#e2e7eb"/>
      <stop offset="70%" stop-color="#bdc6cc"/>
      <stop offset="100%" stop-color="#7d868c"/>
    </linearGradient>

    <!-- Kit alar y alas gruesas en aluminio/gris -->
    <linearGradient id="jdam-wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4ccd1"/>
      <stop offset="50%" stop-color="#eef2f5"/>
      <stop offset="100%" stop-color="#9aa3a8"/>
    </linearGradient>

    <!-- Aletas traseras en sombra y luz -->
    <linearGradient id="fin-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b4bec4"/>
      <stop offset="100%" stop-color="#808b91"/>
    </linearGradient>
    <linearGradient id="fin-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a959c"/>
      <stop offset="100%" stop-color="#636e74"/>
    </linearGradient>
  </defs>

  <!-- ================= ALETAS TRASERAS DE CONTROL ================= -->
  <!-- Aleta trasera izquierda -->
  <polygon points="13.9,51.5 8.5,53.5 8.5,57.5 14.3,55" 
           fill="url(#fin-left)" 
           stroke="#3d4447" 
           stroke-width="0.22"/>

  <!-- Aleta trasera derecha -->
  <polygon points="18.1,51.5 23.5,53.5 23.5,57.5 17.7,55" 
           fill="url(#fin-right)" 
           stroke="#313639" 
           stroke-width="0.22"/>

  <!-- Aleta vertical central -->
  <polygon points="15.7,50 15.7,46 16.3,46 16.3,50" 
           fill="#b5bfc4" 
           stroke="#3d4447" 
           stroke-width="0.18"/>

  <!-- ================= CUERPO PRINCIPAL DE LA BOMBA ================= -->
  <!-- Ojiva frontal aerodinámica -->
  <path d="M 13.2 15 
           C 13.2 9, 14.4 3.8, 16 3.8 
           C 17.6 3.8, 18.8 9, 18.8 15 
           Z" 
        fill="url(#jdam-green)"/>

  <!-- Fuselaje cilíndrico central verde oliva -->
  <rect x="13.2" y="15" width="5.6" height="27" fill="url(#jdam-green)"/>

  <!-- Cono de cola JDAM -->
  <polygon points="13.2,42 18.8,42 17.4,56.5 14.6,56.5" 
           fill="url(#jdam-tail)" 
           stroke="#5d666b" 
           stroke-width="0.2"/>

  <!-- Brillo cilíndrico longitudinal -->
  <rect x="13.2" y="4" width="5.6" height="52" fill="url(#jdam-shine)"/>

  <!-- ================= BANDAS DE IDENTIFICACIÓN ================= -->
  <!-- Banda amarilla de alto explosivo -->
  <rect x="13.2" y="11.5" width="5.6" height="1.8" fill="#f0ad18"/>
  <rect x="13.2" y="11.5" width="5.6" height="1.8" fill="url(#jdam-shine)"/>

  <!-- Anillo metálico plateado de refuerzo -->
  <rect x="13.2" y="17.2" width="5.6" height="1.2" fill="#c0c8cd" stroke="#687278" stroke-width="0.18"/>

  <!-- Junta de separación de cola -->
  <rect x="13.2" y="41.2" width="5.6" height="0.8" fill="#b0b8bd" stroke="#5d666b" stroke-width="0.15"/>

  <!-- Abrazadera metálica con ventana -->
  <rect x="12.9" y="27.5" width="6.2" height="6.5" rx="0.5" fill="#a4aeb3" stroke="#485257" stroke-width="0.2"/>
  <rect x="15.1" y="29.2" width="1.8" height="3" rx="0.3" fill="#2d3336"/>

  <!-- ================= ALAS HACIA ATRÁS (+25% GROSOR) ================= -->
  <!-- Ala izquierda (+25% espesor de pala, ancho de 2.5 mm) -->
  <polygon points="15.2,24.5 16,21.5 7.5,42.2 5,41" 
           fill="url(#jdam-wing)" 
           stroke="#3d464c" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- Ala derecha (+25% espesor de pala, simétrica) -->
  <polygon points="16.8,24.5 16,21.5 24.5,42.2 27,41" 
           fill="url(#jdam-wing)" 
           stroke="#3d464c" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- Carcasa dorsal central que une ambas alas -->
  <rect x="13.9" y="21" width="4.2" height="7.2" rx="0.8" fill="url(#jdam-wing)" stroke="#4e585d" stroke-width="0.22"/>
  
  <!-- Ranuras aerodinámicas del carenado dorsal -->
  <line x1="14.5" y1="22.8" x2="17.5" y2="22.8" stroke="#717d84" stroke-width="0.22"/>
  <line x1="14.5" y1="24.5" x2="17.5" y2="24.5" stroke="#717d84" stroke-width="0.22"/>
  <line x1="14.5" y1="26.2" x2="17.5" y2="26.2" stroke="#717d84" stroke-width="0.22"/>

  <!-- Bisagra / pivote central reforzado -->
  <circle cx="16" cy="23.6" r="0.75" fill="#32383c" stroke="#1d2123" stroke-width="0.15"/>
  <circle cx="16" cy="23.6" r="0.3" fill="#ffffff" opacity="0.75"/>

  <!-- ================= EXTREMO DE COLA ================= -->
  <ellipse cx="16" cy="56.5" rx="1.4" ry="0.4" fill="#222729" stroke="#121517" stroke-width="0.2"/>
  <circle cx="16" cy="56.5" r="0.45" fill="#4d5559"/>
</svg>
