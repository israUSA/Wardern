<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Kornet-D sobre GAZ Tigr (T3 oriental, cazatanques). Verde ruso.
     Camara y escala del set (20.9 px/m). Vehiculo 5.70 x 2.40 x 2.40 m.
     Identidad: blindado ligero de RUEDAS 4x4 con capo delantero bajo y cabina
     cuadrada atras, y sobre el techo el montaje giratorio con DOS bancadas de
     cuatro tubos Kornet cada una. Silueta: furgon blindado con dos racimos de
     tubos encima. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#9aa878"/><stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/><stop offset="1" stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#6b7a4e"/><stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1" stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#485636"/><stop offset="0.6" stop-color="#374327"/>
    <stop offset="1" stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#a6b28a"/><stop offset="0.5" stop-color="#717d5a"/>
    <stop offset="1" stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-tyre" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#26261f"/>
    <stop offset="1" stop-color="#171712"/>
  </linearGradient>
</defs>
<path d="M64 152 L154 126 L180 147 L84 176 Z" fill="#080a06" opacity="0.30"/>

<!-- popa -->
<path d="M47.2 116.9 L70.7 139.9 L70.7 157.9 L47.2 134.9 Z" fill="url(#g-rear)"/>
<path d="M50 123 L61 133.8 L61 148 L50 137.2 Z" fill="#4c5a35" stroke="#1f2716" stroke-width="0.9"/>
<circle cx="49" cy="120" r="2.2" fill="#8f5b30"/>
<circle cx="68.5" cy="139" r="2.2" fill="#8f5b30"/>

<!-- cubierta trasera, techo de cabina y capo -->
<path d="M47.2 116.9 L64.9 112.0 L88.4 135.0 L70.7 139.9 Z" fill="url(#g-deck)"/>
<path d="M64.9 104.0 L110.8 91.3 L134.3 114.3 L88.4 127.0 Z" fill="url(#g-deck)"/>
<path d="M110.8 103.3 L146.1 97.6 L169.6 120.6 L134.3 126.3 Z" fill="url(#g-deck)"/>
<path d="M110.8 103.3 L146.1 97.6 L169.6 120.6 L134.3 126.3 Z" fill="#ffffff" fill-opacity="0.07"/>
<path d="M64.9 104.0 L110.8 91.3" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.4"/>
<!-- rejilla del radiador y faros -->
<g fill="#3b4728">
  <path d="M150 103 L155 108 L152.4 109.2 L147.4 104.2 Z"/>
  <path d="M162 115 L167 120 L164.4 121.2 L159.4 116.2 Z"/>
</g>

<!-- flanco: cubierta trasera, cabina alta y capo bajo -->
<path d="M70.7 157.9 L70.7 139.9 L88.4 135.0 L88.4 127.0 L134.3 114.3
         L134.3 126.3 L169.6 120.6 L175.8 124.9 L175.8 128.9 Z" fill="url(#g-flank)"/>
<!-- ventanillas blindadas -->
<g fill="#2b3320">
  <path d="M94 129.5 L110 125.1 L110 117.1 L94 121.5 Z"/>
  <path d="M114 124 L129 119.9 L129 111.9 L114 116 Z"/>
</g>
<path d="M94 121.5 L110 117.1 L110 118.6 L94 123 Z" fill="#8fb4c4" fill-opacity="0.45"/>
<path d="M114 116 L129 111.9 L129 113.4 L114 117.5 Z" fill="#8fb4c4" fill-opacity="0.45"/>
<!-- estribo -->
<path d="M92 138 L134 126.4 L134 129.4 L92 141 Z" fill="#3f4c2e"/>

<!-- 4 ruedas -->
<g fill="url(#g-tyre)" stroke="#141710" stroke-width="1.2">
  <ellipse cx="91.5"  cy="158.8" rx="9" ry="10.5"/>
  <ellipse cx="153.4" cy="141.8" rx="9" ry="10.5"/>
</g>
<g fill="#5a6247" stroke="#232a1a" stroke-width="1">
  <ellipse cx="91.5"  cy="158.8" rx="4" ry="4.8"/>
  <ellipse cx="153.4" cy="141.8" rx="4" ry="4.8"/>
</g>
<g fill="none" stroke="#4a5040" stroke-opacity="0.8" stroke-width="1.1">
  <ellipse cx="91.5"  cy="158.8" rx="6.6" ry="7.8"/>
  <ellipse cx="153.4" cy="141.8" rx="6.6" ry="7.8"/>
</g>

<!-- montaje giratorio -->
<path d="M91 112 L91 103 L104 99.5 L104 108.5 Z" fill="#4e5c38" stroke="#222a17" stroke-width="1"/>
<path d="M91 103 L104 99.5 L110 102 L97 105.5 Z" fill="#66744c"/>

<!-- bancada A de cuatro tubos Kornet -->
<path d="M82.8 95.8 L89.3 102.2 L89.3 94.2 L82.8 87.8 Z" fill="url(#g-rear)"/>
<path d="M89.3 102.2 L114.0 95.4 L114.0 87.4 L89.3 94.2 Z" fill="url(#g-flank)"/>
<path d="M82.8 87.8 L107.5 81.0 L114.0 87.4 L89.3 94.2 Z" fill="url(#g-deck)"/>
<g fill="#12150e">
  <ellipse cx="110" cy="86.6" rx="1.1" ry="1.7"/><ellipse cx="110" cy="90.6" rx="1.1" ry="1.7"/>
  <ellipse cx="113" cy="88.6" rx="1.1" ry="1.7"/><ellipse cx="113" cy="92.6" rx="1.1" ry="1.7"/>
</g>
<!-- bancada B -->
<path d="M92.1 105.0 L98.7 111.4 L98.7 103.4 L92.1 97.0 Z" fill="url(#g-rear)"/>
<path d="M98.7 111.4 L123.4 104.6 L123.4 96.6 L98.7 103.4 Z" fill="url(#g-flank)"/>
<path d="M92.1 97.0 L116.8 90.2 L123.4 96.6 L98.7 103.4 Z" fill="url(#g-deck)"/>
<g fill="#12150e">
  <ellipse cx="119.4" cy="95.8" rx="1.1" ry="1.7"/><ellipse cx="119.4" cy="99.8" rx="1.1" ry="1.7"/>
  <ellipse cx="122.4" cy="97.8" rx="1.1" ry="1.7"/><ellipse cx="122.4" cy="101.8" rx="1.1" ry="1.7"/>
</g>
<path d="M82.8 87.8 L107.5 81.0" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.3"/>
<path d="M92.1 97.0 L116.8 90.2" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.3"/>
<!-- optica de puntería entre bancadas -->
<path d="M104 97 L112 94.8 L112 90 L104 92.2 Z" fill="#3a4229" stroke="#222a17" stroke-width="0.8"/>
<ellipse cx="112" cy="92.4" rx="1.5" ry="2.3" fill="#8fb4c4"/>
</svg>
