<!-- Steregushchiy, Proyecto 20380 (T3 oriental, corbeta). Gris ruso. Identidad: superestructura furtiva de caras inclinadas que envuelve casi toda la eslora, palo cerrado en vez de enrejado, celdas verticales delante del puente, y hangar con plataforma de helicoptero a popa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
