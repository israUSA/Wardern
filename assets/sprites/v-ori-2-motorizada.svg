<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- BMP-2 - vista superior, morro al norte. Como el BMP-1 pero con torreta PLANA y
       MAS ANCHA (dos hombres) con canon automatico 30mm largo y lanzador Konkurs en
       el lateral derecho de la torreta, sin riel sobre el tubo.
       Tinte por pais: .base/.shade/.light/.hi. Fijos: .metal/.metalS/.metalL, .dark, .rubber. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="bp2f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="bp2f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="bp2gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".5" stop-color="#000" stop-opacity=".19"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bp2g1" gradientUnits="userSpaceOnUse" x1="36" y1="60" x2="92" y2="60">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".16" stop-color="#fff" stop-opacity=".18"/><stop offset=".4" stop-color="#fff" stop-opacity=".22"/><stop offset=".64" stop-color="#fff" stop-opacity=".04"/><stop offset=".84" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="bp2g2" gradientUnits="userSpaceOnUse" x1="64" y1="22" x2="64" y2="106">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="bp2g3" gradientUnits="userSpaceOnUse" x1="57" y1="54" x2="71" y2="54">
    <stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".2" stop-color="#fff" stop-opacity=".2"/><stop offset=".55" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
  </linearGradient>
  <radialGradient id="bp2g5" cx=".38" cy=".32" r=".8">
    <stop offset="0" stop-color="#fff" stop-opacity=".36"/><stop offset=".4" stop-color="#fff" stop-opacity=".08"/><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
  </radialGradient>
  </defs>

  <ellipse cx="64" cy="64" rx="42" ry="52" fill="url(#bp2gs)"/>

  <!-- ===== orugas ===== -->
  <path class="rubber" d="M35.5 26 C35.5 20.5 38.5 18 42 18 C45.5 18 48.5 20.5 48.5 26 L48.5 104 C48.5 109.5 45.5 112 42 112 C38.5 112 35.5 109.5 35.5 104 Z"/>
  <path class="rubber" d="M79.5 26 C79.5 20.5 82.5 18 86 18 C89.5 18 92.5 20.5 92.5 26 L92.5 104 C92.5 109.5 89.5 112 86 112 C82.5 112 79.5 109.5 79.5 104 Z"/>
  <path d="M36 26 C36 21 38.6 18.6 42 18.6 C45.4 18.6 48 21 48 26 L48 104 C48 109 45.4 111.4 42 111.4 C38.6 111.4 36 109 36 104 Z" fill="url(#bp2g1)" opacity=".45"/>
  <path d="M80 26 C80 21 82.6 18.6 86 18.6 C89.4 18.6 92 21 92 26 L92 104 C92 109 89.4 111.4 86 111.4 C82.6 111.4 80 109 80 104 Z" fill="url(#bp2g1)" opacity=".45"/>
  <path d="M36.2 24 L36.2 106 M80.2 24 L80.2 106" stroke="#fff" stroke-width=".8" opacity=".16" fill="none"/>
  <path d="M37 16 L37 114 M40.4 14.4 L40.4 115.6 M43.6 14.4 L43.6 115.6" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".85" fill="none"/>
  <path d="M81 16 L81 114 M84.4 14.4 L84.4 115.6 M87.6 14.4 L87.6 115.6" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".85" fill="none"/>
  <path d="M42 15.5 L42 116.5 M86 15.5 L86 116.5" stroke="#000" stroke-width="1.4" stroke-dasharray="2.6 1.8" opacity=".5" fill="none"/>
  <circle class="metalL" cx="42" cy="21" r="4.8"/><circle class="metal" cx="42" cy="21" r="2.7"/>
  <circle class="metalL" cx="86" cy="21" r="4.8"/><circle class="metal" cx="86" cy="21" r="2.7"/>
  <circle class="metalL" cx="42" cy="109" r="4.8"/><circle class="metal" cx="42" cy="109" r="2.7"/>
  <circle class="metalL" cx="86" cy="109" r="4.8"/><circle class="metal" cx="86" cy="109" r="2.7"/>

  <!-- ===== casco bajo picudo ===== -->
  <path class="base" d="M64 20 C54 23 45 28.5 41 34 L39 40 L38.5 100 L43 106.5 L85 106.5 L89.5 100 L89 40 L87 34 C83 28.5 74 23 64 20 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M64 20 C54 23 45 28.5 41 34 L39 40 L38.5 100 L43 106.5 L85 106.5 L89.5 100 L89 40 L87 34 C83 28.5 74 23 64 20 Z" fill="url(#bp2g1)"/>
  <path d="M64 20 C54 23 45 28.5 41 34 L39 40 L38.5 100 L43 106.5 L85 106.5 L89.5 100 L89 40 L87 34 C83 28.5 74 23 64 20 Z" fill="url(#bp2g2)"/>
  <path d="M64 21 L84.5 31.5 L43.5 31.5 Z" fill="#fff" opacity=".12"/>
  <path d="M64 21 L43.8 31.4" stroke="#fff" stroke-width="1" opacity=".5" fill="none"/>
  <path d="M39.4 40 L38.9 99" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M88.6 40 L89.1 99 L84.8 105.6" stroke="#000" stroke-width="1.4" opacity=".24" fill="none" filter="url(#bp2f1)"/>
  <path d="M39 36 L48 35 L48 103 L39.2 102 Z" fill="#000" opacity=".28" filter="url(#bp2f1)"/>
  <path d="M89 36 L80 35 L80 103 L88.8 102 Z" fill="#000" opacity=".28" filter="url(#bp2f1)"/>
  <!-- visores del conductor en el pico -->
  <rect class="dark" x="59.5" y="27.5" width="4.4" height="2" rx=".5" opacity=".85"/>
  <rect class="dark" x="66" y="27.5" width="4.4" height="2" rx=".5" opacity=".85"/>

  <!-- sombra de la torreta -->
  <path d="M55 48 L76 48 L77.5 64 L53.5 64 Z" fill="#000" opacity=".18" filter="url(#bp2f2)"/>

  <!-- ===== torreta plana y ancha con 30mm ===== -->
  <ellipse class="base" cx="65" cy="57.5" rx="10.4" ry="7.6"/>
  <ellipse cx="65" cy="57.5" rx="10.4" ry="7.6" fill="url(#bp2g3)"/>
  <ellipse cx="65" cy="57.5" rx="10.4" ry="7.6" fill="none" stroke="#3d4232" stroke-width="1"/>
  <path d="M56.6 54.4 A9.8 7 0 0 1 65 50.2" stroke="#fff" stroke-width=".9" opacity=".5" fill="none"/>
  <path d="M73.4 60.4 A9.8 7 0 0 1 65.6 64.9" stroke="#000" stroke-width="1" opacity=".25" fill="none" filter="url(#bp2f1)"/>
  <!-- canon automatico 30mm largo y fino -->
  <path class="shade" d="M62 49.5 L68 49.5 L67.2 52.4 L62.8 52.4 Z"/>
  <path class="dark" d="M63.7 32 L66.3 32 L66.2 49.8 L63.8 49.8 Z"/>
  <path class="hi" d="M64.1 33 L64.5 33 L64.4 48.6 L64.1 48.6 Z" opacity=".55"/>
  <path class="metalS" d="M63.5 30.6 L66.5 30.6 L66.4 32.2 L63.6 32.2 Z"/>
  <!-- lanzador Konkurs en el lateral derecho de la torreta -->
  <rect class="metal" x="71" y="52.5" width="2.4" height="7" rx=".6"/>
  <path class="metalS" d="M71.3 51.3 L73.1 51.3 L73.1 52.7 L71.3 52.7 Z"/>
  <path d="M71.8 53 L71.8 58.8" stroke="#fff" stroke-width=".35" opacity=".4" fill="none"/>
  <!-- escotillas de la torreta -->
  <circle class="metal" cx="59.5" cy="61.5" r="2.1"/>
  <circle class="metal" cx="70.5" cy="61.5" r="2.1"/>

  <!-- ===== techo de tropa con escotillas ===== -->
  <rect class="shade" x="47.5" y="70.5" width="33" height="22" rx="1"/>
  <path d="M47.8 70.8 L80.2 70.8" stroke="#fff" stroke-width=".6" opacity=".3" fill="none"/>
  <ellipse class="dark" cx="53.5" cy="76" rx="3.4" ry="2.6" opacity=".85"/>
  <ellipse class="dark" cx="53.5" cy="82.5" rx="3.4" ry="2.6" opacity=".85"/>
  <ellipse class="dark" cx="74.5" cy="76" rx="3.4" ry="2.6" opacity=".85"/>
  <ellipse class="dark" cx="74.5" cy="82.5" rx="3.4" ry="2.6" opacity=".85"/>
  <path d="M50.4 76 L50.4 88 M77.6 76 L77.6 88" stroke="#000" stroke-width=".4" opacity=".3" fill="none"/>
  <!-- tapas del motor detras -->
  <rect class="dark" x="55" y="95" width="18" height="8" rx="1"/>
  <path d="M57.5 95.6 L57.5 102.4 M61 95.6 L61 102.4 M64.5 95.6 L64.5 102.4 M68 95.6 L68 102.4 M71.5 95.6 L71.5 102.4" stroke="#9aa378" stroke-width=".55" opacity=".6" fill="none"/>
  <!-- antena -->
  <path d="M49 70 L45 61" stroke="#3d4232" stroke-width="1" fill="none" opacity=".85"/>
  <circle class="dark" cx="49" cy="70" r="1"/>
</svg>
