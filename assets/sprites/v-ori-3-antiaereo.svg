<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- S-400 Triumf, lanzador 5P85 (T3 oriental, antiaereo). Verde ruso.
     Camara y escala del set. Camion pesado 8x8 con cabina blindada adelante.
     Identidad: es el unico del set con OCHO RUEDAS y, sobre el bastidor trasero,
     CUATRO contenedores cilindricos IZADOS EN VERTICAL (lanzamiento en frio).
     Silueta: camion largo con cuatro tubos de pie detras de la cabina. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#9aa878"/><stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/><stop offset="1" stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#6b7a4e"/><stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1" stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#485636"/><stop offset="0.6" stop-color="#374327"/>
    <stop offset="1" stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-tube" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b9a69"/><stop offset="0.35" stop-color="#6d7c50"/>
    <stop offset="1" stop-color="#3f4c2e"/>
  </linearGradient>
  <linearGradient id="g-tyre" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#26261f"/>
    <stop offset="1" stop-color="#171712"/>
  </linearGradient>
</defs>
<path d="M28 168 L164 130 L226 124 L200 152 L60 190 Z" fill="#080a06" opacity="0.26"/>

<!-- bastidor trasero -->
<path d="M33.6 141.4 L148.4 109.6 L170.9 131.6 L56.1 163.4 Z" fill="url(#g-deck)"/>
<path d="M56.1 163.4 L170.9 131.6 L170.9 147.6 L56.1 179.4 Z" fill="url(#g-flank)"/>
<path d="M33.6 141.4 L56.1 163.4 L56.1 179.4 L33.6 157.4 Z" fill="url(#g-rear)"/>
<g stroke="#3b4728" stroke-opacity="0.55" stroke-width="1.1">
  <path d="M78 173 L78 157"/><path d="M110 164 L110 148"/><path d="M142 155 L142 139"/>
</g>

<!-- cabina blindada -->
<path d="M156.4 106.2 L180.8 130.1 L180.8 96.1 L156.4 72.2 Z" fill="url(#g-rear)"/>
<path d="M180.8 130.1 L224.9 117.9 L224.9 83.9 L180.8 96.1 Z" fill="url(#g-flank)"/>
<path d="M156.4 72.2 L200.5 60.0 L224.9 83.9 L180.8 96.1 Z" fill="url(#g-deck)"/>
<path d="M156.4 72.2 L200.5 60.0" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4"/>
<!-- ventanillas y rejilla -->
<g fill="#2b3320">
  <path d="M186 121 L200 117.1 L200 104 L186 107.9 Z"/>
  <path d="M205 115.8 L218 112.2 L218 99.2 L205 102.8 Z"/>
</g>
<path d="M186 107.9 L200 104 L200 105.6 L186 109.5 Z" fill="#8fb4c4" fill-opacity="0.45"/>
<path d="M205 102.8 L218 99.2 L218 100.8 L205 104.4 Z" fill="#8fb4c4" fill-opacity="0.45"/>
<g fill="#3b4728">
  <path d="M212 122 L217.5 127.4 L214.5 128.7 L209 123.3 Z"/>
</g>

<!-- ocho ruedas -->
<g fill="url(#g-tyre)" stroke="#141710" stroke-width="1.2">
  <ellipse cx="74.5"  cy="177.6" rx="8" ry="9.4"/>
  <ellipse cx="102.7" cy="169.7" rx="8" ry="9.4"/>
  <ellipse cx="168.1" cy="151.7" rx="8" ry="9.4"/>
  <ellipse cx="199.8" cy="142.9" rx="8" ry="9.4"/>
</g>
<g fill="#5a6247">
  <ellipse cx="74.5"  cy="177.6" rx="3.4" ry="4.2"/>
  <ellipse cx="102.7" cy="169.7" rx="3.4" ry="4.2"/>
  <ellipse cx="168.1" cy="151.7" rx="3.4" ry="4.2"/>
  <ellipse cx="199.8" cy="142.9" rx="3.4" ry="4.2"/>
</g>

<!-- cuatro contenedores en vertical, de mas lejos a mas cerca -->
<path d="M96.5 112.6 L96.5 47.6 L114.5 47.6 L114.5 112.6 Z" fill="url(#g-tube)" stroke="#243019" stroke-width="1"/>
<ellipse cx="105.5" cy="47.6" rx="9" ry="4" fill="#8b9a69" stroke="#243019" stroke-width="1"/>
<path d="M56.7 123.5 L56.7 58.5 L74.7 58.5 L74.7 123.5 Z" fill="url(#g-tube)" stroke="#243019" stroke-width="1"/>
<ellipse cx="65.7" cy="58.5" rx="9" ry="4" fill="#8b9a69" stroke="#243019" stroke-width="1"/>
<path d="M107.8 123.6 L107.8 58.6 L125.8 58.6 L125.8 123.6 Z" fill="url(#g-tube)" stroke="#243019" stroke-width="1"/>
<ellipse cx="116.8" cy="58.6" rx="9" ry="4" fill="#8b9a69" stroke="#243019" stroke-width="1"/>
<path d="M68.0 134.5 L68.0 69.5 L86.0 69.5 L86.0 134.5 Z" fill="url(#g-tube)" stroke="#243019" stroke-width="1"/>
<ellipse cx="77.0" cy="69.5" rx="9" ry="4" fill="#8b9a69" stroke="#243019" stroke-width="1"/>
<!-- zunchos -->
<g stroke="#243019" stroke-opacity="0.7" stroke-width="1.2">
  <path d="M96.5 70 L114.5 70"/><path d="M96.5 92 L114.5 92"/>
  <path d="M56.7 81 L74.7 81"/><path d="M56.7 103 L74.7 103"/>
  <path d="M107.8 81 L125.8 81"/><path d="M107.8 103 L125.8 103"/>
  <path d="M68.0 92 L86.0 92"/><path d="M68.0 114 L86.0 114"/>
</g>
<!-- gatos estabilizadores -->
<g stroke="#4e5c38" stroke-width="5" stroke-linecap="round">
  <path d="M60 172 L64 184"/><path d="M150 146 L154 158"/>
</g>
<g fill="#3f4c2e">
  <ellipse cx="64" cy="185" rx="5.4" ry="2.8"/>
  <ellipse cx="154" cy="159" rx="5.4" ry="2.8"/>
</g>
</svg>
