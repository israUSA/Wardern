<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- S-400 Triumf TEL - vista superior, norte. Chasis BZKT 8x8 de RUEDAS con tres ejes,
       4 TUBOS TALLISIMOS casi verticales 5P85 (bocas grandes vistas desde arriba) en
       bastidor trasero, cabina al frente. Tinte por pais: .base/.shade/.light/.hi.
       Fijos: .metal/.metalS/.metalL (bocas, bastidor), .glass, .dark, .rubber. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="s4f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="s4f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="s4gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".5" stop-color="#000" stop-opacity=".19"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="s4g1" gradientUnits="userSpaceOnUse" x1="40" y1="66" x2="88" y2="66">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".16" stop-color="#fff" stop-opacity=".18"/><stop offset=".4" stop-color="#fff" stop-opacity=".22"/><stop offset=".64" stop-color="#fff" stop-opacity=".04"/><stop offset=".84" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="s4g2" gradientUnits="userSpaceOnUse" x1="64" y1="20" x2="64" y2="108">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <radialGradient id="s4g5" cx=".38" cy=".32" r=".8">
    <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </radialGradient>
  </defs>

  <ellipse cx="64" cy="64" rx="44" ry="52" fill="url(#s4gs)"/>

  <!-- ===== ruedas 8x8 (tres ejes traseros dobles + eje delantero) ===== -->
  <g>
    <ellipse class="dark" cx="45" cy="62" rx="6" ry="6.6" opacity=".3"/><ellipse class="dark" cx="83" cy="62" rx="6" ry="6.6" opacity=".3"/>
    <circle class="rubber" cx="45" cy="62" r="5.4"/><circle class="rubber" cx="83" cy="62" r="5.4"/>
    <circle class="metal" cx="45" cy="62" r="2"/><circle class="metal" cx="83" cy="62" r="2"/>
    <ellipse class="dark" cx="45" cy="76" rx="6" ry="6.6" opacity=".3"/><ellipse class="dark" cx="83" cy="76" rx="6" ry="6.6" opacity=".3"/>
    <circle class="rubber" cx="45" cy="76" r="5.4"/><circle class="rubber" cx="83" cy="76" r="5.4"/>
    <circle class="metal" cx="45" cy="76" r="2"/><circle class="metal" cx="83" cy="76" r="2"/>
    <ellipse class="dark" cx="45" cy="90" rx="6" ry="6.6" opacity=".3"/><ellipse class="dark" cx="83" cy="90" rx="6" ry="6.6" opacity=".3"/>
    <circle class="rubber" cx="45" cy="90" r="5.4"/><circle class="rubber" cx="83" cy="90" r="5.4"/>
    <circle class="metal" cx="45" cy="90" r="2"/><circle class="metal" cx="83" cy="90" r="2"/>
    <g fill="#fff" opacity=".2">
      <circle cx="43.6" cy="60.4" r="1.6"/><circle cx="81.6" cy="60.4" r="1.3"/>
      <circle cx="43.6" cy="74.4" r="1.6"/><circle cx="81.6" cy="74.4" r="1.3"/>
      <circle cx="43.6" cy="88.4" r="1.6"/><circle cx="81.6" cy="88.4" r="1.3"/>
    </g>
  </g>

  <!-- ===== chasis largo ===== -->
  <path class="base" d="M51 22 L77 22 L79.5 28 L79.5 100 L75.5 105.5 L52.5 105.5 L48.5 100 L48.5 28 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M51 22 L77 22 L79.5 28 L79.5 100 L75.5 105.5 L52.5 105.5 L48.5 28 Z" fill="url(#s4g1)" opacity="0"/>
  <path d="M51 22 L77 22 L79.5 28 L79.5 100 L75.5 105.5 L52.5 105.5 L48.5 100 L48.5 28 Z" fill="url(#s4g1)"/>
  <path d="M51 22 L77 22 L79.5 28 L79.5 100 L75.5 105.5 L52.5 105.5 L48.5 100 L48.5 28 Z" fill="url(#s4g2)"/>
  <path d="M49.2 30 L48.8 99" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M78.8 30 L79.2 99" stroke="#000" stroke-width="1.4" opacity=".24" fill="none" filter="url(#s4f1)"/>
  <!-- cabina blindada al frente -->
  <path class="shade" d="M53.5 16.5 L74.5 16.5 L76 20 L76 22.5 L52 22.5 L52 20 Z" stroke="#3d4232" stroke-width="1.1"/>
  <path class="glass" d="M55 17.2 L73 17.2 L74 21 L54 21 Z"/>
  <path d="M55 17.2 L73 17.2 L74 21 L54 21 Z" fill="none" stroke="#243b4d" stroke-width=".6"/>
  <path d="M58.5 17.8 L57.8 20.6 M69.5 17.8 L70.2 20.6" stroke="#243b4d" stroke-width=".5" opacity=".8" fill="none"/>
  <path d="M60 18.2 L59.5 20.4" stroke="#e8f4fb" stroke-width=".8" opacity=".55" fill="none"/>
  <circle class="hi" cx="53.5" cy="23.5" r="1.1"/><circle class="hi" cx="74.5" cy="23.5" r="1.1"/>

  <!-- ===== bastidor con 4 tubos casi verticales ===== -->
  <path d="M51 30 L77 30 L78 64 L50 64 Z" fill="#000" opacity=".26" filter="url(#s4f2)"/>
  <rect class="shade" x="51.5" y="31" width="25" height="32" rx="1.4"/>
  <path d="M51.9 31.4 L76.1 31.4" stroke="#fff" stroke-width=".8" opacity=".45" fill="none"/>
  <!-- union de las 4 bocas -->
  <path d="M64 32.5 L64 62.5 M52.8 33.5 L51.5 61.5 M75.2 33.5 L76.5 61.5" stroke="#000" stroke-width=".6" opacity=".35" fill="none"/>
  <!-- bocas grandes (tubos casi verticales vistos desde arriba) -->
  <circle class="dark" cx="58" cy="35.6" r="4.4"/>
  <circle cx="57" cy="34.6" r="1.2" fill="#fff" opacity=".35"/>
  <circle class="metalL" cx="58" cy="35.6" r="2.2"/>
  <circle class="dark" cx="70" cy="35.6" r="4.4"/>
  <circle cx="69" cy="34.6" r="1.2" fill="#fff" opacity=".35"/>
  <circle class="metalL" cx="70" cy="35.6" r="2.2"/>
  <circle class="dark" cx="55.9" cy="44.6" r="4.4"/>
  <circle class="metalL" cx="55.9" cy="44.6" r="2.2"/>
  <circle class="dark" cx="72.1" cy="44.6" r="4.4"/>
  <circle class="metalL" cx="72.1" cy="44.6" r="2.2"/>
  <circle class="dark" cx="58" cy="55.6" r="4.4"/>
  <circle cx="57" cy="54.6" r="1.1" fill="#fff" opacity=".3"/>
  <circle class="metalL" cx="58" cy="55.6" r="2.2"/>
  <circle class="dark" cx="70" cy="55.6" r="4.4"/>
  <circle class="metalL" cx="70" cy="55.6" r="2.2"/>
  <!-- anillos de refuerzo de los tubos -->
  <path d="M53.4 38.4 L74.6 38.4 M53.4 50.4 L74.6 50.4" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>

  <!-- plataforma trasera con cuadros de mando -->
  <rect class="shade" x="53" y="66.5" width="22" height="5" rx="1"/>
  <path d="M53.3 66.8 L74.7 66.8" stroke="#fff" stroke-width=".5" opacity=".3" fill="none"/>
  <rect class="dark" x="55.5" y="73" width="7" height="5" rx=".8"/>
  <rect class="shade" x="65.5" y="73.5" width="7" height="4.5" rx=".7"/>
  <path d="M57.5 74 L57.5 77 M59 74 L59 77" stroke="#9aa378" stroke-width=".5" opacity=".6" fill="none"/>
  <!-- antena -->
  <path d="M76.5 70 L80.5 62" stroke="#3d4232" stroke-width="1" fill="none" opacity=".85"/>
  <circle class="dark" cx="76.5" cy="70" r="1"/>
  <!-- luces -->
  <rect class="hi" x="52.5" y="102.5" width="2.2" height="1.6" rx=".4" opacity=".85"/>
  <rect class="hi" x="73.3" y="102.5" width="2.2" height="1.6" rx=".4" opacity=".85"/>
</svg>
