<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Puerto - muelle con gruas portal, contenedores y galpon, vista 3/4 superior.
       Tinte por pais: sobreescribir .base/.shade/.light (muelle, gruas, galpon).
       Fijos: .metal/.metalS (estructuras), .rubber (detalles oscuros), .dark (contornos). -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6f767c}.metalS{fill:#54595e}.metalL{fill:#939aa0}
    .glass{fill:#3e607a}.glassL{fill:#7fa3ba}.rubber{fill:#2b2e28}
  </style></defs>

  <!-- muelle -->
  <path class="base" d="M10 60 L118 46 L118 114 L10 118 Z"/>
  <path d="M10 60 L118 46 L118 114 L10 118 Z" fill-opacity="0" stroke="#3d4232" stroke-width="1.2"/>
  <path class="light" d="M10 60 L118 46 L118 52 L10 66 Z" opacity=".7"/>
  <path class="dark" d="M10 112 L118 108 L118 114 L10 118 Z" opacity=".3"/>
  <!-- bolardos -->
  <circle class="dark" cx="22" cy="63" r="1.4"/><circle class="dark" cx="46" cy="59" r="1.4"/>
  <circle class="dark" cx="70" cy="56" r="1.4"/><circle class="dark" cx="94" cy="53" r="1.4"/>
  <!-- tablas del muelle -->
  <path d="M14 74 L114 64 M14 90 L114 82 M14 104 L114 99" stroke="#3d4232" stroke-width=".7" opacity=".3" fill="none"/>

  <!-- grua portal 1 -->
  <path class="metal" d="M28 62 L4 40 L7.5 36 L31.5 58 Z"/>
  <path d="M28 62 L4 40 L7.5 36 L31.5 58 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".9"/>
  <rect class="metal" x="26" y="59" width="34" height="7"/>
  <rect class="metal" x="26" y="59" width="34" height="7" fill-opacity="0" stroke="#3d4232" stroke-width=".9"/>
  <rect class="shade" x="29" y="66" width="7" height="30"/>
  <rect class="shade" x="48" y="64" width="7" height="30"/>
  <path d="M29 66 L29 96 M48 64 L48 94" stroke="#3d4232" stroke-width=".8" opacity=".5"/>
  <!-- carrito y cable -->
  <rect class="metalS" x="18" y="52" width="7" height="5"/>
  <path d="M21.5 57 L21.5 68" stroke="#2b2e28" stroke-width="1.2" fill="none"/>
  <rect class="rubber" x="18" y="68" width="7" height="3.4"/>

  <!-- grua portal 2 -->
  <path class="metal" d="M72 58 L48 36 L51.5 32 L75.5 54 Z"/>
  <path d="M72 58 L48 36 L51.5 32 L75.5 54 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".9"/>
  <rect class="metal" x="70" y="55" width="34" height="7"/>
  <rect class="metal" x="70" y="55" width="34" height="7" fill-opacity="0" stroke="#3d4232" stroke-width=".9"/>
  <rect class="shade" x="73" y="62" width="7" height="30"/>
  <rect class="shade" x="92" y="60" width="7" height="30"/>
  <path d="M73 62 L73 92 M92 60 L92 90" stroke="#3d4232" stroke-width=".8" opacity=".5"/>
  <rect class="metalS" x="62" y="48" width="7" height="5"/>
  <path d="M65.5 53 L65.5 64" stroke="#2b2e28" stroke-width="1.2" fill="none"/>
  <rect class="rubber" x="62" y="64" width="7" height="3.4"/>

  <!-- galpon -->
  <rect class="shade" x="13" y="86" width="34" height="26"/>
  <rect class="shade" x="13" y="86" width="34" height="26" fill-opacity="0" stroke="#3d4232" stroke-width="1"/>
  <path class="light" d="M13 86 L47 86" opacity=".8"/>
  <path d="M15 88 L15 110 M21 88 L21 110 M27 88 L27 110 M33 88 L33 110 M39 88 L39 110" stroke="#3d4232" stroke-width=".7" opacity=".45"/>
  <rect class="dark" x="26" y="98" width="8" height="14"/>

  <!-- contenedores apilados -->
  <rect class="light" x="88" y="88" width="12" height="6"/>
  <rect class="metalS" x="101" y="86.5" width="12" height="6"/>
  <rect class="shade" x="88" y="95" width="12" height="6"/>
  <rect class="light" x="101" y="93.5" width="12" height="6"/>
  <rect class="metalS" x="94" y="102" width="12" height="6"/>
  <path d="M88 88 L113 86.5 L113 108 L94 108 L88 101 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".8"/>
</svg>
