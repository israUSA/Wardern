<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- M1 Abrams (tier 2) - vista superior, casco angular + torreta.
       Difiere del M1A2: sin CROWS y sin CITV; M2 en pivote simple.
       Tinte por pais: sobreescribir .base/.shade/.light/.hi (casco, torreta, faldones).
       Fijos: .metal/.metalS/.metalL (canon, escotillas, RWS), .rubber (orugas), .dark (detalles).
       Volumen: luz principal arriba-izq, rim light en cantos NO, sombra profunda SE,
       oclusion ambiental difuminada bajo torreta/faldones/canastilla, especular en metal. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="o2bf1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.4"/></filter>
  <filter id="o2bf2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
  <radialGradient id="o2bgs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset=".5" stop-color="#000" stop-opacity=".2"/><stop offset=".8" stop-color="#000" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <!-- ambiente diagonal del casco: luz NO, sombra SE -->
  <linearGradient id="o2bg1" gradientUnits="userSpaceOnUse" x1="42" y1="20" x2="88" y2="110">
    <stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".68" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <!-- volumen cruzado del casco -->
  <linearGradient id="o2bg2" gradientUnits="userSpaceOnUse" x1="36" y1="60" x2="92" y2="60">
    <stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".08" stop-color="#000" stop-opacity=".24"/><stop offset=".24" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".26"/><stop offset=".76" stop-color="#000" stop-opacity=".04"/><stop offset=".94" stop-color="#000" stop-opacity=".26"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <!-- volumen cruzado de la torreta -->
  <linearGradient id="o2bg3" gradientUnits="userSpaceOnUse" x1="46" y1="62" x2="82" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".14" stop-color="#fff" stop-opacity=".22"/><stop offset=".4" stop-color="#fff" stop-opacity=".28"/><stop offset=".62" stop-color="#fff" stop-opacity=".08"/><stop offset=".84" stop-color="#000" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <!-- canon: especular a lo largo -->
  <linearGradient id="o2bg4" gradientUnits="userSpaceOnUse" x1="61" y1="6" x2="67" y2="36">
    <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".36"/>
  </linearGradient>
  <!-- dome de escotillas -->
  <radialGradient id="o2bg5" cx=".38" cy=".32" r=".8">
    <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".4" stop-color="#fff" stop-opacity=".08"/><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </radialGradient>
  <!-- top de torreta: especular suave NO -->
  <radialGradient id="o2bg6" cx=".42" cy=".3" r=".9">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/>
  </radialGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="61" cy="68" rx="48" ry="60" fill="url(#o2bgs)"/>

  <!-- ===== orugas ===== -->
  <path class="rubber" d="M29.5 22 C29.5 16.5 33 14 37 14 C41 14 44.5 16.5 44.5 22 L44.5 108 C44.5 113.5 41 116 37 116 C33 116 29.5 113.5 29.5 108 Z"/>
  <path class="rubber" d="M83.5 22 C83.5 16.5 87 14 91 14 C95 14 98.5 16.5 98.5 22 L98.5 108 C98.5 113.5 95 116 91 116 C87 116 83.5 113.5 83.5 108 Z"/>
  <!-- luz/sombra en la banda de rodadura -->
  <path d="M30 22 C30 17 33 14.6 37 14.6 C41 14.6 44 17 44 22 L44 108 C44 113 41 115.4 37 115.4 C33 115.4 30 113 30 108 Z" fill="url(#o2bg2)" opacity=".55"/>
  <path d="M84 22 C84 17 87 14.6 91 14.6 C95 14.6 98 17 98 22 L98 108 C98 113 95 115.4 91 115.4 C87 115.4 84 113 84 108 Z" fill="url(#o2bg2)" opacity=".55"/>
  <path d="M30.2 20 L30.2 110" stroke="#fff" stroke-width=".8" opacity=".18" fill="none"/>
  <path d="M84.2 20 L84.2 110" stroke="#fff" stroke-width=".8" opacity=".18" fill="none"/>
  <!-- eslabones de oruga (segmentos) -->
  <path d="M31 16 L31 114 M35.4 14.4 L35.4 115.6 M38.6 14.4 L38.6 115.6 M43 16 L43 114" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".9" fill="none"/>
  <path d="M85 16 L85 114 M89.4 14.4 L89.4 115.6 M92.6 14.4 L92.6 115.6 M97 16 L97 114" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".9" fill="none"/>
  <path d="M37 15.5 L37 116.5" stroke="#000" stroke-width="1.4" stroke-dasharray="2.6 1.8" opacity=".55" fill="none"/>
  <path d="M91 15.5 L91 116.5" stroke="#000" stroke-width="1.4" stroke-dasharray="2.6 1.8" opacity=".55" fill="none"/>
  <!-- dientes de guiado -->
  <path d="M35 18 L35 112 M39 18 L39 112 M89 18 L89 112 M93 18 L93 112" stroke="#8a929b" stroke-width=".7" stroke-dasharray="1.6 3.4" opacity=".7" fill="none"/>
  <!-- ruedas motrices y tensoras -->
  <circle class="metalL" cx="37" cy="19" r="5.6"/><circle class="metal" cx="37" cy="19" r="3.2"/>
  <circle cx="35.6" cy="17.6" r="1.6" fill="#fff" opacity=".28"/>
  <circle class="metalL" cx="91" cy="19" r="5.6"/><circle class="metal" cx="91" cy="19" r="3.2"/>
  <circle cx="89.6" cy="17.6" r="1.6" fill="#fff" opacity=".28"/>
  <circle class="metalL" cx="37" cy="111" r="5.6"/><circle class="metal" cx="37" cy="111" r="3.2"/>
  <circle class="metalL" cx="91" cy="111" r="5.6"/><circle class="metal" cx="91" cy="111" r="3.2"/>
  <circle cx="35.6" cy="109.6" r="1.6" fill="#fff" opacity=".2"/>
  <circle cx="89.6" cy="109.6" r="1.6" fill="#fff" opacity=".2"/>

  <!-- ===== faldones de oruga segmentados ===== -->
  <path class="shade" d="M26 20 L31 18 L31 112 L26 108 Z"/>
  <path class="shade" d="M102 20 L97 18 L97 112 L102 108 Z"/>
  <path d="M26.4 22 L28 21 L28 108 L26.4 106 Z" fill="#fff" opacity=".18"/>
  <path d="M101.6 22 L100 21 L100 108 L101.6 106 Z" fill="#fff" opacity=".12"/>
  <path d="M28.5 21 L30 20 M28.5 30 L30 30 M28.5 40 L30 40 M28.5 50 L30 50 M28.5 60 L30 60 M28.5 70 L30 70 M28.5 80 L30 80 M28.5 90 L30 90 M28.5 100 L30 101 M29 108 L30.5 109" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>
  <path d="M99.5 21 L98 20 M99.5 30 L98 30 M99.5 40 L98 40 M99.5 50 L98 50 M99.5 60 L98 60 M99.5 70 L98 70 M99.5 80 L98 80 M99.5 90 L98 90 M99.5 100 L98 101 M99 108 L97.5 109" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>
  <!-- oclusion ambiental: faldon proyecta sobre la oruga -->
  <path d="M31.6 20 L34.4 19 L34.4 113 L31.6 111 Z" fill="#000" opacity=".3" filter="url(#o2bf1)"/>
  <path d="M96.4 20 L93.6 19 L93.6 113 L96.4 111 Z" fill="#000" opacity=".3" filter="url(#o2bf1)"/>

  <!-- ===== casco ===== -->
  <path class="base" d="M64 12 L88 30 L90 44 L92 50 L92 101 L84 114 L44 114 L36 101 L36 50 L38 44 L40 30 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 12 L88 30 L90 44 L92 50 L92 101 L84 114 L44 114 L36 101 L36 50 L38 44 L40 30 Z" fill="url(#o2bg2)"/>
  <path d="M64 12 L88 30 L90 44 L92 50 L92 101 L84 114 L44 114 L36 101 L36 50 L38 44 L40 30 Z" fill="url(#o2bg1)"/>
  <!-- cara superior del glacis atrapa luz -->
  <path d="M64 13 L86.6 30 L41.4 30 Z" fill="#fff" opacity=".12"/>
  <!-- rim light en el canto NO del casco -->
  <path d="M64 13 L41 30" stroke="#fff" stroke-width="1.1" opacity=".5" fill="none"/>
  <path d="M37.4 48 L37.4 100" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M39.4 31.4 L37.6 43.6" stroke="#fff" stroke-width=".8" opacity=".35" fill="none"/>
  <!-- sombra profunda SE -->
  <path d="M87.4 31 L90.6 44 L91.4 101 L84 113.2" stroke="#000" stroke-width="2.2" opacity=".3" fill="none" filter="url(#o2bf1)"/>
  <path d="M64 13 L87.4 30.4" stroke="#000" stroke-width="1.4" opacity=".2" fill="none" filter="url(#o2bf1)"/>
  <!-- glacis: sombra central y filos -->
  <path class="light" d="M64 12 L88 30 L87 31.5 L64 14.6 L41 31.5 L40 30 Z" opacity=".85"/>
  <path d="M46 36.5 L82 36.5" stroke="#000" stroke-width=".7" opacity=".28" fill="none"/>
  <path d="M46 35.8 L82 35.8" stroke="#fff" stroke-width=".5" opacity=".25" fill="none"/>
  <path d="M52 24 L47 34 M76 24 L81 34" stroke="#000" stroke-width=".6" opacity=".25" fill="none"/>
  <!-- cable de remolque en glacis -->
  <path d="M49 30 C54 34.5 74 34.5 79 30" stroke="#3d4232" stroke-width="1.1" fill="none" opacity=".8"/>
  <path d="M49 30 C54 34.2 74 34.2 79 30" stroke="#fff" stroke-width=".4" opacity=".25" fill="none"/>
  <path d="M49.6 30.8 L49.6 33 M78.4 30.8 L78.4 33" stroke="#3d4232" stroke-width="1.3" opacity=".8" fill="none"/>
  <!-- faros y cajas de almacenaje frontales -->
  <rect class="shade" x="41.5" y="37" width="6.5" height="5.5" rx="1"/>
  <rect x="41.9" y="37.3" width="2.4" height="2" rx=".6" fill="#fff" opacity=".22"/>
  <rect class="shade" x="80" y="37" width="6.5" height="5.5" rx="1"/>
  <rect x="80.4" y="37.3" width="2.4" height="2" rx=".6" fill="#fff" opacity=".22"/>
  <rect class="hi" x="42.5" y="38.2" width="2.6" height="3.1" rx=".6"/>
  <rect class="hi" x="81" y="38.2" width="2.6" height="3.1" rx=".6"/>
  <!-- escotilla del conductor + visores -->
  <circle class="metal" cx="52" cy="44" r="4.4"/>
  <circle cx="52" cy="44" r="4.4" fill="url(#o2bg5)"/>
  <circle cx="52" cy="44" r="4.4" fill="none" stroke="#3d4232" stroke-width=".9"/>
  <path d="M48.6 40.8 L50 39.6 M55.4 40.8 L54 39.6" stroke="#8a929b" stroke-width="1" opacity=".9" fill="none"/>
  <path class="glass" d="M47.6 42.2 L48.8 41 L50.6 41 L50 42.6 Z" opacity=".9"/>
  <circle cx="50.4" cy="41.6" r=".5" fill="#fff" opacity=".8"/>

  <!-- sombra proyectada de la torreta sobre el casco (oclusion suave) -->
  <path d="M46 88 L82 88 L84 100 L79 109 L49 109 L44 100 Z" fill="#000" opacity=".2" filter="url(#o2bf2)"/>
  <path d="M52.4 85.4 L75.6 85.4 L76.4 89 L51.6 89 Z" fill="#000" opacity=".26" filter="url(#o2bf1)"/>

  <!-- ===== rejillas del motor traseras ===== -->
  <rect class="dark" x="45" y="101" width="15" height="8.5" rx="1"/>
  <rect class="dark" x="68" y="101" width="15" height="8.5" rx="1"/>
  <path d="M47.5 102 L47.5 108.5 M51 102 L51 108.5 M54.5 102 L54.5 108.5 M57.5 102 L57.5 108.5 M70.5 102 L70.5 108.5 M74 102 L74 108.5 M77.5 102 L77.5 108.5 M80.5 102 L80.5 108.5" stroke="#9aa378" stroke-width=".8" opacity=".65" fill="none"/>
  <path d="M45.4 101.4 L59.6 101.4 M68.4 101.4 L82.6 101.4" stroke="#fff" stroke-width=".5" opacity=".2" fill="none"/>

  <!-- ===== canon M256 con manguito termico ===== -->
  <path class="shade" d="M58.6 32 L69.4 32 L68.4 40 L59.6 40 Z"/>
  <path d="M58.6 32 L69.4 32 L68.4 40 L59.6 40 Z" fill="#000" opacity=".14"/>
  <path d="M59.6 40 L68.4 40 L67.6 44.6 L60.4 44.6 Z" fill="#000" opacity=".22" filter="url(#o2bf1)"/>
  <path class="metal" d="M61.8 8 L66.2 8 L65.9 26 L62.1 26 Z"/>
  <path d="M61.8 8 L66.2 8 L65.9 26 L62.1 26 Z" fill="url(#o2bg4)"/>
  <path d="M62.3 9 L62.1 25" stroke="#fff" stroke-width=".7" opacity=".5" fill="none"/>
  <path d="M65.9 9 L65.9 25" stroke="#000" stroke-width=".7" opacity=".35" fill="none"/>
  <path class="metalS" d="M61.4 12.5 L66.6 12.5 L66.5 17.5 L61.5 17.5 Z"/>
  <path d="M61.5 14.2 L66.5 14.2 M61.5 16 L66.5 16" stroke="#000" stroke-width=".5" opacity=".4" fill="none"/>
  <path d="M61.7 12.9 L66.3 12.9" stroke="#fff" stroke-width=".5" opacity=".4" fill="none"/>
  <path class="metalS" d="M61.7 21 L66.3 21 L66.25 23.6 L61.75 23.6 Z" opacity=".9"/>
  <path class="metalS" d="M60.9 4.4 L67.1 4.4 L67 8.2 L61 8.2 Z"/>
  <path class="rubber" d="M61.5 5 L66.5 5 L66.45 7.4 L61.55 7.4 Z"/>
  <path d="M61.9 9.4 L66.1 9.4 M61.9 25 L66.1 25" stroke="#000" stroke-width=".6" opacity=".5" fill="none"/>
  <path class="hi" d="M62.4 9 L63.1 9 L62.9 25 L62.5 25 Z" opacity=".55"/>
  <!-- sombra del canon sobre el glacis -->
  <path d="M57 33 L70.5 33 L70 36 L57.4 36 Z" fill="#000" opacity=".2" filter="url(#o2bf1)"/>

  <!-- ===== torreta ===== -->
  <path class="base" d="M64 38 L74.5 44.5 L80 56 L81 72 L75.5 85 L52.5 85 L47 72 L48 56 L53.5 44.5 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 38 L74.5 44.5 L80 56 L81 72 L75.5 85 L52.5 85 L47 72 L48 56 L53.5 44.5 Z" fill="url(#o2bg3)"/>
  <path d="M64 38 L74.5 44.5 L80 56 L81 72 L75.5 85 L52.5 85 L47 72 L48 56 L53.5 44.5 Z" fill="url(#o2bg6)"/>
  <path d="M64 38 L74.5 44.5 L80 56 L81 72 L75.5 85 L52.5 85 L47 72 L48 56 L53.5 44.5 Z" fill="#fff" opacity=".07"/>
  <!-- rim light NO de la torreta -->
  <path d="M64 38.6 L54 44.8" stroke="#fff" stroke-width="1.1" opacity=".55" fill="none"/>
  <path d="M48.4 57 L47.6 71" stroke="#fff" stroke-width=".9" opacity=".45" fill="none"/>
  <!-- sombra profunda SE de la torreta -->
  <path d="M74.5 44.5 L80 56 L81 72 L75.5 85" stroke="#000" stroke-width="2" opacity=".3" fill="none" filter="url(#o2bf1)"/>
  <!-- planos inclinados de mejilla -->
  <path class="light" d="M64 38 L74.5 44.5 L73 46 L64 40.6 L55 46 L53.5 44.5 Z" opacity=".8"/>
  <path d="M74.5 44.5 L80 56 L81 72 L75.5 85" stroke="#000" stroke-width="1" opacity=".22" fill="none"/>
  <path class="dark" d="M75.5 85 L81 72 L80 56 L76.8 57.8 L77.6 71 L73.4 81.6 Z" opacity=".35"/>
  <!-- anillo de la torreta -->
  <path d="M52 86 C56 88.6 72 88.6 76 86" stroke="#000" stroke-width="1" opacity=".3" fill="none"/>
  <!-- escotillas -->
  <circle class="metal" cx="54.5" cy="58" r="4.7"/>
  <circle cx="54.5" cy="58" r="4.7" fill="url(#o2bg5)"/>
  <circle cx="54.5" cy="58" r="4.7" fill="none" stroke="#3d4232" stroke-width="1"/>
  <circle class="shade" cx="54.5" cy="58" r="1.9"/>
  <circle cx="53.9" cy="57.2" r=".7" fill="#fff" opacity=".5"/>
  <path d="M50.6 54.6 L52.4 52.9 M58.4 54.6 L56.6 52.9" stroke="#8a929b" stroke-width="1.1" fill="none"/>
  <circle class="metal" cx="73" cy="58" r="4.7"/>
  <circle cx="73" cy="58" r="4.7" fill="url(#o2bg5)"/>
  <circle cx="73" cy="58" r="4.7" fill="none" stroke="#3d4232" stroke-width="1"/>
  <circle class="shade" cx="73" cy="58" r="1.9"/>
  <circle cx="72.4" cy="57.2" r=".7" fill="#fff" opacity=".5"/>
  <path d="M69.1 54.6 L70.9 52.9 M76.9 54.6 L75.1 52.9" stroke="#8a929b" stroke-width="1.1" fill="none"/>
  <!-- M2 en pivote simple sobre escotilla del jefe -->
  <path d="M53.2 50.8 L53.2 47.6" stroke="#2b2e28" stroke-width="1.1" fill="none"/>
  <path class="metalS" d="M52.5 47.2 L54 47.2 L53.9 50.8 L52.6 50.8 Z"/>
  <!-- lanzagranadas de humo 2x4 en cada mejilla -->
  <g class="dark">
    <circle cx="49.4" cy="50" r="1"/><circle cx="51.6" cy="48.6" r="1"/><circle cx="49.6" cy="52.4" r="1"/><circle cx="51.8" cy="51" r="1"/>
    <circle cx="78.6" cy="50" r="1"/><circle cx="76.4" cy="48.6" r="1"/><circle cx="78.4" cy="52.4" r="1"/><circle cx="76.2" cy="51" r="1"/>
  </g>
  <g fill="#fff" opacity=".35">
    <circle cx="49.2" cy="49.8" r=".4"/><circle cx="51.4" cy="48.4" r=".4"/><circle cx="49.4" cy="52.2" r=".4"/><circle cx="51.6" cy="50.8" r=".4"/>
  </g>
  <!-- canastilla trasera (stowage) con oclusion bajo el borde -->
  <path class="shade" d="M52.5 85 C52 87.5 53 89 55 89.4 C56 91.4 58 92 60 91.4 C62 92.6 66 92.6 68 91.4 C70 92 72 91.4 73 89.4 C75 89 76 87.5 75.5 85 Z"/>
  <path d="M52.6 85.2 C52.2 87.4 53.2 88.8 55.2 89.2 L55.6 90.8 C53.4 90.4 51.9 88.4 52.2 85.2 Z" fill="#fff" opacity=".14"/>
  <path d="M54 87.6 L74.4 87.6 L74.2 89.6 L54.2 89.6 Z" fill="#000" opacity=".24" filter="url(#o2bf1)"/>
  <path d="M55.5 85.5 C55.2 87 55.6 88.4 56.6 89.2 M61 86 C60.8 88 61.2 89.8 62 91 M67 86 C67.2 88 66.8 89.8 66 91" stroke="#000" stroke-width=".6" opacity=".3" fill="none"/>
  <path class="dark" d="M57.5 87.5 C58.6 86.4 60.4 86.6 61 87.8 C61.6 89 60.2 90.2 58.8 89.8 C57.4 89.4 56.9 88.4 57.5 87.5 Z" opacity=".8"/>
  <path class="dark" d="M65.5 88 C66.6 87 68.4 87.4 68.8 88.6 C69.2 89.8 67.6 90.6 66.4 90 C65.2 89.4 64.9 88.6 65.5 88 Z" opacity=".8"/>
  <path d="M58.6 87.2 C59.2 87.2 59.8 87.6 60.2 88" stroke="#fff" stroke-width=".5" opacity=".3" fill="none"/>
  <!-- antenas de torreta -->
  <path d="M48.5 82 L44.5 94 M79.5 82 L83.5 94" stroke="#3d4232" stroke-width="1" fill="none" opacity=".85"/>
  <circle class="dark" cx="48.5" cy="82" r="1"/><circle class="dark" cx="79.5" cy="82" r="1"/>

  <!-- cajas laterales de almacenaje sobre faldon -->
  <path class="shade" d="M38 62 L44 62 L44 66.5 L38 66.5 Z M38 68.5 L44 68.5 L44 73 L38 73 Z"/>
  <path class="shade" d="M84 62 L90 62 L90 66.5 L84 66.5 Z M84 68.5 L84 68.5 L84 73 L90 73 Z"/>
  <path d="M38.3 62.3 L43.7 62.3 M84.3 62.3 L89.7 62.3" stroke="#fff" stroke-width=".5" opacity=".25" fill="none"/>
  <path d="M38 73 L44 73 L44 74 L38 74 Z" fill="#000" opacity=".2" filter="url(#o2bf1)"/>
  <path d="M84 73 L90 73 L90 74 L84 74 Z" fill="#000" opacity=".2" filter="url(#o2bf1)"/>
  <path d="M38.8 62.5 L38.8 72.4 M89.2 62.5 L89.2 72.4" stroke="#000" stroke-width=".5" opacity=".4" fill="none"/>
</svg>
