</g>

<!-- 8. cesta de estiba en la popa de la torreta -->
<path d="M45.2 108.4 L67.7 130.5 L67.7 118.5 L45.2 96.4 Z" fill="#564c37"/>
<path d="M67.7 130.5 L87.1 125.2 L87.1 113.2 L67.7 118.5 Z" fill="#6a5e45"/>
<path d="M45.2 96.4 L64.6 91.1 L87.1 113.2 L67.7 118.5 Z" fill="#5f553e"/>
<g stroke="#2f2a1e" stroke-opacity="0.7" stroke-width="0.8">
  <path d="M52 103 L74.5 125.1"/>
  <path d="M59 99.8 L81.5 121.9"/>
  <path d="M74 122 L76 113.8"/>
  <path d="M81 119.7 L83 111.5"/>
</g>

<!-- 9. torreta en cuna: popa, flanco derecho, techo -->
<path d="M63.7 109.2 L87.6 132.6 L87.6 112.6 L63.7 89.2 Z" fill="url(#g-rear)"/>
<path d="M87.6 132.6 L136.7 120.8 L152.1 107.1 L152.1 87.1 L136.7 100.8 L87.6 112.6 Z" fill="url(#g-flank)"/>
<path d="M63.7 89.2 L110.0 74.6 L140.4 75.6 L152.1 87.1 L136.7 100.8 L87.6 112.6 Z" fill="url(#g-deck)"/>
<path d="M110.0 74.6 L136.7 100.8" fill="none" stroke="#6d6046" stroke-opacity="0.5" stroke-width="1.1"/>
<path d="M63.7 89.2 L110.0 74.6 L140.4 75.6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4"/>

<!-- 10. caja de estiba en el flanco de la torreta -->
<path d="M102.8 130.1 L133.7 121.5 L133.7 109.5 L102.8 118.1 Z" fill="#8d7f5e" stroke="#5a5039" stroke-width="0.9"/>
<path d="M118 125.5 L118 113.8" fill="none" stroke="#5a5039" stroke-opacity="0.7" stroke-width="0.9"/>

<!-- 11. lanzagranadas fumigenas -->
<path d="M143.5 105.5 L152.5 103.2 L152.5 97.6 L143.5 99.9 Z" fill="#5c5340" stroke="#2f2a1e" stroke-width="0.7"/>
<g fill="#2b271c">
