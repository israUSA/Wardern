<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- BMP-1 (T1 oriental, motorizada). Verde ruso. Camara y escala del set (20.9 px/m).
     Casco 6.74 x 2.94 x 2.07 m: largo, estrecho y bajisimo.
     Identidad: 6 ruedas pequenas con MOTRIZ DELANTERA y 3 rodillos, proa muy
     apuntada de casco anfibio, torreta troncoconica DIMINUTA con el canon corto
     2A28 Grom de 73 mm y el rail del misil Malyutka encima del canon,
     4 escotillas de tropa en la cubierta trasera. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#9aa878"/><stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/><stop offset="1" stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#6b7a4e"/><stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1" stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-turret" x1="0.2" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#8b9a69"/><stop offset="0.5" stop-color="#6d7c50"/>
    <stop offset="1" stop-color="#4e5c38"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#485636"/><stop offset="0.6" stop-color="#374327"/>
    <stop offset="1" stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#a6b28a"/><stop offset="0.5" stop-color="#717d5a"/>
    <stop offset="1" stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#26261f"/>
    <stop offset="1" stop-color="#171712"/>
  </linearGradient>
</defs>
<path d="M31 148 L162 111 L194 140 L61 178 Z" fill="#080a06" opacity="0.30"/>

<!-- popa: dos puertas que son depositos de combustible -->
<path d="M34.8 116.6 L63.4 144.6 L63.4 171.6 L34.8 143.6 Z" fill="url(#g-rear)"/>
<g fill="#4c5a35" stroke="#1f2716" stroke-width="0.9">
  <path d="M37.5 123 L48 133.3 L48 156 L37.5 145.7 Z"/>
  <path d="M50 135.2 L60.5 145.5 L60.5 168 L50 157.7 Z"/>
</g>
<circle cx="36.5" cy="120" r="2.2" fill="#8f5b30"/>

<!-- cubierta y proa apuntada -->
<path d="M34.8 116.6 L112.5 95.1 L141.1 123.1 L63.4 144.6 Z" fill="url(#g-deck)"/>
<path d="M112.5 95.1 L159.3 94.2 L187.9 122.2 L141.1 123.1 Z" fill="url(#g-deck)"/>
<path d="M112.5 95.1 L141.1 123.1" fill="none" stroke="#3b4728" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M112.5 95.1 L159.3 94.2 L187.9 122.2 L141.1 123.1 Z" fill="#ffffff" fill-opacity="0.08"/>
<ellipse cx="150" cy="107" rx="6" ry="4" fill="#6d7c50" stroke="#333d22" stroke-width="1"/>
<g fill="#3b4728">
  <path d="M163 98 L168 103 L165.4 104.2 L160.4 99.2 Z"/>
  <path d="M174 109 L179 114 L176.4 115.2 L171.4 110.2 Z"/>
</g>
<!-- 4 escotillas de tropa -->
<g fill="#6d7c50" stroke="#333d22" stroke-width="0.9">
  <path d="M48.3 118.8 L64.2 114.4 L71.7 121.7 L55.8 126.1 Z"/>
  <path d="M58.6 128.9 L74.5 124.5 L82.0 131.9 L66.1 136.2 Z"/>
  <path d="M67.7 113.4 L83.6 109.0 L91.1 116.4 L75.2 120.8 Z"/>
  <path d="M78.0 123.5 L93.9 119.1 L101.4 126.5 L85.5 130.9 Z"/>
</g>

<!-- flanco -->
<path d="M63.4 144.6 L141.1 123.1 L187.9 122.2 L63.4 156.6 Z" fill="url(#g-flank)"/>
<path d="M63.4 144.6 L141.1 123.1" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>

<!-- tren de rodaje -->
<path d="M62.2 173.7 L191.9 137.9 L191.9 122.9 L62.2 158.7 Z" fill="url(#g-trk)"/>
<g fill="#3d4433" stroke="#17190f" stroke-width="1">
  <ellipse cx="75.4"  cy="162.6" rx="5.2" ry="6.2"/>
  <ellipse cx="96.6"  cy="156.7" rx="5.2" ry="6.2"/>
  <ellipse cx="117.8" cy="150.9" rx="5.2" ry="6.2"/>
  <ellipse cx="139.0" cy="145.0" rx="5.2" ry="6.2"/>
  <ellipse cx="160.2" cy="139.2" rx="5.2" ry="6.2"/>
  <ellipse cx="181.4" cy="133.3" rx="5.2" ry="6.2"/>
</g>
<g fill="#5a6247">
  <ellipse cx="75.4"  cy="162.6" rx="1.9" ry="2.3"/>
  <ellipse cx="96.6"  cy="156.7" rx="1.9" ry="2.3"/>
  <ellipse cx="117.8" cy="150.9" rx="1.9" ry="2.3"/>
  <ellipse cx="139.0" cy="145.0" rx="1.9" ry="2.3"/>
  <ellipse cx="160.2" cy="139.2" rx="1.9" ry="2.3"/>
  <ellipse cx="181.4" cy="133.3" rx="1.9" ry="2.3"/>
</g>
<ellipse cx="186.7" cy="128.3" rx="6.8" ry="8"   fill="#454c39" stroke="#17190f" stroke-width="1.1"/>
<ellipse cx="66.6"  cy="161.5" rx="6.2" ry="7.4" fill="#454c39" stroke="#17190f" stroke-width="1.1"/>
<g fill="#454c39" stroke="#17190f" stroke-width="0.8">
  <ellipse cx="91.3"  cy="149.7" rx="2.4" ry="2.8"/>
  <ellipse cx="123.1" cy="140.9" rx="2.4" ry="2.8"/>
  <ellipse cx="154.9" cy="132.1" rx="2.4" ry="2.8"/>
</g>
<path d="M63 174 L192.5 138.3" fill="none" stroke="#080a06" stroke-opacity="0.55" stroke-width="3"/>

<!-- torreta troncoconica diminuta -->
<path d="M118.8 111.4 C123.2 115.7 120.1 121.0 111.8 123.3
         C103.5 125.6 93.2 123.9 88.8 119.6
         C84.4 115.3 87.5 110.0 95.8 107.7
         C104.1 105.4 114.4 107.1 118.8 111.4 Z" fill="url(#g-flank)"/>
<path d="M118.8 95.4 C123.2 99.7 120.1 105.0 111.8 107.3
         C103.5 109.6 93.2 107.9 88.8 103.6
         C84.4 99.3 87.5 94.0 95.8 91.7
         C104.1 89.4 114.4 91.1 118.8 95.4 Z" fill="url(#g-turret)"/>
<path d="M88.8 103.6 C84.4 99.3 87.5 94.0 95.8 91.7 C104.1 89.4 114.4 91.1 118.8 95.4"
      fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.3"/>
<ellipse cx="99" cy="97" rx="4.6" ry="3.2" fill="#5f6f42" stroke="#333d22" stroke-width="0.9"/>

<!-- canon corto 2A28 de 73 mm -->
<path d="M114 105 L121 99 L127 103 L120 109 Z" fill="#6d7c50" stroke="#333d22" stroke-width="0.9"/>
<path d="M117.9 98.8 L152.3 89.3 L154.3 96.3 L119.9 105.8 Z" fill="url(#g-metal)"/>
<ellipse cx="153.3" cy="92.8" rx="1.6" ry="3.4" fill="#12150e"/>
<path d="M117.9 98.8 L152.3 89.3 L152.6 90.5 L118.2 100 Z" fill="#ffffff" fill-opacity="0.32"/>
<!-- rail y misil Malyutka encima del canon: marca del BMP-1 -->
<path d="M119 92 L120.5 89.5 L138 84.7 L141 85.6 L139.5 88.2 L122 93 Z" fill="#7e8d5e" stroke="#333d22" stroke-width="0.8"/>
<path d="M124 91.5 L127 88 L129 88.6 L126 92.1 Z" fill="#4e5c38"/>
<path d="M120 100 L120 95.5 L124 94.4 L124 98.9 Z" fill="#5f6f42" stroke="#333d22" stroke-width="0.8"/>
</svg>
