<!-- Krivak, Proyecto 1135 (T1 oriental, fragata). Gris ruso. Identidad: el enorme contenedor cuadruple del misil Metel dominando toda la proa por delante del puente, palo enrejado sovietico, y los DOS montajes de canon de 100 mm apilados en la POPA en vez de en la proa: es la fragata del set con la artilleria al reves.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
