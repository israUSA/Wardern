<!-- Alligator, Proyecto 1171 (T1 oriental, transporte). Gris ruso. Buque de desembarco de carros sovietico. Identidad: casco de carguero con la superestructura al extremo de popa y DOS GRUAS DE PLUMA a lo largo de la cubierta de carga, mas puertas de proa; el aspecto es el de un mercante armado, no el de un buque de guerra.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
