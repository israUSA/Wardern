<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- USS Independence LCS (T2 occidental, corbeta). Gris OTAN. Identidad inconfundible: es un TRIMARAN, con diferencia el casco mas ancho del set para su eslora, lo que le da una cubierta de vuelo enorme a popa. Superestructura facetada furtiva adelantada, hangar amplio y un solo canon de 57 mm en la proa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
