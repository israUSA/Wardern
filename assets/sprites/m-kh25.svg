<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- Kh-25ML (AS-10 Karen - Guía Láser Semi-Activa)
       Orientación: Punta hacia ARRIBA (Norte)
       Características:
       - Buscador láser frontal oscuro con ventana óptica redondeada
       - Cuatro canards delanteros triangulares de control
       - Fuselaje cilíndrico en gris claro / blanco sucio soviético
       - Tubos laterales / conductos de cableado longitudinales característicos
       - Grandes aletas traseras en flecha trapezoidal
       - Sección de cola y tobera de propulsor de crucero -->
  <defs>
    <!-- Gradiente cilíndrico del fuselaje gris claro -->
    <linearGradient id="kh25-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ea7ac"/>
      <stop offset="28%" stop-color="#e2e8ec"/>
      <stop offset="68%" stop-color="#c1c9ce"/>
      <stop offset="100%" stop-color="#7c868c"/>
    </linearGradient>

    <!-- Resplandor lateral longitudinal para dar volumen 3D -->
    <linearGradient id="kh25-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Cabeza del seeker láser frontal oscuro -->
    <linearGradient id="kh25-seeker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#343b3e"/>
      <stop offset="35%" stop-color="#677277"/>
      <stop offset="70%" stop-color="#4a5357"/>
      <stop offset="100%" stop-color="#222729"/>
    </linearGradient>

    <!-- Aletas en sombra y luz -->
    <linearGradient id="fin-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8c1c6"/>
      <stop offset="100%" stop-color="#889398"/>
    </linearGradient>
    <linearGradient id="fin-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#939da2"/>
      <stop offset="100%" stop-color="#697277"/>
    </linearGradient>

    <!-- Conductos longitudinales de cables -->
    <linearGradient id="fairing-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#646d72"/>
      <stop offset="50%" stop-color="#8a9499"/>
      <stop offset="100%" stop-color="#4d5559"/>
    </linearGradient>
  </defs>

  <!-- ================= ALETAS TRASERAS DE COLA (FLECHA TRAPEZOIDAL) ================= -->
  <!-- Aleta trasera izquierda -->
  <polygon points="13.8,45 6.5,49.5 6.5,56 11,53.5 13.8,54.5" 
           fill="url(#fin-left)" 
           stroke="#3d4447" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- Aleta trasera derecha -->
  <polygon points="18.2,45 25.5,49.5 25.5,56 21,53.5 18.2,54.5" 
           fill="url(#fin-right)" 
           stroke="#31373a" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- ================= CANARDS DELANTEROS DE CONTROL ================= -->
  <!-- Canard izquierdo -->
  <polygon points="13.8,15.5 10.2,18 13.8,19" 
           fill="url(#fin-left)" 
           stroke="#3d4447" 
           stroke-width="0.22" 
           stroke-linejoin="round"/>

  <!-- Canard derecho -->
  <polygon points="18.2,15.5 21.8,18 18.2,19" 
           fill="url(#fin-right)" 
           stroke="#31373a" 
           stroke-width="0.22" 
           stroke-linejoin="round"/>

  <!-- Canard vertical dorsal -->
  <polygon points="15.6,15.2 15.6,12.5 16.4,12.5 16.4,15.2" fill="#cfd7dc" stroke="#3d4447" stroke-width="0.18"/>

  <!-- ================= CUERPO PRINCIPAL DEL MISIL ================= -->
  <!-- Ojiva cónica superior -->
  <path d="M 13.8 11.5 
           C 13.8 7.5, 14.7 4.5, 16 4.5 
           C 17.3 4.5, 18.2 7.5, 18.2 11.5 
           Z" 
        fill="url(#kh25-body)"/>

  <!-- Tubo cilíndrico completo -->
  <rect x="13.8" y="11.5" width="4.4" height="44" fill="url(#kh25-body)"/>

  <!-- Brillo cilíndrico longitudinal -->
  <rect x="13.8" y="4.5" width="4.4" height="51" fill="url(#kh25-shine)"/>

  <!-- ================= CABEZA BUSCADORA LÁSER FRONTAL (24N1) ================= -->
  <!-- Ojiva óptica oscura cilíndrica-redondeada -->
  <path d="M 14.5 7.5 C 14.5 4.5, 15.1 3, 16 3 C 16.9 3, 17.5 4.5, 17.5 7.5 Z" 
        fill="url(#kh25-seeker)" 
        stroke="#1a1e20" 
        stroke-width="0.2"/>
  <ellipse cx="16" cy="7.5" rx="1.5" ry="0.4" fill="#24292b"/>

  <!-- Lente óptica central del sensor de haz láser -->
  <ellipse cx="16" cy="3.5" rx="0.65" ry="0.35" fill="#111517"/>
  <ellipse cx="15.8" cy="3.3" rx="0.25" ry="0.15" fill="#ffffff" opacity="0.6"/>

  <!-- Collar metálico de separación de la sección sensora -->
  <line x1="13.8" y1="11.5" x2="18.2" y2="11.5" stroke="#5b656a" stroke-width="0.25"/>

  <!-- Micro-perforaciones / tomas de aire barométricas en la ojiva -->
  <circle cx="15.3" cy="13.2" r="0.18" fill="#383f42"/>
  <circle cx="16" cy="13.2" r="0.18" fill="#383f42"/>
  <circle cx="16.7" cy="13.2" r="0.18" fill="#383f42"/>
  <circle cx="15.3" cy="14.2" r="0.18" fill="#383f42"/>
  <circle cx="16" cy="14.2" r="0.18" fill="#383f42"/>
  <circle cx="16.7" cy="14.2" r="0.18" fill="#383f42"/>

  <!-- ================= CANALES LONGITUDINALES Y CARENADOS ================= -->
  <!-- Túnel de cableado dorsal principal -->
  <rect x="15.5" y="21" width="1" height="23" rx="0.3" fill="url(#fairing-grad)" stroke="#313639" stroke-width="0.15"/>

  <!-- Zapata de anclaje para lanzador APU-68 -->
  <rect x="15.3" y="27" width="1.4" height="2.6" rx="0.2" fill="#4d5559" stroke="#252a2d" stroke-width="0.15"/>
  <rect x="15.3" y="38" width="1.4" height="2.6" rx="0.2" fill="#4d5559" stroke="#252a2d" stroke-width="0.15"/>

  <!-- Carenados laterales de interconexión con toberas de motor cohete -->
  <polygon points="13.8,32 13.2,33.5 13.2,43 13.8,44" fill="#5a6368" stroke="#313639" stroke-width="0.15"/>
  <polygon points="18.2,32 18.8,33.5 18.8,43 18.2,44" fill="#495054" stroke="#252a2d" stroke-width="0.15"/>

  <!-- Juntas de separación de secciones del fuselaje -->
  <line x1="13.8" y1="20" x2="18.2" y2="20" stroke="#717c82" stroke-width="0.2"/>
  <line x1="13.8" y1="31" x2="18.2" y2="31" stroke="#717c82" stroke-width="0.2"/>
  <line x1="13.8" y1="44.5" x2="18.2" y2="44.5" stroke="#717c82" stroke-width="0.2"/>

  <!-- ================= TOBERA Y SECCIÓN DE ESCAPE TRASERA ================= -->
  <path d="M 14.3 55.5 L 17.7 55.5 L 17.3 58.5 L 14.7 58.5 Z" fill="#202426" stroke="#0e1112" stroke-width="0.25"/>
  <circle cx="16" cy="58.2" r="0.6" fill="#0d0f10"/>
</svg>

