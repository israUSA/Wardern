<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- USS Newport LST (T1 occidental, transporte). Gris OTAN. Buque de desembarco de carros. Identidad: superestructura y chimenea empujadas al extremo de POPA para dejar libre toda la cubierta de carga, y sobre la proa el PORTICO EN A de dos brazos unidos arriba que sostiene la rampa de desembarco de 34 m. Ningun otro buque del set lleva esa horca en la proa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
