<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64">
  <!-- Misil guiado GENÉRICO. Es el respaldo de cualquier arma sin arte propio.
       CONVENCIÓN: morro hacia ARRIBA (norte), igual que los sprites de avión;
       el render lo gira al rumbo. Dibujo base a propósito: sustitúyelo cuando
       tengas el bueno, el motor no depende de ninguna forma concreta. -->
  <defs>
    <linearGradient id="mg-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8dee5"/>
      <stop offset="0.45" stop-color="#9aa4ae"/>
      <stop offset="1" stop-color="#5b646d"/>
    </linearGradient>
    <linearGradient id="mg-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#ffa83c"/>
      <stop offset="1" stop-color="#e2541f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- llama del motor -->
  <path d="M13 50 L19 50 C20 56 18 61 16 64 C14 61 12 56 13 50 Z" fill="url(#mg-flame)"/>

  <!-- aletas traseras -->
  <path d="M12.5 40 L4 45 L4 50 L12.5 46 Z" fill="#49525b"/>
  <path d="M19.5 40 L28 45 L28 50 L19.5 46 Z" fill="#49525b"/>
  <!-- aletas de guiado delanteras -->
  <path d="M12.5 20 L6 23 L6 27 L12.5 25 Z" fill="#5b646d"/>
  <path d="M19.5 20 L26 23 L26 27 L19.5 25 Z" fill="#5b646d"/>

  <!-- fuselaje -->
  <rect x="12.4" y="12" width="7.2" height="38" rx="1.2" fill="url(#mg-body)"/>
  <!-- banda de identificación -->
  <rect x="12.4" y="26" width="7.2" height="2.4" fill="#c9432f"/>
  <!-- ojiva -->
  <path d="M12.4 12 C13.4 5 14.6 1.5 16 0 C17.4 1.5 18.6 5 19.6 12 Z" fill="#39424b"/>
  <!-- brillo lateral -->
  <rect x="13.4" y="13" width="1.2" height="36" rx="0.6" fill="#ffffff" opacity="0.35"/>
</svg>
