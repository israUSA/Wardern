<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- B-21 Raider - vista superior, morro al norte. ALA VOLADORA mas compacta y LIMPIA
       que el B-2: envergadura menor, morro mas romo, borde de salida con SIERRA mas
       profunda y pocos quiebres, tomas gemelas integradas, sin timones visibles.
       Tinte por pais: .base/.shade/.light/.hi. Fijos: .metalS/.metalL, .glass, .dark. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="b21f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="b21f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="b21gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".5" stop-color="#000" stop-opacity=".16"/><stop offset=".8" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="b21g1" gradientUnits="userSpaceOnUse" x1="54" y1="18" x2="74" y2="94">
    <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".4" stop-color="#fff" stop-opacity=".06"/><stop offset=".72" stop-color="#000" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="b21g2" gradientUnits="userSpaceOnUse" x1="22" y1="44" x2="22" y2="86">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="b21g4" gradientUnits="userSpaceOnUse" x1="62" y1="18" x2="62" y2="25">
    <stop offset="0" stop-color="#e8f4fb" stop-opacity=".85"/><stop offset=".4" stop-color="#9cc4dc" stop-opacity=".4"/><stop offset="1" stop-color="#28495e" stop-opacity=".6"/>
  </linearGradient>
  </defs>

  <ellipse cx="64" cy="62" rx="52" ry="54" fill="url(#b21gs)"/>

  <!-- ===== ala voladora compacta ===== -->
  <path class="base" d="M64 12 C58 18.5 42 32 26 46.5 L15.5 57 L14.5 66 L22 78.5 L34 79 L40.5 90 L54 89 L58.5 100 L64 102.5 L69.5 100 L74 89 L87.5 90 L94 79 L106 78.5 L113.5 66 L112.5 57 L102 46.5 C86 32 70 18.5 64 12 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M64 12 C58 18.5 42 32 26 46.5 L15.5 57 L14.5 66 L22 78.5 L34 79 L40.5 90 L54 89 L58.5 100 L64 102.5 L69.5 100 L74 89 L87.5 90 L94 79 L106 78.5 L113.5 66 L112.5 57 L102 46.5 C86 32 70 18.5 64 12 Z" fill="url(#b21g1)"/>
  <path d="M64 12 C58 18.5 42 32 26 46.5 L15.5 57 L14.5 66 L22 78.5 L34 79 L40.5 90 L54 89 L58.5 100 L64 102.5 L69.5 100 L74 89 L87.5 90 L94 79 L106 78.5 L113.5 66 L112.5 57 L102 46.5 C86 32 70 18.5 64 12 Z" fill="url(#b21g2)" opacity=".5"/>
  <!-- borde de ataque iluminado -->
  <path class="light" d="M64 12.6 C58.4 18.8 42.6 32.4 26.6 46.9 L16.3 56.9 L15.4 64.6 L26.8 47.9 L64 15.4 L101.2 47.9 L112.6 64.6 L111.7 56.9 L101.4 46.9 C85.4 32.4 69.6 18.8 64 12.6 Z" opacity=".9"/>
  <path d="M63.7 14 C55.6 21.4 40 34.8 24.6 48.4" stroke="#fff" stroke-width=".9" opacity=".45" fill="none"/>
  <path d="M64.3 14 C72.4 21.4 88 34.8 103.4 48.4" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <!-- borde de salida en sombra + sierra profunda -->
  <path class="dark" d="M22 78.5 L34 79 L40.5 90 L54 89 L58.5 100 L64 102.5 L69.5 100 L74 89 L87.5 90 L94 79 L106 78.5 L113.5 66 L113.3 69 L106.2 80.7 L94.2 81.2 L87.7 92.2 L74.2 91.2 L69.7 102.2 L64 104.9 L58.3 102.2 L53.8 91.2 L40.3 92.2 L33.8 81.2 L21.8 80.7 L14.7 69 L14.5 66 Z" opacity=".5"/>
  <!-- lineas de panel radiales -->
  <path d="M57 28 L32 66 M51 34 L36 74 M71 28 L96 66 M77 34 L92 74 M59 42 L44 82 M69 42 L84 82" stroke="#000" stroke-width=".5" opacity=".16" fill="none"/>

  <!-- ===== morro romo con cabina integrada ===== -->
  <path class="shade" d="M58.9 18.5 C60.3 16.8 67.7 16.8 69.1 18.5 L69.4 23.5 C66.2 25.2 61.8 25.2 58.6 23.5 Z"/>
  <path d="M59.2 19 C60.5 17.6 67.5 17.6 68.8 19" stroke="#fff" stroke-width=".6" opacity=".4" fill="none"/>
  <path class="glass" d="M60.6 19.3 L67.4 19.3 L67.9 22.6 C65.5 23.8 62.5 23.8 60.1 22.6 Z"/>
  <path d="M60.6 19.3 L67.4 19.3 L67.9 22.6 C65.5 23.8 62.5 23.8 60.1 22.6 Z" fill="url(#b21g4)"/>
  <path d="M60.6 19.3 L67.4 19.3 L67.9 22.6 C65.5 23.8 62.5 23.8 60.1 22.6 Z" fill="none" stroke="#243b4d" stroke-width=".6"/>
  <path d="M62.9 19.3 L62.8 22.4 M65.1 19.3 L65.2 22.4" stroke="#243b4d" stroke-width=".5" opacity=".9" fill="none"/>
  <ellipse cx="61.8" cy="20.7" rx=".7" ry="1.5" transform="rotate(8 61.8 20.7)" fill="#fff" opacity=".85"/>

  <!-- ===== tomas gemelas integradas ===== -->
  <path class="dark" d="M56.6 36 C56.1 41.5 55.9 47 56.3 52 L60.8 51 C60.3 45.8 60.2 40.8 60.6 36.3 C59.2 36.8 57.8 36.5 56.6 36 Z" opacity=".6"/>
  <path class="dark" d="M71.4 36 C71.9 41.5 72.1 47 71.7 52 L67.2 51 C67.7 45.8 67.8 40.8 67.4 36.3 C68.8 36.8 70.2 36.5 71.4 36 Z" opacity=".6"/>
  <path d="M57.2 38.4 L60 38 M68.8 38.4 L71.6 38 M57 43 L59.8 42.7 M69 43 L71.8 42.7" stroke="#000" stroke-width=".4" opacity=".4" fill="none"/>
  <!-- bahia de armas central -->
  <path d="M61 64 C62.8 64.8 65.2 64.8 67 64 M60.8 74 C62.8 74.8 65.2 74.8 67.2 74" stroke="#000" stroke-width=".55" opacity=".25" fill="none"/>
  <!-- escapes en el borde de salida central -->
  <path class="metalL" d="M60.6 92.5 L62.2 91.8 L61.8 96.8 L60.4 97.2 Z M67.4 92.5 L65.8 91.8 L66.2 96.8 L67.6 97.2 Z" opacity=".9"/>
  <!-- antena de cuchilla -->
  <path class="dark" d="M60.7 58 L61.5 58 L61.5 62 L60.7 62 Z" opacity=".85"/>
  <!-- luz de formacion -->
  <path class="hi" d="M20.6 61.5 L21.8 61.5 L21.8 63.5 L20.6 63.5 Z" opacity=".8"/>
  <path class="hi" d="M107.4 61.5 L106.2 61.5 L106.2 63.5 L107.4 63.5 Z" opacity=".8"/>
</svg>
