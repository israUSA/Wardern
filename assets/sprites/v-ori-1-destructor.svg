<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Kashin, Proyecto 61 (T1 oriental, destructor). Gris ruso. Primer destructor del mundo con propulsion enteramente por turbina de gas. Identidad: los DOS pares de lanzadores de misil antiaereo Volna montados en la cubierta, uno a proa y otro a popa, mas dos palos enrejados altisimos con antenas platos. Canones de 76 mm en ambos extremos.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
