<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Destructor proyecto 61 KASHIN (1962) - vista superior, proa al norte.
       Canon gemelo AK-726 a proa, lanzadores gemelos SA-N-1 "Volna" (rieles largos)
       a proa y a popa, UNA chimenea central ancha con el mastil-pilon hexagonal del
       radar MR-310 "Angara" encima, superestructura austera de lineas rectas,
       tubos torpederos a banda.
       Tinte por pais: sobreescribir .base/.shade/.light/.hi (casco, cubierta, superestructuras).
       Fijos: .metal/.metalS/.metalL (canones, lanzadores, radares), .dark, .glass, .rubber.
       Volumen: g1 transversal del casco, g2 longitudinal cubierta, g3 bloques, g4 chimenea. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="or1f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="or1f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <radialGradient id="or1gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="or1g1" gradientUnits="userSpaceOnUse" x1="42" y1="64" x2="86" y2="64">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".18" stop-color="#fff" stop-opacity=".18"/><stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="or1g2" gradientUnits="userSpaceOnUse" x1="64" y1="8" x2="64" y2="119">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".24"/>
  </linearGradient>
  <linearGradient id="or1g3" gradientUnits="userSpaceOnUse" x1="52" y1="70" x2="76" y2="70">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".28" stop-color="#fff" stop-opacity=".14"/><stop offset=".6" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="or1g4" gradientUnits="userSpaceOnUse" x1="54" y1="87" x2="74" y2="87">
    <stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="or1g5" gradientUnits="userSpaceOnUse" x1="46" y1="14" x2="84" y2="114">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="63" cy="66" rx="34" ry="63" fill="url(#or1gs)"/>

  <!-- ===== casco ===== -->
  <path class="shade" d="M64 7 C56.5 11.5 49 20 45.6 32 L43.2 43 L42.6 98 L46.8 111.5 L50.8 118.4 L77.2 118.4 L81.2 111.5 L85.4 98 L84.8 43 L82.4 32 C79 20 71.5 11.5 64 7 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 7 C56.5 11.5 49 20 45.6 32 L43.2 43 L42.6 98 L46.8 111.5 L50.8 118.4 L77.2 118.4 L81.2 111.5 L85.4 98 L84.8 43 L82.4 32 C79 20 71.5 11.5 64 7 Z" fill="url(#or1g1)"/>
  <!-- cubierta -->
  <path class="base" d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L46.2 43.2 L45.8 97.4 L49.6 110.2 L53 116 L75 116 L78.4 110.2 L82.2 97.4 L81.8 43.2 L79.6 32.6 C76.8 22 70.2 14 64 9.8 Z"/>
  <path d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L46.2 43.2 L45.8 97.4 L49.6 110.2 L53 116 L75 116 L78.4 110.2 L82.2 97.4 L81.8 43.2 L79.6 32.6 C76.8 22 70.2 14 64 9.8 Z" fill="url(#or1g2)"/>
  <path d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L46.2 43.2 L45.8 97.4 L49.6 110.2 L53 116 L75 116 L78.4 110.2 L82.2 97.4 L81.8 43.2 L79.6 32.6 C76.8 22 70.2 14 64 9.8 Z" fill="url(#or1g5)"/>
  <!-- rim light babor + sombra estribor -->
  <path d="M47 42.6 L47.4 96 L51 108.6" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M81 42.6 L80.6 96 L77 108.6" stroke="#000" stroke-width="1.6" opacity=".24" fill="none" filter="url(#or1f1)"/>
  <!-- linea de crujia -->
  <path d="M64 11 L64 114.5" stroke="#b8bfa2" stroke-width=".8" opacity=".4" fill="none"/>
  <!-- brillete de proa -->
  <path class="light" d="M64 9.8 C57.8 14 51.2 22 48.4 32.6 L50.4 33 C53.2 22.8 59.4 15.4 65.4 11.2 Z" opacity=".7"/>
  <!-- anclas y cabrestantes -->
  <circle class="metalL" cx="52.5" cy="18.5" r="1.3"/><circle class="metalL" cx="75.5" cy="18.5" r="1.3"/>
  <path d="M50.8 16 L54 20 M74.6 20 L77.8 16" stroke="#4a5057" stroke-width=".8" fill="none"/>
  <path d="M49 24.5 L52 27.5 M79 24.5 L76 27.5" stroke="#3d4232" stroke-width=".9" opacity=".6" fill="none"/>

  <!-- ===== canon gemelo AK-726 de proa ===== -->
  <path class="dark" d="M60.2 30.6 L67.8 30.6 L66.8 36.6 L61.2 36.6 Z" opacity=".85"/>
  <!-- dos canas paralelas -->
  <path class="metal" d="M62.1 18.8 L63.2 18.8 L63.1 29.2 L62 29.2 Z"/>
  <path class="metal" d="M64.8 18.8 L65.9 18.8 L66 29.2 L64.9 29.2 Z"/>
  <path class="hi" d="M62.3 19.2 L62.6 19.2 L62.5 28.8 L62.2 28.8 Z" opacity=".6"/>
  <path class="hi" d="M65 19.2 L65.3 19.2 L65.4 28.8 L65.1 28.8 Z" opacity=".6"/>
  <path class="metalL" d="M61.9 17 L63.4 17 L63.3 19.6 L62 19.6 Z"/>
  <path class="metalL" d="M64.6 17 L66.1 17 L66.2 19.6 L64.9 19.6 Z"/>
  <!-- torre gemela -->
  <path class="metalS" d="M59.6 28.8 L68.4 28.8 L68.4 33.4 Q68.4 35.6 66 35.6 L62 35.6 Q59.6 35.6 59.6 33.4 Z"/>
  <path d="M60.4 29.5 L67.6 29.5" stroke="#fff" stroke-width=".7" opacity=".4" fill="none"/>
  <path class="shade" d="M60.2 34.4 L67.8 34.4 L67 37.2 L61 37.2 Z"/>
  <!-- oclusion del canon sobre la cubierta -->
  <path d="M60.4 37 L67.6 37 L67 39.6 L61 39.6 Z" fill="#000" opacity=".22" filter="url(#or1f1)"/>

  <!-- ===== lanzador gemelo SA-N-1 Volna a proa (rieles largos) ===== -->
  <rect class="dark" x="58" y="39.8" width="12" height="13.6" rx="1.5" opacity=".9"/>
  <path class="shade" d="M58.8 40.6 L69.2 40.6 L70 45.4 L69.4 52.4 L58.6 52.4 L58 45.4 Z"/>
  <path d="M58.8 41 L69.2 41" stroke="#fff" stroke-width=".7" opacity=".35" fill="none"/>
  <!-- dos rieles largos de lanzamiento -->
  <path class="light" d="M61.4 39.2 L62.7 39.2 L62.5 53.8 L61.7 53.8 Z"/>
  <path class="light" d="M65.3 39.2 L66.6 39.2 L66.4 53.8 L65.6 53.8 Z"/>
  <path d="M61.4 39.2 L61.7 53.8 M62.7 39.2 L62.5 53.8 M65.3 39.2 L65.6 53.8 M66.6 39.2 L66.4 53.8" stroke="#2b2e28" stroke-width=".35" opacity=".6" fill="none"/>
  <path d="M61.6 39.6 L61.7 53.2 M65.5 39.6 L65.6 53.2" stroke="#fff" stroke-width=".4" opacity=".5" fill="none"/>
  <rect class="rubber" x="61.6" y="44" width="1" height="2" rx=".4"/>
  <rect class="rubber" x="65.5" y="44" width="1" height="2" rx=".4"/>
  <circle class="metalS" cx="64" cy="46.4" r="1.8"/>
  <circle cx="64" cy="46.4" r=".7" fill="#3d4232"/>
  <path class="dark" d="M60.2 50.2 L67.8 50.2 L67.4 52.6 L60.6 52.6 Z" opacity=".9"/>
  <!-- oclusion del lanzador -->
  <path d="M57 52.6 L71 52.6 L70.6 55.2 L57.4 55.2 Z" fill="#000" opacity=".22" filter="url(#or1f1)"/>

  <!-- ===== superestructura austera (lineas rectas) ===== -->
  <path class="base" d="M53.2 57.6 L74.8 57.6 L76.2 61.8 L76.2 78.4 L51.8 78.4 L51.8 61.8 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M53.2 57.6 L74.8 57.6 L76.2 61.8 L76.2 78.4 L51.8 78.4 L51.8 61.8 Z" fill="url(#or1g3)"/>
  <path d="M52.8 57.8 L75.2 57.8" stroke="#fff" stroke-width="1" opacity=".45" fill="none"/>
  <path d="M52.2 58.4 L52.2 78" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <path d="M75.8 58.4 L75.8 78" stroke="#000" stroke-width="1.3" opacity=".26" fill="none" filter="url(#or1f1)"/>
  <!-- oclusion al pie de la superestructura -->
  <path d="M51 78.4 L77 78.4 L76.8 81.4 L51.2 81.4 Z" fill="#000" opacity=".22" filter="url(#or1f1)"/>
  <!-- ventanas del puente -->
  <path class="glass" d="M57.6 60.6 L61.2 60.6 L60.4 63 L58.4 63 Z M70.4 60.6 L66.8 60.6 L67.6 63 L69.6 63 Z"/>
  <path class="glassL" d="M58.3 61.1 L59.7 61.1 L59.4 62 L58.6 62 Z" opacity=".8"/>
  <path class="glassL" d="M69.7 61.1 L68.3 61.1 L68.6 62 L69.4 62 Z" opacity=".8"/>
  <!-- portillos -->
  <rect class="dark" x="60.4" y="66.4" width="2" height="1.4" rx=".3" opacity=".8"/>
  <rect class="dark" x="65.6" y="66.4" width="2" height="1.4" rx=".3" opacity=".8"/>
  <!-- balsas a banda -->
  <rect class="light" x="49.7" y="74.8" width="2.2" height="3.6" rx=".8"/>
  <rect class="light" x="76.1" y="74.8" width="2.2" height="3.6" rx=".8"/>

  <!-- mastil corto con director -->
  <rect class="dark" x="63.2" y="65.6" width="1.6" height="6" rx=".5"/>
  <circle class="metalL" cx="64" cy="66.6" r="1.5"/>
  <path d="M63 66.2 L65 66.6" stroke="#e6e9e2" stroke-width=".5" opacity=".6" fill="none"/>

  <!-- ===== chimenea central ancha ===== -->
  <path class="shade" d="M54.8 80 L73.2 80 L74.4 84.6 L74 94.6 L54 94.6 L53.6 84.6 Z"/>
  <path d="M54.8 80 L73.2 80 L74.4 84.6 L74 94.6 L54 94.6 L53.6 84.6 Z" fill="url(#or1g4)"/>
  <path d="M55.2 80.3 L72.8 80.3" stroke="#fff" stroke-width=".8" opacity=".45" fill="none"/>
  <path class="light" d="M54.8 80 L73.2 80 L72.8 81.8 L55.2 81.8 Z" opacity=".5"/>
  <!-- boca de escape ancha con costilla central -->
  <rect class="dark" x="57.6" y="87.4" width="12.8" height="6.4" rx="1.2"/>
  <rect x="57.9" y="87.7" width="3.4" height="2.6" rx=".8" fill="#fff" opacity=".16"/>
  <path d="M64 87.6 L64 93.6" stroke="#9aa378" stroke-width=".55" opacity=".5" fill="none"/>
  <!-- oclusion bajo la chimenea -->
  <path d="M53.2 94.4 L74.8 94.4 L74.6 97.2 L53.4 97.2 Z" fill="#000" opacity=".22" filter="url(#or1f1)"/>

  <!-- ===== mastil-pilon hexagonal MR-310 Angara sobre la chimenea ===== -->
  <path class="metalS" d="M60.4 80.3 L67.6 80.3 L68.9 83.8 L67.6 87.3 L60.4 87.3 L59.1 83.8 Z" stroke="#000" stroke-opacity=".55" stroke-width=".6"/>
  <path d="M61.1 81 L66.9 81 L68 83.8 L66.9 86.6 L61.1 86.6 L60 83.8 Z" fill="none" stroke="#fff" stroke-width=".4" opacity=".35"/>
  <!-- antena "Angara" rectangular curva -->
  <path class="metalL" d="M58 82.4 L70 82.4 L69.6 85.6 L58.4 85.6 Z"/>
  <path d="M60.2 82.4 L60.2 85.6 M62.4 82.4 L62.4 85.6 M64.6 82.4 L64.6 85.6 M66.8 82.4 L66.8 85.6 M58.6 84 L69.4 84" stroke="#4a5057" stroke-width=".4" opacity=".8" fill="none"/>
  <path d="M58.4 82.6 L69.6 82.6" stroke="#fff" stroke-width=".45" opacity=".4" fill="none"/>
  <!-- domos y grillos en los hombros de la chimenea -->
  <circle class="metalS" cx="56.4" cy="91" r="1.4"/>
  <circle class="metalS" cx="71.6" cy="91" r="1.4"/>
  <path d="M55.5 90.5 L57.3 91 M70.7 91 L72.5 90.5" stroke="#e6e9e2" stroke-width=".45" opacity=".5" fill="none"/>

  <!-- tubos torpederos a banda -->
  <g class="dark" opacity=".75">
    <rect x="49.4" y="80.8" width="2.8" height="2.4" rx=".6"/>
    <rect x="75.8" y="80.8" width="2.8" height="2.4" rx=".6"/>
  </g>
  <path d="M50.1 82 L51.6 82 M76.5 82 L78 82" stroke="#8a929b" stroke-width=".4" opacity=".6" fill="none"/>

  <!-- ===== lanzador gemelo SA-N-1 Volna a popa ===== -->
  <rect class="dark" x="58.4" y="95.8" width="11.2" height="10.8" rx="1.4" opacity=".9"/>
  <path class="shade" d="M59 96.8 L69 96.8 L69.8 100.8 L69.2 104 L58.8 104 L58.2 100.8 Z"/>
  <path d="M59.2 97.2 L68.8 97.2" stroke="#fff" stroke-width=".6" opacity=".3" fill="none"/>
  <path class="dark" d="M60.8 97.2 L67.2 97.2 L66.9 99.4 L61.1 99.4 Z" opacity=".9"/>
  <circle class="metalS" cx="64" cy="99.8" r="1.7"/>
  <circle cx="64" cy="99.8" r=".7" fill="#3d4232"/>
  <!-- rieles hacia popa -->
  <path class="light" d="M61.6 99.4 L62.9 99.4 L63.1 106.4 L62.3 106.4 Z"/>
  <path class="light" d="M65.1 99.4 L66.4 99.4 L66.2 106.4 L65.4 106.4 Z"/>
  <path d="M61.6 99.4 L62.3 106.4 M62.9 99.4 L63.1 106.4 M65.1 99.4 L65.4 106.4 M66.4 99.4 L66.2 106.4" stroke="#2b2e28" stroke-width=".35" opacity=".6" fill="none"/>
  <path d="M61.8 99.8 L62 105.6 M65.3 99.8 L65.5 105.6" stroke="#fff" stroke-width=".4" opacity=".5" fill="none"/>
  <rect class="rubber" x="61.8" y="101.6" width="1" height="1.8" rx=".4"/>
  <rect class="rubber" x="65.6" y="101.6" width="1" height="1.8" rx=".4"/>
  <!-- oclusion del lanzador de popa -->
  <path d="M58.4 104.2 L69.6 104.2 L69.4 107 L58.6 107 Z" fill="#000" opacity=".22" filter="url(#or1f1)"/>

  <!-- ===== canon gemelo AK-726 a popa ===== -->
  <path class="dark" d="M60.2 107.2 L67.8 107.2 L66.8 112.4 L61.2 112.4 Z" opacity=".85"/>
  <path class="metalS" d="M59.6 106.4 L68.4 106.4 L68.4 110.4 Q68.4 112.6 66 112.6 L62 112.6 Q59.6 112.6 59.6 110.4 Z"/>
  <path d="M60.4 107.1 L67.6 107.1" stroke="#fff" stroke-width=".7" opacity=".4" fill="none"/>
  <path class="shade" d="M60.2 111.4 L67.8 111.4 L67 114 L61 114 Z"/>
  <!-- canas hacia popa -->
  <path class="metal" d="M62 112.4 L63.1 112.4 L63.2 116.6 L62.1 116.6 Z"/>
  <path class="metal" d="M64.9 112.4 L66 112.4 L65.9 116.6 L64.8 116.6 Z"/>
  <path class="metalL" d="M61.9 115 L63.4 115 L63.3 116.9 L62 116.9 Z"/>
  <path class="metalL" d="M64.6 115 L66.1 115 L66.2 116.9 L64.9 116.9 Z"/>

  <!-- bote de maniobras a estribor -->
  <path class="light" d="M82.6 60 C84.6 61.4 84.6 64.6 82.6 66 C81.8 64.6 81.8 61.4 82.6 60 Z"/>
  <path d="M82.6 61.4 L82.6 65" stroke="#4a5057" stroke-width=".4" opacity=".6" fill="none"/>
</svg>
