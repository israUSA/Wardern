<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- USS Kitty Hawk (CV-63) — Superportaviones de Propulsión Convencional (Limpio)
       - Eliminadas las figuras sueltas de espuma y estela exterior.
       - Cubierta de vuelo angulada asimétrica con los 4 ascensores de borde exactos.
       - Isla convencional con chimenea y mástil radarico SPS-48/49.
       - Casco naval inferior limpio y marcas completas en cubierta. -->
  <defs>
    <!-- Gradiente de la cubierta de vuelo (Asfalto naval antideslizante) -->
    <linearGradient id="kh-deck" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#7a858f"/>
      <stop offset="40%" stop-color="#8d97a1"/>
      <stop offset="100%" stop-color="#b0bac4"/>
    </linearGradient>

    <!-- Gradiente del casco y costados (Haze Gray naval bajo luz cenital) -->
    <linearGradient id="kh-hull" x1="0" y1="0" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#646d76"/>
      <stop offset="50%" stop-color="#4d555d"/>
      <stop offset="100%" stop-color="#353b42"/>
    </linearGradient>

    <!-- Gradiente de sombra del casco inferior -->
    <linearGradient id="kh-hull-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3339"/>
      <stop offset="100%" stop-color="#1c2024"/>
    </linearGradient>

    <!-- Gradiente de la superestructura / Isla -->
    <linearGradient id="kh-island" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6dde3"/>
      <stop offset="50%" stop-color="#a4aeb8"/>
      <stop offset="100%" stop-color="#6f7983"/>
    </linearGradient>

    <!-- Pista de aterrizaje angulada oscura (zona de caucho de frenado) -->
    <linearGradient id="kh-runway" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#32383f"/>
      <stop offset="100%" stop-color="#444d57"/>
    </linearGradient>

    <!-- Plataformas de ascensores (elevators) -->
    <linearGradient id="kh-elevator" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#555d66"/>
      <stop offset="100%" stop-color="#3e454d"/>
    </linearGradient>
  </defs>

  <!-- ==================== CASCO INFERIOR ==================== -->
  <!-- Espejo de popa y costado de estribor del casco -->
  <polygon points="46,170 58,186 142,144 142,136 46,164" fill="url(#kh-hull-dark)" stroke="#1a1e22" stroke-width="0.6"/>
  <polygon points="58,186 226,104 226,94 142,136 142,144" fill="url(#kh-hull)" stroke="#22272c" stroke-width="0.7"/>
  <!-- Línea de flotación -->
  <line x1="59" y1="187" x2="226" y2="105" stroke="#16191c" stroke-width="1.8"/>

  <!-- Voladizo del casco bajo la proa -->
  <polygon points="226,94 240,86 242,91 226,104" fill="#586169" stroke="#22272c" stroke-width="0.6"/>

  <!-- ==================== CUBIERTA DE VUELO REAL USS KITTY HAWK ==================== -->
  <!-- Canto de espesor de la cubierta de vuelo (borde lateral) -->
  <polygon points="
    236,78 244,83 244,85 236,80
    244,85 218,98 218,100 244,85
    218,100 172,122 172,124 218,100
    172,124 140,139 140,141 172,124
    140,141 68,175 68,177 140,141
    68,177 40,163 40,161 68,175
  " fill="#292e34"/>

  <!-- Superficie principal de la cubierta -->
  <polygon id="kh-flight-deck" points="
    236,78
    244,83
    218,96
    218,100
    196,110
    196,106
    174,116
    174,121
    144,135
    144,140
    124,149
    124,146
    68,173
    42,160
    36,150
    76,131
    76,126
    94,117
    116,113
    178,92
    222,74
  " fill="url(#kh-deck)" stroke="#1a1e22" stroke-width="0.8"/>

  <!-- Borde perimetral de seguridad y resalte de luz en el filo de babor -->
  <polyline points="222,74 178,92 116,113 94,117 76,126 76,131 36,150" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ==================== LOS 4 ASCENSORES DE BORDE ==================== -->
  <!-- Elevador 1 (Estribor proa, delante de la isla): -->
  <polygon points="218,96 202,104 198,102 214,94" fill="url(#kh-elevator)" stroke="#181c20" stroke-width="0.6"/>
  <!-- Elevador 2 (Estribor justo proa a la isla): -->
  <polygon points="194,107 178,115 174,113 190,105" fill="url(#kh-elevator)" stroke="#181c20" stroke-width="0.6"/>
  <!-- Elevador 3 (Estribor popa, detrás de la isla): -->
  <polygon points="144,135 128,143 124,141 140,133" fill="url(#kh-elevator)" stroke="#181c20" stroke-width="0.6"/>
  <!-- Elevador 4 (Babor, en el quiebre de la pista angulada): -->
  <polygon points="76,126 94,117 96,121 78,130" fill="url(#kh-elevator)" stroke="#181c20" stroke-width="0.6"/>

  <!-- Marcas de advertencia amarillas en el perímetro de los 4 ascensores -->
  <line x1="202" y1="104" x2="218" y2="96" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="178" y1="115" x2="194" y2="107" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="128" y1="143" x2="144" y2="135" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="76" y1="126" x2="94" y2="117" stroke="#e6b800" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- ==================== PISTA DE ATERRIZAJE ANGULADA (ANGLED DECK) ==================== -->
  <polygon points="42,159 64,170 148,118 126,107" fill="url(#kh-runway)" opacity="0.88"/>

  <!-- Eje central de la pista de apontaje con línea discontinua blanca -->
  <line x1="48" y1="162" x2="140" y2="112" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.9"/>
  <!-- Líneas de límite de pista (Tramlines blancas) -->
  <line x1="43" y1="158" x2="128" y2="108" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.75"/>
  <line x1="63" y1="169" x2="147" y2="119" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.75"/>

  <!-- Cables de apontaje (4 Arresting Gear Wires) -->
  <g stroke="#1a1c1e" stroke-width="0.8" opacity="0.95">
    <line x1="56" y1="155" x2="68" y2="161"/>
    <line x1="62" y1="151" x2="74" y2="157"/>
    <line x1="68" y1="147" x2="80" y2="153"/>
    <line x1="74" y1="143" x2="86" y2="149"/>
  </g>

  <!-- ==================== CATAPULTAS DE VAPOR Y JBD ==================== -->
  <!-- Catapultas de Proa (Cat 1 y Cat 2) -->
  <line x1="202" y1="87" x2="236" y2="80" stroke="#252a30" stroke-width="1.1"/>
  <line x1="192" y1="92" x2="228" y2="84" stroke="#252a30" stroke-width="1.1"/>
  <!-- Deflectores de chorro (Jet Blast Deflectors - JBD) proa -->
  <rect x="195" y="87" width="4" height="2" transform="rotate(-26 195 87)" fill="#444c54" stroke="#1d2125" stroke-width="0.5"/>
  <rect x="185" y="92" width="4" height="2" transform="rotate(-26 185 92)" fill="#444c54" stroke="#1d2125" stroke-width="0.5"/>

  <!-- Catapultas de Cintura / Babor (Cat 3 y Cat 4) en la pista angulada -->
  <line x1="108" y1="126" x2="134" y2="110" stroke="#252a30" stroke-width="1.1"/>
  <line x1="120" y1="131" x2="144" y2="116" stroke="#252a30" stroke-width="1.1"/>
  <!-- JBD cintura -->
  <rect x="103" y="128" width="4" height="2" transform="rotate(-32 103 128)" fill="#444c54" stroke="#1d2125" stroke-width="0.5"/>

  <!-- ==================== NUMERAL "63" EN PROA ==================== -->
  <g transform="translate(216, 85) rotate(-26) scale(0.65)" fill="#ffffff" fill-opacity="0.85" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="12">
    <text x="0" y="0">63</text>
  </g>

  <!-- ==================== ISLA (SUPERESTRUCTURA DE KITTY HAWK) ==================== -->
  <!-- Sombra proyectada por la isla sobre la cubierta -->
  <polygon points="146,134 176,119 180,110 162,110 138,124" fill="#14181c" opacity="0.38"/>

  <!-- Bloque inferior de la isla -->
  <polygon points="174,112 177,114 177,105 174,103" fill="#848e98" stroke="#333940" stroke-width="0.5"/>
  <polygon points="174,112 148,125 148,116 174,103" fill="url(#kh-island)" stroke="#333940" stroke-width="0.6"/>
  <polygon points="174,103 177,105 151,118 148,116" fill="#c2cbd4" stroke="#333940" stroke-width="0.5"/>

  <!-- Puente de Mando y Pri-Fly -->
  <polygon points="172,103 154,112 154,104 172,95" fill="#a4aeb8" stroke="#333940" stroke-width="0.5"/>
  <polygon points="172,95 175,97 157,106 154,104" fill="#dce3ea" stroke="#333940" stroke-width="0.5"/>
  <line x1="171" y1="99" x2="162" y2="103" stroke="#161c22" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="154,107 151,109 151,104 154,103" fill="#1a222a"/>

  <!-- CHIMENEA (Smokestack) con tapa de escape de hollín -->
  <polygon points="163,99 156,103 156,92 163,88" fill="#5a636c" stroke="#252a30" stroke-width="0.6"/>
  <polygon points="163,88 166,90 159,94 156,92" fill="#8b95a0" stroke="#252a30" stroke-width="0.5"/>
  <polygon points="163,87 166,89 160,92 157,90" fill="#111315" stroke="#000000" stroke-width="0.5"/>

  <!-- MÁSTIL RADÁRICO (SPS-48 3D & TACAN) -->
  <line x1="168" y1="96" x2="168" y2="72" stroke="#2d333a" stroke-width="1.2"/>
  <line x1="168" y1="78" x2="164" y2="82" stroke="#2d333a" stroke-width="0.7"/>
  <line x1="168" y1="84" x2="172" y2="88" stroke="#2d333a" stroke-width="0.7"/>
  <rect x="165" y="74" width="5" height="4" transform="rotate(-15 165 74)" fill="#dfe6ec" stroke="#292f35" stroke-width="0.6"/>
  <circle cx="168" cy="71" r="1.3" fill="#ffffff" stroke="#2b3137" stroke-width="0.5"/>
  <line x1="154" y1="104" x2="154" y2="88" stroke="#333a42" stroke-width="0.9"/>
  <line x1="151" y1="90" x2="157" y2="90" stroke="#333a42" stroke-width="0.7"/>

  <!-- Sponsons defensivos (CIWS / Sea Sparrow) -->
  <polygon points="214,100 220,97 220,101 214,104" fill="#58616a" stroke="#22262a" stroke-width="0.5"/>
  <circle cx="217" cy="99" r="1.1" fill="#eaf0f6"/>
  <polygon points="36,152 40,154 40,158 36,156" fill="#4a5259" stroke="#1c2024" stroke-width="0.5"/>
  <circle cx="38" cy="154" r="1.1" fill="#eaf0f6"/>
</svg>
