<!-- USS Kitty Hawk (T1 occidental, portaviones). Gris OTAN. Portaviones convencional. Identidad: cubierta de vuelo angulada con la isla a estribor y CUATRO ascensores de borde, tres a babor-proa y uno a popa de la isla; isla mas larga y con chimenea propia, al ser de propulsion convencional y no nuclear.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
