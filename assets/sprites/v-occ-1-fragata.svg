<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- USS Knox (T1 occidental, fragata). Gris OTAN. Fragata antisubmarina de los anos 60. Identidad: silueta de un solo bloque, una UNICA chimenea gruesa integrada en el macaron, canon de 127 mm a proa, el lanzador ASROC en cubierta delantera y plataforma de helicoptero a popa. Sin celdas verticales.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
