<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- USS Knox (DE, anos 70) - vista superior, proa al norte. Clasica de escolta:
       canon 5"/54 Mk42 a proa, lanzador ASROC detras del canon (sin VLS), mastil
       de celosia, chimenea-mack unica, racks antisubmarinos a popa y helipad pequeno. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="fr1f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="fr1f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="fr1gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fr1g1" gradientUnits="userSpaceOnUse" x1="46" y1="62" x2="82" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".18" stop-color="#fff" stop-opacity=".18"/><stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="fr1g2" gradientUnits="userSpaceOnUse" x1="64" y1="13" x2="64" y2="110">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".35" stop-color="#fff" stop-opacity=".05"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="fr1g5" gradientUnits="userSpaceOnUse" x1="50" y1="18" x2="80" y2="104">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="fr1g3" gradientUnits="userSpaceOnUse" x1="53" y1="62" x2="75" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".2" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".85" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <linearGradient id="fr1g4" gradientUnits="userSpaceOnUse" x1="58" y1="80" x2="70" y2="80">
    <stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="63" cy="61" rx="27" ry="55" fill="url(#fr1gs)"/>

  <!-- ===== casco ===== -->
  <path class="shade" d="M64 12.5 C58.2 16.3 52.8 23 50.2 32 L48.4 41 L47.8 95 L51 104 L55 108.8 L73 108.8 L77 104 L80.2 95 L79.6 41 L77.8 32 C75.2 23 69.8 16.3 64 12.5 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 12.5 C58.2 16.3 52.8 23 50.2 32 L48.4 41 L47.8 95 L51 104 L55 108.8 L73 108.8 L77 104 L80.2 95 L79.6 41 L77.8 32 C75.2 23 69.8 16.3 64 12.5 Z" fill="url(#fr1g1)"/>
  <!-- cubierta -->
  <path class="base" d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z"/>
  <path d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z" fill="url(#fr1g2)"/>
  <path d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z" fill="url(#fr1g5)"/>
  <!-- rim light en el costado de babor + sombra profunda a estribor -->
  <path d="M51.8 41 L51.4 94 L54.4 102.6" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M76.2 41 L76.6 94 L73.6 102.6" stroke="#000" stroke-width="1.5" opacity=".24" fill="none" filter="url(#fr1f1)"/>
  <!-- linea de crujia -->
  <path d="M64 16.5 L64 104" stroke="#b8bfa2" stroke-width=".8" opacity=".4" fill="none"/>
  <!-- brillete de proa -->
  <path class="light" d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L54.8 33.2 C57 25.4 60.8 19.8 65.4 16.5 Z" opacity=".7"/>
  <!-- anclas y cabrestantes -->
  <circle class="metalL" cx="55.6" cy="23" r="1.2"/><circle class="metalL" cx="72.4" cy="23" r="1.2"/>
  <path d="M54.2 20.8 L56.9 24.4 M71.6 24.4 L74.3 20.8" stroke="#4a5057" stroke-width=".8" fill="none"/>
  <path d="M53 27.5 L55.7 30.2 M75 27.5 L72.3 30.2" stroke="#3d4232" stroke-width=".9" opacity=".6" fill="none"/>
  <!-- cabrestantes y regala -->
  <circle class="metalS" cx="60.4" cy="26.8" r=".8"/><circle class="metalS" cx="67.6" cy="26.8" r=".8"/>
  <path d="M53.2 36.5 C58 38.2 70 38.2 74.8 36.5 M51.9 88 C51.5 92.5 51.5 96 52.4 100.5 M76.1 88 C76.5 92.5 76.5 96 75.6 100.5" stroke="#000" stroke-width=".5" opacity=".2" fill="none"/>

  <!-- ===== canon 5"/54 Mk42 ===== -->
  <path class="shade" d="M58.6 34.4 L69.4 34.4 L68.7 37.6 L59.3 37.6 Z"/>
  <circle class="metal" cx="64" cy="40.8" r="4.5"/>
  <circle cx="64" cy="40.8" r="4.5" fill="none" stroke="#3d4232" stroke-width=".7"/>
  <circle class="metalS" cx="64" cy="40.8" r="2.7"/>
  <path class="hi" d="M61.7 39.2 L66.3 39.2" stroke="#b8bfa2" stroke-width=".7" opacity=".7" fill="none"/>
  <path class="metal" d="M63.1 28 L64.9 28 L64.8 36.6 L63.2 36.6 Z"/>
  <path class="hi" d="M63.5 28.5 L63.9 28.5 L63.8 36 L63.5 36 Z" opacity=".6"/>
  <path class="metalL" d="M62.8 26.6 L65.2 26.6 L65.1 28.4 L62.9 28.4 Z"/>

  <!-- ===== lanzador ASROC (8 cohetes) ===== -->
  <rect class="dark" x="57.4" y="43.6" width="13.2" height="11" rx="1"/>
  <path d="M57.4 43.6 L70.6 43.6 L70.6 54.6 L57.4 54.6 Z" fill="none" stroke="#000" stroke-width=".5" opacity=".3"/>
  <g class="metalS">
    <circle cx="59.6" cy="45.6" r="1.1"/><circle cx="63.5" cy="45.6" r="1.1"/><circle cx="67.4" cy="45.6" r="1.1"/>
    <circle cx="59.6" cy="48.6" r="1.1"/><circle cx="63.5" cy="48.6" r="1.1"/><circle cx="67.4" cy="48.6" r="1.1"/>
    <circle cx="59.6" cy="51.6" r="1.1"/><circle cx="63.5" cy="51.6" r="1.1"/><circle cx="67.4" cy="51.6" r="1.1"/>
  </g>
  <g class="dark">
    <circle cx="59.6" cy="45.6" r=".45"/><circle cx="63.5" cy="45.6" r=".45"/><circle cx="67.4" cy="45.6" r=".45"/>
    <circle cx="59.6" cy="48.6" r=".45"/><circle cx="63.5" cy="48.6" r=".45"/><circle cx="67.4" cy="48.6" r=".45"/>
    <circle cx="59.6" cy="51.6" r=".45"/><circle cx="63.5" cy="51.6" r=".45"/><circle cx="67.4" cy="51.6" r=".45"/>
  </g>

  <!-- montes de 25mm a banda -->
  <circle class="metal" cx="53.4" cy="58.5" r="1.6"/><path d="M53.4 57 L53.4 55.4" stroke="#2b2e28" stroke-width=".9" fill="none"/>
  <circle class="metal" cx="74.6" cy="58.5" r="1.6"/><path d="M74.6 57 L74.6 55.4" stroke="#2b2e28" stroke-width=".9" fill="none"/>

  <!-- oclusion ambiental: canon y VLS sobre la cubierta -->
  <path d="M59.6 37.2 L68.4 37.2 L67.8 40.6 L60.2 40.6 Z" fill="#000" opacity=".2" filter="url(#fr1f1)"/>
  <path d="M56.4 54.4 L71.6 54.4 L71.2 57 L56.8 57 Z" fill="#000" opacity=".2" filter="url(#fr1f1)"/>

  <!-- ===== superestructura ===== -->
  <path class="base" d="M55 56.4 L73 56.4 L74.6 60.6 L75 70 L73.4 74.6 L54.6 74.6 L53 70 L53.4 60.6 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M55 56.4 L73 56.4 L74.6 60.6 L75 70 L73.4 74.6 L54.6 74.6 L53 70 L53.4 60.6 Z" fill="url(#fr1g3)"/>
  <!-- rim light NO + sombra SE + oclusion al pie -->
  <path d="M55.4 56.7 L72.6 56.7" stroke="#fff" stroke-width="1" opacity=".45" fill="none"/>
  <path d="M53.8 58.4 L53.6 69.4 L54.8 74.2" stroke="#fff" stroke-width=".7" opacity=".3" fill="none"/>
  <path d="M74.2 58.4 L74.6 69.4 L73.4 74.2" stroke="#000" stroke-width="1.3" opacity=".26" fill="none" filter="url(#fr1f1)"/>
  <path d="M53.4 74.4 L74.6 74.4 L74.4 77.6 L53.6 77.6 Z" fill="#000" opacity=".22" filter="url(#fr1f1)"/>
  <!-- ventanas del puente -->
  <path class="glass" d="M58 57.4 L62.4 57.4 L61.8 60 L57.4 60 Z M70 57.4 L65.6 57.4 L66.2 60 L70.6 60 Z"/>
  <path class="glassL" d="M58.8 57.9 L60.4 57.9 L60 59.1 L58.5 59.1 Z" opacity=".8"/>
  <path class="glassL" d="M69.2 57.9 L67.6 57.9 L68 59.1 L69.5 59.1 Z" opacity=".8"/>
  <!-- paneles radar de banda -->
  <rect class="metal" x="54" y="62.5" width="2.4" height="9.4" rx=".5"/>
  <rect class="metal" x="71.6" y="62.5" width="2.4" height="9.4" rx=".5"/>
  <path d="M54.3 65 L56 65 M54.3 68 L56 68 M54.3 70.6 L56 70.6 M72 65 L73.7 65 M72 68 L73.7 68 M72 70.6 L73.7 70.6" stroke="#4a5057" stroke-width=".4" opacity=".8" fill="none"/>
  <!-- botes y balsas a banda -->
  <rect class="light" x="52.3" y="77.5" width="2.1" height="3.8" rx=".8"/>
  <rect class="light" x="73.6" y="77.5" width="2.1" height="3.8" rx=".8"/>

  <!-- ===== mastil unico con radares ===== -->
  <path class="shade" d="M61.4 64 L66.6 64 L67.8 78.5 L60.2 78.5 Z"/>
  <path class="light" d="M61.4 64 L62.7 64 L61.5 78.5 L60.2 78.5 Z" opacity=".6"/>
  <path class="dark" d="M62.5 65.6 L65.5 65.6 L65.8 71.6 L62.2 71.6 Z" opacity=".9"/>
  <path d="M60.8 66 L67.2 70.4 M67.2 66 L60.8 70.4 M60.4 69 L67.6 73 M67.6 69 L60.4 73 M60.2 72 L67.8 76.4 M67.8 72 L60.2 76.4" stroke="#3d4232" stroke-width=".5" opacity=".55" fill="none"/>
  <!-- radar de busqueda aerea giratorio -->
  <path class="metalL" d="M57.6 67.8 L70.4 67.8 L70 70.8 L58 70.8 Z"/>
  <path d="M60.6 67.8 L60.6 70.8 M63.4 67.8 L63.4 70.8 M66.2 67.8 L66.2 70.8 M58.3 69.3 L69.7 69.3" stroke="#4a5057" stroke-width=".4" opacity=".8" fill="none"/>
  <!-- radar de superficie -->
  <circle class="metalS" cx="64" cy="73.6" r="2.1"/>
  <path d="M64 73.6 L66.7 72.1 M64 73.6 L63.1 76.3" stroke="#3d4232" stroke-width=".7" fill="none"/>
  <path d="M64 73.6 L66 75.7" stroke="#b8bfa2" stroke-width=".8" fill="none"/>
  <!-- domo SATCOM -->
  <circle class="metalS" cx="59.4" cy="75" r="1.5"/><circle class="metalS" cx="68.6" cy="75" r="1.5"/>
  <path d="M58.5 74.5 L60.2 74.5" stroke="#e6e9e2" stroke-width=".6" opacity=".5" fill="none"/>
  <!-- antenas de verga -->
  <path d="M56.6 68.6 L58 68.6 M71.4 68.6 L70 68.6" stroke="#3d4232" stroke-width="1" fill="none"/>
  <path d="M56.3 66 L56.3 71.2 M71.7 66 L71.7 71.2" stroke="#3d4232" stroke-width=".7" fill="none"/>

  <!-- ===== racks antisubmarinos a banda ===== -->
  <rect class="dark" x="52" y="80.8" width="5.6" height="5.2" rx=".8" opacity=".92"/>
  <path d="M52.4 82 L57.2 82 M52.4 84.4 L57.2 84.4" stroke="#8a929b" stroke-width=".4" opacity=".6" fill="none"/>
  <rect class="dark" x="70.4" y="80.8" width="5.6" height="5.2" rx=".8" opacity=".92"/>
  <path d="M70.8 82 L75.6 82 M70.8 84.4 L75.6 84.4" stroke="#8a929b" stroke-width=".4" opacity=".6" fill="none"/>
  <!-- hedgehog de proa -->
  <g class="metalS">
    <circle cx="55" cy="44" r=".9"/><circle cx="64" cy="42.4" r=".9"/><circle cx="73" cy="44" r=".9"/>
  </g>

  <!-- ===== chimenea compacta ===== -->
  <path d="M56.6 87 L71.4 87 L71.2 95.2 L56.8 95.2 Z" fill="#000" opacity=".22" filter="url(#fr1f1)"/>
  <path class="shade" d="M58 87.4 L70 87.4 L70.9 90.6 L70.6 94.6 L57.4 94.6 L57.1 90.6 Z"/>
  <path d="M58 87.4 L70 87.4 L70.9 90.6 L70.6 94.6 L57.4 94.6 L57.1 90.6 Z" fill="url(#fr1g4)"/>
  <path d="M58.4 87.7 L69.6 87.7" stroke="#fff" stroke-width=".8" opacity=".45" fill="none"/>
  <rect class="dark" x="60.4" y="89.2" width="3.4" height="4" rx=".7"/>
  <rect class="dark" x="64.2" y="89.2" width="3.4" height="4" rx=".7"/>
  <rect x="60.7" y="89.4" width="1.3" height="1.3" rx=".4" fill="#fff" opacity=".18"/>
  <rect x="64.5" y="89.4" width="1.3" height="1.3" rx=".4" fill="#fff" opacity=".18"/>
  <path class="light" d="M58 87.4 L70 87.4 L70.4 88.8 L57.6 88.8 Z" opacity=".5"/>

  <!-- ===== hangar y cubierta de vuelo ===== -->
  <path class="base" d="M56.5 95.5 L71.5 95.5 L71.5 101 L56.5 101 Z" stroke="#3d4232" stroke-width="1"/>
  <path d="M56.5 95.5 L71.5 95.5 L71.5 101 L56.5 101 Z" fill="url(#fr1g3)" opacity=".55"/>
  <path d="M56.7 95.8 L71.3 95.8" stroke="#fff" stroke-width=".8" opacity=".4" fill="none"/>
  <path d="M71.3 96 L71.3 100.8" stroke="#000" stroke-width="1.1" opacity=".24" fill="none" filter="url(#fr1f1)"/>
  <path d="M56.2 101 L71.8 101 L71.6 103 L56.4 103 Z" fill="#000" opacity=".2" filter="url(#fr1f1)"/>
  <path d="M58.8 96.1 L58.8 100.4 M61.6 96.1 L61.6 100.4 M66.4 96.1 L66.4 100.4 M69.2 96.1 L69.2 100.4" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>
  <path d="M64 96.1 L64 100.4" stroke="#000" stroke-width=".6" opacity=".3" fill="none"/>
  <circle class="metalL" cx="53.6" cy="103.8" r=".7"/><circle class="metalL" cx="74.4" cy="103.8" r=".7"/>
  <!-- CIWS en el techo del hangar -->
  <circle class="metalS" cx="64" cy="97" r="1.8"/><path d="M64 95.4 L64 94.2" stroke="#2b2e28" stroke-width="1" fill="none"/>
  <!-- helipad con circulo pintado -->
  <path d="M64 101 L64 106.4" stroke="#b8bfa2" stroke-width=".7" opacity=".45" fill="none"/>
  <ellipse class="dark" cx="64" cy="103.4" rx="5" ry="2.9"/>
  <ellipse cx="64" cy="103.4" rx="5" ry="2.9" fill="none" stroke="#b8bfa2" stroke-width=".8" opacity=".85"/>
  <path d="M63.2 103.4 L64.8 103.4 M64 102.6 L64 104.2" stroke="#b8bfa2" stroke-width=".7" opacity=".85" fill="none"/>
  <!-- bote de maniobras a estribor -->
  <path class="light" d="M78.6 63 C80.4 64.3 80.4 67.2 78.6 68.5 C77.9 67.2 77.9 64.3 78.6 63 Z"/>
  <path d="M78.6 64.2 L78.6 67.6" stroke="#4a5057" stroke-width=".4" opacity=".6" fill="none"/>
</svg>
