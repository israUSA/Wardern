<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- M60A3 Patton (T1 occidental). Pintura arena.
     Misma camara y escala que el resto del set (20.9 px/m, ~31 grados).
     Casco 6.95 x 3.63 m, 3.27 m al techo de la cupula: es el mas ALTO del set.
     Identidad frente al Abrams: solo 6 ruedas de rodadura, SIN faldones (oruga y
     ruedas a la vista) con 3 rodillos de retorno, torreta fundida alargada en
     punta de aguja, cupula M19 del comandante enorme, proyector de xenon sobre el
     mantelete y canon M68 de 105 mm con el evacuador de humos cerca de la boca. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0"    stop-color="#e2d6b2"/>
    <stop offset="0.34" stop-color="#c8b78d"/>
    <stop offset="0.68" stop-color="#ad9c75"/>
    <stop offset="1"    stop-color="#91815f"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0"    stop-color="#aea172"/>
    <stop offset="0.45" stop-color="#978861"/>
    <stop offset="1"    stop-color="#78694a"/>
  </linearGradient>
  <linearGradient id="g-turret" x1="0.2" y1="0" x2="0.85" y2="1">
    <stop offset="0"    stop-color="#c8b78d"/>
    <stop offset="0.5"  stop-color="#a5946e"/>
    <stop offset="1"    stop-color="#7b6c4d"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0"    stop-color="#6f6247"/>
    <stop offset="0.6"  stop-color="#584d38"/>
    <stop offset="1"    stop-color="#453c2c"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0"    stop-color="#d4c9a8"/>
    <stop offset="0.5"  stop-color="#9e9376"/>
    <stop offset="1"    stop-color="#675e47"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0"    stop-color="#403d34"/>
    <stop offset="0.5"  stop-color="#2c2a22"/>
    <stop offset="1"    stop-color="#1b1a15"/>
  </linearGradient>
</defs>

<!-- 1. sombra -->
<path d="M26 146 L162 110 L204 145 L62 185 Z" fill="#0d0b06" opacity="0.30"/>

<!-- 2. popa -->
<path d="M29.6 112.7 L65.2 147.6 L65.2 176.6 L29.6 141.7 Z" fill="url(#g-rear)"/>
<path d="M34 128 L44 137.8 L44 152 L34 142.2 Z" fill="#241f16"/>
<path d="M48 141.8 L58 151.6 L58 165.8 L48 156 Z" fill="#241f16"/>
<g stroke="#8a7c5b" stroke-opacity="0.7" stroke-width="1.1">
  <path d="M34.6 132 L43.4 140.6"/><path d="M34.6 136.5 L43.4 145.1"/>
  <path d="M48.6 145.8 L57.4 154.4"/><path d="M48.6 150.3 L57.4 158.9"/>
</g>
<circle cx="32" cy="120.5" r="2.6" fill="#8f5b30"/>
<circle cx="62" cy="170" r="2.6" fill="#8f5b30"/>

<!-- 3. cubierta y glacis en punta -->
<path d="M29.6 112.7 L122.3 87.1 L157.9 122.0 L65.2 147.6 Z" fill="url(#g-deck)"/>
<path d="M122.3 87.1 L157.6 88.3 L193.2 123.2 L157.9 122.0 Z" fill="url(#g-deck)"/>
<path d="M122.3 87.1 L157.9 122.0" fill="none" stroke="#6d6046" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M122.3 87.1 L157.6 88.3 L193.2 123.2 L157.9 122.0 Z" fill="#ffffff" fill-opacity="0.07"/>
<!-- escotilla del conductor -->
<ellipse cx="148" cy="104" rx="7" ry="4.6" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>
<!-- faros protegidos por guardas -->
<g fill="#5c5340">
  <path d="M160 90.5 L166.5 96.9 L163 98.4 L156.6 92 Z"/>
  <path d="M177 107 L183.5 113.4 L180 114.9 L173.6 108.5 Z"/>
</g>
<!-- cubierta de motor con rejillas -->
<path d="M34.2 114.9 L67.7 105.7 L97.7 135.1 L64.2 144.3 Z" fill="#6e6247"/>
<g stroke="#a99a74" stroke-opacity="0.75" stroke-width="1.2">
  <path d="M40 114 L70 143.4"/>
  <path d="M46.5 112.2 L76.5 141.6"/>
  <path d="M53 110.4 L83 139.8"/>
  <path d="M59.5 108.6 L89.5 138"/>
</g>

<!-- 4. flanco (esponson sobre la oruga) -->
<path d="M65.2 147.6 L157.9 122.0 L193.2 123.2 L65.2 158.6 Z" fill="url(#g-flank)"/>
<path d="M65.2 147.6 L157.9 122.0" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>

<!-- 5. tren de rodaje al descubierto: 6 ruedas + 3 rodillos de retorno -->
<path d="M63.2 179.0 L198.3 141.6 L198.3 123.6 L63.2 161.0 Z" fill="url(#g-trk)"/>
<g fill="#46423a" stroke="#1b1a15" stroke-width="1.1">
  <ellipse cx="79.1"  cy="166.6" rx="6.8" ry="7.9"/>
  <ellipse cx="101.1" cy="160.5" rx="6.8" ry="7.9"/>
  <ellipse cx="123.2" cy="154.4" rx="6.8" ry="7.9"/>
  <ellipse cx="145.3" cy="148.3" rx="6.8" ry="7.9"/>
  <ellipse cx="167.3" cy="142.2" rx="6.8" ry="7.9"/>
  <ellipse cx="189.4" cy="136.1" rx="6.8" ry="7.9"/>
</g>
<g fill="#6d6455">
  <ellipse cx="79.1"  cy="166.6" rx="2.5" ry="3"/>
  <ellipse cx="101.1" cy="160.5" rx="2.5" ry="3"/>
  <ellipse cx="123.2" cy="154.4" rx="2.5" ry="3"/>
  <ellipse cx="145.3" cy="148.3" rx="2.5" ry="3"/>
  <ellipse cx="167.3" cy="142.2" rx="2.5" ry="3"/>
  <ellipse cx="189.4" cy="136.1" rx="2.5" ry="3"/>
</g>
<ellipse cx="64.9"  cy="165.5" rx="8.6" ry="9.8" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<ellipse cx="196.5" cy="129.1" rx="7.8" ry="9"   fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<g fill="#4c473d" stroke="#1b1a15" stroke-width="0.9">
  <ellipse cx="93.2"  cy="151.7" rx="3.4" ry="3.9"/>
  <ellipse cx="128.5" cy="141.9" rx="3.4" ry="3.9"/>
  <ellipse cx="163.8" cy="132.2" rx="3.4" ry="3.9"/>
</g>
<path d="M64 179.5 L199 142" fill="none" stroke="#0d0b06" stroke-opacity="0.55" stroke-width="3"/>

<!-- 6. torreta fundida alargada, base -->
<path d="M69.5 124.0 C66 119 65 116 65.5 114.6 C70 109 76 106.5 81.6 106.0
         C95 104 112 103.5 120.4 104.1 L137.5 105.2 L130.8 114.2
         C120 120 112 124 105.5 129.4 C97 132 88 132.5 83.3 132.0
         C77 130 71 127 69.5 124.0 Z" fill="url(#g-flank)"/>
<!-- techo de la torreta -->
<path d="M69.5 101.0 C66 96 65 93 65.5 91.6 C70 86 76 83.5 81.6 83.0
         C95 81 112 80.5 120.4 81.1 L137.5 82.2 L130.8 91.2
         C120 97 112 101 105.5 106.4 C97 109 88 109.5 83.3 109.0
         C77 107 71 104 69.5 101.0 Z" fill="url(#g-turret)"/>
<path d="M69.5 101.0 C66 96 65 93 65.5 91.6 C70 86 76 83.5 81.6 83.0
         C95 81 112 80.5 120.4 81.1" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.4"/>
<!-- cesta de estiba en la popa de torreta -->
<path d="M66 110 L74 120 L82 118 L74 108 Z" fill="#5f553e" stroke="#2f2a1e" stroke-width="0.8"/>

<!-- 7. cupula M19 del comandante: marca del M60 -->
<path d="M87.1 98.1 L87.1 82.1 A10 7 0 0 1 107.1 82.1 L107.1 98.1 Z" fill="#8a7c5b"/>
<ellipse cx="97.1" cy="82.1" rx="10" ry="7" fill="#b0a179" stroke="#574d38" stroke-width="1"/>
<g stroke="#574d38" stroke-opacity="0.75" stroke-width="0.9">
  <path d="M89 90 L89 95.5"/><path d="M95 92 L95 97.5"/><path d="M101 92 L101 97.5"/><path d="M106 89 L106 94.5"/>
</g>
<path d="M90 80 A10 7 0 0 1 104 80" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
<!-- .50 del comandante dentro de la cupula -->
<path d="M100 78.5 L104 77 L120 71.4 L121 73.6 L105 79.2 L101.5 80.8 Z" fill="url(#g-metal)"/>
<!-- escotilla del cargador -->
<ellipse cx="82.3" cy="88.1" rx="6.5" ry="4.4" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>

<!-- 8. proyector de xenon sobre el mantelete: marca del M60A1/A3 -->
<path d="M125 84.5 L134 78 L146 82 L137 88.8 Z" fill="#8d7f5e" stroke="#5a5039" stroke-width="0.9"/>
<path d="M137 88.8 L146 82 L146 88 L137 94.5 Z" fill="#6d6046"/>
<ellipse cx="145.5" cy="85" rx="2.6" ry="5.4" fill="#d8cfae"/>

<!-- 9. canon M68 de 105 mm, evacuador cerca de la boca -->
<path d="M129 96.5 L138 89 L146 93.5 L137 101 Z" fill="#9c8d68" stroke="#5a5039" stroke-width="0.9"/>
<path d="M136.4 88.2 L220.2 65.0 L222.4 73.1 L138.6 96.3 Z" fill="url(#g-metal)"/>
<path d="M187.6 71.4 L202.7 67.2 L206.3 80.4 L191.2 84.6 Z" fill="#bcac82" stroke="#6d6046" stroke-width="0.8"/>
<ellipse cx="221.3" cy="69.0" rx="1.5" ry="3.6" fill="#181510"/>
<path d="M136.4 88.2 L220.2 65.0 L220.6 66.6 L136.8 89.8 Z" fill="#ffffff" fill-opacity="0.35"/>
</svg>
