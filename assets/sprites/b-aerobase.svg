<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Base aérea con fondo transparente y pista extendida de borde a borde -->
  <defs>
    <style>
      .runway { fill: #1c1d1a; }
      .shoulder { fill: #2b2e28; }
      .marking { fill: #e8ecda; stroke: #e8ecda; }
      .tower-body { fill: #828a6f; }
      .tower-dark { fill: #5c634d; }
      .tower-roof { fill: #9da687; }
      .tower-glass { fill: #385d75; }
      .edge { stroke: #1b1e16; stroke-width: 0.7; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Arcén / borde de asfalto secundario -->
  <polygon points="12,-20 48,-20 148,105 148,148 112,148 -20,-17" class="shoulder"/>

  <!-- PISTA PRINCIPAL (Extremadamente larga, atraviesa de vértice a vértice) -->
  <polygon points="18,-20 42,-20 148,112 148,148 124,148 -20,-14" class="runway"/>
  <polygon points="18,-20 42,-20 148,112 148,148 124,148 -20,-14" fill="none" stroke="#121310" stroke-width="0.8"/>

  <!-- Líneas de borde de pista continuas -->
  <line x1="20" y1="-20" x2="148" y2="114" stroke="#e8ecda" stroke-width="0.7" opacity="0.85"/>
  <line x1="-20" y1="-12" x2="126" y2="148" stroke="#e8ecda" stroke-width="0.7" opacity="0.85"/>

  <!-- Línea central discontinua de extremo a extremo -->
  <line x1="0" y1="-20" x2="148" y2="131" stroke="#e8ecda" stroke-width="1.6" stroke-dasharray="6 4" stroke-linecap="butt"/>

  <!-- Umbral superior (Piano keys) -->
  <g class="marking" stroke-width="0.9">
    <line x1="6" y1="-12" x2="11" y2="-6"/>
    <line x1="9" y1="-9" x2="14" y2="-3"/>
    <line x1="12" y1="-6" x2="17" y2="0"/>
    <line x1="15" y1="-3" x2="20" y2="3"/>
    <line x1="18" y1="0" x2="23" y2="6"/>
  </g>

  <!-- Umbral inferior (Piano keys) -->
  <g class="marking" stroke-width="0.9">
    <line x1="102" y1="99" x2="107" y2="105"/>
    <line x1="105" y1="102" x2="110" y2="108"/>
    <line x1="108" y1="105" x2="113" y2="111"/>
    <line x1="111" y1="108" x2="116" y2="114"/>
    <line x1="114" y1="111" x2="119" y2="117"/>
  </g>

  <!-- Conexión / Calle de rodaje corta -->
  <polygon points="78,28 92,20 98,28 84,36" class="shoulder"/>
  <polygon points="80,30 90,23 95,29 85,35" class="runway"/>

  <!-- TORRE DE CONTROL (Único edificio aislado) -->
  <g class="edge">
    <!-- Base -->
    <polygon points="94,18 108,14 114,21 100,25" fill="#383d2c"/>

    <!-- Fuste / Columna -->
    <polygon points="100,20 106,18 106,34 100,36" class="tower-body"/>
    <polygon points="106,18 110,16 110,32 106,34" class="tower-dark"/>

    <!-- Cabina acristalada -->
    <polygon points="98,14 108,12 112,10 102,12" class="tower-roof"/>
    <polygon points="98,14 108,12 108,17 98,19" class="tower-glass"/>
    <polygon points="108,12 112,10 112,15 108,17" fill="#5885a2"/>

    <!-- Techo y antena -->
    <polygon points="97,14 109,12 113,10 101,12" class="tower-roof"/>
    <line x1="105" y1="12" x2="105" y2="5" stroke="#1c1d1a" stroke-width="0.8"/>
    <circle cx="105" cy="4" r="1.1" fill="#c93b2b" stroke="#1c1d1a" stroke-width="0.3"/>
  </g>
</svg>

