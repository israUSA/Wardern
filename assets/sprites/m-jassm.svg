<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="100%" height="100%">
  <!-- AGM-158 JASSM - Versión compacta, lomo blanco nítido, tipografía contenida en zona blanca y bandera detallada -->
  <defs>
    <!-- Lomo blanco plano y brillante sin sombras en la zona útil -->
    <linearGradient id="jassm-white-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f5f7"/>
    </linearGradient>

    <!-- Laterales biselados para dar volumen -->
    <linearGradient id="jassm-side-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bcc7cc"/>
      <stop offset="100%" stop-color="#dce3e6"/>
    </linearGradient>

    <linearGradient id="jassm-side-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5d9"/>
      <stop offset="100%" stop-color="#aeb9be"/>
    </linearGradient>

    <linearGradient id="jassm-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7e0e5"/>
    </linearGradient>

    <!-- Ventana óptica del seeker -->
    <linearGradient id="seeker-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3338"/>
      <stop offset="100%" stop-color="#0f1416"/>
    </linearGradient>
  </defs>

  <!-- ================= ALAS RETRÁCTILES ================= -->
  <!-- Ala Izquierda -->
  <polygon points="11,26 1.8,30.5 1.8,33.5 11.2,31.5" 
           fill="url(#jassm-wing)" 
           stroke="#8b989f" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- Ala Derecha -->
  <polygon points="21,26 30.2,30.5 30.2,33.5 20.8,31.5" 
           fill="url(#jassm-wing)" 
           stroke="#8b989f" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- ================= ESTABILIZADORES TRASEROS ================= -->
  <polygon points="12,47 7.5,49.5 7.5,52.2 12.5,51.2" 
           fill="url(#jassm-side-l)" 
           stroke="#8b989f" 
           stroke-width="0.22"/>
  <polygon points="20,47 24.5,49.5 24.5,52.2 19.5,51.2" 
           fill="url(#jassm-side-r)" 
           stroke="#8b989f" 
           stroke-width="0.22"/>

  <!-- ================= CUERPO PRINCIPAL FACETADO ================= -->
  <!-- Bisel lateral izquierdo gris -->
  <polygon points="16,8 12,13 11,27 11.6,49.5 13.5,52 16,52 16,8" 
           fill="url(#jassm-side-l)"/>

  <!-- Bisel lateral derecho gris -->
  <polygon points="16,8 20,13 21,27 20.4,49.5 18.5,52 16,52 16,8" 
           fill="url(#jassm-side-r)"/>

  <!-- Lomo central superior BLANCO (ancho y nítido de x=13 a x=19) -->
  <polygon points="16,9 13,13.5 12.6,26 13,49 16,50.8 19,49 19.4,26 19,13.5" 
           fill="url(#jassm-white-top)" 
           stroke="#9aa5ab" 
           stroke-width="0.25" 
           stroke-linejoin="round"/>

  <!-- ================= VENTANA ÓPTICA INFRARROJA (SEEKER) ================= -->
  <polygon points="16,8.5 14.6,11.5 16,12.6 17.4,11.5" 
           fill="url(#seeker-glass)" 
           stroke="#182023" 
           stroke-width="0.25"/>
  <polygon points="16,9.1 15.1,11.3 16,12" 
           fill="#4b5d66" 
           opacity="0.5"/>

  <!-- ================= LÍNEAS DE PANEL Y PIVOTES ================= -->
  <path d="M 13 17.5 Q 16 19 19 17.5" fill="none" stroke="#cfd7dc" stroke-width="0.25"/>
  <path d="M 13 23.5 Q 16 25 19 23.5" fill="none" stroke="#cfd7dc" stroke-width="0.25"/>
  <circle cx="13" cy="26.5" r="0.45" fill="#a4b1b8"/>
  <circle cx="19" cy="26.5" r="0.45" fill="#a4b1b8"/>

  <!-- ================= TEXTO EN LA FRANJA TOTALMENTE BLANCA ================= -->
  <!-- Centrado dentro del sector blanco izquierdo (x=14.1) sin pisar bordes grises -->
  <text x="26" y="-13.8" 
        transform="rotate(90)" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="1.15" 
        font-weight="bold" 
        letter-spacing="0.18" 
        fill="#1e2930" 
        opacity="0.95">U.S. AIR FORCE</text>

  <!-- ================= BANDERA DE EE.UU. MEJORADA ================= -->
  <!-- Ubicada justo después del texto, 100% sobre la franja blanca (x=13.3 a 15.7) -->
  <g id="us-flag" transform="translate(13.4, 40)">
    <!-- Base blanca de la bandera -->
    <rect x="0" y="0" width="2.2" height="3.8" fill="#ffffff" stroke="#909aa0" stroke-width="0.08"/>
    
    <!-- Franjas rojas horizontales nítidas -->
    <rect x="0" y="0.32" width="2.2" height="0.26" fill="#bf2626"/>
    <rect x="0" y="0.90" width="2.2" height="0.26" fill="#bf2626"/>
    <rect x="0" y="1.48" width="2.2" height="0.26" fill="#bf2626"/>
    <rect x="0" y="2.06" width="2.2" height="0.26" fill="#bf2626"/>
    <rect x="0" y="2.64" width="2.2" height="0.26" fill="#bf2626"/>
    <rect x="0" y="3.22" width="2.2" height="0.26" fill="#bf2626"/>

    <!-- Cantón azul superior (Union Jack) -->
    <rect x="0" y="0" width="1.1" height="1.8" fill="#143666"/>
    
    <!-- Matriz de estrellas blancas definidas -->
    <circle cx="0.28" cy="0.4" r="0.1" fill="#ffffff"/>
    <circle cx="0.55" cy="0.4" r="0.1" fill="#ffffff"/>
    <circle cx="0.82" cy="0.4" r="0.1" fill="#ffffff"/>

    <circle cx="0.41" cy="0.9" r="0.1" fill="#ffffff"/>
    <circle cx="0.69" cy="0.9" r="0.1" fill="#ffffff"/>

    <circle cx="0.28" cy="1.4" r="0.1" fill="#ffffff"/>
    <circle cx="0.55" cy="1.4" r="0.1" fill="#ffffff"/>
    <circle cx="0.82" cy="1.4" r="0.1" fill="#ffffff"/>
  </g>

  <!-- ================= ALETA VERTICAL Y TOBERA TRASERA ================= -->
  <polygon points="15.6,41 16.4,41 16.5,51 15.5,51" 
           fill="#b5c1c7" 
           stroke="#7a8990" 
           stroke-width="0.2"/>
  <ellipse cx="16" cy="51.8" rx="1.8" ry="0.5" fill="#1b2022"/>
</svg>
