<!-- Gepard, Proyecto 11661 (T2 oriental, corbeta). Gris ruso. Identidad: los cuatro contenedores inclinados del misil Uran ocupando media cubierta a popa, algo que ninguna corbeta occidental del set lleva a la vista; canon de 76 mm a proa y palo enrejado a media eslora.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
