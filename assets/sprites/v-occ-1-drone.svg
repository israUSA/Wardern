<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- RQ-2 Pioneer - vista superior, morro al norte. DRON PEQUEÑO y corpachón:
       fuselaje corto tipo vaina, ala recta de envergadura media, DOBLE VIGA (twin boom)
       que une las alas al estabilizador trasero con DOS derivas verticales, hélice
       propulsora, tren fijo. Tinte por pais: .base/.shade/.light/.hi.
       Fijos: .metal/.metalS/.metalL (bujes, antena), .glass (ojo del sensor), .rubber. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="d1f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="d1f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="d1gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="d1g1" gradientUnits="userSpaceOnUse" x1="18" y1="59" x2="110" y2="59">
    <stop offset="0" stop-color="#000" stop-opacity=".34"/><stop offset=".16" stop-color="#000" stop-opacity=".08"/><stop offset=".34" stop-color="#fff" stop-opacity=".16"/><stop offset=".46" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".06"/><stop offset=".82" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".42"/>
  </linearGradient>
  <linearGradient id="d1g2" gradientUnits="userSpaceOnUse" x1="58" y1="60" x2="70" y2="60">
    <stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".24" stop-color="#fff" stop-opacity=".2"/><stop offset=".42" stop-color="#fff" stop-opacity=".24"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="d1g3" gradientUnits="userSpaceOnUse" x1="64" y1="42" x2="64" y2="96">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
  </linearGradient>
  </defs>

  <ellipse cx="64" cy="62" rx="50" ry="50" fill="url(#d1gs)"/>

  <!-- ===== alas rectas ===== -->
  <path class="base" d="M61.4 53.5 L20 56 Q13.5 57.4 13 61.7 Q13.5 66 20 67.4 L61.4 67.6 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path class="base" d="M66.6 53.5 L108 56 Q114.5 57.4 115 61.7 Q114.5 66 108 67.4 L66.6 67.6 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M61.4 53.5 L20 56 Q13.5 57.4 13 61.7 Q13.5 66 20 67.4 L61.4 67.6 Z" fill="url(#d1g1)"/>
  <path d="M66.6 53.5 L108 56 Q114.5 57.4 115 61.7 Q114.5 66 108 67.4 L66.6 67.6 Z" fill="url(#d1g1)"/>
  <path d="M61 54.2 L17.5 56.9 M67 54.2 L110.5 56.9" stroke="#fff" stroke-width=".7" opacity=".45" fill="none"/>
  <path d="M64 19 L64 100" stroke="#b8bfa2" stroke-width=".7" opacity=".0" fill="none"/>
  <!-- luces de punta -->
  <circle class="dark" cx="14.4" cy="61.7" r="1"/><circle class="dark" cx="113.6" cy="61.7" r="1"/>
  <!-- flaperaones -->
  <path d="M23 61.7 L60 62 M68 62 L105 61.7" stroke="#000" stroke-width=".55" opacity=".24" fill="none"/>
  <path d="M30 57.2 L30 66.5 M98 57.2 L98 66.5" stroke="#000" stroke-width=".5" opacity=".2" fill="none"/>

  <!-- ===== doble viga (twin boom) ===== -->
  <path class="shade" d="M38.5 58.5 L41.5 58.5 L41.5 90.5 L38.5 90.5 Z"/>
  <path class="shade" d="M86.5 58.5 L89.5 58.5 L89.5 90.5 L86.5 90.5 Z"/>
  <path d="M39 59.5 L39 89.5 M87 59.5 L87 89.5" stroke="#fff" stroke-width=".6" opacity=".3" fill="none"/>
  <path d="M41 62 L41.2 88 M86.5 62 L86.3 88" stroke="#000" stroke-width=".7" opacity=".25" fill="none" filter="url(#d1f1)"/>
  <!-- oclusion viga-alas -->
  <path d="M38.2 58 L41.8 58 L41.8 60.5 L38.2 60.5 Z" fill="#000" opacity=".22" filter="url(#d1f1)"/>
  <path d="M86.2 58 L89.8 58 L89.8 60.5 L86.2 60.5 Z" fill="#000" opacity=".22" filter="url(#d1f1)"/>

  <!-- ===== estabilizador trasero entre vigas + derivas ===== -->
  <path class="shade" d="M37.5 90.5 L90.5 90.5 L89 94.5 L39 94.5 Z" stroke="#3d4232" stroke-width="1"/>
  <path d="M38 91.2 L89.7 91.2" stroke="#fff" stroke-width=".6" opacity=".35" fill="none"/>
  <path class="dark" d="M39 94.5 L89 94.5 L88.4 96 L39.6 96 Z" opacity=".6"/>
  <!-- dos derivas verticales en los extremos (de canto) -->
  <path class="shade" d="M38.4 88 L41.6 88 L41.4 96.5 L38.6 96.5 Z"/>
  <path class="light" d="M38.4 88 L39.4 88 L39.2 96.5 L38.6 96.5 Z" opacity=".6"/>
  <path class="shade" d="M86.4 88 L89.6 88 L89.4 96.5 L86.6 96.5 Z"/>
  <path class="light" d="M86.4 88 L87.4 88 L87.2 96.5 L86.6 96.5 Z" opacity=".6"/>
  <path d="M40 90 L40 95.5 M88 90 L88 95.5" stroke="#000" stroke-width=".5" opacity=".3" fill="none"/>

  <!-- ===== fuselaje vaina corto ===== -->
  <path class="base" d="M64 41.5 C60.8 43.5 58.9 46.5 58.2 50.5 L57.2 57 L56.6 64 L57 71.5 L58.4 79 C59.4 83.5 61 86.5 63 87.8 L64 88.2 L65 87.8 C67 86.5 68.6 83.5 69.6 79 L71 71.5 L71.4 64 L70.8 57 L69.8 50.5 C69.1 46.5 67.2 43.5 64 41.5 Z" stroke="#3d4232" stroke-width="1.3"/>
  <path d="M64 41.5 C60.8 43.5 58.9 46.5 58.2 50.5 L57.2 57 L56.6 64 L57 71.5 L58.4 79 C59.4 83.5 61 86.5 63 87.8 L64 88.2 L65 87.8 C67 86.5 68.6 83.5 69.6 79 L71 71.5 L71.4 64 L70.8 57 L69.8 50.5 C69.1 46.5 67.2 43.5 64 41.5 Z" fill="url(#d1g2)"/>
  <path d="M64 41.5 C60.8 43.5 58.9 46.5 58.2 50.5 L57.2 57 L56.6 64 L57 71.5 L58.4 79 C59.4 83.5 61 86.5 63 87.8 L64 88.2 L65 87.8 C67 86.5 68.6 83.5 69.6 79 L71 71.5 L71.4 64 L70.8 57 L69.8 50.5 C69.1 46.5 67.2 43.5 64 41.5 Z" fill="url(#d1g3)"/>
  <path d="M59 46 C57.9 53 57.4 62 57.7 71 C58 79 59 85 60.4 88" stroke="#fff" stroke-width=".9" opacity=".4" fill="none"/>
  <path d="M69 46 C70.1 53 70.6 62 70.3 71 C70 79 69 85 67.6 88" stroke="#000" stroke-width="1.3" opacity=".24" fill="none" filter="url(#d1f1)"/>
  <!-- sombra del fuselaje sobre las alas -->
  <path d="M61.8 54 L66.2 54 L65.6 67.6 L62.4 67.6 Z" fill="#000" opacity=".2" filter="url(#d1f1)"/>
  <!-- linea de crujia y paneles -->
  <path d="M64 43 L64 86" stroke="#b8bfa2" stroke-width=".7" opacity=".35" fill="none"/>
  <path d="M57.6 58 L70.4 58 M58.2 70 L69.8 70" stroke="#000" stroke-width=".5" opacity=".22" fill="none"/>

  <!-- ===== ojo de sensor bajo el morro ===== -->
  <path d="M61.2 48.5 L66.8 48.5 L66.2 51.2 L61.8 51.2 Z" fill="#000" opacity=".22" filter="url(#d1f1)"/>
  <ellipse class="dark" cx="64" cy="47.4" rx="3" ry="2.6"/>
  <circle class="glass" cx="64" cy="47" r="1.6"/>
  <circle cx="63.6" cy="46.5" r=".55" fill="#fff" opacity=".9"/>

  <!-- ===== tren fijo ===== -->
  <path d="M58.8 66.5 L56 70.2 M69.2 66.5 L72 70.2" stroke="#3d4232" stroke-width="1" fill="none"/>
  <circle class="rubber" cx="55.4" cy="71" r="2.2"/>
  <circle class="metal" cx="55.4" cy="71" r="1"/>
  <circle class="rubber" cx="72.6" cy="71" r="2.2"/>
  <circle class="metal" cx="72.6" cy="71" r="1"/>
  <path d="M64 88 L64 90.4" stroke="#3d4232" stroke-width="1" fill="none"/>
  <circle class="rubber" cx="64" cy="91.2" r="1.4"/>
  <circle class="metalS" cx="64" cy="91.2" r=".65"/>

  <!-- ===== helice propulsora trasera ===== -->
  <g class="dark" opacity=".42">
    <path d="M62.6 84.5 L65.4 84.5 L65.7 96.5 L62.3 96.5 Z" transform="rotate(40 64 98)"/>
    <path d="M62.6 84.5 L65.4 84.5 L65.7 96.5 L62.3 96.5 Z" transform="rotate(130 64 98)"/>
    <path d="M62.6 84.5 L65.4 84.5 L65.7 96.5 L62.3 96.5 Z" transform="rotate(220 64 98)"/>
    <path d="M62.6 84.5 L65.4 84.5 L65.7 96.5 L62.3 96.5 Z" transform="rotate(310 64 98)"/>
  </g>
  <g class="dark" opacity=".8">
    <path d="M62.5 84.7 L65.5 84.7 L65.6 89.3 L62.4 89.3 Z" transform="rotate(40 64 98)"/>
    <path d="M62.5 84.7 L65.5 84.7 L65.6 89.3 L62.4 89.3 Z" transform="rotate(130 64 98)"/>
    <path d="M62.5 84.7 L65.5 84.7 L65.6 89.3 L62.4 89.3 Z" transform="rotate(220 64 98)"/>
    <path d="M62.5 84.7 L65.5 84.7 L65.6 89.3 L62.4 89.3 Z" transform="rotate(310 64 98)"/>
  </g>
  <circle class="shade" cx="64" cy="98" r="2.3"/>
  <circle class="metal" cx="64" cy="98" r="1.3"/>
  <circle class="metalL" cx="64" cy="98" r=".55"/>
  <!-- antena de radio a popa -->
  <path d="M66.5 84 L69 88.5" stroke="#3d4232" stroke-width=".9" fill="none"/>
</svg>
