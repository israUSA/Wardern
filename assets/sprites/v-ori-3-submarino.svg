<!-- Yasen, Proyecto 885 (T3 oriental, submarino). Casco negro. Identidad: vela BAJA y muy carenada, casi fundida con el casco, timones de profundidad a proa, y el bloque de silos de misiles de crucero justo detras de la vela. Es el submarino ruso mas limpio del set.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
