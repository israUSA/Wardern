<!-- USS Constellation (T3 occidental, fragata). Gris OTAN. Identidad: superestructura moderna facetada y continua con palo cerrado integrado, banco de celdas verticales Mk41 entre el canon de proa y el puente, y hangar amplio con plataforma de helicoptero. Aspecto liso, sin chimenea a la vista.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
