  <path class="glass" d="M58 57.4 L62.4 57.4 L61.8 60 L57.4 60 Z M70 57.4 L65.6 57.4 L66.2 60 L70.6 60 Z"/>
  <path class="glassL" d="M58.8 57.9 L60.4 57.9 L60 59.1 L58.5 59.1 Z" opacity=".8"/>
  <path class="glassL" d="M69.2 57.9 L67.6 57.9 L68 59.1 L69.5 59.1 Z" opacity=".8"/>
  <!-- paneles radar de banda -->
  <rect class="metal" x="54" y="62.5" width="2.4" height="9.4" rx=".5"/>
  <rect class="metal" x="71.6" y="62.5" width="2.4" height="9.4" rx=".5"/>
  <path d="M54.3 65 L56 65 M54.3 68 L56 68 M54.3 70.6 L56 70.6 M72 65 L73.7 65 M72 68 L73.7 68 M72 70.6 L73.7 70.6" stroke="#4a5057" stroke-width=".4" opacity=".8" fill="none"/>
  <!-- botes y balsas a banda -->
  <rect class="light" x="52.3" y="77.5" width="2.1" height="3.8" rx=".8"/>
  <rect class="light" x="73.6" y="77.5" width="2.1" height="3.8" rx=".8"/>

  <!-- ===== mastil unico con radares ===== -->
  <path class="shade" d="M61.4 64 L66.6 64 L67.8 78.5 L60.2 78.5 Z"/>
  <path class="light" d="M61.4 64 L62.7 64 L61.5 78.5 L60.2 78.5 Z" opacity=".6"/>
  <path class="dark" d="M62.5 65.6 L65.5 65.6 L65.8 71.6 L62.2 71.6 Z" opacity=".9"/>
  <!-- radar de busqueda aerea giratorio -->
  <path class="metalL" d="M57.6 67.8 L70.4 67.8 L70 70.8 L58 70.8 Z"/>
  <path d="M60.6 67.8 L60.6 70.8 M63.4 67.8 L63.4 70.8 M66.2 67.8 L66.2 70.8 M58.3 69.3 L69.7 69.3" stroke="#4a5057" stroke-width=".4" opacity=".8" fill="none"/>
  <!-- radar de superficie -->
  <circle class="metalS" cx="64" cy="73.6" r="2.1"/>
  <path d="M64 73.6 L66.7 72.1 M64 73.6 L63.1 76.3" stroke="#3d4232" stroke-width=".7" fill="none"/>
  <path d="M64 73.6 L66 75.7" stroke="#b8bfa2" stroke-width=".8" fill="none"/>
  <!-- domo SATCOM -->
  <circle class="metalS" cx="59.4" cy="75" r="1.5"/><circle class="metalS" cx="68.6" cy="75" r="1.5"/>
  <path d="M58.5 74.5 L60.2 74.5" stroke="#e6e9e2" stroke-width=".6" opacity=".5" fill="none"/>
  <!-- antenas de verga -->
  <path d="M56.6 68.6 L58 68.6 M71.4 68.6 L70 68.6" stroke="#3d4232" stroke-width="1" fill="none"/>
  <path d="M56.3 66 L56.3 71.2 M71.7 66 L71.7 71.2" stroke="#3d4232" stroke-width=".7" fill="none"/>

  <!-- cubierta limpia a media nave -->
  <path d="M53.5 81 L57.5 81 M70.5 81 L74.5 81" stroke="#000" stroke-width=".4" opacity=".2" fill="none"/>

  <!-- ===== chimenea compacta ===== -->
  <path d="M56.6 87 L71.4 87 L71.2 95.2 L56.8 95.2 Z" fill="#000" opacity=".22" filter="url(#fr3f1)"/>
  <path class="shade" d="M58 87.4 L70 87.4 L70.9 90.6 L70.6 94.6 L57.4 94.6 L57.1 90.6 Z"/>
  <path d="M58 87.4 L70 87.4 L70.9 90.6 L70.6 94.6 L57.4 94.6 L57.1 90.6 Z" fill="url(#fr3g4)"/>
  <path d="M58.4 87.7 L69.6 87.7" stroke="#fff" stroke-width=".8" opacity=".45" fill="none"/>
  <rect class="dark" x="60.4" y="89.2" width="3.4" height="4" rx=".7"/>
  <rect class="dark" x="64.2" y="89.2" width="3.4" height="4" rx=".7"/>
  <rect x="60.7" y="89.4" width="1.3" height="1.3" rx=".4" fill="#fff" opacity=".18"/>
  <rect x="64.5" y="89.4" width="1.3" height="1.3" rx=".4" fill="#fff" opacity=".18"/>
  <path class="light" d="M58 87.4 L70 87.4 L70.4 88.8 L57.6 88.8 Z" opacity=".5"/>

  <!-- ===== hangar y cubierta de vuelo ===== -->
  <path class="base" d="M56.5 95.5 L71.5 95.5 L71.5 101 L56.5 101 Z" stroke="#3d4232" stroke-width="1"/>
  <path d="M56.5 95.5 L71.5 95.5 L71.5 101 L56.5 101 Z" fill="url(#fr3g3)" opacity=".55"/>
  <path d="M56.7 95.8 L71.3 95.8" stroke="#fff" stroke-width=".8" opacity=".4" fill="none"/>
  <path d="M71.3 96 L71.3 100.8" stroke="#000" stroke-width="1.1" opacity=".24" fill="none" filter="url(#fr3f1)"/>
  <path d="M56.2 101 L71.8 101 L71.6 103 L56.4 103 Z" fill="#000" opacity=".2" filter="url(#fr3f1)"/>
  <path d="M58.8 96.1 L58.8 100.4 M61.6 96.1 L61.6 100.4 M66.4 96.1 L66.4 100.4 M69.2 96.1 L69.2 100.4" stroke="#000" stroke-width=".5" opacity=".25" fill="none"/>
  <path d="M64 96.1 L64 100.4" stroke="#000" stroke-width=".6" opacity=".3" fill="none"/>
  <circle class="metalL" cx="53.6" cy="103.8" r=".7"/><circle class="metalL" cx="74.4" cy="103.8" r=".7"/>
  <!-- CIWS en el techo del hangar -->
  <circle class="metalS" cx="64" cy="97" r="1.8"/><path d="M64 95.4 L64 94.2" stroke="#2b2e28" stroke-width="1" fill="none"/>
  <!-- helipad con circulo pintado -->
  <path d="M64 101 L64 106.4" stroke="#b8bfa2" stroke-width=".7" opacity=".45" fill="none"/>
  <ellipse class="dark" cx="64" cy="103" rx="4.2" ry="2.4"/>
  <ellipse cx="64" cy="103" rx="4.2" ry="2.4" fill="none" stroke="#b8bfa2" stroke-width=".8" opacity=".85"/>
  <path d="M63.2 103 L64.8 103 M64 102.3 L64 103.7" stroke="#b8bfa2" stroke-width=".7" opacity=".85" fill="none"/>
  <!-- contenedores NSM 2x2 a popa -->
  <rect class="dark" x="55.5" y="104.6" width="6.4" height="2.6" rx=".7" opacity="0"/>
  <rect class="dark" x="56.4" y="104.4" width="6.2" height="2.8" rx=".7"/>
  <rect class="dark" x="65.4" y="104.4" width="6.2" height="2.8" rx=".7"/>
  <path d="M57.8 104.7 L57.8 106.9 M61.2 104.7 L61.2 106.9 M66.8 104.7 L66.8 106.9 M70.2 104.7 L70.2 106.9" stroke="#8a929b" stroke-width=".45" opacity=".7" fill="none"/>
  <!-- bote de maniobras a estribor -->
  <path class="light" d="M78.6 63 C80.4 64.3 80.4 67.2 78.6 68.5 C77.9 67.2 77.9 64.3 78.6 63 Z"/>
  <path d="M78.6 64.2 L78.6 67.6" stroke="#4a5057" stroke-width=".4" opacity=".6" fill="none"/>
</svg>
