<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- USS Constellation (FFG-62, ultra-moderna) - vista superior, proa al norte.
       Moderna: canon 57mm compacto, VLS Mk41 de 32 celdas, paneles SPY-6 a banda,
       mastil integrado, contenedores NSM a popa (2x2) detras del hangar. -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6a7077}.metalS{fill:#8a929b}.metalL{fill:#4a5057}
    .glass{fill:#7fa8c9}.glassL{fill:#a9cbdf}.rubber{fill:#2b2e28}
  </style>
  <filter id="fr3f1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="fr3f2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <radialGradient id="fr3gs" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".36"/><stop offset=".5" stop-color="#000" stop-opacity=".18"/><stop offset=".8" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fr3g1" gradientUnits="userSpaceOnUse" x1="46" y1="62" x2="82" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".18" stop-color="#fff" stop-opacity=".18"/><stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset=".62" stop-color="#fff" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
  </linearGradient>
  <linearGradient id="fr3g2" gradientUnits="userSpaceOnUse" x1="64" y1="13" x2="64" y2="110">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".35" stop-color="#fff" stop-opacity=".05"/><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="fr3g5" gradientUnits="userSpaceOnUse" x1="50" y1="18" x2="80" y2="104">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="fr3g3" gradientUnits="userSpaceOnUse" x1="53" y1="62" x2="75" y2="62">
    <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".2" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset=".85" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".34"/>
  </linearGradient>
  <linearGradient id="fr3g4" gradientUnits="userSpaceOnUse" x1="58" y1="80" x2="70" y2="80">
    <stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
  </linearGradient>
  </defs>

  <!-- sombra de contacto grande y suava -->
  <ellipse cx="63" cy="61" rx="27" ry="55" fill="url(#fr3gs)"/>

  <!-- ===== casco ===== -->
  <path class="shade" d="M64 12.5 C58.2 16.3 52.8 23 50.2 32 L48.4 41 L47.8 95 L51 104 L55 108.8 L73 108.8 L77 104 L80.2 95 L79.6 41 L77.8 32 C75.2 23 69.8 16.3 64 12.5 Z" stroke="#3d4232" stroke-width="1.4"/>
  <path d="M64 12.5 C58.2 16.3 52.8 23 50.2 32 L48.4 41 L47.8 95 L51 104 L55 108.8 L73 108.8 L77 104 L80.2 95 L79.6 41 L77.8 32 C75.2 23 69.8 16.3 64 12.5 Z" fill="url(#fr3g1)"/>
  <!-- cubierta -->
  <path class="base" d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z"/>
  <path d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z" fill="url(#fr3g2)"/>
  <path d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L51.3 41.4 L50.8 94.4 L53.6 102.8 L56.8 106.4 L71.2 106.4 L74.4 102.8 L77.2 94.4 L76.7 41.4 L75.2 32.8 C73 24.6 68.6 18.6 64 15.2 Z" fill="url(#fr3g5)"/>
  <!-- rim light en el costado de babor + sombra profunda a estribor -->
  <path d="M51.8 41 L51.4 94 L54.4 102.6" stroke="#fff" stroke-width="1" opacity=".4" fill="none"/>
  <path d="M76.2 41 L76.6 94 L73.6 102.6" stroke="#000" stroke-width="1.5" opacity=".24" fill="none" filter="url(#fr3f1)"/>
  <!-- linea de crujia -->
  <path d="M64 16.5 L64 104" stroke="#b8bfa2" stroke-width=".8" opacity=".4" fill="none"/>
  <!-- brillete de proa -->
  <path class="light" d="M64 15.2 C59.4 18.6 55 24.6 52.8 32.8 L54.8 33.2 C57 25.4 60.8 19.8 65.4 16.5 Z" opacity=".7"/>
  <!-- anclas y cabrestantes -->
  <circle class="metalL" cx="55.6" cy="23" r="1.2"/><circle class="metalL" cx="72.4" cy="23" r="1.2"/>
  <path d="M54.2 20.8 L56.9 24.4 M71.6 24.4 L74.3 20.8" stroke="#4a5057" stroke-width=".8" fill="none"/>
  <path d="M53 27.5 L55.7 30.2 M75 27.5 L72.3 30.2" stroke="#3d4232" stroke-width=".9" opacity=".6" fill="none"/>
  <!-- cabrestantes y regala -->
  <circle class="metalS" cx="60.4" cy="26.8" r=".8"/><circle class="metalS" cx="67.6" cy="26.8" r=".8"/>
  <path d="M53.2 36.5 C58 38.2 70 38.2 74.8 36.5 M51.9 88 C51.5 92.5 51.5 96 52.4 100.5 M76.1 88 C76.5 92.5 76.5 96 75.6 100.5" stroke="#000" stroke-width=".5" opacity=".2" fill="none"/>

  <!-- ===== canon 57mm compacto ===== -->
  <path class="shade" d="M60.2 35 L67.8 35 L67.3 37.2 L60.7 37.2 Z"/>
  <circle class="metal" cx="64" cy="39.6" r="3.4"/>
  <circle cx="64" cy="39.6" r="3.4" fill="none" stroke="#3d4232" stroke-width=".7"/>
  <circle class="metalS" cx="64" cy="39.6" r="1.9"/>
  <path class="hi" d="M62.4 38.4 L65.6 38.4" stroke="#b8bfa2" stroke-width=".7" opacity=".7" fill="none"/>
  <path class="metal" d="M63.3 30.6 L64.7 30.6 L64.6 36.8 L63.4 36.8 Z"/>
  <path class="metalL" d="M63 29.5 L65 29.5 L64.9 30.8 L63.1 30.8 Z"/>

  <!-- ===== VLS de proa (Mk41 2x8) ===== -->
  <rect class="dark" x="56.6" y="43.6" width="14.8" height="11" rx="1"/>
  <path d="M60.3 44.2 L60.3 54 M63.9 44.2 L63.9 54 M67.5 44.2 L67.5 54" stroke="#8a929b" stroke-width=".55" opacity=".75" fill="none"/>
  <path d="M57.2 46.4 L70.8 46.4 M57.2 49.4 L70.8 49.4 M57.2 52.4 L70.8 52.4" stroke="#8a929b" stroke-width=".55" opacity=".75" fill="none"/>
  <path d="M56.6 43.6 L71.4 43.6 L71.4 54.6 L56.6 54.6 Z" fill="none" stroke="#000" stroke-width=".5" opacity=".3"/>
  <circle class="metalS" cx="58.2" cy="44.7" r=".5"/><circle class="metalS" cx="69.8" cy="44.7" r=".5"/><circle class="metalS" cx="58.2" cy="53.5" r=".5"/><circle class="metalS" cx="69.8" cy="53.5" r=".5"/>

  <!-- montes de 25mm a banda -->
  <circle class="metal" cx="53.4" cy="58.5" r="1.6"/><path d="M53.4 57 L53.4 55.4" stroke="#2b2e28" stroke-width=".9" fill="none"/>
  <circle class="metal" cx="74.6" cy="58.5" r="1.6"/><path d="M74.6 57 L74.6 55.4" stroke="#2b2e28" stroke-width=".9" fill="none"/>

  <!-- oclusion ambiental: canon y VLS sobre la cubierta -->
  <path d="M59.6 37.2 L68.4 37.2 L67.8 40.6 L60.2 40.6 Z" fill="#000" opacity=".2" filter="url(#fr3f1)"/>
  <path d="M56.4 54.4 L71.6 54.4 L71.2 57 L56.8 57 Z" fill="#000" opacity=".2" filter="url(#fr3f1)"/>

  <!-- ===== superestructura ===== -->
  <path class="base" d="M55 56.4 L73 56.4 L74.6 60.6 L75 70 L73.4 74.6 L54.6 74.6 L53 70 L53.4 60.6 Z" stroke="#3d4232" stroke-width="1.2"/>
  <path d="M55 56.4 L73 56.4 L74.6 60.6 L75 70 L73.4 74.6 L54.6 74.6 L53 70 L53.4 60.6 Z" fill="url(#fr3g3)"/>
