<!-- Pauk, Proyecto 1331 (T1 oriental, corbeta). Gris ruso. Corbeta antisubmarina de 64 m. Identidad: palo enrejado alto y desnudo tipico sovietico, montaje AK-176 de 76 mm a proa, un AK-630 a popa y los raileres de cargas de profundidad en el espejo de popa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
