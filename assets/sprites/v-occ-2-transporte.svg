<!-- USS Whidbey Island LSD (T2 occidental, transporte). Gris OTAN. Identidad: la mitad de POPA es un DIQUE INUNDABLE abierto, una gran superficie plana y hundida para lanchas de desembarco, con toda la superestructura y la chimenea concentradas en el tercio de proa. Sin portico ni rampa a la vista.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
