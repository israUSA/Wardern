<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- HMS Visby (T3 occidental, corbeta). Gris OTAN. Corbeta furtiva sueca. Identidad: superficie facetada continua de proa a popa, sin masteleros ni antenas sueltas; el casco y la superestructura forman un solo bloque inclinado. Canon de 57 mm oculto en la proa y plataforma para helicoptero a popa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#c3ccd4"/><stop offset="0.45" stop-color="#a3adb6"/>
    <stop offset="1" stop-color="#8a949d"/>
  </linearGradient>
  <linearGradient id="g-side" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#8a949d"/><stop offset="0.5" stop-color="#727c85"/>
    <stop offset="1" stop-color="#565f68"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#dfe5ea"/><stop offset="0.5" stop-color="#9aa4ad"/>
    <stop offset="1" stop-color="#5d666e"/>
  </linearGradient>
</defs>
