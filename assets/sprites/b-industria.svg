<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Industria militar - nave con dientes de sierra, chimeneas y tanques, vista 3/4 superior.
       Tinte por pais: sobreescribir .base/.shade/.light (nave, tanques).
       Fijos: .glass (ventaneros del techo), .metal (chimeneas), .dark (contornos). -->
  <defs><style>
    .base{fill:#7c8464}.shade{fill:#5b6349}.dark{fill:#3d4232}.light{fill:#9aa378}.hi{fill:#b8bfa2}
    .metal{fill:#6f767c}.metalS{fill:#54595e}.metalL{fill:#939aa0}
    .glass{fill:#3e607a}.glassL{fill:#7fa3ba}.rubber{fill:#2b2e28}
  </style></defs>

  <!-- humo de chimeneas -->
  <circle class="light" cx="101" cy="14" r="6.5" opacity=".4"/>
  <circle class="light" cx="97" cy="23" r="5" opacity=".45"/>
  <circle class="light" cx="118" cy="26" r="5.5" opacity=".4"/>
  <circle class="light" cx="114" cy="35" r="4.2" opacity=".45"/>

  <!-- chimeneas -->
  <rect class="metal" x="93" y="26" width="9" height="34"/>
  <rect class="metal" x="93" y="26" width="9" height="34" fill-opacity="0" stroke="#3d4232" stroke-width="1"/>
  <rect class="light" x="93" y="30" width="9" height="5"/>
  <rect class="dark" x="93" y="26" width="9" height="3"/>
  <rect class="metal" x="111" y="38" width="8" height="22"/>
  <rect class="metal" x="111" y="38" width="8" height="22" fill-opacity="0" stroke="#3d4232" stroke-width="1"/>
  <rect class="light" x="111" y="41" width="8" height="4.4"/>

  <!-- nave principal -->
  <path class="shade" d="M14 58 L84 58 L96 40 L26 40 Z"/>
  <path d="M14 58 L84 58 L96 40 L26 40 Z" fill-opacity="0" stroke="#3d4232" stroke-width="1"/>
  <path class="light" d="M14 58 L84 58 L86 55.4 L16 55.4 Z" opacity=".7"/>
  <!-- dientes de sierra con ventaneros -->
  <path class="glass" d="M28 54.5 L44 54.5 L49 47 L33 47 Z"/>
  <path class="glass" d="M52 54.5 L68 54.5 L73 47 L57 47 Z"/>
  <path class="glass" d="M76 54.5 L86 54.5 L90.5 47 L81 47 Z"/>
  <path class="glassL" d="M30 53 L34 53 L38.5 47.6 L34.5 47.6 Z" opacity=".7"/>
  <path class="glassL" d="M54 53 L58 53 L62.5 47.6 L58.5 47.6 Z" opacity=".7"/>
  <rect class="base" x="14" y="56" width="72" height="32"/>
  <rect class="base" x="14" y="56" width="72" height="32" fill-opacity="0" stroke="#3d4232" stroke-width="1.1"/>
  <!-- grandes puertas -->
  <rect class="dark" x="22" y="64" width="16" height="24"/>
  <rect class="dark" x="60" y="64" width="16" height="24"/>
  <path d="M25 64 L25 88 M29 64 L29 88 M33 64 L33 88 M37 64 L37 88" stroke="#9aa378" stroke-width="1" opacity=".55"/>
  <path d="M63 64 L63 88 M67 64 L67 88 M71 64 L71 88 M75 64 L75 88" stroke="#9aa378" stroke-width="1" opacity=".55"/>
  <!-- ventanas altas -->
  <rect class="glass" x="44" y="66" width="10" height="7"/>
  <rect class="glass" x="78" y="66" width="8" height="7"/>

  <!-- tanque de almacenamiento -->
  <ellipse class="light" cx="106" cy="80" rx="12" ry="4.6"/>
  <ellipse class="light" cx="106" cy="80" rx="12" ry="4.6" fill-opacity="0" stroke="#3d4232" stroke-width=".9"/>
  <path class="shade" d="M94 80 L94 96 C94 99.6 99.4 102.4 106 102.4 C112.6 102.4 118 99.6 118 96 L118 80 Z"/>
  <path d="M94 80 L94 96 C94 99.6 99.4 102.4 106 102.4 C112.6 102.4 118 99.6 118 96 L118 80 Z" fill-opacity="0" stroke="#3d4232" stroke-width=".9"/>
  <path class="light" d="M96 84 L96 96" stroke="#9aa378" stroke-width="1.4" opacity=".6"/>

  <!-- alambrado perimetral -->
  <path d="M12 94 L12 102 M30 95 L30 103 M48 96 L48 104 M66 96 L66 104" stroke="#3d4232" stroke-width="1" opacity=".5"/>
  <path d="M10 97 L68 98" stroke="#3d4232" stroke-width=".8" opacity=".4"/>
</svg>
