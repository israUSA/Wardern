<g stroke="#7e8d5e" stroke-opacity="0.7" stroke-width="1"><path d="M40 135 L50.5 145.3"/><path d="M39.5 139.5 L50 149.8"/></g>
<circle cx="37.5" cy="128" r="2.2" fill="#8f5b30"/>

