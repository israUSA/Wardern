<!-- Kiev, Proyecto 1143 (T1 oriental, portaviones). Gris ruso. Crucero portaaeronaves: mitad portaviones, mitad crucero. Identidad unica en el set: la cubierta de vuelo angulada ocupa SOLO LA MITAD DE POPA, y toda la proa va cargada de artilleria y de lanzadores de misiles antibuque a la vista, algo impensable en un portaviones occidental.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
