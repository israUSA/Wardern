<!-- Proyecto 22350M (T3 oriental, fragata). Gris ruso. Version alargada del Gorshkov: mismo aspecto furtivo y mismo palo piramidal, pero con casco mas largo y el DOBLE de celdas verticales delante del puente, y hangar mayor. Es la fragata mas grande del set.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
