<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64">
  <!-- FAMILIA: MANPADS (AIM-92 Stinger / Igla-V). Es el misil MÁS PEQUEÑO del
       juego y se nota: cuerpo corto y rechoncho, aletitas minúsculas, morro
       cónico opaco. Ocupa poco del lienzo a propósito.
       Morro hacia ARRIBA (norte). Dibujo base: mejóralo encima. -->
  <defs>
    <linearGradient id="mp-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4d8cc"/>
      <stop offset="0.45" stop-color="#969c8c"/>
      <stop offset="1" stop-color="#565b4e"/>
    </linearGradient>
    <linearGradient id="mp-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0cc"/>
      <stop offset="0.5" stop-color="#ffab55"/>
      <stop offset="1" stop-color="#d9531f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M14.2 43 L17.8 43 C18.6 48 17.4 51.5 16 54 C14.6 51.5 13.4 48 14.2 43 Z" fill="url(#mp-flame)"/>

  <!-- aletitas traseras muy cortas -->
  <path d="M14.2 37 L10.5 39.5 L10.5 42.5 L14.2 41 Z" fill="#4a4f42"/>
  <path d="M17.8 37 L21.5 39.5 L21.5 42.5 L17.8 41 Z" fill="#4a4f42"/>
  <!-- aletitas de morro, casi testimoniales -->
  <path d="M14.2 20 L11.6 21.5 L11.6 24 L14.2 23 Z" fill="#6c7263"/>
  <path d="M17.8 20 L20.4 21.5 L20.4 24 L17.8 23 Z" fill="#6c7263"/>

  <rect x="14.1" y="18" width="3.8" height="25" rx="0.9" fill="url(#mp-body)"/>
  <rect x="14.1" y="30" width="3.8" height="1.8" fill="#9e3a2b"/>
  <!-- ojiva cónica, sin cristal: el buscador va tapado hasta el disparo -->
  <path d="M14.1 18 C14.7 13 15.2 11 16 10 C16.8 11 17.3 13 17.9 18 Z" fill="#343930"/>
</svg>
