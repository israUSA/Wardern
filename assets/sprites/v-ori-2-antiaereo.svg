  <circle cx="64" cy="90" r="11.5" fill="none" stroke="#b8bfa2" stroke-width=".6" stroke-dasharray="2 3" opacity=".28"/>
  <circle class="metal" cx="64" cy="90" r="6.8"/>
  <circle cx="64" cy="90" r="6.8" fill="url(#bk2g5)"/>
  <circle cx="64" cy="90" r="6.8" fill="none" stroke="#3d4232" stroke-width=".9"/>
  <path d="M59.6 85.8 A6.4 6.4 0 0 1 66.6 84.4" stroke="#fff" stroke-width=".9" opacity=".4" fill="none"/>
  <circle class="metalL" cx="64" cy="90" r="2"/>
  <circle class="dark" cx="60" cy="87.6" r=".7"/><circle class="dark" cx="68" cy="87.6" r=".7"/>
  <circle class="dark" cx="60" cy="92.4" r=".7"/><circle class="dark" cx="68" cy="92.4" r=".7"/>
  <!-- panel de antena girado -->
  <g transform="rotate(-24 64 90)">
    <path class="metalS" d="M52.5 83.5 L75.5 83.5 L75.5 96.5 L52.5 96.5 Z" stroke="#3d4232" stroke-width="1"/>
    <path d="M52.5 83.5 L75.5 83.5 L75.5 96.5 L52.5 96.5 Z" fill="url(#bk2g4)"/>
    <path d="M56.3 84 L56.3 96 M60.1 84 L60.1 96 M63.9 84 L63.9 96 M67.7 84 L67.7 96 M71.5 84 L71.5 96" stroke="#4a5057" stroke-width=".5" opacity=".8" fill="none"/>
    <path d="M52.5 90 L75.5 90" stroke="#4a5057" stroke-width=".5" opacity=".8" fill="none"/>
    <rect class="dark" x="62.4" y="81.4" width="3.2" height="2.6" rx=".6"/>
  </g>
  <!-- tirantes del radar -->
  <path d="M56.5 95 L60.5 99 M71.5 95 L67.5 99" stroke="#3d4232" stroke-width="1" opacity=".8" fill="none"/>

  <!-- ===== popa: APU y herramientas ===== -->
  <rect class="dark" x="54.5" y="103.5" width="8.5" height="6" rx=".8"/>
  <path d="M56.5 104.5 L56.5 108.5 M59 104.5 L59 108.5 M61.3 104.5 L61.3 108.5" stroke="#9aa378" stroke-width=".55" opacity=".6" fill="none"/>
