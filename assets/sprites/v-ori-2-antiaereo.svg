  <path class="shade" d="M28.5 34 L33.5 32 L33.5 114 L28.5 110 Z"/>
  <path class="shade" d="M99.5 34 L94.5 32 L94.5 114 L99.5 110 Z"/>
  <path d="M31 35 L32.5 34 M31 45 L32.5 45 M31 55 L32.5 55 M31 65 L32.5 65 M31 75 L32.5 75 M31 85 L32.5 85 M31 95 L32.5 95 M31 105 L32.5 106" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>
  <path d="M97 35 L95.5 34 M97 45 L95.5 45 M97 55 L95.5 55 M97 65 L95.5 65 M97 75 L95.5 75 M97 85 L95.5 85 M97 95 L95.5 95 M97 105 L95.5 106" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>

