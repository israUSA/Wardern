  <circle class="metalL" cx="88.5" cy="33" r="5.4"/><circle class="metal" cx="88.5" cy="33" r="3"/>
  <circle class="metalL" cx="39.5" cy="111" r="5.4"/><circle class="metal" cx="39.5" cy="111" r="3"/>
  <circle class="metalL" cx="88.5" cy="111" r="5.4"/><circle class="metal" cx="88.5" cy="111" r="3"/>

