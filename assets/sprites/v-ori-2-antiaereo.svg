  <g class="dark">
    <circle cx="49.5" cy="51.5" r=".9"/><circle cx="51.7" cy="50.3" r=".9"/>
    <circle cx="78.5" cy="51.5" r=".9"/><circle cx="76.3" cy="50.3" r=".9"/>
  </g>

  <!-- sombra del canister elevado sobre el casco (oclusion suave y ancha) -->
  <path d="M50.5 46.6 L77.5 46.6 L80 59 L48 59 Z" fill="#000" opacity=".26" filter="url(#bk2f2)"/>
  <path d="M53 47 L75 47 L77 58 L51 58 Z" fill="#000" opacity=".16"/>
  <path d="M57 51.6 L71 51.6 L70.6 55 L57.4 55 Z" fill="#000" opacity=".3" filter="url(#bk2f1)"/>

  <!-- ===== pedestal y canister elevado 2x2 ===== -->
