  <path d="M48 96 L44.5 107 M80 96 L83.5 107" stroke="#3d4232" stroke-width="1" fill="none" opacity=".85"/>
  <circle class="dark" cx="48" cy="96" r="1"/><circle class="dark" cx="80" cy="96" r="1"/>
  <!-- escapes -->
  <rect class="rubber" x="45.2" y="99" width="3" height="6" rx="1"/>
  <rect class="rubber" x="79.8" y="99" width="3" height="6" rx="1"/>
</svg>
