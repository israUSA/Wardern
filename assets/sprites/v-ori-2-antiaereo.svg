  <circle class="dark" cx="60.4" cy="18.1" r="2.4"/>
  <circle cx="59.6" cy="17.3" r=".7" fill="#fff" opacity=".4"/>
  <circle class="metalL" cx="60.4" cy="18.1" r="1.2"/>
  <circle class="dark" cx="67.6" cy="18.1" r="2.4"/>
  <circle cx="66.8" cy="17.3" r=".7" fill="#fff" opacity=".4"/>
  <circle class="metalL" cx="67.6" cy="18.1" r="1.2"/>
