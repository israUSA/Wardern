  <path d="M64 18.5 L64 45 M60.2 19.5 L56.5 45 M67.8 19.5 L71.5 45" stroke="#000" stroke-width=".7" opacity=".4" fill="none"/>
  <path d="M55.8 30 C60.5 31.2 67.5 31.2 72.2 30 M55.2 38 C60.5 39.2 67.5 39.2 74.8 38" stroke="#000" stroke-width=".6" opacity=".3" fill="none"/>
