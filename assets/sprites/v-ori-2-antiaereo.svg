  <path d="M33.5 30 L33.5 114 M37.9 28.4 L37.9 115.6 M41.1 28.4 L41.1 115.6 M45.5 30 L45.5 114" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".9" fill="none"/>
  <path d="M82.5 30 L82.5 114 M86.9 28.4 L86.9 115.6 M90.1 28.4 L90.1 115.6 M94.5 30 L94.5 114" stroke="#4a4f42" stroke-width="1" stroke-dasharray="2.1 1.2" opacity=".9" fill="none"/>
