<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- 9K37 Buk, vehiculo TELAR 9A310 (T2 oriental, antiaereo). Verde ruso.
     Camara y escala del set. Chasis oruga GM-569, casco muy largo (9.3 m),
     6 ruedas de rodadura y 3 rodillos de retorno.
     Identidad: los CUATRO misiles 9M38 tumbados sobre el rail elevador, encarados
     hacia arriba y adelante, mas la antena del radar de iluminacion levantada en
     el frente de la torreta. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#9aa878"/><stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/><stop offset="1" stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#6b7a4e"/><stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1" stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#485636"/><stop offset="0.6" stop-color="#374327"/>
    <stop offset="1" stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-msl" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#cdd3bb"/><stop offset="0.5" stop-color="#9aa287"/>
    <stop offset="1" stop-color="#5f6750"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#26261f"/>
    <stop offset="1" stop-color="#171712"/>
  </linearGradient>
</defs>
