  <path class="shade" d="M43.5 60 L46.5 60 L46.5 66 L43.5 66 Z M43.5 70 L46.5 70 L46.5 76 L43.5 76 Z"/>
  <path class="shade" d="M84.5 60 L81.5 60 L81.5 66 L84.5 66 Z M84.5 70 L81.5 70 L81.5 76 L84.5 76 Z"/>
  <path d="M44.2 60.5 L44.2 75.5 M83.8 60.5 L83.8 75.5" stroke="#000" stroke-width=".5" opacity=".35" fill="none"/>
