<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- 9P149 Shturm-S (T2 oriental, cazatanques). Verde ruso.
     Camara y escala del set (20.9 px/m). Chasis MT-LB, 6.45 x 2.86 x 1.86 m.
     Identidad: casco MT-LB rasante y plano con 6 ruedas pequenas SIN rodillos de
     retorno y motriz delantera, cabina baja adelantada, y sobre la cubierta
     trasera el brazo elevador con el UNICO tubo lanzador del misil Shturm.
     Silueta: plancha larga y baja con un brazo y un tubo grueso encima. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#9aa878"/><stop offset="0.34" stop-color="#7c8b5d"/>
    <stop offset="0.68" stop-color="#66744c"/><stop offset="1" stop-color="#52603c"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#6b7a4e"/><stop offset="0.45" stop-color="#5a6942"/>
    <stop offset="1" stop-color="#455233"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#485636"/><stop offset="0.6" stop-color="#374327"/>
    <stop offset="1" stop-color="#2a331e"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#a6b28a"/><stop offset="0.5" stop-color="#717d5a"/>
    <stop offset="1" stop-color="#464f35"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#26261f"/>
    <stop offset="1" stop-color="#171712"/>
  </linearGradient>
</defs>
