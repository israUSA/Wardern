<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- M2 Bradley (T2 occidental, motorizada). Arena. Camara y escala del set (20.9 px/m).
     Casco 6.55 x 3.60 x 2.98 m.
     Identidad: 6 ruedas con RUEDA MOTRIZ DELANTERA y 3 rodillos de retorno,
     faldones de 5 paneles con troneras de tiro, torreta biplaza DESPLAZADA A LA
     DERECHA con el canon automatico M242 de 25 mm (cana fina y larga) y el
     lanzador doble de TOW en el costado izquierdo de la torreta. -->
<defs>
  <linearGradient id="g-deck" x1="0.12" y1="0" x2="0.9" y2="0.15">
    <stop offset="0" stop-color="#e2d6b2"/><stop offset="0.34" stop-color="#c8b78d"/>
    <stop offset="0.68" stop-color="#ad9c75"/><stop offset="1" stop-color="#91815f"/>
  </linearGradient>
  <linearGradient id="g-flank" x1="0" y1="0" x2="0.85" y2="0.3">
    <stop offset="0" stop-color="#aea172"/><stop offset="0.45" stop-color="#978861"/>
    <stop offset="1" stop-color="#78694a"/>
  </linearGradient>
  <linearGradient id="g-rear" x1="0" y1="0" x2="1" y2="0.6">
    <stop offset="0" stop-color="#6f6247"/><stop offset="0.6" stop-color="#584d38"/>
    <stop offset="1" stop-color="#453c2c"/>
  </linearGradient>
  <linearGradient id="g-metal" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#d4c9a8"/><stop offset="0.5" stop-color="#9e9376"/>
    <stop offset="1" stop-color="#675e47"/>
  </linearGradient>
  <linearGradient id="g-trk" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#403d34"/><stop offset="0.5" stop-color="#2c2a22"/>
    <stop offset="1" stop-color="#1b1a15"/>
  </linearGradient>
</defs>
<path d="M30 150 L156 114 L196 150 L66 186 Z" fill="#0d0b06" opacity="0.30"/>

<!-- popa con rampa -->
<path d="M33.3 106.4 L68.5 140.8 L68.5 180.8 L33.3 146.4 Z" fill="url(#g-rear)"/>
<path d="M37 116 L65 143.4 L65 174 L37 146.6 Z" fill="#5c5340" stroke="#2f2a1e" stroke-width="1"/>
<ellipse cx="51" cy="147" rx="3.4" ry="2.6" fill="#8d7f5e"/>
<circle cx="35" cy="113" r="2.4" fill="#8f5b30"/>
<circle cx="66.5" cy="144" r="2.4" fill="#8f5b30"/>

<!-- cubierta y glacis -->
<path d="M33.3 106.4 L117.2 83.2 L152.4 117.6 L68.5 140.8 Z" fill="url(#g-deck)"/>
<path d="M117.2 83.2 L154.3 96.0 L189.5 130.4 L152.4 117.6 Z" fill="url(#g-deck)"/>
<path d="M117.2 83.2 L152.4 117.6" fill="none" stroke="#6d6046" stroke-opacity="0.55" stroke-width="1.2"/>
<path d="M117.2 83.2 L154.3 96.0 L189.5 130.4 L152.4 117.6 Z" fill="#ffffff" fill-opacity="0.07"/>
<ellipse cx="140" cy="105" rx="6.5" ry="4.3" fill="#a2946d" stroke="#5a5039" stroke-width="1"/>
<g fill="#5c5340">
  <path d="M158 99 L163.5 104.4 L160.5 105.7 L155 100.3 Z"/>
  <path d="M172 112 L177.5 117.4 L174.5 118.7 L169 113.3 Z"/>
</g>

<!-- flanco -->
<path d="M68.5 140.8 L152.4 117.6 L189.5 130.4 L68.5 163.8 Z" fill="url(#g-flank)"/>

<!-- tren de rodaje: 6 ruedas, motriz delantera, 3 rodillos -->
<path d="M67.2 182.9 L193.5 148.0 L193.5 131.0 L67.2 165.9 Z" fill="url(#g-trk)"/>
<g fill="#46423a" stroke="#1b1a15" stroke-width="1.1">
  <ellipse cx="80.5"  cy="171.3" rx="5.8" ry="6.8"/>
  <ellipse cx="101.7" cy="165.4" rx="5.8" ry="6.8"/>
  <ellipse cx="122.9" cy="159.6" rx="5.8" ry="6.8"/>
  <ellipse cx="144.1" cy="153.7" rx="5.8" ry="6.8"/>
  <ellipse cx="165.3" cy="147.9" rx="5.8" ry="6.8"/>
  <ellipse cx="184.7" cy="142.5" rx="5.8" ry="6.8"/>
</g>
<g fill="#6d6455">
  <ellipse cx="80.5"  cy="171.3" rx="2.1" ry="2.5"/>
  <ellipse cx="101.7" cy="165.4" rx="2.1" ry="2.5"/>
  <ellipse cx="122.9" cy="159.6" rx="2.1" ry="2.5"/>
  <ellipse cx="144.1" cy="153.7" rx="2.1" ry="2.5"/>
  <ellipse cx="165.3" cy="147.9" rx="2.1" ry="2.5"/>
  <ellipse cx="184.7" cy="142.5" rx="2.1" ry="2.5"/>
</g>
<ellipse cx="189.1" cy="137.3" rx="7.4" ry="8.6" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<ellipse cx="71.7"  cy="169.7" rx="6.6" ry="7.8" fill="#4c473d" stroke="#1b1a15" stroke-width="1.2"/>
<g fill="#4c473d" stroke="#1b1a15" stroke-width="0.9">
  <ellipse cx="96.4"  cy="156.9" rx="2.8" ry="3.2"/>
  <ellipse cx="131.7" cy="147.1" rx="2.8" ry="3.2"/>
  <ellipse cx="167.0" cy="137.4" rx="2.8" ry="3.2"/>
</g>
<path d="M68 183.2 L194 148.4" fill="none" stroke="#0d0b06" stroke-opacity="0.55" stroke-width="3"/>

<!-- faldones con troneras de tiro -->
<path d="M67.6 168.2 L186.8 135.2 L186.8 109.2 L67.6 142.2 Z" fill="url(#g-flank)"/>
<g stroke="#6d6046" stroke-opacity="0.7" stroke-width="1.2">
  <path d="M87.1 136.8 L87.1 162.8"/><path d="M108.2 131.0 L108.2 157.0"/>
  <path d="M129.4 125.1 L129.4 151.1"/><path d="M150.6 119.3 L150.6 145.3"/>
  <path d="M171.8 113.4 L171.8 139.4"/>
</g>
<g fill="#4a412f">
  <ellipse cx="97" cy="141" rx="2.4" ry="3" /><ellipse cx="118" cy="135.2" rx="2.4" ry="3"/>
  <ellipse cx="139" cy="129.4" rx="2.4" ry="3"/><ellipse cx="160" cy="123.6" rx="2.4" ry="3"/>
</g>
<path d="M67.6 142.2 L186.8 109.2" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="2"/>

<!-- torreta biplaza desplazada a la derecha -->
<path d="M75.7 114.7 L92.6 131.2 L92.6 109.2 L75.7 92.7 Z" fill="url(#g-rear)"/>
<path d="M92.6 131.2 L132.3 120.2 L132.3 98.2 L92.6 109.2 Z" fill="url(#g-flank)"/>
<path d="M75.7 92.7 L115.4 81.7 L132.3 98.2 L92.6 109.2 Z" fill="url(#g-deck)"/>
<path d="M75.7 92.7 L115.4 81.7" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4"/>
<!-- lanzador doble de TOW en el costado izquierdo -->
<path d="M87.9 98.6 L105.5 93.7 L110.2 98.3 L92.6 103.2 Z" fill="#9c8d68" stroke="#5a5039" stroke-width="1"/>
<path d="M87.9 84.6 L105.5 79.7 L110.2 84.3 L92.6 89.2 Z" fill="#b0a179" stroke="#5a5039" stroke-width="1"/>
<path d="M87.9 98.6 L87.9 84.6 L105.5 79.7 L105.5 93.7 Z" fill="#8d7f5e" stroke="#5a5039" stroke-width="1"/>
<g fill="#2b271c">
  <ellipse cx="106.5" cy="83.5" rx="2" ry="2.6"/>
  <ellipse cx="106.5" cy="90.5" rx="2" ry="2.6"/>
</g>
<!-- visor del jefe y escotillas -->
<ellipse cx="105" cy="94.5" rx="4.6" ry="3.2" fill="#a2946d" stroke="#5a5039" stroke-width="0.9"/>
<!-- canon M242 de 25 mm -->
<path d="M120.0 95.9 L160.6 84.7 L162.8 87.3 L122.2 98.5 Z" fill="url(#g-metal)"/>
<path d="M117 100 L124 94.5 L128 98 L121 103.5 Z" fill="#9c8d68" stroke="#5a5039" stroke-width="0.9"/>
<ellipse cx="161.7" cy="86.0" rx="1.2" ry="2" fill="#181510"/>
<path d="M120.0 95.9 L160.6 84.7 L160.9 85.7 L120.3 96.9 Z" fill="#ffffff" fill-opacity="0.35"/>
</svg>
