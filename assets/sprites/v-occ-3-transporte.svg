  <path class="shade" d="M61.4 36.2 L66.6 36.2 L66.3 37.8 L61.7 37.8 Z"/>
  <rect class="metal" x="53.2" y="41" width="4.6" height="2.8" rx=".9"/>
  <rect class="metal" x="70.2" y="41" width="4.6" height="2.8" rx=".9"/>

