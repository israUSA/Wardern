<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- USS San Antonio LPD (T3 occidental, transporte). Gris OTAN. Identidad inconfundible: los DOS MASTELEROS CERRADOS de composite en forma de prisma que sustituyen a las celosias y a las antenas colgantes; se ven como dos torres macizas gemelas sobre la superestructura. Dique inundable y cubierta de vuelo a popa.
     Camara naval del set: acimut 28 grados, elevacion 45 grados, mas alta que la
     de los vehiculos terrestres porque en un buque la identidad esta en la
     cubierta. Manga exagerada un 40 por ciento para que la cubierta sea legible. -->
