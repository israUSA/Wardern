  <path class="shade" d="M64 63.5 L59.4 69.5 L61 71.2 L64 67 L67 71.2 L68.6 69.5 Z"/>
  <path class="light" d="M64 63.5 L59.4 69.5 L60.2 69.9 L64 64.8 Z" opacity=".55"/>
