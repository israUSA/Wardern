<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardern — Guerra en América</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="map"></canvas>

    <!-- Pantalla de inicio / selección de país -->
    <div id="start-screen" class="screen">
      <div class="start-title">
        <h1>WARDERN</h1>
        <p class="subtitle">Guerra total en América · 2026</p>
      </div>
      <div id="start-error" class="start-error hidden"></div>
      <div id="country-card" class="country-card hidden">
        <div class="cc-head">
          <span id="cc-flag" class="cc-flag"></span>
          <span id="cc-name"></span>
        </div>
        <div id="cc-stats" class="cc-stats"></div>
        <div class="cc-diff-label">Dificultad</div>
        <div id="cc-difficulty" class="cc-diff"></div>
        <button id="cc-play" class="btn primary">Jugar como este país</button>
      </div>
      <div class="start-actions">
        <button id="btn-continue" class="btn hidden">Continuar partida guardada</button>
        <p class="hint">Haz clic en un país del mapa para elegirlo · arrastra para mover · rueda para zoom</p>
      </div>
    </div>

    <!-- UI de partida -->
    <div id="game-ui" class="hidden">
      <div id="topbar">
        <div class="tb-country">
          <span id="tb-flag" class="cc-flag"></span>
          <span id="tb-name"></span>
        </div>
        <div id="tb-resources" class="tb-resources"></div>
        <div id="tb-wars" class="tb-wars" title="Países con los que estás en guerra · clic para ir a su capital"></div>
        <div class="tb-time">
          <span id="tb-date"></span>
          <div class="tb-speeds">
            <button data-speed="0" title="Pausa">❚❚</button>
            <button data-speed="1" class="active">1×</button>
            <button data-speed="2">2×</button>
            <button data-speed="4">4×</button>
          </div>
        </div>
        <div class="tb-menu">
          <button id="btn-research" title="Investigación y doctrina">🔬 Investigación</button>
          <button id="btn-market" title="Mercado: compra o vende suministros y combustible">💱 Mercado</button>
          <button id="btn-save" title="Guardar">Guardar</button>
          <button id="btn-export" title="Exportar JSON">Exportar</button>
          <button id="btn-import" title="Importar JSON">Importar</button>
          <button id="btn-newgame">Nueva</button>
          <input type="file" id="file-import" accept=".json" class="hidden">
        </div>
      </div>

      <div id="province-panel" class="panel hidden"></div>

      <div id="event-log" class="panel"></div>

      <!-- Hoja de datos de la unidad seleccionada en el mapa -->
      <div id="unit-panel" class="panel hidden"></div>

      <!-- Radar y armamento del avión seleccionado -->
      <div id="radar-panel" class="panel hidden"></div>

      <div id="toast" class="hidden"></div>
      <div id="tooltip" class="hidden"></div>
    </div>

    <!-- Modal genérico -->
    <div id="modal" class="hidden">
      <div class="modal-box">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div id="modal-buttons" class="modal-buttons"></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
